item: station.catalog/v1
kind: app
name: tailscale
description: 'The Tailscale app: each Mac is a node, and station reads it'
provides: [tailscale]
then: [tailscale-cli]
bundle: Tailscale
supersedes: tailscale
accepts: [app-store]
methods:
    - os: macos
      kind: computer
      cask: tailscale-app
disk:
    paths:
        - path: ~/Library/Containers/io.tailscale.ipn.macos*
          level: kept
          os: macos
          kind: computer
          note: the App Store app's login
        - path: ~/Library/Containers/io.tailscale.ipn.macsys*
          level: kept
          os: macos
          kind: computer
          note: the Standalone app's login
        - path: ~/Library/Containers/Tailscale
          level: kept
          os: macos
          kind: computer
        - path: ~/Library/Group Containers/*io.tailscale.ipn.macos
          level: kept
          os: macos
          kind: computer
        - path: ~/Library/Group Containers/*io.tailscale.ipn.macsys
          level: kept
          os: macos
          kind: computer
        - path: ~/Library/Group Containers/group.*.io.tailscale.shared
          level: kept
          os: macos
          kind: computer
        - path: ~/Library/Application Scripts/*io.tailscale.*
          level: kept
          os: macos
          kind: computer
    installed:
        - /Applications/Tailscale.app
        - /usr/local/bin/tailscale
        - ~/.local/bin/tailscale
    removal:
        ~/.local/bin/tailscale: 'written by the `tailscale-cli` setting for the App Store app: `station settings off tailscale-cli` removes it'
    no-erase: "nothing to erase: the login is the Tailscale app's"
