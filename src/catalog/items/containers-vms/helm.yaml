item: station.catalog/v1
kind: app
name: helm
description: Kubernetes package manager
provides: [helm]
methods:
    - os: macos
      brew: helm
    - family: linux
      script:
          run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4 | HELM_INSTALL_DIR="$HOME/.local/bin" USE_SUDO=false bash
disk:
    paths:
        - path: ~/Library/Caches/helm
          level: cache
          os: macos
        - path: ~/Library/Preferences/helm
          level: settings
          os: macos
    free:
        - delete: [~/Library/Caches/helm/*]
          os: macos
    no-erase: 'nothing to erase: keys and logins are kept'
