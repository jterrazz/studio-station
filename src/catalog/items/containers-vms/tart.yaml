item: station.catalog/v1
kind: app
name: tart
order: 380
description: "Virtual machines on Apple silicon: the engine of station's VMs"
provides: [tart]
then: [tart-launcher]
version:
    args: [tart, --version]
    pattern: ^(\S+)
methods:
    - os: macos
      only: mac
      script:
          run: d="$HOME/.local/share"; case "$XDG_DATA_HOME" in /*) d="$XDG_DATA_HOME" ;; esac; mkdir -p "$d/station/tart" "$d/station/vms" "$HOME/.local/bin" && curl -fsSL https://github.com/cirruslabs/tart/releases/latest/download/tart.tar.gz | tar -xz -C "$d/station/tart"
disk:
    paths:
        - path: '{data}/station/vms/cache/OCIs'
          level: cache
          note: the base images Tart pulled
        - path: '{data}/station/vms/cache/IPSWs'
          level: cache
        - path: '{data}/station/vms/tmp'
          level: cache
        - path: ~/Library/Caches/com.github.cirruslabs.tart
          level: cache
          note: Tart's NSURLCache
    installed: ['{data}/station/tart', ~/.local/bin/tart]
    free:
        - run: [tart, prune, --entries=caches, --older-than=0]
          needs: tart
        - delete: [~/Library/Caches/com.github.cirruslabs.tart/*]
    no-erase: "station's data are VMs and images: station machines delete <vm>, station images delete <image>"
    misplaced:
        - path: ~/.tart
          busy: tart
          move:
              - from: ~/.tart
                to: '{data}/station/vms'
          then: [tart-launcher]
        - path: ~/.local/opt
          busy: tart
          move:
              - from: ~/.local/opt/tart.app
                to: '{data}/station/tart/tart.app'
              - from: ~/.local/opt/LICENSE
                to: '{data}/station/tart/LICENSE'
          prune: [~/.local/opt]
          then: [tart-launcher]
