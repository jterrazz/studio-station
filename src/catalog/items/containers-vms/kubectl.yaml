item: station.catalog/v1
kind: app
name: kubectl
description: Kubernetes command line
provides: [kubectl]
methods:
    - os: macos
      brew: kubectl
    - family: linux
      mise:
          name: kubectl
          version: latest
disk:
    paths:
        - path: ~/.kube/cache
          level: cache
        - path: ~/.kube/config
          level: kept
    free:
        - delete: [~/.kube/cache/*]
    no-erase: 'nothing to erase: keys and logins are kept'
