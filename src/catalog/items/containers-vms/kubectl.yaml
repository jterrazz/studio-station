item: station.catalog/v1
kind: app
name: kubectl
description: Kubernetes command line
provides: [kubectl]
methods:
    - os: macos
      brew: kubectl
    - family: linux
      script:
          run: |
              set -eu
              case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64) arch=arm64 ;; *) echo "no build for $(uname -m)" >&2; exit 1 ;; esac
              version=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
              base=https://dl.k8s.io/release/$version/bin/linux/$arch
              dir=$(mktemp -d)
              trap 'rm -rf "$dir"' EXIT
              curl -fsSL -o "$dir/kubectl" "$base/kubectl"
              curl -fsSL -o "$dir/kubectl.sha256" "$base/kubectl.sha256"
              echo "$(cat "$dir/kubectl.sha256")  $dir/kubectl" | sha256sum -c -
              mkdir -p "$HOME/.local/bin"
              install -m 0755 "$dir/kubectl" "$HOME/.local/bin/kubectl"
disk:
    paths:
        - path: ~/.kube/cache
          level: cache
        - path: ~/.kube/config
          level: kept
    free:
        - delete: [~/.kube/cache/*]
    no-erase: 'nothing to erase: keys and logins are kept'
