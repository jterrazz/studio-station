item: station.catalog/v1
kind: app
name: orbstack
order: 400
description: Docker and Linux machines on the Mac, for exploration on a Mac
provides: [orb]
bundle: OrbStack
methods:
    - os: macos
      only: mac
      cask: orbstack
disk:
    paths:
        - path: ~/Library/Group Containers/HUAQ24HBR6.dev.orbstack
          level: data
        - path: ~/.orbstack
          level: settings
    installed: [/Applications/OrbStack.app]
    no-erase: OrbStack erases its own data, in its Settings
