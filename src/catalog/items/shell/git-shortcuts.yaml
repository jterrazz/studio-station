item: station.catalog/v1
kind: setting
name: git-shortcuts
description: 'Git shortcuts: git wip, unwip, sync, feat, fix, chore, branches, lg, st, pushup'
reversible: true
methods:
    - os: any
      git-aliases:
          file: ~/.gitconfig
          aliases:
              - name: wip
                command: '!git add --all && git commit -m WIP'
              - name: unwip
                command: '!git reset --soft HEAD~1 && git reset HEAD'
              - name: sync
                command: '!git fetch -p; git pull'
              - name: feat
                command: '!f() { git add . && git commit -m "feat: $*"; }; f'
              - name: fix
                command: '!f() { git add . && git commit -m "fix: $*"; }; f'
              - name: chore
                command: '!f() { git add . && git commit -m "chore: $*"; }; f'
              - name: branches
                command: branch
              - name: lg
                command: log --oneline -10
              - name: st
                command: status
              - name: pushup
                command: push -u origin HEAD
writes:
    - path: ~/.gitconfig
      level: settings
      note: station's `[alias]` block
