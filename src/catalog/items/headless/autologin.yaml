item: station.catalog/v1
kind: setting
name: autologin
order: 140
description: GUI auto-login for jterrazz.agent (FileVault-aware)
needs: [sudo, terminal]
reversible: true
options:
    - name: password
      label: Password of jterrazz.agent
      type: password
      required: true
      default-env: AGENT_PASSWORD
sets:
    - { key: autoLoginUser, value: jterrazz.agent }
    - { key: /etc/kcpassword, value: present }
methods:
    - os: macos
      only: mac
      builtin: autologin
writes:
    - path: /etc/kcpassword
      level: kept
      note: the agent user's login password, obfuscated
    - path: /Library/Preferences/com.apple.loginwindow
      level: settings
      note: '`autoLoginUser` in `com.apple.loginwindow`'
