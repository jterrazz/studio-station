item: station.catalog/v1
kind: app
name: browser-use
description: AI agent library for browser automation
provides: [browser-use]
requires: [uv]
methods:
    - os: macos
      machine: [workspace, server]
      uv: browser-use
    - family: linux
      script:
          run: uv tool install browser-use
          undo: uv tool uninstall browser-use
