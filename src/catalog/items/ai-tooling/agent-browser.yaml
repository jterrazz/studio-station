item: station.catalog/v1
kind: app
name: agent-browser
description: Browser automation CLI for AI agents
provides: [agent-browser]
requires: [bun]
methods:
    - os: macos
      kind: [workspace, server]
      bun: agent-browser
    - family: linux
      bun: agent-browser
disk:
    installed: [~/.agent-browser/browsers]
    no-erase: 'the browsers are the app: station apps remove agent-browser'
