item: station.catalog/v1
kind: app
name: markitdown
description: Convert files to Markdown for LLMs
provides: [markitdown]
requires: [uv]
methods:
    - os: macos
      kind: [workspace, server]
      uv: markitdown[all]
    - family: linux
      mise:
          name: pipx:markitdown[all]
          version: latest
