item: station.catalog/v1
kind: app
name: markitdown
description: Convert files to Markdown for LLMs
provides: [markitdown]
requires: [uv]
methods:
    - os: macos
      machine: [workspace, server]
      uv: markitdown[all]
    - family: linux
      script:
          check: markitdown --version
          run: uv tool install 'markitdown[all]'
          undo: uv tool uninstall markitdown
