item: station.catalog/v1
kind: app
name: playwright-browsers
description: Chromium runtime for website specs (@jterrazz/test)
requires: [node]
version:
    path: ~/Library/Caches/ms-playwright/chromium*
methods:
    - os: macos
      kind: [workspace, server]
      script:
          run: npx playwright install chromium
    - family: linux
      script:
          run: npx playwright install chromium
disk:
    installed: [~/Library/Caches/ms-playwright, '{cache}/ms-playwright']
    no-erase: 'the browsers are the app: station apps remove playwright-browsers'
