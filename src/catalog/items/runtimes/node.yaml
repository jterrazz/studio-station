item: station.catalog/v1
kind: manager
name: node
description: JavaScript runtime built on Chrome's V8 engine
manages: [npm]
provides: [node, npm, npx]
methods:
    - os: any
      mise:
          name: node
          version: lts
disk:
    paths:
        - path: '{cache}/npm'
          level: cache
        - path: ~/.npmrc
          level: settings
          note: may hold registry tokens
    free:
        - run: [npm, cache, clean, --force]
          uses: npm
        - delete: ['{cache}/npm/*']
    no-erase: "npm's globals are apps: station apps remove <app>"
    relocate:
        - file: npmrc
          key: cache
          value: '{cache}/npm'
    misplaced:
        - path: ~/.npm
          free:
              - run: [npm, cache, clean, --force, --cache, ~/.npm]
                uses: npm
              - delete: [~/.npm/_npx, ~/.npm/_logs, ~/.npm/_cacache]
                prune: [~/.npm]
