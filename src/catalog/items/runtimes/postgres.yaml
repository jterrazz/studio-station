item: station.catalog/v1
kind: app
name: postgres
description: Relational database server
provides: [postgres, psql]
ports:
    - port: 5432
      label: Postgres
methods:
    - os: ubuntu
      provides: [psql]
      needs: [sudo]
      apt: { packages: [postgresql] }
    - os: macos
      brew: postgresql@18
