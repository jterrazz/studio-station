item: station.catalog/v1
kind: app
name: bat
order: 200
description: Cat clone with syntax highlighting
replaces: cat (for humans)
provides: [bat]
methods:
    - os: macos
      brew: bat
    - os: linux
      mise:
          name: bat
          version: latest
disk:
    paths:
        - path: '{cache}/bat'
          level: cache
    free:
        - run: [bat, cache, --clear]
          needs: bat
    no-erase: 'nothing to erase: keys and logins are kept'
