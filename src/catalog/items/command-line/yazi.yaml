item: station.catalog/v1
kind: app
name: yazi
description: Terminal file manager
replaces: Finder in the terminal
provides: [yazi]
methods:
    - os: macos
      brew: yazi
    - family: linux
      mise:
          name: yazi
          version: latest
disk:
    paths:
        - path: '{state}/yazi'
          level: data
        - path: '{config}/yazi'
          level: settings
    erase:
        - delete: ['{state}/yazi/*']
