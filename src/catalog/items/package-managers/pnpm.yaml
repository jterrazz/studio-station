item: station.catalog/v1
kind: app
name: pnpm
order: 60
description: Fast, disk space efficient Node package manager
provides: [pnpm]
methods:
    - os: macos
      brew: pnpm
    - os: linux
      mise:
          name: pnpm
          version: latest
disk:
    paths:
        - path: ~/Library/pnpm/store
          level: cache
          'on': [mac, macos]
        - path: '{data}/pnpm/store'
          level: cache
          'on': [linux]
        - path: '{state}/pnpm'
          level: cache
        - path: ~/Library/Preferences/pnpm
          level: settings
          'on': [mac, macos]
    free:
        - run: [pnpm, store, prune]
          needs: pnpm
          exists: ~/Library/pnpm/store
          'on': [mac, macos]
        - run: [pnpm, store, prune]
          needs: pnpm
          exists: '{data}/pnpm/store'
          'on': [linux]
        - delete: [~/Library/pnpm/store/*]
          'on': [mac, macos]
        - delete: ['{data}/pnpm/store/*']
          'on': [linux]
    no-erase: 'nothing to erase: keys and logins are kept'
