item: station.catalog/v1
kind: manager
name: apt
description: Debian and Ubuntu's package manager
manages: [apt]
priority: { ubuntu: 1, debian: 1 }
provides: [apt-get]
methods:
    - family: debian
      needs: [sudo]
      apt: { packages: [apt] }
disk:
    paths:
        - path: '{data}/station/apt'
          level: kept
          note: one empty file per package station's install added beside an app's own, the only such packages a removal takes back
    no-erase: 'what it installed is apps: station apps remove <app>'
