item: station.catalog/v1
kind: app
name: terraform
description: Infrastructure as code provisioning
provides: [terraform]
methods:
    - os: macos
      trusted: true
      brew: hashicorp/tap/terraform
    - family: linux
      mise:
          name: terraform
          version: latest
disk:
    paths:
        - path: ~/.terraform.d
          level: settings
    no-erase: 'nothing to erase: keys and logins are kept'
