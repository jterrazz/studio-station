item: station.catalog/v1
kind: app
name: lazygit
description: Terminal UI for git
replaces: raw git porcelain (interactive)
provides: [lazygit]
methods:
    - os: macos
      brew: lazygit
    - family: linux
      mise:
          name: lazygit
          version: latest
disk:
    paths:
        - path: ~/Library/Application Support/lazygit/state.yml
          level: data
          os: macos
    erase:
        - delete: [~/Library/Application Support/lazygit/state.yml]
