item: station.catalog/v1
kind: app
name: tmux
description: Terminal multiplexer for persistent sessions
provides: [tmux]
then: [tmux-dotfiles]
methods:
    - os: macos
      brew: tmux
    - family: linux
      mise:
          name: tmux
          version: latest
disk:
    paths:
        - path: ~/.tmux.conf
          level: settings
    no-erase: 'nothing to erase: keys and logins are kept'
