item: station.catalog/v1
kind: app
name: zoxide
order: 180
description: Smarter cd command
replaces: cd (jumping around)
provides: [zoxide]
methods:
    - os: macos
      brew: zoxide
    - os: linux
      mise:
          name: zoxide
          version: latest
disk:
    paths:
        - path: ~/Library/Application Support/zoxide/db.zo
          level: data
          'on': [mac, macos]
        - path: '{data}/zoxide/db.zo'
          level: data
          'on': [linux]
    erase:
        - delete: [~/Library/Application Support/zoxide/db.zo, '{data}/zoxide/db.zo']
