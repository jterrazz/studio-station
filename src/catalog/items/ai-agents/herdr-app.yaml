item: station.catalog/v1
kind: app
name: herdr-app
description: Desktop app that keeps coding agents running in the background
bundle: Herdr
methods:
    - os: macos
      machine: computer
      cask: herdr-app
disk:
    paths:
        - path: '{state}/herdr-core'
          level: data
        - path: '{config}/herdr-app'
          level: settings
    erase:
        - delete: ['{state}/herdr-core/*']
    quit: Herdr
