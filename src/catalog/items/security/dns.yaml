item: station.catalog/v1
kind: setting
name: dns
description: Encrypted DNS via Quad9 (DoH)
guided: true
sets:
    - { key: encrypted DNS, value: Quad9 DoH }
methods:
    - os: macos
      kind: computer
      builtin: dns
writes:
    - path: '{state}/station/dns/quad9-dns.mobileconfig'
      level: settings
      note: installed as the profile `com.jterrazz.dns.quad9`
