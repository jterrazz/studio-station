item: station.catalog/v1
kind: setting
name: claude-token
description: The Claude Code subscription token a VM may borrow
help: run `claude setup-token` and paste the token
reversible: true
options:
    - name: token
      label: Claude Code token
      help: run `claude setup-token` and paste the token
      type: string
      secret: true
      required: true
sets:
    - { key: token, value: kept by the studio credential store }
    - { key: share list, value: holds it }
methods:
    - os: macos
      machine: computer
      builtin: claude-token
writes:
    - path: '{config}/studio-os'
      level: kept
      note: '`operator:claude:oauth-token` in the OS credential store'
