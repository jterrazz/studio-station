item: station.catalog/v1
kind: setting
name: ssh-key
order: 60
description: An ed25519 SSH key, kept in the Keychain
needs: [terminal]
sets:
    - { key: ~/.ssh/id_ed25519, value: present }
    - { key: ~/.ssh/config, value: the Keychain stanza }
methods:
    - os: macos
      only: mac
      builtin: ssh-key
writes:
    - path: ~/.ssh/id_ed25519
      level: kept
    - path: ~/.ssh/id_ed25519.pub
      level: kept
    - path: ~/.ssh/config
      level: settings
      note: 'the `Host *` stanza: `UseKeychain yes`, `IdentityFile ~/.ssh/id_ed25519`'
