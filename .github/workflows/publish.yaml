name: Publish
run-name: Publish ${{ github.ref_name }}

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    publish:
        name: Publish
        uses: jterrazz/studio-actions/.github/workflows/publish-go.yaml@main
        with:
            binary-name: station
            build-path: ./src/cmd/station
            go-version-file: go.mod
            ldflags: -X github.com/jterrazz/studio-station/src/wire.version={tag}
            targets: 'darwin/arm64,darwin/amd64,linux/arm64,linux/amd64'
