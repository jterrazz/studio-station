package: station.package/v1
kind: setting
name: herdr-machine
description: 'Herdr reaches every workspace of this Mac: its agents show in Herdr'
requires: [herdr-core]
reversible: true
sets:
    - { key: herdr-core, value: 'every workspace a machine, by its name' }
methods:
    - os: macos
      machine: computer
      mux-machines: {}
