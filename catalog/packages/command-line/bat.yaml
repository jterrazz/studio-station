package: station.package/v1
kind: app
name: bat
description: Cat clone with syntax highlighting
replaces: cat (for humans)
provides: [bat]
methods:
    - os: macos
      brew: bat
    - os: ubuntu
      provides: [batcat]
      needs: [sudo]
      apt: { packages: [bat] }
disk:
    paths:
        - path: '{cache}/bat'
          level: cache
    free:
        - run: [bat, cache, --clear]
          uses: bat
    no-erase: 'nothing to erase: keys and logins are kept'
