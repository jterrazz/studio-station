package: station.package/v1
kind: app
name: dust
description: Intuitive disk usage viewer
replaces: du -sh
provides: [dust]
methods:
    - os: macos
      brew: dust
    - family: linux
      arch: arm64
      github-release: { repo: bootandy/dust, asset: 'dust-*-aarch64-unknown-linux-gnu.tar.gz' }
    - family: linux
      arch: amd64
      github-release: { repo: bootandy/dust, asset: 'dust-*-x86_64-unknown-linux-gnu.tar.gz' }
