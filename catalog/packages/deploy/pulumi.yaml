item: station.catalog/v1
kind: app
name: pulumi
description: Infrastructure as code using real programming languages
provides: [pulumi]
methods:
    - os: macos
      trusted: true
      brew: pulumi/tap/pulumi
    - family: linux
      arch: arm64
      provides:
          [
              pulumi,
              pulumi-language-go,
              pulumi-language-nodejs,
              pulumi-language-python,
              pulumi-language-python-exec,
          ]
      github-release: { repo: pulumi/pulumi, asset: 'pulumi-v*-linux-arm64.tar.gz' }
    - family: linux
      arch: amd64
      provides:
          [
              pulumi,
              pulumi-language-go,
              pulumi-language-nodejs,
              pulumi-language-python,
              pulumi-language-python-exec,
          ]
      github-release: { repo: pulumi/pulumi, asset: 'pulumi-v*-linux-x64.tar.gz' }
disk:
    paths:
        - path: ~/.pulumi/plugins
          level: cache
        - path: ~/.pulumi/workspaces
          level: data
        - path: ~/.pulumi/credentials.json
          level: kept
    free:
        - run: [pulumi, plugin, rm, --all, --yes]
          uses: pulumi
    erase:
        - delete: [~/.pulumi/workspaces/*]
