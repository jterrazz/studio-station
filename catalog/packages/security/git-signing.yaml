package: station.package/v1
kind: setting
name: git-signing
description: Sign every commit with a GPG key
requires: [gpg]
needs: [terminal]
sets:
    - { key: commit.gpgsign, value: 'true' }
    - { key: gpg.program, value: gpg }
methods:
    - os: macos
      builtin: git-signing
writes:
    - path: ~/.gnupg
      level: kept
    - path: ~/.gitconfig
      level: settings
      note: '`git config --global` user.signingkey, commit.gpgsign'
