package: station.package/v1
kind: app
name: herdr
description: Agent multiplexer that lives in your terminal
provides: [herdr]
methods:
    - os: macos
      brew: herdr
    - family: linux
      arch: arm64
      github-release: { repo: herdrdev/herdr, asset: 'herdr-linux-aarch64' }
    - family: linux
      arch: amd64
      github-release: { repo: herdrdev/herdr, asset: 'herdr-linux-x86_64' }
