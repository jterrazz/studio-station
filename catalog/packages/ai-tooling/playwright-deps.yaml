package: station.package/v1
kind: app
name: playwright-deps
description: The system libraries and fonts headless Chromium needs on Linux
methods:
    # outside: the list of `playwright install-deps chromium` on Ubuntu 24.04, read in a 24.04 VM.
    - os: ubuntu
      version: '24.04'
      needs: [sudo]
      apt:
          packages:
              [
                  libasound2t64,
                  libatk-bridge2.0-0t64,
                  libatk1.0-0t64,
                  libatspi2.0-0t64,
                  libcairo2,
                  libcups2t64,
                  libdbus-1-3,
                  libdrm2,
                  libgbm1,
                  libglib2.0-0t64,
                  libnspr4,
                  libnss3,
                  libpango-1.0-0,
                  libx11-6,
                  libxcb1,
                  libxcomposite1,
                  libxdamage1,
                  libxext6,
                  libxfixes3,
                  libxkbcommon0,
                  libxrandr2,
                  xvfb,
                  fonts-noto-color-emoji,
                  fonts-unifont,
                  libfontconfig1,
                  libfreetype6,
                  xfonts-cyrillic,
                  xfonts-scalable,
                  fonts-liberation,
                  fonts-ipafont-gothic,
                  fonts-wqy-zenhei,
                  fonts-tlwg-loma-otf,
                  fonts-freefont-ttf,
              ]
