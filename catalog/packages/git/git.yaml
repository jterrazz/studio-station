package: station.package/v1
kind: app
name: git
description: Distributed version control system
provides: [git]
version-read:
    args: [git, --version]
    pattern: git version (\S+)
methods:
    - os: macos
      script:
          run: xcode-select --install
    - os: ubuntu
      needs: [sudo]
      apt: { packages: [git] }
disk:
    paths:
        - path: ~/.gitconfig
          level: settings
    no-erase: 'nothing to erase: keys and logins are kept'
