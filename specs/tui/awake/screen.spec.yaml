description: 'the Awake screen: a block per Mac, its keys, toggles and guards, a policy with the server it hosts'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; "$STATION" awake until 18:00 --lid >/dev/null; terminal --size 110x34 "$STATION" | /usr/bin/sed -n "s/^.\{24\}┃//p" | /usr/bin/sed -n "/Every Mac, this one first/,/From here or from any Mac/p" | /usr/bin/perl -CSD -pe "s/ *\x{2503}$//"'
      stdin: |
          see Overview · This Mac
          send [
          see Awake · every Mac · 2
          see From here or from any Mac
          screen
          send q
      exit: 0
      stdout: |4
           Every Mac, this one first. VMs follow their Mac and are not listed.

           This Mac · jterrazz-macbook-pro · you are here
             ● Awake until 18:00 · lid closed · 7h 59m left
               For        1 1 h   4 4 h   u until 18:00 (on)   o off
               Lid closed ● on    On battery ○ off     l b toggle
               Guards     temperature nominal · battery 96 % · the screen still turns off

           mac-mini · jterrazz-mac-mini · over Tailscale
             ● Never sleeps · always-on Mac policy
               Last slept never in 12d 1h
               Set by     Settings › Always-on Mac › Never sleeps
               Hosts      infra  Server · it pauses if mac-mini sleeps
               c Change… keep the policy, or allow sleep (asks: y/n, names infra)

           From here or from any Mac: the same controls, sent over Tailscale.
