description: 'on mac-mini, which has no lid and no battery, Awake offers no l or b and sends no --lid'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 130x34 "$STATION"'
      stdin: |
          see Overview · This Mac
          send [
          see Awake · every Mac · 2
          see l lid  b battery
          send l
          see Lid closed on for the next keep-awake
          send j
          see o off  c change the policy
          gone l lid
          gone b battery
          send l
          send c
          see Let mac-mini sleep again?
          send y
          see ○ mac-mini  Sleeps normally
          send 1
          see mac-mini stays awake for 1 h
          run /usr/bin/jq -e '.macs["jterrazz-mac-mini"].power.holds == ["station: station awake 1h"]' world.json >/dev/null
          gone has no lid
          send q
      exit: 0
