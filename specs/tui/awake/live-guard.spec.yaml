description: 'a guard that ends the keep-awake while Awake is shown redraws the page at once'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; "$STATION" awake 4h >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Overview · This Mac
          send [
          see Awake until 14:
          run "$STATION" world thermal serious
          within 3 see ◐ This Mac  Awake stopped · thermal serious
          send q
      exit: 0
