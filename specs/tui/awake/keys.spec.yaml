description: 'the Awake keys 1, 4, l, b, o, u on the Mac under the cursor, and c asking y/n naming infra'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Overview · This Mac
          send [
          see Awake · every Mac · 2
          send 1
          see 59m left
          run /usr/bin/jq -e '.macs["jterrazz-macbook-pro"].power.holds == ["station: station awake 1h"]' world.json >/dev/null
          send 4
          see 3h 59m left
          send l
          see · lid closed · 3h
          run /usr/bin/jq -e '.macs["jterrazz-macbook-pro"].power.clamshell == true' world.json >/dev/null
          send b
          see lid closed · on battery allowed
          send o
          see Sleeps normally
          run /usr/bin/jq -e '.macs["jterrazz-macbook-pro"].power.holds == null' world.json >/dev/null
          send u
          see Keep This Mac awake until
          send \r
          see Awake until 18:00 · lid closed · on battery allowed
          send j
          send c
          see Let mac-mini sleep again?
          see It hosts infra (server): infra pauses while mac-mini sleeps.
          see y allow sleep   n no
          send y
          see ○ mac-mini  Sleeps normally
          send q
      exit: 0
