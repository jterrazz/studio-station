description: 'four calls at once: the strip shows three and +1 more; tab focuses it and lists them all'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: 'world hold Installer.Install'
      exit: 0
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          send ]]
          see Apps · This Mac
          send /rust
          see (/rust)
          send \r
          settle
          send j
          see i install
          send i
          see Installing rust
          send \x1b
          settle
          send /bun
          see (/bun)
          send \r
          settle
          send j
          see i install
          send i
          see Installing bun
          send \x1b
          settle
          send /ohmyzsh
          see (/ohmyzsh)
          send \r
          settle
          send j
          see i install
          send i
          see Installing ohmyzsh
          send \x1b
          settle
          send /zed
          see (/zed)
          send \r
          settle
          send j
          see i install
          send i
          see +1 more · tab to open
          send \x1b
          settle
          see +1 more · tab to open
          gone Installing zed
          send \t\t
          see Installing zed
          gone +1 more
          see tab next pane  esc back
          send \x1b
          see +1 more · tab to open
          send q
          see 4 calls still run here: quit anyway?
          send y
      exit: 0
