description: 'a call spins in the Progress strip with its seconds while every key works; a success toasts for 4 s'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          send ]]
          see Apps · This Mac
          send /fd
          see (/fd)
          send \r
          settle
          send j
          see i install
          send i
          see Progress  ✓ Installed fd
          run /bin/sleep 3
          see Progress  ✓ Installed fd
          gone ✓ Installed fd
          send q
      exit: 0
    - command: 'world hold Installer.Install'
      exit: 0
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          send ]]
          see Apps · This Mac
          send /rust
          see (/rust)
          send \r
          settle
          send j
          see i install
          send i
          see Installing rust
          see Installing rust · 1 s
          send ]
          see Settings · This Mac
          send [
          see All machines › This Mac › Apps
          send \x1b[Z
          see Installing rust · 2 s
          send q
          see 1 call still runs here: quit anyway?
          send y
      exit: 0
