description: 'a click selects, a double click opens, the wheel scrolls: in the sidebar and in a list'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see infra always on
          send \x1b[<0;6;10M\x1b[<0;6;10m
          send \x1b[<0;6;10M\x1b[<0;6;10m
          see All machines › mac-mini › Overview
          see MAC-MINI
          send \x1b[<0;6;6M\x1b[<0;6;6m
          send \x1b[<0;6;6M\x1b[<0;6;6m
          see THIS MAC
          send \x1b[<0;6;17M\x1b[<0;6;17m
          see Apps · This Mac
          see ╭─ This Mac ─
          send \x1b[<65;40;10M
          send \x1b[<65;40;10M
          see ╭─ ghostty ─
          send \x1b[<64;40;10M
          see ╭─ node ─
          send \x1b[<0;40;13M\x1b[<0;40;13m
          see ╭─ gh ─
          see ┏━ Apps · This Mac
          send \x1b[<0;40;13M\x1b[<0;40;13m
          see left list  esc back
          send q
      exit: 0
