description: 'a section whose read fails shows its error block; the other sections still work'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: 'world fault Listeners.Read'
      exit: 0
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see infra always on
          send ]]]]]
          see All machines › This Mac › Ports
          see Error: lsof failed: what listens could not be read
          see Ports              ✗
          send ]
          see Accounts · This Mac
          gone Error: lsof failed
          send [[[[
          see Apps · This Mac
          send q
      exit: 0
