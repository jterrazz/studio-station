description: '? lists every key of the focused pane, then every key that works everywhere; any key closes it'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see mac-mini         1
          send ?
          see Keys · Overview
          screen
          send x
          gone Keys · Overview
          send q
      exit: 0
      stdout: |
          station  ● This Mac · jterrazz-macbook-pro · Engine running · Awake off
           All machines › This Mac › Overview
