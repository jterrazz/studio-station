description: '] opens the next section of the machine, [ the previous one, and they wrap around'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see All machines › This Mac › Overview
          send ]
          see All machines › This Mac › Activity
          send [
          see All machines › This Mac › Overview
          send [
          see All machines › This Mac › Awake
          send ]
          see All machines › This Mac › Overview
          send q
      exit: 0
