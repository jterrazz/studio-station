description: 'the footer lists only the keys that work in the focused pane and its section'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION" | /usr/bin/grep "? keys"'
      stdin: |
          see Needs you
          see mac-mini         1
          screen
          send \x1b[Z
          see enter open
          screen
          send \x09]]
          see Apps · This Mac
          see Not installed
          screen
          send /
          see type filter
          screen
          send \x1b
          gone type filter
          send q
      exit: 0
      stdout: |4
           ↑↓ move  enter fix  left sidebar  esc up a level  tab next pane  [ ] section  ? keys
           ↑↓ move  enter open  right list  esc up a level  tab next pane  [ ] section  ? keys
           ↑↓ move  space tick  U update by method  enter detail  / filter  left sidebar  esc up a level  ? keys
           type filter  enter keep  esc clear  ? keys
