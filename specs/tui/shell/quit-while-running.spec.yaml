description: 'q while an install runs in this process asks first: n keeps working, y quits'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: 'world hold Installer.Install'
      exit: 0
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          send ]]
          see Apps · This Mac
          send /rust
          see (/rust)
          send \r
          settle
          send j
          see i install
          send i
          see Installing rust
          send q
          see 1 call still runs here: quit anyway?
          see y quit  n keep working
          send n
          gone quit anyway?
          see Installing rust
          send q
          see 1 call still runs here: quit anyway?
          send y
          within 5 exit 0
      exit: 0
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          send q
          within 5 exit 0
      exit: 0
