description: 'with the engine stopped the header says it, Overview says what waits for it, and s starts it'
fixture:
    - ../../__fixtures__/terminal/
env:
    - engine-stopped
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see station  ◐ This Mac · jterrazz-macbook-pro · Engine stopped
          see ◐ This Mac         1
          see ◐ Engine stopped  station engine start
          see Awake       needs the engine
          see VMs         ○ api stopped · ○ linux-1 stopped
          see s start the engine
          send s
          see Progress  ✓ Started the engine
          see station  ● This Mac · jterrazz-macbook-pro · Engine running
          gone s start the engine
          send q
      exit: 0
    - command: 'engine --json | /usr/bin/jq -r .engine.state'
      exit: 0
      stdout: |
          running
