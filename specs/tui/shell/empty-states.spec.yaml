description: 'an empty section names the key that fills it, and that key runs'
fixture:
    - ../../__fixtures__/terminal/
env:
    - one-mac
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          send \x1b
          see No VMs yet. Press n to create one.
          send n
          see ▸ Kind          ← Workspace →
          send \r
          see ✗ Creating linux-1, a workspace on This Mac failed: image linux is not
          see b build linux
          send q
      exit: 0
