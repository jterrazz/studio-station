description: 'with NO_COLOR every glyph stays and the focus is heavy; with colour its corners stay rounded'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see ✗ npm sign-in expired
          see ◐ 2 brew updates waiting
          see ┏━ Overview · This Mac
          send q
      exit: 0
    - command: '--version >/dev/null; terminal --size 110x34 /usr/bin/env -u NO_COLOR "$STATION"'
      stdin: |
          see ✗ npm sign-in expired
          see ╮╭─ Overview · This Mac
          gone ┏
          send q
      exit: 0
