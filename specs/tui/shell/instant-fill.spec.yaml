description: 'the first frame names every section ◌, reads the shown section first, then fills'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: 'world slow jterrazz-macbook-pro 3s'
      exit: 0
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION" | /usr/bin/perl -CS -lne ''print substr($_, 0, 24)'''
      stdin: |
          within 1 see ◌ Overview · reading This Mac
          within 1 see ? keys
          screen
          within 10 see Needs you
          see Apps               ◐
          send q
      exit: 0
      stdout: |
          station  ◌ This Mac · jt
           All machines › This Mac
          ╭──────────────────────╮
          │ MACHINES             │
          │ ◇ All machines       │
          │ ◌ This Mac           │
          │                      │
          │ THIS MAC             │
          │▸Overview           ◌ │
          │ Activity           ◌ │
          │ Apps               ◌ │
          │ Settings           ◌ │
          │ Disk               ◌ │
          │ Ports              ◌ │
          │ Accounts           ◌ │
          │ Background         ◌ │
          │ Awake              ◌ │
          │                      │
