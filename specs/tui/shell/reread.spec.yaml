description: 'ctrl+r reads the section shown again: an app installed from another terminal shows once read again'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see infra always on
          send ]]
          see Apps · This Mac
          send /uv
          see (/uv)
          send \r
          see ○ uv
          run "$STATION" apps install uv >/dev/null
          settle
          see ○ uv
          send \x12
          see ● uv
          send q
      exit: 0
