description: 'enter on mac-mini › infra grows the breadcrumb to its Overview, esc twice shrinks it back'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION" | /usr/bin/grep "^ All machines"'
      stdin: |
          see mac-mini
          send \x1b[Z
          send k
          send \r
          see All machines › mac-mini › infra › Overview
          screen
          send \x1b
          see All machines › mac-mini › Overview
          screen
          send \x1b
          see ALL MACHINES
          screen
          send q
      exit: 0
      stdout: |4
           All machines › mac-mini › infra › Overview
           All machines › mac-mini › Overview
           All machines
