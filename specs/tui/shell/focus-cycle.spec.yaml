description: 'tab and shift+tab move the focus pane to pane, and the focused panes border turns heavy'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see ╮┏━ Overview · This Mac
          send \x09
          see ┓╭─ Overview · This Mac
          send \x1b[Z
          see ╮┏━ Overview · This Mac
          send ]]
          see Apps · This Mac
          send \x09
          see ╮┏━ This Mac ━
          send \x09
          see ┏━━━━━━━━━━━━━━━━━━━━━━┓
          send q
      exit: 0
