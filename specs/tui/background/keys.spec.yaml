description: 'x removes a user task after yes or no; c copies a root task''s command, x on it does nothing'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          send [[
          see All machines › This Mac › Background
          see Failing  1
          send j
          see x remove
          send x
          see Remove com.jterrazz.brain.x-snapshot?
          send y
          see ✓ Removed com.jterrazz.brain.x-snapshot
          send /istatmenus
          see (/istatmenus)
          send \r
          settle
          see c copy the command
          send c
          clipboard sudo launchctl bootout system/com.bjango.istatmenus.installer && sudo rm /Library/LaunchDaemons/com.bjango.istatmenus.installer.plist
          see ✓ Copied sudo launchctl bootout
          gone x remove
          send x
          settle
          gone Remove com.bjango
          send q
      exit: 0
    - command: 'background | /usr/bin/grep -c -e x-snapshot -e istatmenus'
      exit: 0
      stdout: |
          1
