description: 'u updates gh, x removes lazygit after yes or no, enter opens gh''s full page'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          send ]]
          see Apps · This Mac
          send /gh
          see (/gh)
          send \r
          settle
          send j
          see enter full page
          send \r
          see lives on  every machine
          see keeps     {cache}/gh
          send \x1b
          settle
          send u
          see ✓ Updated gh
          send \x1b
          settle
          send /lazygit
          see (/lazygit)
          send \r
          settle
          send j
          see x remove
          send x
          see Remove lazygit?
          see y yes  n no
          send y
          see ✓ Removed lazygit
          send q
      exit: 0
    - command: 'apps | /usr/bin/grep -e "	gh	" -e "	lazygit	"'
      exit: 0
      stdout: |
          ○	lazygit		brew	station apps install lazygit
          ●	gh	2.98.0	brew
