description: 'space ticks two apps, i installs them one after the other; you keep navigating'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          send ]]
          see Apps · This Mac
          send /eza
          see (/eza)
          send \r
          settle
          send j
          see i install
          send \x20
          see ✓  ○ eza
          send \x1b
          settle
          send /fd
          see (/fd)
          send \r
          settle
          send j
          see i install
          send \x20
          send i
          see ✓ Installed eza
          see ✓ Installed fd
          send q
      exit: 0
    - command: 'apps | /usr/bin/grep -e "	fd	" -e "	eza	"'
      exit: 0
      stdout: |
          ●	eza	0.23.4	brew
          ●	fd	10.3.0	brew
    - command: 'world hold Installer.Install'
      exit: 0
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          send ]]
          see Apps · This Mac
          send /uv
          see (/uv)
          send \r
          settle
          send j
          see i install
          send \x20
          send \x1b
          settle
          send /cocoapods
          see (/cocoapods)
          send \r
          settle
          send j
          send \x20
          send i
          see Installing cocoapods · 1/2
          send ]
          see Settings · This Mac
          see Installing cocoapods · 1/2
          send q
          see 1 call still runs here: quit anyway?
          send y
      exit: 0
