description: 'a failed install stays in the Progress strip with its keys until dismissed; l opens its log'
fixture:
    - ../../__fixtures__/terminal/
    - ../__fixtures__/opener/
env:
    - two-macs
    - terminal
runs:
    - command: 'world fault Installer.Install 2 times'
      exit: 0
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          send ]]
          see Apps · This Mac
          send /claude
          see (/claude)
          send \r
          settle
          see i install
          send i
          see ✗ Installing claude failed: ~/.local/state/station/logs/claud…  i install claude  l log  x dismiss
          send ]
          see Settings · This Mac
          see ✗ Installing claude failed
          send \t\t
          see i install claude  l log  x dismiss  ? keys
          send x
          gone Installing claude failed
          send [
          see All machines › This Mac › Apps
          settle
          send i
          see ✗ Installing claude failed
          send \t\t
          send l
          file opened
          send i
          gone Installing claude failed
          see ✓ Ran station apps install claude
          send q
      exit: 0
    - command: 'apps claude | /usr/bin/head -1'
      exit: 0
      stdout: |
          ●	claude	1.0.0	script
    - command: '--version >/dev/null; /bin/cat opened'
      exit: 0
      stdout: |
          open ~/.local/state/station/logs/claude.log
