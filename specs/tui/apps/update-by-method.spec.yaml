description: 'U puts the method picker; the method picked updates every app of it, and only those'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          send ]]
          see U update by method
          send U
          see Update by method
          see ▸ mise
          send jj
          see ▸ brew
          send \r
          see ✓ Updated every brew app
          send q
      exit: 0
    - command: 'apps | /usr/bin/grep -e "	gh	" -e "	node	"'
      exit: 0
      stdout: |
          ◐	node	22.11.0	mise	update available · station apps update node
          ●	gh	2.98.0	brew
