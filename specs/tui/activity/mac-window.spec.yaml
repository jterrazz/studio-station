description: 'This Mac › Activity: a sparkline per measure, the disk bar, thermal, battery, up, the top processes; w cycles 6 min · 1 h · 24 h and the title says it'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; for i in 1 2 3 4 5 6 7 8; do "$STATION" world advance 1m; done; terminal --size 110x34 "$STATION" | LC_ALL=en_US.UTF-8 /usr/bin/sed -nE "s/^.{24}┃ (Activity · This Mac · last [^━]*|CPU |Memory |Swap |Disk read |Disk write |Net in |Net out |Disk free |Thermal |Battery |Up |TOP PROCESSES)( *)([▁▂▃▄▅▆▇█░]*)( *)([^┃]*[^ ┃]).*/\1 \3 \5/p" | LC_ALL=en_US.UTF-8 /usr/bin/sed -E "s/█+░+/bar/; s/[▁▂▃▄▅▆▇█]+/graph/; s/ +/ /g; s/[0-9.]+ GB since boot/… since boot/"'
      stdin: |
          see Overview · This Mac
          send ]
          see Activity · This Mac · last 6 min
          screen
          send w
          see Activity · This Mac · last 1 h
          send w
          see Activity · This Mac · last 24 h
          send w
          see Activity · This Mac · last 6 min
          send q
      exit: 0
      stdout: |
          CPU graph 34 % of 10 CPU · load 2.8 3.1 2.9
          Memory graph 12.4 of 16 GB · pressure normal
          Swap graph 1.2 GB used
          Disk read graph 4.1 MB/s · … since boot
          Disk write graph 1.3 MB/s · … since boot
          Net in graph 2.1 MB/s · … since boot
          Net out graph 210 KB/s · … since boot
          Disk free bar 388 GB free of 994 GB
          Thermal ● Nominal
          Battery 96 % · charging · health 98 % · 112 cycles
          Up 3d 4h
          TOP PROCESSES · by CPU p by memory
