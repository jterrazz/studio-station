description: 'p sorts the top processes by memory, then by CPU again'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].meter.top.memory += [{"pid": 900, "name": "Ghostty", "value": 6442450944}]'' world.json > w.json && /bin/mv w.json world.json; terminal --size 110x34 "$STATION" | /usr/bin/awk -F "┃" ''/TOP PROCESSES/ { p = 1; printf "%s:", ($2 ~ /· by memory/ ? "by memory" : "by CPU"); next } p && $2 ~ /^ *$/ { p = 0; print ""; next } p { split($2, w, " +"); printf " %s %s %s", w[2], w[3], w[4] }'''
      stdin: |
          see Overview · This Mac
          send ]
          see TOP PROCESSES · by CPU
          screen
          send p
          see TOP PROCESSES · by memory
          screen
          send p
          see TOP PROCESSES · by CPU
          screen
          send q
      exit: 0
      stdout: |
          by CPU: tart VM linux-1 Zed 9% 2.0 WindowServer 4% 644 Ghostty – 6.4
          by memory: Ghostty – 6.4 tart VM linux-1 Zed 9% 2.0 WindowServer 4% 644
          by CPU: tart VM linux-1 Zed 9% 2.0 WindowServer 4% 644 Ghostty – 6.4
