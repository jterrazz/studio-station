description: 'all machines'' Activity draws SPEC §9.2''s screen: each VM under its Mac with its CPU sparkline, DISK R/W and NET IN/OUT, how it was read, what needs you, each Mac''s thermal state and battery; enter opens a machine''s Activity'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION" | /usr/bin/sed -n "s/^.\{24\}┃//p" | /usr/bin/sed -n "/MACHINE  /,/no battery/p; /Activity · linux-1/p; /up 2h/p" | /usr/bin/perl -CSD -pe "s/[ \x{2581}-\x{2588}]{5}(?= +\d+%)/spark/; s/ *\x{2503}$//"'
      stdin: |
          see mac-mini         1
          send \x1b
          see never sleeps
          send ]
          see Activity · all machines · 5
          see THERMAL AND BATTERY · Macs only
          see ▃ 34%
          screen
          send jj
          send \r
          see All machines › This Mac › linux-1 › Activity
          see Activity · linux-1 · last 6 min
          send q
      exit: 0
      stdout: |4
           MACHINE      KIND       CPU        MEMORY        DISK R/W     NET IN/OUT    FREE
           ● This Mac   Mac        spark 34%  12.4/16 GB    4.1/1.3 MB/s 2.1/0.2 MB/s  388 GB
             ○ api      Workspace  –          –             –            –
             ● linux-1  Workspace  spark  8%  1.1/4 GB      0.2/0.4 MB/s 0.3/0.1 MB/s  12.4 GB
           ● mac-mini   Mac        spark 21%  26/64 GB      1.8/6.2 MB/s 0.9/1.4 MB/s  1.6 TB
             ● infra    Server     spark 18%  15/24 GB      1.1/5.9 MB/s 0.8/1.3 MB/s  44 GB

           Rates: last 1 s. FREE: the machine's own disk; a VM's from inside it.
           api is stopped. Every value comes from the machine itself (guest inside a VM).

           NEEDS YOU · 0 from activity
           Nothing is hot, full or swapping.

           THERMAL AND BATTERY · Macs only
           This Mac   ● Nominal          ● 96 % charging
           mac-mini   ● Nominal          – no battery
