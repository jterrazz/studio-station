description: 'All machines › Activity: one row per machine with DISK R/W and NET IN/OUT; enter opens that machine''s Activity'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION" | /usr/bin/sed -n "s/^.\{24\}┃//p" | /usr/bin/sed -n "/KIND/,/infra/p; /Activity · linux-1/p; /up 2h/p" | /usr/bin/sed "s/ *┃$//"'
      stdin: |
          see mac-mini         1
          send \x1b
          see never sleeps
          send ]
          see Activity · all machines · 5
          screen
          send jjj
          send \r
          see All machines › This Mac › linux-1 › Activity
          see Activity · linux-1 · last 6 min
          send q
      exit: 0
      stdout: |4
                         KIND       CPU      MEMORY      DISK R/W      NET IN/OUT    FREE
             ● This Mac  Mac        34 %     12.4/16 GB  4.1/1.3 MB/s  2.1/0.2 MB/s  388 GB
             ○ api       Workspace  Stopped
             ● linux-1   Workspace  8 %      1.1/4 GB    0.2/0.4 MB/s  0.3/0.1 MB/s  12.4 GB
             ● mac-mini  Mac        21 %     26/64 GB    1.8/6.2 MB/s  0.9/1.4 MB/s  1.6 TB
             ● infra     Server     18 %     15/24 GB    1.1/5.9 MB/s  0.8/1.3 MB/s  44 GB
