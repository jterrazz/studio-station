description: 'at 80 columns each measure shortens its graph and keeps its line: none is dropped'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; for i in 1 2 3 4 5 6 7 8; do "$STATION" world advance 1m; done; terminal --size 80x30 "$STATION" | /usr/bin/sed -n "s/^.\{24\}┃//p" | /usr/bin/sed -n "/^ CPU/,/^ Up/p" | LC_ALL=en_US.UTF-8 /usr/bin/sed -E "s/ *┃$//; s/[0-9.]+ GB since boot/… since boot/"'
      stdin: |
          see Overview · This Mac
          send ]
          see Activity · This Mac · last 6 min
          screen
          send q
      exit: 0
      stdout: |4
           CPU         ▃▃▃▃  34 % of 10 CPU · load 2.8 3.1 2.9
           Memory      ▆▆▆▆  12.4 of 16 GB · pressure normal
           Swap        ▁▁▁▁  1.2 GB used
           Disk read   ████  4.1 MB/s · … since boot
           Disk write  ████  1.3 MB/s · … since boot
           Net in      ████  2.1 MB/s · … since boot
           Net out     ████  210 KB/s · … since boot
           Disk free   ██░░  388 GB free of 994 GB
           Thermal     ● Nominal
           Battery     96 % · charging · health 98 % · 112 cy…
           Up          3d 4h
