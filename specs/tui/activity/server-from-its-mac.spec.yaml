description: 'infra › Activity while its guest is silent: the title says from mac-mini; its process''s CPU and memory only, no disk or network line, never zeros'
fixture:
    - ../../__fixtures__/terminal/
env:
    - server-without-guest
    - terminal
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-mac-mini"].meter = {"sample": {}, "top": {"cpu": [], "memory": []}, "processes": {"2001": {"cpu": 18, "memory": 16106127360, "started": "2026-10-23T10:00:00Z"}}}'' world.json > w.json && /bin/mv w.json world.json; "$STATION" world advance 1m; terminal --size 110x30 "$STATION" | /usr/bin/sed -n "3,10s/^.\{24\}//p" | /usr/bin/sed "s/ *│$//"'
      stdin: |
          see infra always on
          send \x1b[Z
          send k
          send \r
          see INFRA · SERVER
          send ]
          see Activity · infra · from mac-mini (its guest does not answer)
          screen
          send q
      exit: 0
      stdout: |
          ╭─ Activity · infra · from mac-mini (its guest does not answer) ─────────────────────╮
          │ Server · up 12d 0h (since its run started)
          │
          │ CPU         18 % of mac-mini
          │ Memory      15 GB resident
          │ Up          12d 0h (since its run started)
          │
          │
