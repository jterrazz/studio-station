description: 's on linux-1''s Overview asks yes or no, then linux-1 stops'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see mac-mini         1
          send \x1b[Z
          send kkk
          send \r
          see LINUX-1 · WORKSPACE
          gone ◌
          send \t
          see s stop  r restart  e edit  c copy ssh
          send s
          see Stop linux-1?
          see y stop   n no
          send y
          see Stopped linux-1
          see ○ linux-1
          run "$STATION" machines | /usr/bin/grep -q "^○	linux-1	Workspace	jterrazz-macbook-pro	Stopped"
          send q
      exit: 0
