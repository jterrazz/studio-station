description: 'r on linux-1''s Overview restarts it at once, with no question, said in the Progress strip'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see mac-mini         1
          send \x1b[Z
          send kkk
          send \r
          see LINUX-1 · WORKSPACE
          gone ◌
          send \t
          see s stop  r restart  e edit  c copy ssh
          send r
          see Progress  ● Restarted linux-1
          send q
      exit: 0
