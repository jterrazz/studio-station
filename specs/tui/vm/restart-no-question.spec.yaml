description: 'r on linux-1''s Overview restarts it with no question: a new run, said in Progress'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see mac-mini         1
          send \x1b[Z
          send kkk
          send \r
          see LINUX-1 · WORKSPACE
          gone ◌
          send \t
          see s stop  r restart  e edit  c copy ssh
          run /usr/bin/jq -e '.macs["jterrazz-macbook-pro"].vms["linux-1"].pid == 1001' world.json >/dev/null
          send r
          see Progress  ● Restarted linux-1
          run /usr/bin/jq -e '.macs["jterrazz-macbook-pro"].vms["linux-1"] | .pid == 2002 and .booted != null' world.json >/dev/null
          send q
      exit: 0
