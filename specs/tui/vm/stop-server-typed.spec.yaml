description: 'S on infra''s Overview asks its name typed: enter is off until infra is typed exactly, then infra stops'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see mac-mini         1
          send \x1b[Z
          send k
          send \r
          see INFRA · SERVER
          gone ◌
          send \t
          see S stop… (type the name)
          send s
          gone Stop infra?
          send S
          see Stop infra?
          see enter is off until you type infra
          send infr
          send \r
          see Type infra to confirm: infr_
          run "$STATION" machines | /usr/bin/grep -q "^●	infra	Server	jterrazz-mac-mini	Running"
          send a
          see enter stop   esc keep it
          send \r
          see Stopped infra
          run "$STATION" machines | /usr/bin/grep -q "^○	infra	Server	jterrazz-mac-mini	Stopped"
          send q
      exit: 0
