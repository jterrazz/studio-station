description: 'e edits linux-1''s size and infra''s health check; c copies the ssh command of each'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see mac-mini         1
          send \x1b[Z
          send kkk
          send \r
          see LINUX-1 · WORKSPACE
          gone ◌
          send \t
          see s stop  r restart  e edit  c copy ssh
          send e
          see Edit linux-1
          see CPUs          4_
          send \x7f6
          send \t
          see Memory        8G_
          send \r
          see Edited linux-1: it applies when it next starts
          run "$STATION" machines | /usr/bin/grep -q "^●	linux-1	Workspace	jterrazz-macbook-pro	Running · ephemeral	6 CPU	8 GB"
          send c
          see Copied ssh admin@linux-1
          run /usr/bin/grep -qx 'ssh admin@linux-1' clipboard
          send h
          send k
          send \r
          see INFRA · SERVER
          gone ◌
          send \t
          send e
          see Edit infra
          see Health check  https://infra:6443/readyz
          send \t\t\t
          send \x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7finfra:6443
          see Health check  infra:6443_
          send \r
          see Edited infra
          run "$STATION" machines infra --on mac-mini | /usr/bin/grep -q "infra:6443"
          send c
          see Copied ssh admin@infra
          run /usr/bin/grep -qx 'ssh admin@infra' clipboard
          send q
      exit: 0
