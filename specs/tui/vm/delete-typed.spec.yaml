description: 'D on linux-1 asks its name typed, then deletes it and it leaves the sidebar'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see infra always on
          send \x1b[Z
          send kkk
          send \r
          see LINUX-1 · WORKSPACE
          gone ◌
          send \t
          see D delete… (type the name)
          send D
          see Delete linux-1?
          see Its disk, its record, its reserved ports and its shared accounts go with it.
          see Type linux-1 to delete it: _
          see enter is off until you type linux-1
          send linux-
          send \r
          see Type linux-1 to delete it: linux-_
          run "$STATION" machines | /usr/bin/grep -q "	linux-1	"
          send 1
          see enter delete   esc keep it
          send \r
          see Deleted linux-1
          gone └ ● linux-1
          send q
      exit: 0
    - command: 'machines | /usr/bin/grep -c "	linux-1	"'
      exit: 1
      stdout: |
          0
