description: 'the All machines table and its sections in the one order; enter opens a machine, sidebar or not'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION" | /usr/bin/head -21'
      stdin: |
          see mac-mini         1
          send \x1b
          see MACHINE
          see never sleeps
          gone ◌
          screen
          send q
      exit: 0
      stdout: |
          station  ● This Mac · jterrazz-macbook-pro · Engine running · Awake off
           All machines
          ╭──────────────────────╮┏━ Overview · All machines ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
          │ MACHINES             │┃     MACHINE     KIND       CPU    MEMORY      DISK     PORTS  AWAKE         NEED   ┃
          │ ◇ All machines       │┃   ● This Mac    Mac        ▃ 34%  12.4/16 GB  388 GB   0 · 0  sleeps        9      ┃
          │ ● This Mac         9 │┃   ├─ ○ api      Workspace  –      –           –        –      –             –      ┃
          │  Workspaces          │┃   └─ ● linux-1  Workspace  ▁ 8%   1.1/4 GB    12.4 GB  0 · 2  –             –      ┃
          │  ├ ○ api             │┃   ● mac-mini    Mac        ▂ 21%  26/64 GB    1.6 TB   0 · 0  never sleeps  1      ┃
          │  └ ● linux-1         │┃   └─ ● infra    Server     ▂ 18%  15/24 GB    44 GB    0 · 0  –             –      ┃
          │ ● mac-mini         1 │┃                                                                                    ┃
          │  Servers             │┃   4 running · 1 stopped · PORTS: public · private                                  ┃
          │  └ ● infra always on │┃                                                                                    ┃
          │                      │┃ Needs you · 10                                                                     ┃
          │ ALL MACHINES         │┃   ✗ This Mac  npm sign-in expired                                    npm login     ┃
          │▸Overview             │┃   ✗ This Mac  com.jterrazz.brain.x-snapshot is failing, last exit 2  station back… ┃
          │ Activity             │┃   ◐ This Mac  1 mise update waiting                                  station apps… ┃
          │ Settings             │┃   ◐ This Mac  2 brew updates waiting                                 station apps… ┃
          │ Ports                │┃   ◐ This Mac  Firewall: off                                          System Setti… ┃
          │ Accounts             │┃   ◐ This Mac  ~/.tart is misplaced                                   station disk… ┃
          │ Images               │┃   ◐ This Mac  com.bjango.istatmenus.installer is an orphan           sudo launchc… ┃
          │                      │┃   ◐ This Mac  com.docker.socket is an orphan                         sudo launchc… ┃
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see mac-mini         1
          send \x1b
          see never sleeps
          send jjj
          send \r
          see All machines › mac-mini › Overview
          see MAC-MINI
          send q
      exit: 0
    - command: '--version >/dev/null; terminal --size 70x34 "$STATION"'
      stdin: |
          see Needs you
          send \x1b
          see never sleeps
          gone MACHINES
          send jjj
          send \r
          see All machines › mac-mini › Overview
          see Overview · mac-mini
          send q
      exit: 0
