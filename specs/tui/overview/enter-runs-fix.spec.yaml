description: 'enter on a Needs-you line whose fix is station''s runs it; the line leaves'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          see 2 brew updates waiting
          send jjj
          see enter fix
          send \r
          see ✓ Fixed: 2 brew updates waiting
          gone 2 brew updates waiting
          send q
      exit: 0
    - command: 'apps | /usr/bin/grep -c "update available"'
      exit: 0
      stdout: |
          1
