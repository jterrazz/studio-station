description: 'enter on a Needs-you line whose fix is yours shows the fix; nothing runs'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          see npm sign-in expired
          send \r
          see Run it yourself:
          see npm login
          see station runs nothing here
          send \x1b
          settle
          send jjjj
          send \r
          see Open it yourself:
          see System Settings > Network >
          see Firewall
          gone Progress
          send q
      exit: 0
    - command: 'overview | /usr/bin/head -3'
      exit: 0
      stdout: |
          # Needs you
          ✗	npm sign-in expired	npm login
          ✗	com.jterrazz.brain.x-snapshot is failing, last exit 2	station background remove com.jterrazz.brain.x-snapshot
    - command: 'apps | /usr/bin/grep "update available"'
      exit: 0
      stdout: |
          ◐	node	22.11.0	mise	update available · station apps update node
          ◐	ghostty	1.2.0	cask	update available · station apps update ghostty
          ◐	gh	2.97.0	brew	update available · station apps update gh
