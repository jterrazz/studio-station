description: 'ctrl+p searches the calls with their keys and confirmations; tab changes the machine'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see infra always on
          send \x10
          see Actions · on This Mac
          see tab on This Mac → on api
          send update
          see ▸ Update every app
          see Update the images
          gone Open Apps
          send \t\t\t
          see Actions · on mac-mini
          send \x7f\x7f\x7f\x7f\x7f\x7f
          send stop infra
          see ▸ Stop infra (server) on mac-mini · type infra
          send \t
          see Actions · on infra
          send \x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f\x7f
          send app
          see Nothing on infra matches app.
          send \x7f\x7f\x7f
          send restart
          see ▸ Restart infra (server) on mac-mini
          send \x1b
          gone Actions
          settle
          send \x10
          send update every
          see ▸ Update every app
          send \r
          see Progress
          see Updated every app
          send \x10
          see RECENT
          see    Update every app
          send \x1b
          settle
          send q
      exit: 0
