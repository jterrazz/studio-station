description: 'bare station on a terminal opens the TUI on This Mac: header, breadcrumb, sidebar, Overview'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see station  ● This Mac · jterrazz-macbook-pro
          see All machines › This Mac › Overview
          see THIS MAC
          see Overview · This Mac
          see Needs you
          send q
      exit: 0
