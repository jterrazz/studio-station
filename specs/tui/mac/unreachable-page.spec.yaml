description: 'a Mac that does not answer: its last answer, the likely cause, u unlock… and r retry'
fixture:
    - ../../__fixtures__/terminal/
    - ../__fixtures__/opener/
env:
    - mini-offline
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see infra always on
          send \x1b[Z
          send kk
          send \r
          see MAC-MINI
          see ✗ mac-mini does not answer · last answer 03:12
          see Likely: it restarted after a power cut and waits at the FileVault unlock.
          see → u Unlock…   station machines unlock mac-mini   (asks its password)
          see infra is a server on mac-mini: its state is unknown until mac-mini answers.
          send \t
          see u unlock…  r retry now
          send u
          see A new terminal runs station machines unlock mac-mini
          file opened
          run "$STATION" world unlock jterrazz-mac-mini
          send r
          gone does not answer
          see Overview · mac-mini
          send q
      exit: 124
      stderr: |
          still saw 'does not answer' (9013 bytes drawn in 10.3 s); the screen held:
          station  ✗ mac-mini · jterrazz-mac-mini · Unreachable · last answer 03:12
           All machines › mac-mini › Overview
          ╭──────────────────────╮┏━ Overview · mac-mini ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
          │ MACHINES             │┃ ✗ mac-mini does not answer · last answer 03:12                                     ┃
          │ ◇ All machines       │┃                                                                                    ┃
          │ ● This Mac         3 │┃ What station knows                                                                 ┃
          │  Workspaces          │┃   ✗ mac-mini answers neither station nor ssh                                       ┃
          │  ├ ○ api             │┃   ◐ It runs a server: after a power cut, its disk unlock needs you                 ┃
          │  └ ● linux-1         │┃                                                                                    ┃
          │ ✗ mac-mini           │┃ Likely: it restarted after a power cut and waits at the FileVault unlock.          ┃
          │  Servers             │┃ Tailscale starts only after the disk is unlocked, so unlock it from the            ┃
          │  └ ? infra always on │┃ same network as mac-mini:                                                          ┃
