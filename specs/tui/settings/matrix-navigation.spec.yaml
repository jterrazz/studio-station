description: 'the matrix moves cell to cell, opens a setting on its machine, filters with F, applies across'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          send \x1b
          settle
          send ]]
          see This Mac  mac-mini  linux-1  api  OK
          see ○ hushlogin               [○]        ○         ○        ?    0/3
          send F
          see Settings · All machines · only what needs a look
          gone hushlogin
          see ◐ firewall [◐]        ●         –        ?    1/2
          see infra · not checked: station does not manage its settings
          send l
          see ◐ firewall  ◐        [●]        –        ?    1/2
          send \r
          see All machines › mac-mini › Settings
          see ─ firewall ─
          send \x1b
          settle
          send ]]
          see only what needs a look
          send F
          see hushlogin
          send /git-shortcuts
          see Settings (/git-shortcuts) 1 · All machines
          send \r
          settle
          see a apply across
          send a
          see ✓ Applied git-shortcuts on every machine · api skipped (stopped) · infra skipped (server)
          see ● git-shortcuts            ●        [●]        ●        ?    3/3
          send h
          see ● git-shortcuts           [●]        ●         ●        ?    3/3
          send h
          see right list
          send q
      exit: 0
    - command: 'settings --all-machines --all | /usr/bin/grep -e git-shortcuts'
      exit: 0
      stdout: |
          ●	git-shortcuts	●	●	●	?	3/3
