description: 'a applies, d shows the diff, o turns off after yes or no, f opens the System Settings pane'
fixture:
    - ../../__fixtures__/terminal/
    - ../__fixtures__/opener/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          send ]]]
          see All machines › This Mac › Settings
          send /hushlogin
          see (/hushlogin)
          send \r
          settle
          send j
          see d diff
          send d
          see ~/.hushlogin
          send \x1b
          settle
          send a
          see ✓ Applied hushlogin
          send \x1b
          settle
          send /dock-reset
          see (/dock-reset)
          send \r
          settle
          send j
          see o off here
          send o
          see Turn off dock-reset?
          send y
          see ✓ Turned off dock-reset
          send \x1b
          settle
          send /firewall
          see (/firewall)
          send \r
          settle
          see f open the fix
          send f
          see ✓ Opened x-apple.systempreferences:com.apple.Network-Settings.extension?Firewall
          send q
      exit: 0
    - command: 'settings | /usr/bin/grep -e "^.	hushlogin" -e "^.	dock-reset"'
      exit: 0
      stdout: |
          ●	hushlogin	applied · ~/.hushlogin
          ⊘	dock-reset	off here
    - command: '--version >/dev/null; /bin/cat opened'
      exit: 0
      stdout: |
          open x-apple.systempreferences:com.apple.Network-Settings.extension?Firewall
