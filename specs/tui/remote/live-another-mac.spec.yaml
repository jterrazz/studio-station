description: 'infra''s Activity on mac-mini, open from This Mac, follows it live across a restart'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION" >/dev/null; /bin/cat seen.txt; /usr/bin/jq -c ''.macs | map_values(.engine.activity | keys?)'' world.json'
      stdin: |
          see mac-mini         1
          send \x1b[Z
          send k
          send \r
          see INFRA · SERVER
          see Ports · 0
          send \t
          send \r
          see Activity · infra · last 6 min
          run "$STATION" world crash infra
          run "$STATION" machines infra --json | /usr/bin/jq -c '[.state, .restarts]' > seen.txt
          run for i in 1 2 3 4 5 6; do "$STATION" world advance 2s; done
          within 10 see ▂▂
          send q
      exit: 0
      stdout: |
          ["running",1]
          {"jterrazz-mac-mini":["infra","jterrazz-mac-mini"],"jterrazz-macbook-pro":["jterrazz-macbook-pro","linux-1"]}
