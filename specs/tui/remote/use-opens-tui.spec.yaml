description: 'a terminal that uses linux-1 opens the TUI on it; m moves the TUI, not the terminal'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: 'use linux-1'
      exit: 0
      stdout: |
          	On linux-1 in this terminal. Other terminals stay on This Mac.
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see All machines › This Mac › linux-1 › Overview
          see LINUX-1 · WORKSPACE
          see infra always on
          send m
          send mac-mini
          see ▸ ● mac-mini  Mac
          send \r
          see All machines › mac-mini › Overview
          see MAC-MINI
          send q
      exit: 0
    - command: 'shell prompt'
      exit: 0
      stdout: |
          on linux-1
