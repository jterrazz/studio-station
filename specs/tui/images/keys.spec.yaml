description: 'x deletes an older image after yes or no, b builds one, u fetches the newest'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          send \x1b
          see ALL MACHINES
          send [
          see All machines › Images
          send /2026.10.20
          see (/2026.10.20)
          send \r
          settle
          see x delete
          send x
          see Delete linux 2026.10.20?
          send y
          see ✓ Deleted linux 2026.10.20
          send \x1b
          settle
          send /2026.11.01
          see (/2026.11.01)
          send \r
          settle
          see b build
          send b
          see ✗ Building linux failed: this station is a dev build
          send \t\t
          send x
          gone Building linux failed
          send \x1b
          settle
          send /mac-mini
          see (/mac-mini)
          send \r
          settle
          see u update
          send u
          see ✓ Updated linux
          send q
      exit: 0
    - command: 'images'
      exit: 0
      stdout: |
          ●	linux	2026.11.01	4.0 GB	jterrazz-macbook-pro	api · linux-1
          ●	linux	2026.11.03	4.0 GB	jterrazz-mac-mini	no VM made from it
          ○	linux	2026.11.01	4.0 GB	jterrazz-mac-mini	infra
          ○	macos				not built yet
