description: 'enter on a shared port opens its detail with the QR code; c copies its link'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x40 "$STATION"'
      stdin: |
          see mac-mini         1
          send \x1b
          see never sleeps
          send ]]]
          see Ports · all machines
          send /5173
          send \r
          send \r
          see scan with a phone
          send c
          see Copied https://jterrazz-macbook-pro.tail1234.ts.net:40001
          run /usr/bin/grep -qx 'https://jterrazz-macbook-pro.tail1234.ts.net:40001' clipboard
          send q
      exit: 0
