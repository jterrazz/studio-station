description: 'all machines'' Ports: a table per class, the fix in full, a unfolds, enter opens the detail'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; "$STATION" world listen jterrazz-mac-mini "*:5000" ControlCenter; "$STATION" world listen jterrazz-mac-mini "127.0.0.1:6379" redis; terminal --size 110x34 "$STATION" | /usr/bin/sed -n "s/^.\{24\}┃//p" | /usr/bin/sed -n "/Needs you/,/machine only/p" | /usr/bin/perl -CSD -pe "s/ *\x{2503}$//"'
      stdin: |
          see mac-mini         2
          send \x1b
          see never sleeps
          send ]]
          see Ports · all machines · 3
          see 1 more listens on its machine only · a all
          screen
          send a
          see Listens on its machine only · 1
          gone 1 more listens on its machine only
          see mac-mini   6379   redis             127.0.0.1:6379
          send a
          see 1 more listens on its machine only · a all
          gone Listens on its machine only · 1
          send \r
          see category    Needs you
          send q
      exit: 0
      stdout: |4
           ✗ Needs you · reachable outside Tailscale, not declared public · 1
              MACHINE    PORT   WHAT              LISTENS ON              DECLARED
           ✗  mac-mini   5000   AirPlay Receiver  *:5000 all interfaces   no
              Fix: System Settings › General › AirDrop & Handoff › AirPlay Receiver off, or
              declare a port you mean to open: d declare public

           Private · shared with you on Tailscale · 2
              linux-1    5173   node              https://jterrazz-macbook-pro…:40001
              linux-1    7000   server            jterrazz-macbook-pro…ail1234.ts.net:40002

           Station reads what listens, then compares it with what you declared.
           1 more listens on its machine only · a all
