description: 's on linux-1''s Ports asks the port in a form, then the port is shared and its row shows its link'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x40 "$STATION"'
      stdin: |
          see mac-mini         1
          send \x1b[Z
          send kkk
          send \r
          see LINUX-1 · WORKSPACE
          gone ◌
          send \t
          send ]]]]]
          see Ports · linux-1 · 2
          send s
          see Share a port of linux-1
          send 3000
          send \r
          see Shared it
          see 3000                     https://jterrazz-macbook-pro…:40000
          run "$STATION" ports --all-machines | /usr/bin/grep -q "linux-1	3000	private	https://jterrazz-macbook-pro.tail1234.ts.net:40000"
          send q
      exit: 0
