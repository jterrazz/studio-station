description: 'd on a red port asks its route in a form, then the port is declared and moves to Public'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; "$STATION" world listen jterrazz-mac-mini "*:5000" ControlCenter; terminal --size 110x40 "$STATION"'
      stdin: |
          see mac-mini         2
          send \x1b
          see never sleeps
          send ]]
          see Needs you: reachable outside Tailscale
          send /5000
          send \r
          send d
          see Declare jterrazz-mac-mini 5000 public
          see Route         lan_
          send \r
          see Declared jterrazz-mac-mini 5000 public
          gone Needs you: reachable outside Tailscale
          see Public: reachable from anywhere else
          run "$STATION" ports --all-machines | /usr/bin/grep -q "jterrazz-mac-mini	5000	public"
          send q
      exit: 0
