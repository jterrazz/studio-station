description: 'x stops sharing a port after a yes; u undeclares a public one after a yes, and it leaves Public'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; "$STATION" world listen infra "*:443" traefik; terminal --size 110x40 "$STATION"'
      stdin: |
          see mac-mini         1
          send \x1b
          see never sleeps
          send ]]
          see Public: reachable from anywhere else
          send /5173
          send \r
          send x
          see Stop sharing linux-1 5173?
          see y stop sharing   n no
          send y
          see Stopped sharing linux-1 5173
          gone 5173 → 40001
          run "$STATION" ports --all-machines | /usr/bin/grep -q "linux-1	5173	private		behind jterrazz-macbook-pro, not shared"
          send \x1b
          gone (/5173)
          send /443
          send \r
          send u
          see Undeclare infra 443?
          send y
          see Undeclared infra 443
          gone Public: reachable from anywhere else
          see ● infra   443  private  own Tailscale devic
          run "$STATION" ports --all-machines | /usr/bin/grep -q "infra	443	private		own Tailscale device: infra"
          send q
      exit: 0
