description: 'n opens the create form: enter creates linux-2 and the sidebar gains it under This Mac'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see infra always on
          send n
          see Create
          see ▸ Kind          ← Workspace →   Workspace · Server
          see   Name          linux-2
          see   On            ← This Mac →   This Mac · mac-mini
          see   Lifetime      ← Ephemeral →   Ephemeral · Persistent
          send \t\t\t
          see ▸ Lifetime
          send \x1b[C
          see ← Persistent →
          send \t
          send \x7f
          send 2
          see CPUs          2_
          send \r
          see Created linux-2, a workspace on This Mac
          see  └ ● linux-2
          send q
      exit: 0
    - command: 'machines | /usr/bin/grep linux-2'
      exit: 0
      stdout: |
          ●	linux-2	Workspace	jterrazz-macbook-pro	Running · persistent	2 CPU	4 GB
