description: 'n, kind Server: the form asks the name and the health check, no lifetime'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see infra always on
          send n
          see ▸ Kind          ← Workspace →
          send \x1b[C
          see ▸ Kind          ← Server →
          see   Name          server-1
          see   Health check
          gone Lifetime
          see   Memory        8G
          send \t\t
          send \x1b[C
          see ← mac-mini →
          send \t
          send infra:6443
          see Health check  infra:6443_
          send \r
          see Created server-1, a server on mac-mini
          see  └ ● server-1 always
          send q
      exit: 0
    - command: 'machines | /usr/bin/grep server-1'
      exit: 0
      stdout: |
          ●	server-1	Server	jterrazz-mac-mini	Running · always on	4 CPU	8 GB
