description: 'm opens Switch machine: inf keeps infra, enter moves the whole TUI to it, - goes back to the previous machine'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see infra always on
          send m
          see Switch machine
          see ALL MACHINES
          see ● infra  Server · Running · Always on · on mac-mini
          send inf
          see › inf_
          gone ● api
          send \r
          see station  ● infra · Server · Running · Always on · on mac-mini
          see All machines › mac-mini › infra › Overview
          see INFRA · SERVER
          send -
          see All machines › This Mac › Overview
          see THIS MAC
          send m
          see RECENT
          see ▸ ● infra  Server
          send \x1b
          gone Switch machine
          send q
      exit: 0
