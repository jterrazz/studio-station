description: 't takes an account back from a VM after yes or no; s shares one with the VM picked'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          send [[[
          see All machines › This Mac › Accounts
          within 30 see npm
          send /github
          see (/github)
          send \r
          settle
          send jj
          see t take back
          send t
          see Take github back from linux-1?
          send y
          within 30 see ✓ Took github back from linux-1
          send k
          see s share with a VM
          send s
          see Share github with
          see ▸ linux-1
          send \r
          within 30 see ✓ Shared github with linux-1
          send q
      exit: 0
    - command: 'accounts | /usr/bin/grep linux-1'
      exit: 0
      stdout: |
          ●	claude	linux-1	11 h left
          ●	github	linux-1	12 h left
