description: 'infra › SSH: c copies the ssh command, o opens a new terminal that runs it'
fixture:
    - ../../__fixtures__/terminal/
    - ../__fixtures__/opener/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          see infra
          send \x1b
          see never sleeps
          send jjjj
          send \r
          see All machines › mac-mini › infra › Overview
          send [
          see All machines › mac-mini › infra › SSH
          see c copy
          send c
          clipboard ssh admin@infra
          see ✓ Copied ssh admin@infra
          send o
          see ✓ A new terminal runs ssh admin@infra
          send q
      exit: 0
    - command: '--version >/dev/null; /bin/cat opened'
      exit: 0
      stdout: |
          osascript tell application "Terminal" to do script "ssh admin@infra"
          osascript tell application "Terminal" to activate
