description: 'infra''s Overview: its state, what it was created with, its last hour, its ssh, its Health and Ports beside (under it at 80 columns); enter opens its Activity'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; "$STATION" world listen infra "*:443" traefik; "$STATION" world listen infra 127.0.0.1:20241 cloudflared; "$STATION" ports declare infra 443 --via cloudflare-tunnel >/dev/null; "$STATION" world listen infra "*:6443" k3s-server; for i in 1 2 3 4 5 6; do "$STATION" world advance 1m; done; terminal --size 110x34 "$STATION" | /usr/bin/sed -n "3,24s/^.\{24\}//p" | /usr/bin/sed "s/ *│$//"'
      stdin: |
          see infra always on
          send \x1b[Z
          send k
          send \r
          see INFRA · SERVER
          see ACTIVITY · last hour
          see Ports · 2
          screen
          send \t
          send \r
          see Activity · infra · last 6 min
          send q
      exit: 0
      stdout: |
          ╭─ infra  Server  ───────────────────────────────╮╭─ Health ● ───────────────────────╮
          │ ● Running · up 12d 0h                          ││ ● Running
          │ Restarts   ↺ 0 · none since boot               ││ ● Has an address  192.168.64.5
          │ Wanted     Running · Stop sets it to Stopped   ││ ● SSH answers
          │                                                ││ ● Check passes
          │ CREATED WITH                          e edit   ││   https://infra:6443/readyz
          │   Kind     Server · always on                  │╰──────────────────────────────────╯
          │   Size     8 CPU · 24 GB · 80 GB               │╭─ Ports · 2 ──────────────────────╮
          │   Check    https://infra:6443/readyz           ││ Public · declared
          │                                                ││   443  Cloudflare Tunnel ●
          │ ACTIVITY · last hour              enter open   ││
          │   CPU  ▂▂▂▂▂▂▂     18 % of 8 CPU               ││ Private · Tailscale
          │   Mem  ▅▅▅▅▅▅▅     15 of 24 GB                 ││   6443 Kubernetes API
          │   Disk ████░░░░░░  36 of 80 GB                 ││   on its own device: infra
          │                                                ││
          │ SSH · for debugging                            ││ Nothing else reachable
          │   ssh admin@infra   c copy                     ││ outside Tailscale. ●
          │                                                ││
          │ NOT MANAGED: Apps, Settings, Disk, Accounts.   ││
          │ Your own tooling manages what runs inside.     ││
          │                                                ││
          │   r Restart   S Stop… type infra               ││
    - command: '--version >/dev/null; terminal --size 80x44 "$STATION" | /usr/bin/sed -n "/NOT MANAGED/,/outside Tailscale/p" | /usr/bin/sed "s/^.\{24\}//; s/ *│$//"'
      stdin: |
          see infra always on
          send \x1b[Z
          send k
          send \r
          see INFRA · SERVER
          see Ports · 2
          screen
          send q
      exit: 0
      stdout: |
          │ NOT MANAGED: Apps, Settings, Disk, Accounts.
          │ Your own tooling manages what runs inside.
          │
          │   r Restart   S Stop… type infra
          │
          │ Health ●
          │ ● Running
          │ ● Has an address  192.168.64.5
          │ ● SSH answers
          │ ● Check passes
          │   https://infra:6443/readyz
          │
          │ Ports · 2
          │ Public · declared
          │   443  Cloudflare Tunnel ●
          │
          │ Private · Tailscale
          │   6443 Kubernetes API
          │   on its own device: infra
          │
          │ Nothing else reachable
          │ outside Tailscale. ●
