description: 'infra''s SSH: its one door through mac-mini, each hop that reaches it; c copies the command'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION" | /usr/bin/sed -n "3,17s/^.\{24\}//p" | /usr/bin/sed "s/ *│$//"; /bin/cat clipboard; echo'
      stdin: |
          see infra always on
          send \x1b[Z
          send k
          send \r
          see INFRA · SERVER
          send ]]]
          see HOW IT IS REACHED
          see 192.168.64
          see as jterrazz.agent
          screen
          send \t
          see c copy  
          send c
          see Copied ssh admin@infra
          send q
      exit: 0
      stdout: |
          ╭─ SSH · infra ──────────────────────────────────────────────────────────────────────╮
          │ The one door into infra, through mac-mini. No password: your key.
          │
          │   ssh admin@infra                                 c copy
          │   From any Mac: the block in your ssh_config hops through mac-mini.
          │   In an editor: Remote SSH to infra (Zed, VS Code).
          │
          │ HOW IT IS REACHED
          │   This Mac › mac-mini   over Tailscale, as jterrazz.agent
          │   mac-mini › infra      192.168.64.5 · its Mac's private network
          │
          │ Files travel through the same name; no folder of a Mac is shared.
          │
          │ Station opens it for debugging only; your tooling owns what runs inside.
          │
          ssh admin@infra
