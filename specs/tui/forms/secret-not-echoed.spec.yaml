description: 'a applies claude-token through its form: the token drawn masked, sent, asked afresh'
fixture:
    - ../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 110x34 "$STATION"'
      stdin: |
          see Engine running
          send ]]]
          see All machines › This Mac › Settings
          send /claude-token
          see (/claude-token)
          send \r
          settle
          send j
          send a
          see Configure claude-token
          see ▸ Claude Code token
          send sk-ant-oat01-x
          see ▸ Claude Code token  ••••••••••••••_
          gone sk-ant
          send \r
          see ✓ Applied claude-token
          gone ••••
          settle
          send a
          see Configure claude-token
          see ▸ Claude Code token  _
          gone ••••
          send \x1b
          settle
          send q
      exit: 0
    - command: 'settings claude-token --json | /usr/bin/jq -r .setting.state'
      exit: 0
      stdout: |
          applied
    - command: '--version >/dev/null; /usr/bin/grep -c sk-ant world.json'
      exit: 1
      stdout: |
          0
