description: 'the Claude token reaches studio on stdin, never as an argument, and the share list once'
fixture:
    - ../../__fixtures__/terminal/
    - ./__fixtures__/settings-studio/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION" settings apply claude-token'
      stdin: |
          see ┃ Claude Code token
          send sk-ant-oat01-x\r
          see ●
          screen
      exit: 0
      stdout: |
          Configure claude-token
          ┃ Claude Code token
          ┃ run `claude setup-token` and paste the token
          ●       claude-token
          ●       operator:claude:oauth-token     kept by the studio credential store
          ●       share list      holds operator:claude:oauth-token
    - command: '--version >/dev/null; terminal "$STATION" settings apply claude-token'
      stdin: |
          see ┃ Claude Code token
          send sk-ant-oat01-x\r
          see ●
      exit: 0
      files:
          .calls:
              equals: |
                  studio credentials export operator:claude:oauth-token
                  studio credentials import
                  {"operator:claude:oauth-token":"sk-ant-oat01-x"}
                  studio credentials export operator:claude:oauth-token
                  studio credentials export operator:claude:oauth-token
                  studio credentials import
                  {"operator:claude:oauth-token":"sk-ant-oat01-x"}
                  studio credentials export operator:claude:oauth-token
    - command: '--version >/dev/null; /usr/bin/jq -c .lend_list .config/station/preferences.json'
      exit: 0
      stdout: |
          ["operator:claude:oauth-token"]
    - command: '--version >/dev/null; /usr/bin/grep -c sk-ant .config/station/preferences.json'
      exit: 1
      stdout: |
          0
    - command: '--version >/dev/null; /bin/rm bin/studio .calls; terminal --size 120x24 "$STATION" settings apply claude-token'
      stdin: |
          see yours is lost
          send y
          see ┃ Claude Code token
          send sk-ant-oat01-x\r
          see Hint:
          screen
      exit: 1
      stdout: |
          ┃ Apply claude-token? A setting changed since is overwritten: yours is lost
          ┃
          Configure claude-token
          ┃ Claude Code token
          ┃ run `claude setup-token` and paste the token
          ✗       claude-token    failed: claude-token is kept by the studio CLI, which is not on PATH
          Error: 1 of 1 settings failed
          Hint: re-run it: station settings apply claude-token
      files:
          .calls: absent
