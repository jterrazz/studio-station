description: '--method skills re-adds the skills whose folder changed upstream, and nothing else'
fixture:
    - ../../__fixtures__/stubs/
    - ../__fixtures__/skills-cli/
    - ./__fixtures__/skill-lock/
serve:
    - github
runs:
    - command: 'apps update --method skills'
      exit: 0
      stdout: |
          ●	shadcn
      files:
          .calls:
              equals: |
                  skills add shadcn-ui/ui -g -y --skill shadcn --agent claude-code codex
