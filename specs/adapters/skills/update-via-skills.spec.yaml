description: '--via skills re-adds every installed skill tool, and nothing else'
fixture:
    - ../../__fixtures__/stubs/
    - ../../__fixtures__/skills-cli/
    - ../../__fixtures__/skill-lock/
runs:
    - command: 'tools upgrade --via skills'
      exit: 0
      stdout: |
          ●	frontend-design
          ●	shadcn
      files:
          .calls:
              equals: |
                  skills add anthropics/skills -g -y --skill frontend-design --agent claude-code codex
                  skills add shadcn-ui/ui -g -y --skill shadcn --agent claude-code codex
