description: 'a skill uninstalls through the skills CLI'
fixture:
    - ../../cli/tools/__fixtures__/stubs/
    - ../../cli/tools/__fixtures__/skills-cli/
    - ../../cli/tools/__fixtures__/skill-lock/
runs:
    - command: 'tools uninstall frontend-design --yes'
      exit: 0
      stdout: |
          ●	frontend-design
      files:
          .calls:
              contains:
                  - 'skills remove -g -y frontend-design'
