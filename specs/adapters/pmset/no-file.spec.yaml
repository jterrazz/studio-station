description: 'awake writes no file: a keep-awake, a guard end, a refresh and an off leave the sandbox as it was'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/power/
env: engine
runs:
    - command: '--version > /dev/null; "$STATION" engine run 2> engine.log & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; /bin/sleep 1; : > mark; "$STATION" awake 4h --lid > /dev/null; echo 3 > power/thermal; /bin/sleep 1.5; echo 0 > power/thermal; "$STATION" awake 4h > /dev/null; "$STATION" awake 1h > /dev/null; "$STATION" awake off > /dev/null; /usr/bin/find . -newer mark -type f ! -name .calls ! -name engine.log ! -path "./power/*" ! -path "./.local/state/station/logs/*"; kill $d; wait $d'
      exit: 0
