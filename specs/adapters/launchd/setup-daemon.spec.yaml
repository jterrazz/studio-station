description: 'setup installs the one daemon of a host under its launchd agent, and starts it'
fixture: ../../__fixtures__/vms/
runs:
    - command: 'setup </dev/null'
      exit: 0
      stdout: |
          ●	name	x
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	bunfig, go env, mise config, npmrc
          ○	tools	missing: homebrew mise git tailscale: run station setup on a terminal
          ●	engine	running {{string}}
      files:
          Library/LaunchAgents/com.jterrazz.station.engine.plist:
              contains:
                  - '<string>com.jterrazz.station.engine</string>'
                  - |-
                    	<key>ProgramArguments</key>
                    	<array>
                    		<string>{{path}}</string>
                    		<string>engine</string>
                    		<string>run</string>
                    	</array>
                  - |-
                    		<key>PATH</key>
                    		<string>{{workdir}}/bin:{{workdir}}/.local/share/bun/bin:{{workdir}}/.local/share/go/bin</string>
                  - "\t<key>RunAtLoad</key>

                    \t<true/>

                    \t<key>KeepAlive</key>

                    \t<true/>

                    \t<key>AbandonProcessGroup</key>

                    \t<true/>"
                  - '<string>{{workdir}}/.local/state/station/logs/engine.log</string>'
          .calls:
              contains:
                  - 'launchctl bootstrap gui/{{int}} {{workdir}}/Library/LaunchAgents/com.jterrazz.station.engine.plist'
                  - 'launchctl kickstart gui/{{int}}/com.jterrazz.station.engine'
