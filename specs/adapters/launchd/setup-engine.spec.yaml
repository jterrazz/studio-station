description: 'setup installs a Mac''s one engine under its launchd agent, and starts it'
fixture: ../../__fixtures__/vms/
runs:
    - command: 'setup </dev/null'
      exit: 0
      stdout: |
          ●	name	x
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	bunfig, go env, mise settings, npmrc
          ●	engine	running {{string}}
          ○	apps	missing: homebrew mise git tailscale: run station setup on a terminal
          ●	settings	applied hushlogin tart-launcher git-shortcuts docker-shortcuts
          ○	ssh-key	next: station settings apply ssh-key
          ○	spotlight-exclude	next: station settings apply spotlight-exclude
          ○	dns	next: station settings apply dns
          ○	claude-token	next: station settings apply claude-token
          ○	dock-reset	next: station settings apply dock-reset
          ○	dock-spacer	next: station settings apply dock-spacer
      files:
          Library/LaunchAgents/com.jterrazz.station.engine.plist:
              contains:
                  - '<string>com.jterrazz.station.engine</string>'
                  - |-
                    	<key>ProgramArguments</key>
                    	<array>
                    		<string>{{path}}</string>
                    		<string>engine</string>
                    		<string>run</string>
                    	</array>
                  - |-
                    		<key>PATH</key>
                    		<string>{{workdir}}/bin:{{workdir}}/.local/share/bun/bin:{{workdir}}/.local/share/go/bin</string>
                  - "\t<key>RunAtLoad</key>

                    \t<true/>

                    \t<key>KeepAlive</key>

                    \t<true/>

                    \t<key>AbandonProcessGroup</key>

                    \t<true/>"
                  - '<string>{{workdir}}/.local/state/station/logs/engine.log</string>'
          .calls:
              contains:
                  - 'launchctl bootstrap gui/{{int}} {{workdir}}/Library/LaunchAgents/com.jterrazz.station.engine.plist'
                  - 'launchctl kickstart gui/{{int}}/com.jterrazz.station.engine'
