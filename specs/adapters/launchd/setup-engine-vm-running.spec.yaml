description: 'a VM running under its old agent refuses the migration: nothing is booted out'
fixture:
    - ../../__fixtures__/vms/
    - ./__fixtures__/old-agents/
env: engine
runs:
    - command: '--version >/dev/null; echo running > .tart-vms/api; "$STATION" setup </dev/null'
      exit: 1
      stdout: |
          ●	name	x
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	bunfig, go env, mise settings, npmrc
          ✗	engine	api still runs under its round-3 agent
          ○	apps	missing: homebrew mise git tailscale: run station setup on a terminal
          ●	settings	applied hushlogin tart-launcher git-shortcuts docker-shortcuts
          ○	ssh-key	next: station settings apply ssh-key
          ○	spotlight-exclude	next: station settings apply spotlight-exclude
          ○	dns	next: station settings apply dns
          ○	claude-token	next: station settings apply claude-token
          ○	dock-reset	next: station settings apply dock-reset
          ○	dock-spacer	next: station settings apply dock-spacer
      stderr: |
          Error: setup step engine: api still runs under its round-3 agent
          Hint: stop the permanent VMs and delete the throwaway ones (station machines), then station setup
      files:
          Library/LaunchAgents/com.jterrazz.station.vm.api.plist: exists
