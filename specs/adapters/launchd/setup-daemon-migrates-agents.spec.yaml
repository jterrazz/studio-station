description: 'setup boots out the per-VM agents of stopped VMs; a permanent one stopped by its owner stays so'
fixture:
    - ../../__fixtures__/vms/
    - ./__fixtures__/old-agents/
runs:
    - command: 'setup </dev/null'
      exit: 0
      stdout: |
          ●	name	x
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	bunfig, go env, mise config, npmrc
          ●	engine	running {{string}}
          ○	apps	missing: homebrew mise git tailscale: run station setup on a terminal
          ●	settings	applied hushlogin tart-launcher git-shortcuts docker-shortcuts
          ○	ssh-key	next: station settings apply ssh-key
          ○	spotlight-exclude	next: station settings apply spotlight-exclude
          ○	dns	next: station settings apply dns
          ○	claude-token	next: station settings apply claude-token
          ○	dock-reset	next: station settings apply dock-reset
          ○	dock-spacer	next: station settings apply dock-spacer
      files:
          .calls:
              contains:
                  - 'launchctl bootout gui/{{int}}/com.jterrazz.station.vm.t'
                  - 'launchctl bootout gui/{{int}}/com.jterrazz.station.vm.api'
          Library/LaunchAgents/com.jterrazz.station.vm.t.plist: absent
          Library/LaunchAgents/com.jterrazz.station.vm.api.plist: absent
          .local/state/station/vms/api.json:
              contains: '"want": "stopped"'
