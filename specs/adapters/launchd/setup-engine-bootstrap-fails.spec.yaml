description: 'an engine launchd refuses to load is a failed step, never a running row'
fixture:
    - ../../__fixtures__/vms/
    - ./__fixtures__/launchctl-fails-bootstrap/
runs:
    - command: 'setup </dev/null'
      exit: 1
      stdout: |
          ●	name	x
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	bunfig, go env, mise settings, npmrc
          ✗	engine	launchctl bootstrap exited 5: Bootstrap failed: 5: Input/output error
          ○	apps	missing: homebrew mise git tailscale: run station setup on a terminal
          ●	settings	applied hushlogin tart-launcher git-shortcuts docker-shortcuts
          ○	ssh-key	next: station settings apply ssh-key
          ○	spotlight-exclude	next: station settings apply spotlight-exclude
          ○	dns	next: station settings apply dns
          ○	claude-token	next: station settings apply claude-token
          ○	dock-reset	next: station settings apply dock-reset
          ○	dock-spacer	next: station settings apply dock-spacer
      stderr: |
          Error: setup step engine: launchctl bootstrap exited 5: Bootstrap failed: 5: Input/output error
          Hint: fix it, then run station setup again: it resumes
    - command: '--version >/dev/null; /usr/bin/grep -c "launchctl kickstart" .calls || true'
      exit: 0
      stdout: |
          0
