description: 'with the engine down, engine stop ends the VMs whose run outlived it, then boots the agent out'
fixture:
    - ../../__fixtures__/vms/
    - ../__fixtures__/launchctl/
env: engine
runs:
    - command: '--version > /dev/null; /bin/mkdir -p Library/LaunchAgents .local/state/station/vms .local/state/station/runs; : > Library/LaunchAgents/com.jterrazz.station.engine.plist; printf ''{"name":"api","image":"linux","version":"2026.11.07","lifetime":"lasting"}\n'' > .local/state/station/vms/api.json; s=$(/bin/sh -c ''/bin/sleep 9 > /dev/null 2>&1 & echo $!''); echo $s > .local/state/station/runs/api.pid; : > launchctl.loaded; "$STATION" engine stop; echo "exit $?"; "$STATION" engine stop --yes; echo "exit $?"; /bin/kill $s 2> /dev/null; /usr/bin/grep -E "^(ssh|tart|launchctl bootout)" .calls | /usr/bin/sed -E ''s/gui\/[0-9]+/gui\/U/''; /usr/bin/jq -r .want .local/state/station/vms/api.json'
      exit: 0
      stdout: |
          exit 2
          ●	engine	stopped 1 VM (api) · the engine stopped
          exit 0
          tart list --source local --format json
          launchctl bootout gui/U/com.jterrazz.station.engine
          stopped
      stderr: |
          Error: station engine stop stops api
          Hint: station engine stop --yes
