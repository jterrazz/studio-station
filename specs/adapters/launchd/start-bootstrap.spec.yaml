description: 'start bootstraps the agent and waits for the daemon; running, it only says so'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/launchctl/
env: engine
runs:
    - command: 'start'
      exit: 1
      stderr: |
          Error: the engine is not installed
          Hint: station setup
    - command: '--version > /dev/null; /bin/mkdir -p Library/LaunchAgents; : > Library/LaunchAgents/com.jterrazz.station.engine.plist; "$STATION" start | /usr/bin/sed -E ''s/pid [0-9]+/pid N/; s/started · [^ ]+ ·/started · V ·/''; "$STATION" start | /usr/bin/sed -E ''s/pid [0-9]+/pid N/; s/started · [^ ]+ ·/started · V ·/''; /usr/bin/grep -c "^launchctl bootstrap gui/[0-9]* $HOME/Library/LaunchAgents/com.jterrazz.station.engine.plist" .calls; "$STATION" stop > /dev/null'
      exit: 0
      stdout: |
          ●	engine	started · V · pid N
          ●	engine	running · pid N
          1
    - command: '--version > /dev/null; : > launchctl.loaded; "$STATION" start | /usr/bin/sed -E ''s/pid [0-9]+/pid N/; s/started · [^ ]+ ·/started · V ·/''; /usr/bin/grep -c "^launchctl kickstart -k gui/" .calls; "$STATION" stop > /dev/null'
      exit: 0
      stdout: |
          ●	engine	started · V · pid N
          1
    - command: '--version > /dev/null; : > launchctl.silent; "$STATION" start'
      exit: 1
      stderr: |
          Error: the engine did not answer in 15s
          Hint: tail ~/.local/state/station/logs/engine.log
    - command: 'start --on mac-mini'
      exit: 2
      stderr: |
          Error: station start acts on this host only
          Hint: ssh mac-mini station start
