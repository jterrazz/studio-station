description: 'a VM running under its old agent refuses the migration: nothing is booted out'
fixture:
    - ../../__fixtures__/vms/
    - ./__fixtures__/old-agents/
env: engine
runs:
    - command: '--version >/dev/null; echo running > .tart-vms/api; "$STATION" engine start </dev/null'
      exit: 1
      stderr: |
          Error: api still runs under its round-3 agent
          Hint: stop the permanent VMs and delete the throwaway ones (station machines), then station engine start
      files:
          Library/LaunchAgents/com.jterrazz.station.vm.api.plist: exists
