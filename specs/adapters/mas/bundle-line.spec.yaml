description: 'an exploration dev app installs on a host, through the one brew bundle'
fixture:
    - ../../__fixtures__/stubs/
    - ../__fixtures__/bundle-batch/
    - ./__fixtures__/mas-xcode/
runs:
    - command: 'apps install xcode'
      exit: 0
      stdout: |
          ●	xcode
      files:
          .calls:
              contains:
                  - |-
                    brew bundle install --no-upgrade --file=-
                    mas "Xcode", id: 497799835
