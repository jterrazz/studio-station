description: 'an exploration dev tool installs on a host, through the one brew bundle'
fixture:
    - ../../cli/tools/__fixtures__/stubs/
    - ../brew/__fixtures__/bundle-batch/
    - ./__fixtures__/mas-xcode/
runs:
    - command: 'tools install xcode'
      exit: 0
      stdout: |
          ●	xcode
      files:
          .calls:
              contains:
                  - |-
                    brew bundle install --no-upgrade --file=-
                    mas "Xcode", id: 497799835
