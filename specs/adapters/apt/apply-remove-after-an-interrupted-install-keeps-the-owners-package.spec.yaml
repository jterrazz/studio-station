description: 'an install cut short keeps station''s record, so apply --remove takes back only what it added'
fixture:
    - ../../__fixtures__/terminal/
    - ./__fixtures__/ubuntu/
    - ./__fixtures__/foo-owned/
    - ./__fixtures__/install-hangs/
env: terminal
runs:
    - command: '--version >/dev/null; terminal /usr/bin/env STATION_MACHINE_KIND=linux "$STATION" apply --machinefile ci.yaml --yes'
      stdin: |
          file apt-hung
          send \x03
          scrollback
      exit: 130
      stdout: |
          # To install
          ○       foo     apt
          # To adopt
          ?       apt     apt     the manager of foo · on PATH, not managed by apt
          ^C◐     apt             apt     the manager of foo · adopted · on PATH, not mant
          ●       foo     1.0     apt
    - command: '--version >/dev/null; /bin/rm hang; /bin/cat dpkg.db'
      exit: 0
      stdout: |
          foo	1.0
          foo-extra	1.0
    - command: '--version >/dev/null; /usr/bin/sed -i.bak "s/apps: \[foo\]/apps: []/" .config/station/machinefiles/ci.yaml'
      exit: 0
    - command: '--version >/dev/null; STATION_MACHINE_KIND=linux "$STATION" apply --remove --yes'
      exit: 0
      stdout: |
          # Extra
          ?	foo	apt	installed by station for ci, listed no longer
          ●	foo		apt	removed
    - command: '--version >/dev/null; /bin/cat dpkg.db'
      exit: 0
      stdout: |
          foo	1.0
