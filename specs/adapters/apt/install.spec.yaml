description: 'an apt app installs as root and asks nothing: lists refreshed, then apt-get install'
fixture:
    - ./__fixtures__/ubuntu/
env:
    - STATION_MACHINE_KIND=linux
runs:
    - command: 'apps install jq'
      exit: 0
      stdout: |
          ●	jq	1.0	apt
      files:
          .calls:
              contains:
                  - 'sudo -n env DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold update'
                  - 'sudo -n env DEBIAN_FRONTEND=noninteractive apt-get -y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold install jq'
    - command: 'apps --json | /usr/bin/jq -r ''.apps[] | select(.name == "jq") | "\(.state) \(.method) \(.installed)"'''
      exit: 0
      stdout: |
          ok apt 1.0
