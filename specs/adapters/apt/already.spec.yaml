description: 'an apt package dpkg lists installed is ok, and installing it again runs nothing as root'
fixture:
    - ./__fixtures__/ubuntu/
    - ./__fixtures__/jq-held/
env:
    - STATION_MACHINE_KIND=linux
runs:
    - command: 'apps install jq'
      exit: 0
      stdout: |
          ●	jq	1.7.1	apt	already installed
    - command: '--version > /dev/null; /usr/bin/grep -c ''^sudo'' .calls'
      exit: 1
      stdout: |
          0
