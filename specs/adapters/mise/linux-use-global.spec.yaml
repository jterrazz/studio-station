description: 'on a linux VM a runtime installs through mise, and brew is never called'
fixture: ../../__fixtures__/stubs/
env:
    - STATION_MACHINE_KIND=linux
runs:
    - command: 'apps install go'
      exit: 0
      stdout: |
          ●	go		mise
      files:
          .calls:
              contains:
                  - 'mise use --global go@latest'
    - command: '--version > /dev/null; /usr/bin/grep -c ''^brew'' .calls'
      exit: 1
      stdout: |
          0
