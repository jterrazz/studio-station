description: 'in a VM no Mac has connected to yet, every ports command says so'
env: engine
runs:
    - command: '--version >/dev/null; STATION_MACHINE_KIND=linux "$STATION" ports --all-machines'
      exit: 1
      stderr: |
          Error: no host has connected to this VM yet
          Hint: on the VM's host: station setup
    - command: '--version >/dev/null; STATION_MACHINE_KIND=linux "$STATION" ports --all-machines --json'
      exit: 1
      stdout: |
          {
            "schema": "station.error/v1",
            "type": "failed",
            "code": null,
            "subject": null,
            "message": "no host has connected to this VM yet",
            "hint": "on the VM's host: station setup",
            "fix": null
          }
      stderr: |
          Error: no host has connected to this VM yet
          Hint: on the VM's host: station setup
    - command: '--version >/dev/null; STATION_MACHINE_KIND=linux "$STATION" ports share 3000'
      exit: 1
      stderr: |
          Error: no host has connected to this VM yet
          Hint: on the VM's host: station setup
    - command: '--version >/dev/null; STATION_MACHINE_KIND=linux "$STATION" ports stop-sharing 3000 --yes'
      exit: 1
      stderr: |
          Error: no host has connected to this VM yet
          Hint: on the VM's host: station setup
