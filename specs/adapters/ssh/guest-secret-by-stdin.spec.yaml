description: 'a shared secret reaches the VM by stdin: no exec line, call log or engine log carries it'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/engine-vm/
    - ./__fixtures__/lend/
env: engine
serve: sshd
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "share_list": ["operator:claude:oauth-token"], "services": {"range": "42700-42719"}/'' .config/station/preferences.json; "$STATION" engine run 2> engine.log & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --permanent --name api > /dev/null; for i in $(/usr/bin/seq 1 30); do "$STATION" machines --json | /usr/bin/grep -q ''"ssh": true'' && break; /bin/sleep 0.2; done; "$STATION" accounts share claude --with api > /dev/null; kill $d; wait $d; /usr/bin/grep "^vm-sshd exec STUDIO" .calls; /usr/bin/grep -c "stub-value" .calls engine.log'
      exit: 1
      stdout: |
          vm-sshd exec STUDIO_CREDENTIALS_BACKEND=file studio credentials import
          .calls:0
          engine.log:0
      files:
          imported.json:
              equals: |
                  {"operator:claude:oauth-token":"stub-value-of-operator:claude:oauth-token"}
