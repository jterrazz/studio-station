description: 'a lent secret reaches the VM by stdin: no exec line, call log or daemon log carries it'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/daemon-vm/
    - ../../__fixtures__/lend/
env: daemon
serve: sshd
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "lend_list": ["operator:claude:oauth-token"], "services": {"range": "42700-42719"}/'' .config/station/settings.json; "$STATION" daemon 2> daemon.log & d=$!; n=0; while [ ! -S .local/state/station/daemon.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --lifetime lasting --name api > /dev/null; for i in $(/usr/bin/seq 1 30); do "$STATION" machines --json | /usr/bin/grep -q ''"guest": "connected"'' && break; /bin/sleep 0.2; done; "$STATION" secrets lend --to api > /dev/null; kill $d; wait $d; /usr/bin/grep "^vm-sshd exec STUDIO" .calls; /usr/bin/grep -c "stub-value" .calls daemon.log'
      exit: 1
      stdout: |
          vm-sshd exec STUDIO_CREDENTIALS_BACKEND=file studio credentials import
          .calls:0
          daemon.log:0
      files:
          imported.json:
              equals: |
                  {"operator:claude:oauth-token":"stub-value-of-operator:claude:oauth-token"}
