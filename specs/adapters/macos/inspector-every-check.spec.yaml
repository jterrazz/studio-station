description: 'every checked setting reads its own macOS command, on and off, its fix never a station command'
fixture:
    - ./__fixtures__/inspector-every-check/
runs:
    - command: 'settings | /usr/bin/sed -n ''/^# Checked/,$p'''
      exit: 0
      stdout: |
          # Checked	9 ●
          ●	filevault	as expected · on
          ●	firewall	as expected · on
          ●	sip	as expected · on
          ●	automatic-updates	as expected · on
          ●	screen-lock	as expected · locks after 2 min
          ●	gatekeeper	as expected · on
          ●	remote-login	as expected · off
          ●	time-machine	as expected · last backup 2 d ago
          ●	macos-updates	as expected · up to date
    - command: '--version >/dev/null; : > .off'
      exit: 0
    - command: 'settings | /usr/bin/sed -n ''/^# Checked/,$p'''
      exit: 0
      stdout: |
          # Checked	9 ◐
          ◐	filevault	off	System Settings > Privacy & Security > FileVault
          ◐	firewall	off	System Settings > Network > Firewall
          ◐	sip	off	Recovery > Terminal > csrutil enable
          ◐	automatic-updates	off	System Settings > General > Software Update > Automatic updates
          ◐	screen-lock	never locks · expected 5 min	System Settings > Lock Screen
          ◐	gatekeeper	off	System Settings > Privacy & Security > Security
          ◐	remote-login	on · not expected on a laptop	System Settings > General > Sharing > Remote Login
          ◐	time-machine	no backup yet	System Settings > General > Time Machine
          ◐	macos-updates	1 update waiting	System Settings > General > Software Update
    - command: '--version >/dev/null; : > .no-destination'
      exit: 0
    - command: 'settings | /usr/bin/grep time-machine'
      exit: 0
      stdout: |
          ◐	time-machine	no backup yet	System Settings > General > Time Machine
