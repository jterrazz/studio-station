description: 'a host refusing the key before boot gets a password session, whose disconnect is the success'
fixture:
    - ../../__fixtures__/terminal/
    - ../../__fixtures__/hosts-x-y/
    - ../../__fixtures__/machines-stubs/
    - ./__fixtures__/pre-boot/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION" machines unlock y'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/sed "s|=/.*/known_hosts/|=~/known_hosts/|" .calls'
      exit: 0
      stdout: |
          ssh -o ConnectTimeout=2 -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/known_hosts/y.preboot y true
          ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/known_hosts/y.preboot y
