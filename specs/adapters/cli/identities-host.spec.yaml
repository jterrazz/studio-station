description: 'the host''s providers read as this Mac''s shapes, one record each, and Tailscale costs no second read'
fixture:
    - ../../__fixtures__/accounts/
env: engine
runs:
    - command: 'accounts; /usr/bin/grep -c "^tailscale status --json" .calls'
      exit: 0
      stdout: |
          ●	github	signed in	jterrazz	gist · read:org · repo · workflow
          ●	npm	signed in	jterrazz
          ●	claude	signed in	admin@jterrazz.com	max	claude.ai
          ●	tailscale	signed in	jterrazz@github	tailnet jterrazz.github
          ●	cloudflare	signed in	admin@jterrazz.com	studio
          ●	git	signed in	Jean-Baptiste Terrazzoni, admin@jterrazz.com
          ●	ssh	signed in	6 keys	admin@jterrazz.com · station-image · station-e2e · deploy · old-rsa · github-actions
          ●	docker	signed in	deploy	registry.jterrazz.com
          # Shared with VMs
          	none
          1
    - command: 'accounts --json | /usr/bin/jq -c ''[.schema, .machine.kind, (.accounts[]|select(.name=="github")|[.who, .scope])]'''
      exit: 0
      stdout: |
          ["station.accounts.list/v1","mac",["jterrazz","gist, read:org, repo, workflow"]]
    - command: 'accounts --page | /usr/bin/jq -r ''[.schema, .id]|@tsv'''
      exit: 0
      stdout: |
          station.page/v1	accounts
