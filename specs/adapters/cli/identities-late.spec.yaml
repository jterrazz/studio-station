description: 'a provider silent past its budget is ◐ late and never holds the page'
fixture:
    - ../../__fixtures__/accounts/
env: engine
runs:
    - command: '--version > /dev/null; /bin/mkdir -p answers/accounts; echo slow > answers/accounts/gh.mode; echo 30 > answers/accounts/gh.slow; s=$(/bin/date +%s); "$STATION" accounts > out.txt; e=$(/bin/date +%s); [ $((e - s)) -lt 7 ] && echo fast; /usr/bin/awk -F''\t'' ''$2=="github"'' out.txt; /usr/bin/wc -l < out.txt | /usr/bin/tr -d " "'
      exit: 0
      stdout: |
          fast
          ◐	github	late			no answer in 5s
          10
