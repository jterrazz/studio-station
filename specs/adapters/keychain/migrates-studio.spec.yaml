description: 'setup moves ~/.studio: settings and dns; the userspace tailscaled is retired, not moved'
fixture:
    - ../__fixtures__/setup-stubs/
    - ../__fixtures__/v1-studio/
env:
    - USER=tester
runs:
    - command: 'setup'
      exit: 0
      stdout: |
          ●	name	base
          ●	zshrc
          ●	layout	moved to the XDG folders
          ●	layout	userspace tailscaled retired; its node "base" stays at https://login.tailscale.com/admin/machines until you remove it
          ●	relocate	bunfig, go env, mise config, npmrc
          ○	engine	not needed until tart is installed
          ○	apps	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ●	settings	applied hushlogin tart-launcher git-shortcuts
          ○	ssh-key	next: station settings apply ssh-key
          ○	spotlight-exclude	next: station settings apply spotlight-exclude
          ○	dns	next: station settings apply dns
          ○	claude-token	next: station settings apply claude-token
          ○	dock-reset	next: station settings apply dock-reset
          ○	dock-spacer	next: station settings apply dock-spacer
      files:
          .config/station/preferences.json:
              equals: |
                  {
                    "here": "base",
                    "macs": {
                      "base": {},
                      "mini": {
                        "user": "agent",
                        "key": "~/.ssh/id_mini"
                      }
                    },
                    "vm_user": "tester",
                    "user_email": "owner@example.com"
                  }
          .calls:
              equals: |
                  security delete-generic-password -s station -a vm-join-id
                  security delete-generic-password -s station -a vm-join-secret
                  security delete-generic-password -s station -a tailnet-authkey
          .local/state/station/tailscaled: absent
          .local/state/station/dns/quad9-dns.mobileconfig: exists
          .studio: absent
    - command: 'setup'
      exit: 0
      stdout: |
          ●	name	base
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	nothing to do
          ○	engine	not needed until tart is installed
          ○	apps	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ●	settings
          ○	ssh-key	next: station settings apply ssh-key
          ○	spotlight-exclude	next: station settings apply spotlight-exclude
          ○	dns	next: station settings apply dns
          ○	claude-token	next: station settings apply claude-token
          ○	dock-reset	next: station settings apply dock-reset
          ○	dock-spacer	next: station settings apply dock-spacer
      files:
          .studio: absent
