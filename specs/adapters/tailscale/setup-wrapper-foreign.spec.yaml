description: 'a tailscale file setup did not write is never overwritten'
fixture:
    - ../../__fixtures__/system-tools/
    - ../../__fixtures__/tailscale-app-store/
env: engine
runs:
    - command: '--version >/dev/null; /bin/rm bin/tailscale; /bin/mkdir -p .local/bin; printf "#!/bin/sh\necho mine\n" > .local/bin/tailscale; "$STATION" setup --name m </dev/null | /usr/bin/grep -E ''^.	apps'''
      exit: 0
      stdout: |
          ●	apps
      files:
          .local/bin/tailscale:
              equals: |
                  #!/bin/sh
                  echo mine
