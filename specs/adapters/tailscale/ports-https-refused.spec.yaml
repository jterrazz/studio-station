description: 'a share Tailscale refuses while Serve is on is local only, with its line, and keeps its URL'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/engine-vm/
env: engine
serve: sshd
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "42160-42179"}/'' .config/station/preferences.json; "$STATION" engine run 2>/dev/null & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --permanent --name api > /dev/null; : > answers/tailscale/serve.hang; : > answers/tailscale/serve.warn; printf ''  sl  local\n   0: 00000000:1F40 00000000:0000 0A 00000000:00000000 00:00000000 00000000  1000        0 101 1 0 100 0 0 10 0\n'' > vm/root/proc/net/tcp; n=0; until "$STATION" ports --all-machines --json | /usr/bin/jq -e ''.ports[] | select(.port == 8000 and .state == "shared")'' > /dev/null || [ $n -ge 50 ]; do /bin/sleep 0.2; n=$((n+1)); done; "$STATION" ports --all-machines --json | /usr/bin/jq -c ''.ports[] | select(.port == 8000) | [.state, .url, .detail]''; "$STATION" ports --all-machines | /usr/bin/grep "api	8000"; /bin/rm answers/tailscale/serve.hang; "$STATION" machines stop api --yes > /dev/null; kill $d; wait $d'
      exit: 0
      stdout: |
          ["local-only","https://macbook.tail1234.ts.net:42162","serve: Serve is not enabled on your tailnet."]
          ◐	api	8000	private	https://macbook.tail1234.ts.net:42162	local only · serve: Serve is not enabled on your tailnet.
