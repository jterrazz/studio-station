description: 'tailscale installs as the app, the cask tailscale-app, on a host only'
fixture:
    - ../../__fixtures__/stubs/
    - ./__fixtures__/tailscale-app/
env: engine
runs:
    - command: 'apps --json | /usr/bin/jq -c ''.apps[] | select(.name == "tailscale") | [.method, .lives_on]'''
      exit: 0
      stdout: |
          ["cask","mac-only"]
    - command: 'apps install tailscale'
      exit: 0
      stdout: |
          ●	tailscale
      files:
          .calls:
              contains:
                  - |-
                    brew bundle install --no-upgrade --file=-
                    cask "tailscale-app"
    - command: '--version > /dev/null; STATION_MACHINE_KIND=linux "$STATION" apps --json | /usr/bin/jq -r ''[.apps[] | select(.name == "tailscale")] | length'''
      exit: 0
      stdout: |
          0
