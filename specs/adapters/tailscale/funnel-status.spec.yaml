description: 'a port declared via Tailscale Funnel is seen when serve status allows Funnel on it'
fixture:
    - ../../__fixtures__/vms/
    - ./__fixtures__/funnel/
env: engine
runs:
    - command: 'ports declare x 8443 --via tailscale-funnel'
      exit: 0
      stdout: |
          ●	8443 on x	declared public (Tailscale Funnel)
    - command: 'ports declare x 9443 --via tailscale-funnel'
      exit: 0
      stdout: |
          ●	9443 on x	declared public (Tailscale Funnel)
    - command: '--version >/dev/null; /bin/rm -f .calls; "$STATION" ports | /usr/bin/grep -e 443 -e "^# Public"; /usr/bin/sort -u .calls'
      exit: 0
      stdout: |
          # Public: reachable from anywhere else, internet or LAN, declared	1 ●	1 ◐
          ●	x	8443	public	caddy	127.0.0.1:8443 this machine	Tailscale Funnel · Funnel lists it
          ◐	x	9443	public	caddy	127.0.0.1:9443 this machine	declared, but Funnel does not list 9443 on x
          tailscale serve status --json
          tailscale status --json
