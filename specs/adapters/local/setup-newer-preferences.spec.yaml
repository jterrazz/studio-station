description: 'setup refuses a settings.json a newer station wrote, and leaves it as it is'
fixture:
    - ../__fixtures__/setup-stubs/
    - ./__fixtures__/newer-preferences/
env:
    - USER=tester
runs:
    - command: 'setup'
      exit: 1
      stdout: |
          ○	name	not set: station setup --name <name>
          ●	zshrc
          ✗	layout	cannot read {{workdir}}/.config/station/preferences.json: written at version 2 by a newer station, this one knows 1
          ●	relocate	bunfig, go env, mise config, npmrc
          ○	engine	not needed until tart is installed
          ○	apps	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ●	settings	applied hushlogin tart-launcher git-shortcuts docker-shortcuts
          ○	ssh-key	next: station settings apply ssh-key
          ○	spotlight-exclude	next: station settings apply spotlight-exclude
          ○	dns	next: station settings apply dns
          ○	claude-token	next: station settings apply claude-token
          ○	dock-reset	next: station settings apply dock-reset
          ○	dock-spacer	next: station settings apply dock-spacer
      stderr: |
          Error: setup step layout: cannot read {{workdir}}/.config/station/preferences.json: written at version 2 by a newer station, this one knows 1
          Hint: fix it, then run station setup again: it resumes
      files:
          .config/station/preferences.json:
              equals: |
                  {
                    "here": "t",
                    "hosts": {
                      "t": {}
                    },
                    "v": 2,
                    "vm_user": "tester"
                  }
