description: 'a port another process holds on the Mac is skipped: the reservation takes the next'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/engine-vm/
env: engine
serve: sshd
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "42040-42059"}/'' .config/station/preferences.json; "$STATION" engine run 2>/dev/null & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; /usr/bin/nc -l 127.0.0.1 42040 & h=$!; /bin/sleep 0.3; "$STATION" machines create --persistent --name api > /dev/null; /usr/bin/jq -c ''[.leases[] | [.guest_port, .host_port]]'' .local/state/station/leases.json; kill $h; wait $h 2>/dev/null; kill $d; wait $d'
      exit: 0
      stdout: |
          [[5173,42042],[8081,42041]]
