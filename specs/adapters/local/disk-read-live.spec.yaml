description: 'disk on a terminal fills in as it reads, a late size says ?, and last-known sizes are kept'
fixture:
    - ../../__fixtures__/terminal/
    - ./__fixtures__/disk-slow-docker/
    - ./__fixtures__/disk-go/
env: terminal
runs:
    - command: '--version >/dev/null; /bin/mkdir -p .cache/go-build && echo x > .cache/go-build/a'
      exit: 0
    - command: '--version >/dev/null; terminal --size 120x80 /usr/bin/env -u NO_COLOR COLUMNS=120 STATION_MACHINE_KIND=linux "$STATION" disk | /usr/bin/grep -c " free of "'
      stdin: |
          within 1 see ● go
          within 1 see ◌ docker
          see ?
          gone ◌
          screen
      exit: 0
      stdout: |
          1
    - command: '--version >/dev/null; STATION_MACHINE_KIND=linux "$STATION" disk > out.txt; /usr/bin/grep -c "◌" out.txt; /usr/bin/grep "^●	docker" out.txt'
      exit: 0
      stdout: |
          0
          ●	docker	?
    - command: '--version >/dev/null; /usr/bin/jq -r --arg h "$HOME" ''.v, (.sizes[$h + "/.cache/go-build"].bytes)'' .cache/station/sizes.json'
      exit: 0
      stdout: |
          1
          2
    - command: '--version >/dev/null; echo yy > .cache/go-build/b; STATION_MACHINE_KIND=linux "$STATION" disk --json | /usr/bin/jq ''.rows[] | select(.app == "go") | .bytes'''
      exit: 0
      stdout: |
          5
    - command: '--version >/dev/null; STATION_MACHINE_KIND=linux "$STATION" disk free station > /dev/null; /bin/ls -A .cache/station'
      exit: 0
