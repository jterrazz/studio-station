description: 'a settings.json that differs from the converted config.json is never overwritten'
fixture:
    - ../__fixtures__/setup-stubs/
    - ../__fixtures__/v1-studio/
    - ./__fixtures__/other-settings/
env:
    - USER=tester
runs:
    - command: 'setup'
      exit: 1
      stdout: |
          ●	name	elsewhere
          ●	zshrc
          ✗	layout	{{workdir}}/.config/station/preferences.json already exists with different content
          ●	relocate	bunfig, go env, mise config, npmrc
          ○	engine	not needed until tart is installed
          ○	apps	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ●	settings	applied hushlogin tart-launcher
          ○	ssh-key	next: station settings apply ssh-key
          ○	spotlight-exclude	next: station settings apply spotlight-exclude
          ○	dns	next: station settings apply dns
          ○	claude-token	next: station settings apply claude-token
          ○	dock-reset	next: station settings apply dock-reset
          ○	dock-spacer	next: station settings apply dock-spacer
      stderr: |
          Error: setup step layout: {{workdir}}/.config/station/preferences.json already exists with different content
          Hint: keep one of the two files, then run station setup again
      files:
          .studio/config.json: exists
          .calls: absent
          .config/station/preferences.json:
              equals: |
                  {
                    "here": "elsewhere",
                    "hosts": {
                      "elsewhere": {}
                    },
                    "vm_user": "someone"
                  }
