description: 'with the engine down, stop sharing releases the reservation in its store itself'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/vm-api/
    - ./__fixtures__/ports-api-leases/
runs:
    - command: 'ports stop-sharing api:3000 --yes; /usr/bin/jq -c "[.leases[] | .guest_port]" .local/state/station/leases.json'
      exit: 0
      stdout: |
          ●	api:3000	not shared
          [8081]
