description: 'resetting xcode empties its caches, then shuts down and erases every simulator; the archives stay'
fixture:
    - ../../__fixtures__/disk-xcode/
    - ./__fixtures__/disk-pgrep-idle/
runs:
    - command: '--version >/dev/null; /bin/mkdir -p Library/Developer/Xcode/DerivedData/p Library/Developer/Xcode/Archives/a && /bin/dd if=/dev/zero of=Library/Developer/Xcode/DerivedData/p/x bs=1048576 count=2 2>/dev/null && echo a > Library/Developer/Xcode/Archives/a/x'
      exit: 0
    - command: 'disk erase xcode --confirm=xcode'
      exit: 0
      stdout: |
          ●	xcode	2.1 MB erased
      files:
          Library/Developer/Xcode/DerivedData/p: absent
          Library/Developer/Xcode/Archives/a/x: exists
    - command: '--version >/dev/null; /bin/cat .calls'
      exit: 0
      stdout: |
          pgrep -x Xcode
          xcrun simctl delete unavailable
          xcrun simctl shutdown all
          xcrun simctl erase all
