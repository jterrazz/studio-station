description: 'init refuses a settings.json a newer station wrote, and leaves it as it is'
fixture:
    - ../__fixtures__/setup-stubs/
    - ./__fixtures__/newer-preferences/
env:
    - USER=tester
runs:
    - command: 'init'
      exit: 1
      stdout: |
          ○	name	not set: station init --name <name>
          ●	zshrc
          ✗	layout	cannot read {{workdir}}/.config/station/preferences.json: written at version 2 by a newer station, this one knows 1
          ●	relocate	bunfig, go env, mise settings, npmrc
          # Machinefile
          	none yet: apps and settings come one at a time
      stderr: |
          Error: init step layout: cannot read {{workdir}}/.config/station/preferences.json: written at version 2 by a newer station, this one knows 1
          Hint: fix it, then run station init again: it resumes
      files:
          .config/station/preferences.json:
              equals: |
                  {
                    "here": "t",
                    "hosts": {
                      "t": {}
                    },
                    "v": 2,
                    "vm_user": "tester"
                  }
