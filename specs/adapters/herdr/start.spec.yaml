description: 'an agent starts in a Herdr terminal of its own, its task typed on stdin once it is ready'
fixture: ./__fixtures__/hc/
env:
    - STATION_MACHINE_KIND=linux
runs:
    - command: 'agents start "Build the landing page" --folder /home/admin/app --name docs-bot'
      exit: 0
      stdout: |
          ●	docs-bot	starts · claudecode · in /home/admin/app · Build the landing page
    - command: '--version >/dev/null; /bin/cat .calls'
      exit: 0
      stdout: |
          hc connect {"jsonrpc":"2.0","id":1,"method":"terminal.list","params":{"labels":{"station":"agent"}}}
          hc connect {"jsonrpc":"2.0","id":1,"method":"terminal.run","params":{"argv":["claude"],"name":"docs-bot","cwd":"/home/admin/app","labels":{"station":"agent","station.agent":"docs-bot","station.app":"claudecode"},"no_parent":true,"outlive_parent":true,"keep":true,"wait":true,"timeout":60}}
          hc connect {"jsonrpc":"2.0","id":1,"method":"terminal.send","params":{"terminal":"t7","text":"Build the landing page"}}
