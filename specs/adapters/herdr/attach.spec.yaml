description: 'attach from the Mac puts its terminal on the agent''s Herdr terminal in the workspace'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/engine-vm/
    - ./__fixtures__/hc/
env: engine
serve: sshd
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "42920-42939"}/'' .config/station/preferences.json; "$STATION" engine run 2>/dev/null & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --permanent --name linux-1 > /dev/null; for i in $(/usr/bin/seq 1 30); do "$STATION" machines --json | /usr/bin/grep -q ''"ssh": true'' && break; /bin/sleep 0.2; done; "$STATION" agents attach review-bot --on linux-1; c=$?; kill $d; wait $d; /usr/bin/grep -e "^hc attach" -e "terminal" .calls; exit $c'
      exit: 0
      stdout: |
          hc connect {"jsonrpc":"2.0","id":1,"method":"terminal.list","params":{"labels":{"station":"agent"}}}
          hc attach linux-1/t7
