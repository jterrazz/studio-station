description: 'a source is cloned with no hook nor submodule, its url after --; at its pin it fetches nothing'
fixture:
    - ./__fixtures__/stub/
    - ./__fixtures__/source/
runs:
    - command: 'explain machine.kind --machinefile station-macos'
      exit: 0
      stdout: |
          # station-macos
          	machine.kind	workspace	built-in	station-macos
    - command: 'explain machine.kind --machinefile station-macos'
      exit: 0
      stdout: |
          # station-macos
          	machine.kind	workspace	built-in	station-macos
      files:
          .calls:
              equals: |
                  git -c core.hooksPath=/dev/null -c submodule.recurse=false -c protocol.allow=never -c protocol.https.allow=always -c protocol.ssh.allow=always clone --quiet --no-checkout -- https://example.com/studio.git {{workdir}}/.cache/station/sources/studio
                  git -C {{workdir}}/.cache/station/sources/studio -c core.hooksPath=/dev/null -c submodule.recurse=false -c protocol.allow=never -c protocol.https.allow=always -c protocol.ssh.allow=always -c advice.detachedHead=false checkout --quiet --detach 1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d --
                  git -C {{workdir}}/.cache/station/sources/studio -c core.hooksPath=/dev/null -c submodule.recurse=false -c protocol.allow=never -c protocol.https.allow=always -c protocol.ssh.allow=always status --porcelain=v2 --branch --untracked-files=all --ignored
