description: 'upgrade fetches the branch from its url, after --, checks out a descendant detached, reads it there'
fixture:
    - ./__fixtures__/stub/
    - ./__fixtures__/source/
env: engine
runs:
    - command: 'explain machine.kind --machinefile station-macos >/dev/null; /usr/bin/printf "machinefile: station.machinefile/v1\nname: bare\nmachine: { kind: computer, system: { os: macos } }\n" > .cache/station/sources/studio/machinefiles/bare.machine.yaml; echo ffffffffffffffffffffffffffffffffffffffff > .origin; : > .calls; "$STATION" upgrade --machinefile bare'
      exit: 0
      stdout: |
          	none
          # Lock
          ●	shared source		studio@fffffff, was none
      files:
          .calls:
              contains: |
                  git -C {{workdir}}/.cache/station/sources/studio -c core.hooksPath=/dev/null -c submodule.recurse=false -c protocol.allow=never -c protocol.https.allow=always -c protocol.ssh.allow=always status --porcelain=v2 --branch --untracked-files=all --ignored
                  git -C {{workdir}}/.cache/station/sources/studio -c core.hooksPath=/dev/null -c submodule.recurse=false -c protocol.allow=never -c protocol.https.allow=always -c protocol.ssh.allow=always fetch --quiet --no-recurse-submodules -- https://example.com/studio.git HEAD
                  git -C {{workdir}}/.cache/station/sources/studio -c core.hooksPath=/dev/null -c submodule.recurse=false -c protocol.allow=never -c protocol.https.allow=always -c protocol.ssh.allow=always rev-parse --verify --quiet FETCH_HEAD^{commit}
                  git -C {{workdir}}/.cache/station/sources/studio -c core.hooksPath=/dev/null -c submodule.recurse=false -c protocol.allow=never -c protocol.https.allow=always -c protocol.ssh.allow=always merge-base --is-ancestor 1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d ffffffffffffffffffffffffffffffffffffffff
                  git -C {{workdir}}/.cache/station/sources/studio -c core.hooksPath=/dev/null -c submodule.recurse=false -c protocol.allow=never -c protocol.https.allow=always -c protocol.ssh.allow=always -c advice.detachedHead=false checkout --quiet --detach ffffffffffffffffffffffffffffffffffffffff --
                  git -C {{workdir}}/.cache/station/sources/studio -c core.hooksPath=/dev/null -c submodule.recurse=false -c protocol.allow=never -c protocol.https.allow=always -c protocol.ssh.allow=always status --porcelain=v2 --branch --untracked-files=all --ignored
