description: 'a source whose url is no https, ssh or scp-style remote (ext::, file://) is refused before git runs'
fixture:
    - ./__fixtures__/stub/
    - ./__fixtures__/bad-url/
runs:
    - command: 'explain machine.kind --machinefile station-macos'
      exit: 1
      stderr: |
          Error: the source studio cannot be read: its url "ext::sh -c id" is no url station clones: https://, ssh:// or user@domain:path
          Hint: check its url in ~/.config/station/preferences.json
      files:
          .calls: absent
