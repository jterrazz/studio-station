description: 'lsof''s listening addresses are read as bound: loopback, every interface, Tailscale, LAN'
fixture: ./__fixtures__/binds/
runs:
    - command: 'ports --json | /usr/bin/jq -c ''[.local_only, [.ports[] | [.port, .process, .bind, .class]], .findings]'''
      exit: 0
      stdout: |
          [1,[[3000,"node",["0.0.0.0","::"],"public"],[8000,"python3",["192.168.1.20"],"public"],[8443,"caddy",["100.101.102.103"],"private"]],["port 3000 is reachable outside Tailscale","port 8000 is reachable outside Tailscale"]]
