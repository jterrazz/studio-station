description: 'a second install finds the Homebrew the first one installed, so its installer never runs twice'
fixture: ../__fixtures__/script-installers/
runs:
    - command: 'apps install homebrew'
      exit: 0
      stdout: |
          ●	homebrew		script
    - command: 'apps install homebrew'
      exit: 0
      stdout: |
          ●	homebrew		script	already installed
    - command: '--version >/dev/null; /usr/bin/grep -c Homebrew/install .calls'
      exit: 0
      stdout: |
          1
