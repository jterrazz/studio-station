description: 'once the app is installed, setup uninstalls the tailscale formula it supersedes'
fixture:
    - ../../__fixtures__/system-tools/
    - ./__fixtures__/tailscale-formula/
env: engine
runs:
    - command: '--version >/dev/null; /bin/mkdir -p answers/brew; echo "tailscale-app 1.104.4" > answers/brew/cask.txt; "$STATION" setup --name m </dev/null | /usr/bin/grep -E ''^.	apps'''
      exit: 0
      stdout: |
          ●	apps	tailscale formula uninstalled: the app replaces it
      files:
          .calls:
              equals: |
                  brew uninstall tailscale
