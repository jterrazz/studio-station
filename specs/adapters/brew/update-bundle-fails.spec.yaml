description: 'a failing brew bundle update is a failure, exit 1'
fixture:
    - ../../__fixtures__/stubs/
    - ./__fixtures__/bat-installed/
    - ./__fixtures__/bundle-fails/
runs:
    - command: 'apps update --method brew'
      exit: 1
      stdout: |
          ✗	bat	the update failed: its output is in ~/.local/state/station/logs/apps.log
      stderr: |
          Error: 1 of 1 apps failed
          Hint: re-run it: station apps update bat
