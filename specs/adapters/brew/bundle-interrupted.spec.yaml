description: 'ctrl-c mid-bundle is an interruption, exit 130, never a failed install'
fixture:
    - ../../__fixtures__/terminal/
    - ./__fixtures__/bundle-interrupted/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION" apps install homebrew mise tailscale'
      stdin: |
          file bundle-started
          send \x03
          scrollback
      exit: 130
      stdout: |
          ▸ Installing homebrew · asks your password once
          ^C
