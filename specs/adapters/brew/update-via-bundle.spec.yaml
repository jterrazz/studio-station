description: 'a named app updates through brew bundle --upgrade'
fixture:
    - ../../__fixtures__/stubs/
    - ./__fixtures__/bat-installed/
runs:
    - command: 'apps update bat'
      exit: 0
      stdout: |
          ●	bat	0.24.0	brew
      files:
          .calls:
              contains:
                  - |-
                    brew bundle install --upgrade --file=-
                    brew "bat"
