description: 'a named tool upgrades through brew bundle --upgrade'
fixture:
    - ../../cli/tools/__fixtures__/stubs/
    - ../../cli/tools/__fixtures__/bat-installed/
runs:
    - command: 'tools upgrade bat'
      exit: 0
      stdout: |
          ●	bat
      files:
          .calls:
              contains:
                  - |-
                    brew bundle install --upgrade --file=-
                    brew "bat"
