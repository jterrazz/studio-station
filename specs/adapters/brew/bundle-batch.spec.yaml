description: 'a formula and a cask install through ONE brew bundle fed on stdin'
fixture:
    - ../../__fixtures__/stubs/
    - ../__fixtures__/bundle-batch/
runs:
    - command: 'apps install bat ghostty'
      exit: 0
      stdout: |
          ●	bat	0.24.0	brew
          ●	ghostty	1.2.0	cask
          ●	ghostty-dotfiles			~/.config/ghostty/config and 2 more
      files:
          .calls:
              contains:
                  - |-
                    brew bundle install --no-upgrade --file=-
                    brew "bat"
                    cask "ghostty"
    - command: '--version > /dev/null; /usr/bin/grep -c ''bundle'' .calls'
      exit: 0
      stdout: |
          1
