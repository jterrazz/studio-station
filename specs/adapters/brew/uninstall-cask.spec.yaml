description: 'a cask uninstalls with brew uninstall --cask'
fixture:
    - ../../cli/tools/__fixtures__/stubs/
    - ./__fixtures__/cask/
runs:
    - command: 'tools uninstall ghostty --yes'
      exit: 0
      stdout: |
          ●	ghostty
      files:
          .calls:
              contains:
                  - 'brew uninstall --cask ghostty'
