description: 'a cask failing in the bundle gets its own row and the settings still apply'
fixture:
    - ../../__fixtures__/terminal/
    - ./__fixtures__/setup-bundle-fails/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION" setup --name m'
      stdin: |
          within 10 exit 1
          scrollback
      exit: 1
      stdout: |
          Error: tailscale-app: sudo needs a terminal
          ●       name    m
          ●       zshrc
          ●       layout  nothing to retire
          ●       relocate        bunfig, go env, mise settings, npmrc
          ○       engine  not needed until tart is installed
          ✗       tailscale       the install failed: its output is in ~/.local/state/stag
          ●       settings        applied hushlogin git-shortcuts docker-shortcuts
          ○       ssh-key next: station settings apply ssh-key
          ○       spotlight-exclude       next: station settings apply spotlight-exclude
          ○       dns     next: station settings apply dns
          ○       claude-token    next: station settings apply claude-token
          ○       dock-reset      next: station settings apply dock-reset
          ○       dock-spacer     next: station settings apply dock-spacer
          Error: setup step apps: tailscale: the install failed: its output is in ~/.locag
          Hint: fix the apps above, then run station setup again: it resumes
