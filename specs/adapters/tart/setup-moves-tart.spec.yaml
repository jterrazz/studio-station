description: 'setup moves the old Tart store and app into station''s data folder by rename, never pulls'
fixture: ./__fixtures__/tart-store/
runs:
    - command: 'setup --name m </dev/null'
      exit: 0
      stdout: |
          ●	name	m
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	bunfig, go env, mise settings, npmrc, moved ~/.tart, ~/.local/opt
          ○	engine	not needed until tart is installed
          ○	apps	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ●	settings	applied hushlogin git-shortcuts docker-shortcuts
          ○	ssh-key	next: station settings apply ssh-key
          ○	spotlight-exclude	next: station settings apply spotlight-exclude
          ○	dns	next: station settings apply dns
          ○	claude-token	next: station settings apply claude-token
          ○	dock-reset	next: station settings apply dock-reset
          ○	dock-spacer	next: station settings apply dock-spacer
      files:
          .local/share/station/vms/vms/station-image-linux-2026.11.01/config.json: { equals: "{\"os\":\"linux\"}\n" }
          .local/share/station/vms/cache/OCIs/ghcr.io/x/disk.img: { equals: "disk\n" }
          .local/share/station/tart/tart.app/Contents/MacOS/tart: { equals: "#!/bin/sh\necho tart\n" }
          .local/share/station/tart/LICENSE: { equals: "license\n" }
          .local/bin/tart: { equals: "#!/bin/sh\nd=\"$HOME/.local/share\"\ncase \"$XDG_DATA_HOME\" in /*) d=\"$XDG_DATA_HOME\" ;; esac\nTART_HOME=\"$d/station/vms\" exec \"$d/station/tart/tart.app/Contents/MacOS/tart\" \"$@\"\n" }
          .tart: absent
          .local/opt: absent
    - command: 'setup </dev/null'
      exit: 0
      stdout: |
          ●	name	m
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	nothing to do
          ○	engine	not needed until tart is installed
          ○	apps	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ●	settings
          ○	ssh-key	next: station settings apply ssh-key
          ○	spotlight-exclude	next: station settings apply spotlight-exclude
          ○	dns	next: station settings apply dns
          ○	claude-token	next: station settings apply claude-token
          ○	dock-reset	next: station settings apply dock-reset
          ○	dock-spacer	next: station settings apply dock-spacer
    - command: '--version >/dev/null; /usr/bin/grep -c -e curl -e "^tar " -e "tart pull" .calls'
      exit: 1
      stdout: |
          0
