description: 'a temporary VM''s reboot runs it again on a fresh console, its poweroff then deletes it'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/engine-vm/
    - ./__fixtures__/reboot/
env: engine
serve: sshd
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "42000-42019"}/'' .config/station/settings.json; "$STATION" engine run 2>/dev/null & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --lifetime temporary > /dev/null; for i in $(/usr/bin/seq 1 60); do [ -f .local/state/station/vms/linux-1.json ] || break; /bin/sleep 0.2; done; /usr/bin/grep -c ''^sh -c'' .calls; /bin/cat .consoles; /usr/bin/grep -c ''^tart delete linux-1'' .calls; /bin/ls .local/state/station/vms; kill $d; wait $d'
      exit: 0
      stdout: |
          2
          console before run 1: 0
          console before run 2: 0
          1
      files:
          .calls:
              contains:
                  - 'tart run --no-graphics --no-audio --serial-path {{workdir}}/.local/state/station/consoles/linux-1 linux-1'
