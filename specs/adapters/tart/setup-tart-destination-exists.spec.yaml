description: 'a non-empty destination is never merged into: setup stops, both trees untouched'
fixture:
    - ./__fixtures__/tart-store/
    - ./__fixtures__/vms-taken/
runs:
    - command: 'setup --name m </dev/null'
      exit: 1
      stdout: |
          ●	name	m
          ●	zshrc
          ●	layout	nothing to retire
          ✗	relocate	~/.local/share/station/vms already exists
          ○	engine	launchd is not here to run it
      stderr: |
          Error: setup step relocate: ~/.local/share/station/vms already exists
          Hint: ~/.local/share/station/vms already exists: move one of them by hand
      files:
          .tart/vms/station-image-linux-2026.11.01/config.json: exists
          .local/share/station/vms/vms/other/config.json: exists
