description: 'deleting an image version never prunes Tart''s cache: that is tart''s storage clean'
fixture:
    - ./__fixtures__/images-stubs/
    - ./__fixtures__/images-recorded/
runs:
    - command: 'images delete linux@2026.11.01 --yes'
      exit: 0
      stdout: |
          ●	linux	2026.11.01	deleted
    - command: '--version > /dev/null; /usr/bin/grep -c "prune" .calls'
      exit: 1
      stdout: |
          0
