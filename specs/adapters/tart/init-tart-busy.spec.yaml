description: 'with tart running, init moves nothing and names the relocate step and what to stop'
fixture:
    - ./__fixtures__/tart-store/
    - ../__fixtures__/process-running/
runs:
    - command: 'init --name m </dev/null'
      exit: 1
      stdout: |
          ●	name	m
          ●	zshrc
          ●	layout	nothing to retire
          ✗	relocate	tart is running: its files cannot move under it
          # Machinefile
          	none yet: apps and settings come one at a time
      stderr: |
          Error: init step relocate: tart is running: its files cannot move under it
          Hint: stop the persistent VMs and delete the ephemeral ones (station machines), then station init
      files:
          .tart/vms/station-image-linux-2026.11.01/config.json: exists
          .local/share/station/vms: absent
