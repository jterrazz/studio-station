description: 'a recipe that fails exits 1, deletes the build VM and records nothing'
fixture:
    - ./__fixtures__/images-stubs/
    - ./__fixtures__/images-build/
    - ./__fixtures__/images-served/
    - ./__fixtures__/images-recipe-fails/
serve: sshd
runs:
    - command: 'images build station-linux --binary $HOME/station-linux'
      exit: 1
      stderr: |
          Error: image station-linux: the recipe failed: exited 1: E: Unable to locate package libatomic1
          Hint: station images build station-linux
      files:
          .calls:
              contains: 'tart delete station-build-station-linux'
          .local/state/station/consoles/station-build-station-linux: absent
    - command: '--version > /dev/null; /bin/ls .local/state/station/images'
      exit: 0
      stdout: |
          key
          key.pub
