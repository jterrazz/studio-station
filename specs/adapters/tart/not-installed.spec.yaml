description: 'without tart the create is refused before anything, and names the app to install'
fixture: ../../__fixtures__/vms/
runs:
    - command: '--version > /dev/null; /bin/rm bin/tart'
      exit: 0
    - command: 'machines create'
      exit: 2
      stderr: |
          Error: tart is required by machines
          Hint: station apps install tart
      files:
          .calls: absent
