description: 'a bridged VM runs on the interface of the Mac''s default route'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/engine-vm/
    - ./__fixtures__/route/
env: engine
serve: sshd
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "42320-42339"}/'' .config/station/preferences.json; /bin/mkdir -p .local/state/station/vms; printf ''{"name":"mac","image":"macos","version":"2026.11.07","lifetime":"lasting","want":"running","network":"bridged"}\n'' > .local/state/station/vms/mac.json; echo stopped > .tart-vms/mac; "$STATION" engine run 2>/dev/null & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; ("$STATION" machines start mac >/dev/null 2>&1 &); n=0; until "$STATION" machines --json 2>/dev/null | /usr/bin/grep -q ''"state": "running"'' || [ $n -ge 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; for i in $(/usr/bin/seq 1 50); do /usr/bin/grep -q ''^tart run'' .calls && break; /bin/sleep 0.1; done; /usr/bin/grep -E ''^(route|tart run)'' .calls | /usr/bin/sed "s|$PWD|WORKDIR|"; kill $d; wait $d; echo stopped > .tart-vms/mac'
      exit: 0
      stdout: |
          route -n get default
          tart run --no-graphics --no-audio --serial-path WORKDIR/.local/state/station/consoles/mac --net-bridged=en7 mac
