description: 'setup writes go''s env file, mise''s settings, ~/.npmrc and the bunfig; a rerun changes nothing'
runs:
    - command: 'setup --name m </dev/null'
      exit: 0
      stdout: |
          ●	name	m
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	bunfig, go env, mise settings, npmrc
          ○	engine	not needed until tart is installed
          ○	apps	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ●	settings	applied hushlogin tart-launcher git-shortcuts docker-shortcuts
          ○	ssh-key	next: station settings apply ssh-key
          ○	spotlight-exclude	next: station settings apply spotlight-exclude
          ○	dns	next: station settings apply dns
          ○	claude-token	next: station settings apply claude-token
          ○	dock-reset	next: station settings apply dock-reset
          ○	dock-spacer	next: station settings apply dock-spacer
      files:
          Library/Application Support/go/env: { equals: "GOPATH={{workdir}}/.local/share/go\nGOMODCACHE={{workdir}}/.cache/go/mod\n" }
          .npmrc: { equals: "cache={{workdir}}/.cache/npm\n" }
          .config/mise/config.toml: { equals: "[settings]\ngo_set_gobin = false\n" }
          .bunfig.toml: { equals: "# >>> station >>>\n[install]\nglobalDir = \"{{workdir}}/.local/share/bun/install/global\"\nglobalBinDir = \"{{workdir}}/.local/share/bun/bin\"\n\n[install.cache]\ndir = \"{{workdir}}/.cache/bun/install\"\n# <<< station <<<\n" }
    - command: 'setup </dev/null'
      exit: 0
      stdout: |
          ●	name	m
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	nothing to do
          ○	engine	launchd is not here to run it
          ○	apps	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ●	settings
          ○	ssh-key	next: station settings apply ssh-key
          ○	spotlight-exclude	next: station settings apply spotlight-exclude
          ○	dns	next: station settings apply dns
          ○	claude-token	next: station settings apply claude-token
          ○	dock-reset	next: station settings apply dock-reset
          ○	dock-spacer	next: station settings apply dock-spacer
    - command: '--version >/dev/null; /bin/cat "Library/Application Support/go/env" .npmrc'
      exit: 0
      stdout: |
          GOPATH={{workdir}}/.local/share/go
          GOMODCACHE={{workdir}}/.cache/go/mod
          cache={{workdir}}/.cache/npm
