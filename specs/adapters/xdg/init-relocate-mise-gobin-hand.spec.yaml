description: 'a go_set_gobin the owner set in mise''s settings file is reported and never overwritten'
fixture: ./__fixtures__/mise-gobin-hand/
runs:
    - command: 'init --name m </dev/null'
      exit: 0
      stdout: |
          ●	name	m
          ●	zshrc
          ●	layout	nothing to retire
          ◐	relocate	mise go_set_gobin set by hand to true; station leaves it
          # Machinefile
          	none yet: apps and settings come one at a time
      files:
          .config/mise/config.toml: { equals: "[settings]\ngo_set_gobin = true\n" }
