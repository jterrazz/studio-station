description: 'a go_set_gobin the owner set in mise''s config is reported and never overwritten'
fixture: ./__fixtures__/mise-gobin-hand/
runs:
    - command: 'setup --name m </dev/null'
      exit: 0
      stdout: |
          ●	name	m
          ●	zshrc
          ●	layout	nothing to retire
          ◐	relocate	mise go_set_gobin set by hand to true; station leaves it
          ○	tools	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ○	engine	not needed until tart is installed
      files:
          .config/mise/config.toml: { equals: "[settings]\ngo_set_gobin = true\n" }
