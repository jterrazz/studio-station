description: 'on a Linux VM with XDG_CONFIG_HOME, go''s env file and mise''s settings file move with it'
env:
    - STATION_MACHINE_KIND=linux
    - XDG_CONFIG_HOME=$WORKDIR/x
runs:
    - command: 'init'
      exit: 0
      stdout: |
          ●	zshrc
          ●	relocate	bunfig, go env, mise settings, npmrc
          # Machinefile
          	none yet: apps and settings come one at a time
      files:
          x/go/env: exists
          x/mise/config.toml: exists
          .config/go: absent
