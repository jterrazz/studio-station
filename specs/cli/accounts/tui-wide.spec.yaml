description: 'at 120 columns Accounts keeps its scope column, and the ssh key comments wait in the row detail'
fixture:
    - ./__fixtures__/accounts/
    - ../__fixtures__/terminal/
env: terminal
runs:
    - command: '--version >/dev/null; terminal --size 120x24 "$STATION"'
      stdin: |
          see Machine
          send 7
          see 9 ●
          screen
          send /ssh\r
          send \x1b[B
          send \x1b[B
          send \r
          see github-actions
          screen
          send \x1b
          gone category
          send q
      exit: 0
      stdout: |4
