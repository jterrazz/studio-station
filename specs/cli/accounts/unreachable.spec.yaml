description: 'a VM whose guest is absent keeps its lent rows whole and reads every other one ? unreachable'
fixture:
    - ../../__fixtures__/accounts/
    - ../../__fixtures__/vms/
    - ../../__fixtures__/daemon-vm/
    - ../__fixtures__/vm-api/
env: daemon
runs:
    - command: '--version >/dev/null; echo stopped > .tart-vms/api; /usr/bin/jq ''.lent=[{"name":"operator:claude:oauth-token","at":(now-3600|todate),"until":(now+39600|todate)}]'' .local/state/station/vms/api.json > r.json && /bin/mv r.json .local/state/station/vms/api.json; STATION_GUEST_SSH_PORT=9 "$STATION" daemon 2> /dev/null & d=$!; n=0; while [ ! -S .local/state/station/daemon.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" accounts | /usr/bin/awk -F''\t'' ''$2=="api"{print $1, $3, $4, $5, $6, $8}''; "$STATION" accounts --json | /usr/bin/jq -c ''.machines[]|select(.name=="api")|[.guest,(.accounts|length)]''; "$STATION" accounts --page | /usr/bin/jq -c ''[..|objects|select(.id?=="api")|[.mark,.reason]]''; kill $d; wait $d; echo stopped > .tart-vms/api'
      exit: 0
      stdout: |
          ◐ github ? own  guest not connected
          ◐ npm ? own  guest not connected
          ● claude admin@jterrazz.com lent operator:claude:oauth-token 
          ◐ cloudflare ? own  guest not connected
          ◐ git ? own  guest not connected
          ◐ ssh ? own  guest not connected
          ◐ entry ? own  guest not connected
          ["absent",7]
          [["attention","unreachable"]]
