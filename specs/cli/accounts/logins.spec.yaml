description: 'a refused credential is ✗ refused, a missing login ○ unset, each with its fix; the read still exits 0'
fixture:
    - ../__fixtures__/accounts/
env: daemon
runs:
    - command: '--version > /dev/null; /bin/mkdir -p answers/accounts; echo e401 > answers/accounts/npm.mode; "$STATION" accounts | /usr/bin/awk -F''\t'' ''$3=="npm"'''
      exit: 0
      stdout: |
          ✗	jterrazz-macbook-pro	npm	?	own			token refused by registry.npmjs.org	npm login
    - command: '--version > /dev/null; echo eneedauth > answers/accounts/npm.mode; echo out > answers/accounts/gh.mode; "$STATION" accounts | /usr/bin/awk -F''\t'' ''$3=="npm"||$3=="github"'''
      exit: 0
      stdout: |
          ○	jterrazz-macbook-pro	github					not logged in	station config install github-login
          ○	jterrazz-macbook-pro	npm					not logged in	npm login
