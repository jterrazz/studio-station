description: 'never a token: the sentinel every stub prints reaches no output of accounts'
fixture:
    - ./__fixtures__/accounts/
env: daemon
runs:
    - command: 'accounts > out.txt 2> err.txt; "$STATION" accounts --json > out.json 2>> err.txt; "$STATION" accounts --page > page.json 2>> err.txt; /usr/bin/grep -c SENTINEL out.txt err.txt out.json page.json; /usr/bin/jq ''[..|strings|select(test("gho_|sk-ant-|npm_|eyJ"))]|length'' out.json; /usr/bin/grep -c "docker-credential-osxkeychain get" .calls'
      exit: 1
      stdout: |
          out.txt:0
          err.txt:0
          out.json:0
          page.json:0
          0
          0
