description: 'the host''s providers read as this Mac''s shapes, one record each, and Tailscale costs no second read'
fixture:
    - ../__fixtures__/accounts/
env: daemon
runs:
    - command: 'accounts; /usr/bin/grep -c "^tailscale status --json" .calls'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	github	jterrazz	own	gist · read:org · repo · workflow		gh · keyring · ssh
          ●	jterrazz-macbook-pro	npm	jterrazz	own
          ●	jterrazz-macbook-pro	claude	admin@jterrazz.com	own	max		claude.ai
          ●	jterrazz-macbook-pro	tailscale	jterrazz@github	own	tailnet jterrazz.github
          ●	jterrazz-macbook-pro	cloudflare	admin@jterrazz.com	own	studio		wrangler
          ●	jterrazz-macbook-pro	git	Jean-Baptiste Terrazzoni · admin@jterrazz.com	own
          ●	jterrazz-macbook-pro	ssh	6 keys	own	admin@jterrazz.com · station-image · station-e2e · deploy · old-rsa · github-actions
          ●	jterrazz-macbook-pro	docker	deploy	own	registry.jterrazz.com		osxkeychain
          1
    - command: 'accounts --json | /usr/bin/jq -c ''[.schema, (.machines|length), .machines[0].kind, (.machines[0].accounts[]|select(.provider=="github")|[.identity,.source,.notes])]'''
      exit: 0
      stdout: |
          ["station.accounts/v1",1,"host",["jterrazz","gh",["keyring","ssh"]]]
    - command: 'accounts --page | /usr/bin/jq -r ''[.schema, .id]|@tsv'''
      exit: 0
      stdout: |
          station.page/v1	accounts
