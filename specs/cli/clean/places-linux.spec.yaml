description: 'a linux VM lists docker only, and refuses a cleanable placed on a host'
fixture: ./__fixtures__/docker/
env:
    - STATION_MACHINE_KIND=linux
runs:
    - command: 'clean --json | /usr/bin/jq -r ''[.items[].name] | join(" ")'''
      exit: 0
      stdout: |
          docker
    - command: 'clean trash --yes'
      exit: 2
      stderr: |
          Error: trash's place is host, macos; here is linux
          Hint: run station clean for what can be reclaimed here
