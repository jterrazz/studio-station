description: 'old-images reclaims every version but the newest, then prunes the base images Tart cached'
fixture: ./__fixtures__/old-images/
runs:
    - command: 'clean --json | /usr/bin/jq -c ''.items[] | select(.name == "old-images") | [.available, .bytes]'''
      exit: 0
      stdout: |
          [true,5000000000]
    - command: 'clean old-images --yes'
      exit: 0
      stdout: |
          ●	old-images	1 removed
      files:
          .calls:
              equals: |
                  tart --version
                  tart list --source local --format json
                  tart delete station-image-linux-2026.11.01
                  tart prune --entries=caches
          .local/state/station/images/linux/2026.11.01.json: absent
          .local/state/station/images/linux/2026.11.07.json: exists
