description: 'clean with items or --all refuses off a terminal without --yes, exit 2, and runs nothing'
fixture:
    - ./__fixtures__/docker/
    - ./__fixtures__/trash/
runs:
    - command: 'clean trash'
      exit: 2
      stderr: |
          Error: refusing to clean without --yes
          Hint: re-run with --yes
    - command: 'clean --all'
      exit: 2
      stderr: |
          Error: refusing to clean without --yes
          Hint: re-run with --yes
      files:
          .calls: absent
          .Trash/old-download.zip:
              contains: 'xxxxxxxx'
