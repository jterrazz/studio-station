description: 'clean --all reclaims every cleanable placed here, in catalogue order'
fixture:
    - ./__fixtures__/docker/
    - ./__fixtures__/brew/
runs:
    - command: 'clean --all --yes | /usr/bin/grep -v -e stale-vms -e old-images'
      exit: 0
      stdout: |
          ●	brew	cleaned
          ●	docker	cleaned
          ●	trash	cleaned
      files:
          .calls:
              contains:
                  - |-
                    brew cleanup
                    docker container prune -f
