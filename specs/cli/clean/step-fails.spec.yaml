description: 'a failing prune lets the next ones run, then exits 1 naming the first failure'
fixture:
    - ./__fixtures__/docker/
    - ./__fixtures__/volume-prune-fails/
runs:
    - command: 'clean docker --yes'
      exit: 1
      stdout: |
          ✗	docker	docker volume prune -f exited 1
      stderr: |
          Error response from daemon: volume prune failed
          Error: 1 of 1 cleanables failed
          Hint: re-run it: station clean docker --yes
      files:
          .calls:
              contains:
                  - |-
                    docker volume prune -f
                    docker network prune -f
                    docker builder prune -f
