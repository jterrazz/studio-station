description: 'the old manager flags are gone; --via names the manager'
fixture:
    - ../__fixtures__/stubs/
    - ../__fixtures__/bat-installed/
runs:
    - command: 'tools upgrade --brew'
      exit: 2
      stderr: |
          Error: unknown flag: --brew
          Hint: run station tools upgrade --help
    - command: 'tools upgrade --via brew'
      exit: 0
      stdout: |
          ●	bat
      files:
          .calls:
              contains:
                  - |-
                    brew bundle install --upgrade --file=-
                    brew "bat"
