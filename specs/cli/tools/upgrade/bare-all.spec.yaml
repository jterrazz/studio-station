description: 'bare tools upgrade upgrades every installed catalogue tool'
fixture:
    - ../../../__fixtures__/stubs/
    - ./__fixtures__/two-installed/
runs:
    - command: 'tools upgrade'
      exit: 0
      stdout: |
          ●	bat
          ●	jq
          ●	homebrew
      files:
          .calls:
              contains:
                  - |-
                    brew bundle install --upgrade --file=-
                    brew "bat"
                    brew "jq"
                  - 'bash https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh'
