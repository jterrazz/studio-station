description: 'a failing brew bundle upgrade is a failure, exit 1'
fixture:
    - ../../../__fixtures__/stubs/
    - ../../../__fixtures__/bat-installed/
    - ./__fixtures__/bundle-fails/
runs:
    - command: 'tools upgrade --via brew'
      exit: 1
      stdout: |
          ✗	bat	brew bundle exited 1
      stderr: |
          Error: 1 of 1 tools failed
          Hint: re-run it: station tools upgrade bat
