description: 'a word naming a catalogue tool hints the install verb; any other word hints the help'
runs:
    - command: 'tools jq'
      exit: 2
      stderr: |
          Error: "jq" is a tool: say what to do with it
          Hint: station tools install jq
    - command: 'tools nope'
      exit: 2
      stderr: |
          Error: unknown command "nope" for "station tools"
          Hint: run station tools --help
