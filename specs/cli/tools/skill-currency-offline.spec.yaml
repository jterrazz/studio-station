description: 'with GitHub out of reach, a locked skill stays ok, its currency unknown'
fixture:
    - ./__fixtures__/stubs/
    - ./__fixtures__/skill-lock/
runs:
    - command: 'tools --json | /usr/bin/jq -r ''.tools[] | select(.name | IN("frontend-design", "shadcn", "last30days")) | "\(.name) \(.state) \(.detail) \(.method) \(.category)"'''
      exit: 0
      stdout: |
          frontend-design ok currency unknown skill Agent skills
          shadcn ok currency unknown skill Agent skills
          last30days absent skills not installed skill Agent skills
