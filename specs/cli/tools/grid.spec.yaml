description: 'tools on a terminal sizes each section to its own rows, never to the widest of the page'
fixture:
    - ../../__fixtures__/terminal/
    - ../../__fixtures__/stubs/
env: terminal
runs:
    - command: '--version >/dev/null; terminal --size 100x200 /usr/bin/env -u NO_COLOR COLUMNS=100 "$STATION" tools | /usr/bin/grep -E "^   [^ ]+ (homebrew|bat|frontend-design) "'
      stdin: |
          scrollback
      exit: 0
      stdout: |4
             ● homebrew   5.0.1  script · system
             ○ bat         brew  → station tools install bat
             ○ frontend-design              skill  skills not installed  → station tools install skills
