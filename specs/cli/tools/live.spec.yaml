description: 'tools on a terminal draws the catalogue placed here at once, every row pending, and fills each method''s rows as its manager answers; piped, one document'
fixture:
    - ../__fixtures__/terminal/
    - ./__fixtures__/slow-cask/
env: terminal
runs:
    - command: '--version >/dev/null; terminal --size 120x200 /usr/bin/env -u NO_COLOR COLUMNS=120 "$STATION" tools | /usr/bin/grep -c "^ station tools"'
      stdin: |
          within 1 see Package Managers
          within 1 see ◌ ghostty
          see ● ghostty
          gone ◌
          screen
      exit: 0
      stdout: |
          1
    - command: 'tools | /usr/bin/grep -c "◌"'
      exit: 1
      stdout: |
          0
