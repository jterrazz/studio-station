description: 'off a terminal, an uninstall without --yes is refused before anything runs'
fixture:
    - ../__fixtures__/stubs/
    - ../__fixtures__/bat-installed/
    - ../__fixtures__/skills-cli/
    - ../__fixtures__/skill-lock/
runs:
    - command: 'tools uninstall bat </dev/null'
      exit: 2
      stderr: |
          Error: refusing to uninstall without --yes
          Hint: re-run with --yes
    - command: 'tools uninstall frontend-design </dev/null'
      exit: 2
      stderr: |
          Error: refusing to uninstall without --yes
          Hint: re-run with --yes
      files:
          .calls: absent
