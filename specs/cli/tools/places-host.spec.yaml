description: 'a host lists dia, ollama, the exploration dev tools and node, and no VM-only tool'
runs:
    - command: 'tools --json | /usr/bin/jq -r ''.tools[] | select(.name | IN("dia", "node", "ollama", "browser-use", "xcode")) | "\(.name) \(.places | join(","))"'''
      exit: 0
      stdout: |
          node host,linux,macos
          xcode host,macos
          ollama host
          dia host
    - command: 'tools --json | /usr/bin/jq -r ''[.tools[] | select(.name | IN("xcode", "cocoapods", "xcodegen", "android-studio", "lens", "orbstack", "multipass", "utm", "browser-use"))] | length'''
      exit: 0
      stdout: |
          6
