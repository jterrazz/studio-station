description: 'one bundle for two tools: what brew lists after is ok, the rest broken, exit 1 after the document'
fixture:
    - ../__fixtures__/stubs/
    - ./__fixtures__/partial-failure/
runs:
    - command: 'tools install bat ghostty'
      exit: 1
      stdout: |
          ●	bat
          ✗	ghostty	brew bundle exited 1
      stderr: |
          ==> Downloading ghostty
          curl: (22) The requested URL returned error: 404
          Error: 1 of 2 tools failed
          Hint: station tools install ghostty
