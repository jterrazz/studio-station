description: 'a skill installs through the skills CLI that bun put in its relocated bin, ~/.local/share/bun/bin, off the caller''s PATH'
fixture:
    - ../__fixtures__/stubs/
    - ./__fixtures__/skills-in-bun-bin/
runs:
    - command: 'tools install frontend-design'
      exit: 0
      stdout: |
          ●	frontend-design
      files:
          .calls:
              contains:
                  - 'skills add anthropics/skills -g -y --skill frontend-design'
