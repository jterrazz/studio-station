description: 'a locked skill is ok, degraded and outdated when its folder changed upstream, absent unlocked'
fixture:
    - ./__fixtures__/stubs/
    - ./__fixtures__/skill-lock/
serve:
    - github
runs:
    - command: 'tools --json | /usr/bin/jq -r ''.tools[] | select(.name | IN("frontend-design", "shadcn", "last30days")) | "\(.name) \(.state) \(.detail) \(.method) \(.category)"'''
      exit: 0
      stdout: |
          frontend-design ok  skill Agent skills
          shadcn degraded outdated skill Agent skills
          last30days absent skills not installed skill Agent skills
