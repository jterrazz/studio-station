description: 'tools --page prints the page as station.page/v1: sections, columns, rows, actions'
fixture: ./__fixtures__/node-on-path/
runs:
    - command: 'tools --page | /usr/bin/jq -r ''"\(.schema) \(.id) \(.state)"'''
      exit: 0
      stdout: |
          station.page/v1 tools ready
    - command: 'tools --page | /usr/bin/jq -r ''.sections[0] | "\(.id) \(.title) \(.fold) \([.columns[].key] | join(","))"'''
      exit: 0
      stdout: |
          package-managers Package Managers auto name,version,method
    - command: 'tools --page | /usr/bin/jq -r ''.sections[].items[].row | select(.id == "node") | "\(.mark) \(.reason) \(.hint.command)"'''
      exit: 0
      stdout: |
          attention missing station tools install mise
    - command: 'tools --page | /usr/bin/jq -r ''.actions[] | "\(.key) \(.label) \(.on)"'''
      exit: 0
      stdout: |
          i install row
          u uninstall row
          U upgrade row
