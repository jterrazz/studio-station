description: 'every tool says its host use: system for the five the fleet depends on, exploration for the rest'
runs:
    - command: 'tools --json | /usr/bin/jq -r ''[.tools[] | select(.use == "system") | .name] | join(" ")'''
      exit: 0
      stdout: |
          homebrew mise git tart tailscale
    - command: 'tools --json | /usr/bin/jq -r ''[.tools[] | select(.name | IN("node", "xcode", "orbstack")) | .use] | unique | join(" ")'''
      exit: 0
      stdout: |
          exploration
    - command: 'tools --json | /usr/bin/jq -r ''[.tools[] | select(.use != "system" and .use != "exploration")] | length'''
      exit: 0
      stdout: |
          0
    - command: 'tools --json | /usr/bin/jq -r ''[.tools[] | select(.name | IN("xcode", "cocoapods", "xcodegen", "android-studio", "lens", "orbstack")) | .name] | join(" ")'''
      exit: 0
      stdout: |
          cocoapods android-studio xcode xcodegen orbstack lens
