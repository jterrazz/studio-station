description: '--on runs the same words over ssh, and the remote answers as if it were here'
fixture: ./__fixtures__/ssh-answers/
runs:
    - command: 'tools --json --on x'
      exit: 3
      stdout: |
          {"schema":"station.tools/v1","tools":[]}
      files:
          .calls:
              equals: |
                  ssh x -- sh -c 'PATH="$HOME/.local/bin:/usr/local/bin:$PATH" exec station "$@"' station tools --json
    - command: '--on=y tools --json'
      exit: 3
      stdout: |
          {"schema":"station.tools/v1","tools":[]}
      files:
          .calls:
              contains: ssh y -- sh -c
    - command: 'man --on x'
      exit: 3
      stdout: |
          {"schema":"station.tools/v1","tools":[]}
      files:
          .calls:
              contains: |
                  ssh x -- sh -c 'PATH="$HOME/.local/bin:/usr/local/bin:$PATH" exec station "$@"' station man
