description: '--on a stopped VM of this Mac: a read names it with the verb that starts it, an action is refused'
fixture:
    - ../../__fixtures__/vms/
    - ../__fixtures__/vm-api/
    - ./__fixtures__/stopped-api/
env: engine
runs:
    - command: '--version >/dev/null; "$STATION" engine run 2>/dev/null & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" apps --on api; echo "exit $?"; "$STATION" apps install jq --on api; echo "exit $?"; kill $d; wait $d'
      exit: 0
      stdout: |
          ○ api is stopped · start it to read its apps
          exit 0
          exit 2
      stderr: |
          Error: api is stopped
          Hint: station machines start api
