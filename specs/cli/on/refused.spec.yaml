description: '--on is refused where no call is sent, and a bare station --on is the menu off a terminal'
fixture: ./__fixtures__/far-mac/
runs:
    - command: 'shell zsh --on x'
      exit: 2
      stderr: |
          Error: --on does not apply to "shell"
          Hint: run it on x itself: ssh x
    - command: 'completion zsh --on x'
      exit: 2
      stderr: |
          Error: --on does not apply to "completion zsh"
          Hint: run it on x itself: ssh x
    - command: 'machines supervise v --on x'
      exit: 2
      stderr: |
          Error: --on does not apply to "machines supervise"
          Hint: run it on x itself: ssh x
    - command: 'machines pipe v --on x'
      exit: 2
      stderr: |
          Error: --on does not apply to "machines pipe"
          Hint: run it on x itself: ssh x
      files:
          .calls: absent
    - command: 'daemon --on x'
      exit: 2
      stderr: |
          Error: --on does not apply to "daemon"
          Hint: run it on x itself: ssh x
    - command: 'guest --on x'
      exit: 2
      stderr: |
          Error: --on does not apply to "guest"
          Hint: run it on x itself: ssh x
    - command: 'man --on x'
      exit: 2
      stderr: |
          Error: --on does not apply to "man"
          Hint: run it on x itself: ssh x
    - command: 'help --on x'
      exit: 2
      stderr: |
          Error: --on does not apply to "help"
          Hint: run it on x itself: ssh x
    - command: '--on x 2> menu.txt </dev/null || echo "station exited $?"'
      exit: 0
      stdout: |
          station exited 2
      files:
          menu.txt:
              contains: '    tools '
          .calls: absent
