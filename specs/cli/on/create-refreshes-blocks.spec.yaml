description: 'a VM created on another host with --on gets its ssh block here as soon as the create returns'
fixture: ./__fixtures__/create-on-y/
runs:
    - command: 'machines create --permanent --on y'
      exit: 0
      stdout: |
          ●	linux-1	y	permanent	linux 2026.11.07	4 cpus · 4 GB
      files:
          .ssh/config:
              contains:
                  - |-
                    Host linux-1
                      HostName linux-1
                      User vmu
    - command: '--version > /dev/null; /usr/bin/head -n 1 .calls'
      exit: 0
      stdout: |
          ssh -o BatchMode=yes -o ConnectTimeout=5 y -- sh -c 'PATH="$HOME/.local/bin:/usr/local/bin:$PATH" exec station "$@"' station engine attach
