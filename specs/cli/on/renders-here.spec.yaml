description: '--on runs the call on the other Mac, through its engine over ssh, and renders its answer here: the same bytes as there'
fixture: ./__fixtures__/far-mac/
env: daemon
runs:
    - command: 'tools --json --on x > on.json; echo "on $?"; "$STATION" tools --on x > on.txt; cd far && for out in "--json > ../there.json" "> ../there.txt"; do eval /usr/bin/env -i HOME="$PWD" PATH="$PWD/bin" TZ=UTC NO_COLOR=1 COLUMNS=80 STATION_MACHINE_KIND=host STATION_SYSTEM_DIRS= STATION_SYSTEM_ROOT="$PWD/root" STATION_POWER_STUB="$PWD/power" STATION_GITHUB_API_URL=http://127.0.0.1:9 "$STATION" tools $out; done; echo "there $?"; /usr/bin/cmp ../on.json ../there.json && /usr/bin/cmp ../on.txt ../there.txt && echo same; /usr/bin/jq -r .schema ../on.json'
      exit: 0
      stdout: |
          on 0
          there 0
          same
          station.tools/v1
      files:
          .calls:
              equals: |
                  ssh -o BatchMode=yes -o ConnectTimeout=5 x -- sh -c 'PATH="$HOME/.local/bin:/usr/local/bin:$PATH" exec station "$@"' station engine attach
                  ssh -o BatchMode=yes -o ConnectTimeout=5 x -- sh -c 'PATH="$HOME/.local/bin:/usr/local/bin:$PATH" exec station "$@"' station engine attach
    - command: '--on=y tools --json | /usr/bin/jq -r .schema'
      exit: 0
      stdout: |
          station.tools/v1
      files:
          .calls:
              contains: ssh -o BatchMode=yes -o ConnectTimeout=5 y -- sh -c
