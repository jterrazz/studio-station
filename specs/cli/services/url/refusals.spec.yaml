description: 'services url refuses a host, an ignored port and what is not a port'
env: daemon
runs:
    - command: 'services url 3000'
      exit: 2
      stderr: |
          Error: station services url runs inside a VM
          Hint: station services url runs inside a VM; here: station services
    - command: '--version >/dev/null; STATION_MACHINE_KIND=linux "$STATION" services url 80'
      exit: 2
      stderr: |
          Error: port 80 is not published
          Hint: the host ignores ports below 1024 and 22
    - command: '--version >/dev/null; STATION_MACHINE_KIND=linux "$STATION" services url 22'
      exit: 2
      stderr: |
          Error: port 22 is not published
          Hint: the host ignores ports below 1024 and 22
    - command: '--version >/dev/null; STATION_MACHINE_KIND=linux "$STATION" services url x'
      exit: 2
      stderr: |
          Error: "x" is not a port
          Hint: a port is a number from 1 to 65535
