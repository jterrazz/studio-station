description: 'services --json is station.services/v1: every host, every service object whole'
fixture:
    - ../../__fixtures__/vms/
    - ./__fixtures__/fleet/
runs:
    - command: 'services --json | /usr/bin/jq -c ''.schema, (.hosts | length), ([.hosts[] | select(.reachable | not) | .name]), ([.hosts[].services[] | keys] | unique)'''
      exit: 0
      stdout: |
          "station.services/v1"
          3
          ["z"]
          [["detail","guest_port","host_port","http","last_seen_at","pinned","process","profile","state","urls","vm"]]
    - command: 'services --json | /usr/bin/jq -c ''[.hosts[].services[] | [.vm, .guest_port, .state]]'''
      exit: 0
      stdout: |
          [["api",3000,"unknown"],["api",8081,"unknown"],["w",3000,"published"]]
