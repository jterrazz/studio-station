description: 'a serve refused while Serve is on is degraded with tailscale''s line and keeps its URL'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/daemon-vm/
env: daemon
serve: sshd
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "42160-42179"}/'' .config/station/settings.json; "$STATION" daemon 2>/dev/null & d=$!; n=0; while [ ! -S .local/state/station/daemon.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --lifetime lasting --name api > /dev/null; : > answers/tailscale/serve.hang; : > answers/tailscale/serve.warn; printf ''  sl  local\n   0: 00000000:1F40 00000000:0000 0A 00000000:00000000 00:00000000 00000000  1000        0 101 1 0 100 0 0 10 0\n'' > vm/root/proc/net/tcp; n=0; until "$STATION" services --json | /usr/bin/jq -e ''.hosts[0].services[] | select(.guest_port == 8000 and .state == "published")'' > /dev/null || [ $n -ge 50 ]; do /bin/sleep 0.2; n=$((n+1)); done; "$STATION" services --json | /usr/bin/jq -c ''.hosts[0].services[] | select(.guest_port == 8000) | [.state, .urls.public, .detail]''; "$STATION" services | /usr/bin/grep "api	8000"; /bin/rm answers/tailscale/serve.hang; "$STATION" machines stop api > /dev/null; kill $d; wait $d'
      exit: 0
      stdout: |
          ["published","https://macbook.tail1234.ts.net:42162","serve: Serve is not enabled on your tailnet."]
          ◐	api	8000	https://macbook.tail1234.ts.net:42162	x	published		serve: Serve is not enabled on your tailnet.
