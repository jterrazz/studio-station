description: 'once a serve is refused, a URL handed out before start is the tailnet one, not dead https'
fixture:
    - ../__fixtures__/vms/
    - ../__fixtures__/daemon-vm/
env: daemon
serve: sshd
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "42200-42219"}/'' .config/station/settings.json; "$STATION" daemon & d=$!; n=0; while [ ! -S .local/state/station/daemon.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --lifetime lasting --name api > /dev/null; "$STATION" services --json | /usr/bin/jq -c ''.hosts[0].services[] | select(.guest_port == 8081) | [.state, .urls.https]''; : > answers/tailscale/serve.hang; printf ''  sl  local\n   0: 00000000:1F40 00000000:0000 0A 00000000:00000000 00:00000000 00000000  1000        0 101 1 0 100 0 0 10 0\n'' > vm/root/proc/net/tcp; n=0; until "$STATION" services --json | /usr/bin/jq -e ''.hosts[0].services[] | select(.guest_port == 8000 and .state == "published")'' > /dev/null || [ $n -ge 50 ]; do /bin/sleep 0.2; n=$((n+1)); done; "$STATION" services --json | /usr/bin/jq -c ''.hosts[0].services[] | select(.guest_port == 8081) | [.state, .urls.https, .urls.tailnet]''; HOME=$PWD/vm STATION_MACHINE_KIND=linux STATION_SYSTEM_ROOT=$PWD/vm/root "$STATION" services url 3100; /bin/rm answers/tailscale/serve.hang; "$STATION" machines stop api > /dev/null; kill $d; wait $d'
      exit: 0
      stdout: |
          ["waiting","https://macbook.tail1234.ts.net:42200"]
          ["waiting","","http://macbook.tail1234.ts.net:42200"]
          http://macbook.tail1234.ts.net:42203
