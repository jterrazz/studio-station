description: 'piped, every row holds at most 8 fields with its host in field 5; an unreachable host is one row'
fixture:
    - ../../__fixtures__/vms/
    - ./__fixtures__/fleet/
runs:
    - command: 'services | /usr/bin/awk -F "\t" ''{print (NF <= 8), $2, $3, $5}'''
      exit: 0
      stdout: |
          1 engine  x
          1 api 3000 x
          1 api 8081 x
          1 w 3000 y
          1 z  z
    - command: 'services | /usr/bin/awk -F "\t" ''$5 == "z"'''
      exit: 0
      stdout: |
          ◐	z			z	unreachable		ssh z true
