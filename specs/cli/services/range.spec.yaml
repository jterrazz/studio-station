description: 'each host heads its services with its range, leased and free, on a terminal and in JSON'
fixture:
    - ../__fixtures__/vms/
    - ../__fixtures__/terminal/
    - ./__fixtures__/ten-ports/
env: terminal
runs:
    - command: 'services --json | /usr/bin/jq -c ''.hosts[0].range'''
      exit: 0
      stdout: |
          {"low":40000,"high":40009,"leased":1,"free":9,"max_per_vm":20}
    - command: '--version >/dev/null; /usr/bin/env -u NO_COLOR terminal "$STATION" services | /usr/bin/grep -o "x  40000-40009 .*"'
      stdin: |
          see per VM
          screen
      exit: 0
      stdout: |
          x  40000-40009 · 1 leased · 9 free · 20 per VM
    - command: 'services'
      exit: 0
      stdout: |
          ◐	daemon			x	not running		station setup
          ◐	api	3000	http://127.0.0.1:40000	x	unknown
