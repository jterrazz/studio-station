description: 'with the daemon down release edits the lease store itself'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/vm-api/
    - ../../__fixtures__/api-leases/
runs:
    - command: 'services release api:3000; /usr/bin/jq -c "[.leases[] | .guest_port]" .local/state/station/leases.json'
      exit: 0
      stdout: |
          ●	api:3000	released
          [8081]
