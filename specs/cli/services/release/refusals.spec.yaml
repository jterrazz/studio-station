description: 'release refuses an unknown VM, a bare port on a host, a missing lease'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/vm-api/
runs:
    - command: 'services release nope:1'
      exit: 2
      stderr: |
          Error: unknown VM "nope"
          Hint: station services
    - command: 'services release 3000'
      exit: 2
      stderr: |
          Error: "3000" is not a service to release
          Hint: station services release <vm>:<port>
    - command: 'services release api:9999'
      exit: 2
      stderr: |
          Error: api holds no lease on 9999
          Hint: station services
