description: 'a VM of another host is released by that host''s engine, over ssh, and its answer printed here'
fixture:
    - ../../../__fixtures__/vms/
    - ./__fixtures__/remote/
runs:
    - command: 'services release w:3000; /usr/bin/grep -c ''station engine attach'' .calls'
      exit: 0
      stdout: |
          ●	w:3000	released
          1
