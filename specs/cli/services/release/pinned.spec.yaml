description: 'a profile''s pinned lease asks first: off a terminal it needs --yes'
fixture:
    - ../../../__fixtures__/vms/
    - ../../__fixtures__/vm-api/
    - ../../__fixtures__/api-leases/
runs:
    - command: 'services release api:8081 </dev/null'
      exit: 2
      stderr: |
          Error: refusing to release without --yes
          Hint: re-run with --yes
    - command: 'services release api:8081 --yes; /usr/bin/jq -c "[.leases[] | .guest_port]" .local/state/station/leases.json'
      exit: 0
      stdout: |
          ●	api:8081	released
          [3000]
