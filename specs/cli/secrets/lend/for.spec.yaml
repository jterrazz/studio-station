description: 'every lend expires: --for sets its term, 12h by default, between 1m and 7d'
fixture:
    - ../../../__fixtures__/vms/
    - ../../../__fixtures__/daemon-vm/
    - ../__fixtures__/stubs/
    - ../__fixtures__/fleet/
env: daemon
serve: sshd
runs:
    - command: '--version >/dev/null; engine-up; "$STATION" secrets lend --to api > /dev/null; engine-down; "$STATION" secrets --json | /usr/bin/jq -c ''.lends.api|map([.name,((.until|fromdate)-(.at|fromdate))])'''
      exit: 0
      stdout: |
          [["session:a",43200]]
    - command: '--version >/dev/null; engine-up; "$STATION" secrets lend --to api --for 4h > /dev/null; engine-down; "$STATION" secrets --json | /usr/bin/jq -c ''[.lent.api, (.lends.api|map((.until|fromdate)-(.at|fromdate)))]'''
      exit: 0
      stdout: |
          [["session:a"],[14400]]
    - command: 'secrets lend --to api --for 8d'
      exit: 2
      stderr: |
          Error: a lend lasts between 1m and 7d
          Hint: station secrets lend --to api --for 12h
    - command: 'secrets lend --to api --for 30s'
      exit: 2
      stderr: |
          Error: a lend lasts between 1m and 7d
          Hint: station secrets lend --to api --for 12h
