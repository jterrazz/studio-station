description: 'the lend list carries the Claude token with the sessions in one export and one import'
fixture:
    - ../../../__fixtures__/vms/
    - ../../../__fixtures__/daemon-vm/
    - ../__fixtures__/stubs/
    - ../__fixtures__/fleet/
    - ../__fixtures__/fleet-both/
env: daemon
serve: sshd
runs:
    - command: '--version >/dev/null; engine-up; "$STATION" secrets lend --to api | /usr/bin/sed -E ''s/until [0-9]{2}:[0-9]{2}/until HH:MM/''; engine-down; /usr/bin/jq -c ''[.lent[]|[.name,((.until|fromdate)-(.at|fromdate))]]'' .local/state/station/vms/api.json; /usr/bin/grep -E "^(studio |vm-sshd exec (command|STUDIO))" .calls'
      exit: 0
      stdout: |
          ●	session:a	lent to api · until HH:MM (12h)
          ●	operator:claude:oauth-token	lent to api · until HH:MM (12h)
          [["session:a",43200],["operator:claude:oauth-token",43200]]
          vm-sshd exec command -v studio
          studio credentials export session:a operator:claude:oauth-token
          vm-sshd exec STUDIO_CREDENTIALS_BACKEND=file studio credentials import
      files:
          imported.json:
              equals: |
                  {"session:a":"stub-value-of-session:a","operator:claude:oauth-token":"stub-value-of-operator:claude:oauth-token"}
