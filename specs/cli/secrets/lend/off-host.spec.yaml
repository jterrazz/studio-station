description: 'a VM lends nothing: lending off a host is refused before any call'
fixture:
    - ../__fixtures__/stubs/
    - ../__fixtures__/fleet/
env: 'STATION_MACHINE_KIND=linux'
runs:
    - command: 'secrets lend --to api'
      exit: 2
      stderr: |
          Error: secrets are lent from a host, not from a VM
          Hint: run it on a host: station secrets <verb> --on <host>
      files:
          .calls: absent
