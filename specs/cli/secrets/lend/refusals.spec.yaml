description: 'lending refuses before any call: no target, a host, an unknown VM, an unlisted name, no list'
fixture:
    - ../__fixtures__/stubs/
    - ../__fixtures__/fleet/
runs:
    - command: 'secrets lend'
      exit: 2
      stderr: |
          Error: lending needs a target: --to <vm>
          Hint: station secrets lend --to <vm>
    - command: 'secrets lend --to mac-mini'
      exit: 2
      stderr: |
          Error: "mac-mini" is a host: secrets are lent to VMs only
          Hint: station machines lists the VMs
    - command: 'secrets lend --to ghost'
      exit: 2
      stderr: |
          Error: unknown VM "ghost"
          Hint: station machines lists the VMs
    - command: 'secrets lend --to api session:z'
      exit: 2
      stderr: |
          Error: "session:z" is not on the lend list
          Hint: station secrets lists the lend list; station secrets allow session:z adds it
      files:
          .calls: absent
    - command: 'secrets disallow session:a --yes'
      exit: 0
      stdout: |
          ●	session:a	off the lend list
    - command: 'secrets lend --to api'
      exit: 2
      stderr: |
          Error: the lend list is empty: nothing to lend
          Hint: station secrets allow session:<id>
      files:
          .calls: absent
