description: 'a VM without studio fails the pre-check with exit 1, nothing is exported and the record is unchanged'
fixture:
    - ../__fixtures__/stubs/
    - ./__fixtures__/no-studio/
    - ../__fixtures__/fleet/
runs:
    - command: 'secrets lend --to api'
      exit: 1
      stderr: |
          Error: no studio command in "api"
          Hint: see docs/reference/secrets.md#studio-in-a-vm
      files:
          .calls:
              equals: |
                  ssh api command -v studio
          imported.json: absent
          .local/state/station/vms/api.json:
              equals: |
                  {
                    "name": "api",
                    "image": "linux",
                    "version": "1",
                    "lifetime": "lasting"
                  }
