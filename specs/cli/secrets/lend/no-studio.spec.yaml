description: 'a VM without studio fails the pre-check with exit 1, nothing is exported and the record is unchanged'
fixture:
    - ../../../__fixtures__/vms/
    - ../../../__fixtures__/engine-vm/
    - ../__fixtures__/stubs/
    - ../__fixtures__/fleet/
env: engine
serve: sshd
runs:
    - command: '--version >/dev/null; /bin/rm vm/bin/studio; engine-up; "$STATION" secrets lend --to api; c=$?; engine-down; /usr/bin/grep -c -E "^(studio |vm-sshd exec (command|STUDIO))" .calls; exit $c'
      exit: 1
      stdout: |
          1
      stderr: |
          Error: no studio command in "api"
          Hint: see docs/reference/secrets.md#studio-in-a-vm
      files:
          imported.json: absent
          .local/state/station/vms/api.json:
              contains:
                  - '"want": "running",'
