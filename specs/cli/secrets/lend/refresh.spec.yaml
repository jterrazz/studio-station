description: 'lending pipes the OS export into the VM import, never through argv, and lending again refreshes'
fixture:
    - ../__fixtures__/stubs/
    - ../__fixtures__/fleet/
runs:
    - command: 'secrets lend --to api'
      exit: 0
      stdout: |
          ●	session:a	lent to api
      files:
          .calls:
              equals: |
                  ssh api command -v studio
                  studio credentials export session:a
                  ssh api env STUDIO_CREDENTIALS_BACKEND=file studio credentials import
          imported.json:
              equals: |
                  {"session:a":"stub-value-of-session:a"}
          .local/state/station/vms/api.json:
              equals: |
                  {
                    "image": "linux",
                    "lent": [
                      "session:a"
                    ],
                    "lifetime": "lasting",
                    "name": "api",
                    "version": "1"
                  }
    - command: 'secrets lend --to api'
      exit: 0
      stdout: |
          ●	session:a	lent to api
      files:
          .calls:
              equals: |
                  ssh api command -v studio
                  studio credentials export session:a
                  ssh api env STUDIO_CREDENTIALS_BACKEND=file studio credentials import
                  ssh api command -v studio
                  studio credentials export session:a
                  ssh api env STUDIO_CREDENTIALS_BACKEND=file studio credentials import
          .local/state/station/vms/api.json:
              equals: |
                  {
                    "image": "linux",
                    "lent": [
                      "session:a"
                    ],
                    "lifetime": "lasting",
                    "name": "api",
                    "version": "1"
                  }
