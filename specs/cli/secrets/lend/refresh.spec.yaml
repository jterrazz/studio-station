description: 'lending pipes the OS export into the VM import, never through argv, and lending again refreshes'
fixture:
    - ../__fixtures__/stubs/
    - ../__fixtures__/fleet/
runs:
    - command: 'secrets lend --to api | /usr/bin/sed -E ''s/until [0-9]{2}:[0-9]{2}/until HH:MM/''; /usr/bin/jq -c ''[.lent[]|[.name,((.until|fromdate)-(.at|fromdate))]]'' .local/state/station/vms/api.json'
      exit: 0
      stdout: |
          ●	session:a	lent to api · until HH:MM (12h)
          [["session:a",43200]]
      files:
          .calls:
              equals: |
                  ssh api command -v studio
                  studio credentials export session:a
                  ssh api env STUDIO_CREDENTIALS_BACKEND=file studio credentials import
          imported.json:
              equals: |
                  {"session:a":"stub-value-of-session:a"}
    - command: 'secrets lend --to api | /usr/bin/sed -E ''s/until [0-9]{2}:[0-9]{2}/until HH:MM/''; /usr/bin/jq -c ''[.lent[]|[.name,((.until|fromdate)-(.at|fromdate))]]'' .local/state/station/vms/api.json'
      exit: 0
      stdout: |
          ●	session:a	lent to api · until HH:MM (12h)
          [["session:a",43200]]
      files:
          .calls:
              equals: |
                  ssh api command -v studio
                  studio credentials export session:a
                  ssh api env STUDIO_CREDENTIALS_BACKEND=file studio credentials import
                  ssh api command -v studio
                  studio credentials export session:a
                  ssh api env STUDIO_CREDENTIALS_BACKEND=file studio credentials import
