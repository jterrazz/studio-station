description: 'lending pipes the OS export into the VM import, never through argv, and lending again refreshes'
fixture:
    - ../../../__fixtures__/vms/
    - ../../../__fixtures__/daemon-vm/
    - ../__fixtures__/stubs/
    - ../__fixtures__/fleet/
env: daemon
serve: sshd
runs:
    - command: '--version >/dev/null; engine-up; "$STATION" secrets lend --to api | /usr/bin/sed -E ''s/until [0-9]{2}:[0-9]{2}/until HH:MM/''; engine-down; /usr/bin/jq -c ''[.lent[]|[.name,((.until|fromdate)-(.at|fromdate))]]'' .local/state/station/vms/api.json; /usr/bin/grep -E "^(studio |vm-sshd exec (command|STUDIO))" .calls'
      exit: 0
      stdout: |
          ●	session:a	lent to api · until HH:MM (12h)
          [["session:a",43200]]
          vm-sshd exec command -v studio
          studio credentials export session:a
          vm-sshd exec STUDIO_CREDENTIALS_BACKEND=file studio credentials import
      files:
          imported.json:
              equals: |
                  {"session:a":"stub-value-of-session:a"}
    - command: '--version >/dev/null; engine-up; "$STATION" secrets lend --to api | /usr/bin/sed -E ''s/until [0-9]{2}:[0-9]{2}/until HH:MM/''; engine-down; /usr/bin/jq -c ''[.lent[]|[.name,((.until|fromdate)-(.at|fromdate))]]'' .local/state/station/vms/api.json; /usr/bin/grep -c -E "^(studio |vm-sshd exec (command|STUDIO))" .calls; /usr/bin/grep -c "stub-value" .calls daemon.log'
      exit: 1
      stdout: |
          ●	session:a	lent to api · until HH:MM (12h)
          [["session:a",43200]]
          6
          .calls:0
          daemon.log:0
