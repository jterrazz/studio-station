description: 'an old record reads each plain name as lent at its mtime for 12h; the next lend rewrites it'
fixture:
    - ../__fixtures__/stubs/
    - ../__fixtures__/fleet/
    - ../__fixtures__/lent-a/
runs:
    - command: 'secrets --json | /usr/bin/jq -c ''[.lent.api, (.lends.api|map([.name, ((.until|fromdate)-(.at|fromdate))]))]'''
      exit: 0
      stdout: |
          [["session:a"],[["session:a",43200]]]
    - command: 'secrets --json | /usr/bin/jq -r ''.lends.api[0].at'' > at.txt; /bin/date -u -r .local/state/station/vms/api.json +%Y-%m-%dT%H:%M:%SZ | /usr/bin/cmp - at.txt && echo "at is the mtime"'
      exit: 0
      stdout: |
          at is the mtime
    - command: 'secrets lend --to api > /dev/null; /usr/bin/jq -c ''.lent|map([.name, ((.until|fromdate)-(.at|fromdate))])'' .local/state/station/vms/api.json'
      exit: 0
      stdout: |
          [["session:a",43200]]
