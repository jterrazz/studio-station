description: 'a session name joins the lend list, once, in settings and in secrets --json'
fixture: ../__fixtures__/fleet/
runs:
    - command: 'secrets allow session:b'
      exit: 0
      stdout: |
          ●	session:b	on the lend list
    - command: 'secrets allow session:b'
      exit: 0
      stdout: |
          ●	session:b	on the lend list
    - command: 'secrets --json | /usr/bin/jq -c .lend_list'
      exit: 0
      stdout: |
          ["session:a","session:b"]
      files:
          .config/station/preferences.json:
              contains: '"session:b"'
