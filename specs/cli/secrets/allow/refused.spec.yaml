description: 'any other name is refused with exit 2, and a refusal changes nothing, even beside a good name'
fixture: ../__fixtures__/fleet/
runs:
    - command: 'secrets allow operator:x'
      exit: 2
      stderr: |
          Error: "operator:x" cannot be lent: only session:<id> names and operator:claude:oauth-token can
          Hint: other secrets wait for the secret manager (TODO.md)
    - command: 'secrets allow claude:oauth-token'
      exit: 2
      stderr: |
          Error: "claude:oauth-token" cannot be lent: only session:<id> names and operator:claude:oauth-token can
          Hint: other secrets wait for the secret manager (TODO.md)
    - command: 'secrets allow session:b grant:x'
      exit: 2
      stderr: |
          Error: "grant:x" cannot be lent: only session:<id> names and operator:claude:oauth-token can
          Hint: other secrets wait for the secret manager (TODO.md)
    - command: 'secrets allow session:'
      exit: 2
      stderr: |
          Error: "session:" cannot be lent: only session:<id> names and operator:claude:oauth-token can
          Hint: other secrets wait for the secret manager (TODO.md)
    - command: 'secrets --json | /usr/bin/jq -c .lend_list'
      exit: 0
      stdout: |
          ["session:a"]
