description: 'the Claude Code token name is the one operator name the lend list accepts'
fixture: ../__fixtures__/fleet/
runs:
    - command: 'secrets allow operator:claude:oauth-token'
      exit: 0
      stdout: |
          ●	operator:claude:oauth-token	on the lend list
    - command: 'secrets --json | /usr/bin/jq -c .lend_list'
      exit: 0
      stdout: |
          ["session:a","operator:claude:oauth-token"]
