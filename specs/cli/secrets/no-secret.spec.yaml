description: 'no output holds a kept value or a lent one, though the keychain and studio stubs hold them'
fixture:
    - ./__fixtures__/stubs/
    - ./__fixtures__/keychain/
    - ./__fixtures__/fleet-both/
    - ./__fixtures__/lent-a/
runs:
    - command: 'secrets --json | /usr/bin/jq -c .kept'
      exit: 0
      stdout: |
          ["vm-join-id","vm-join-secret","tailnet-authkey"]
    - command: 'secrets --json | /usr/bin/grep -c -e s3cr3t -e stub-value'
      exit: 1
      stdout: |
          0
    - command: 'secrets | /usr/bin/grep -c -e s3cr3t -e stub-value'
      exit: 1
      stdout: |
          0
