description: 'disallow --yes recalls the name from every VM holding it; an unlent name needs no confirm'
fixture:
    - ../../../__fixtures__/vms/
    - ../../../__fixtures__/engine-vm/
    - ../__fixtures__/stubs/
    - ../__fixtures__/fleet-both/
    - ../__fixtures__/lent-a/
env: engine
serve: sshd
runs:
    - command: '--version >/dev/null; engine-up; "$STATION" secrets disallow session:a --yes; engine-down; /usr/bin/jq -c .lent .local/state/station/vms/api.json; /usr/bin/grep "^vm-sshd exec STUDIO" .calls'
      exit: 0
      stdout: |
          ●	session:a	off the lend list
          ●	session:a	recalled from api
          null
          vm-sshd exec STUDIO_CREDENTIALS_BACKEND=file studio credentials delete session:a
    - command: 'secrets disallow operator:claude:oauth-token </dev/null'
      exit: 0
      stdout: |
          ●	operator:claude:oauth-token	off the lend list
    - command: 'secrets --json | /usr/bin/jq -c .lend_list'
      exit: 0
      stdout: |
          []
