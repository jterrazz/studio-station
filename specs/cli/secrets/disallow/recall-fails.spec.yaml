description: 'when a recall fails the name still leaves the lend list, exit 1, and the copy stays recorded'
fixture:
    - ../../../__fixtures__/vms/
    - ../../../__fixtures__/engine-vm/
    - ../__fixtures__/stubs/
    - ../__fixtures__/delete-fails/
    - ../__fixtures__/fleet/
    - ../__fixtures__/lent-a/
env: engine
serve: sshd
runs:
    - command: '--version >/dev/null; engine-up; "$STATION" secrets disallow session:a --yes; c=$?; engine-down; exit $c'
      exit: 1
      stdout: |
          ●	session:a	off the lend list
          ◐	recall	deleting the copies failed for "api": exit 1
      stderr: |
          Error: 1 of 1 recalls failed
          Hint: re-run it: station secrets recall --from <vm>
      files:
          .local/state/station/vms/api.json:
              contains: '"session:a"'
    - command: 'secrets --json | /usr/bin/jq -c .lend_list'
      exit: 0
      stdout: |
          []
