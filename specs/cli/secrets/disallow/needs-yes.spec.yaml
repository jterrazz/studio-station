description: 'disallowing a lent name refuses without --yes and changes nothing; an unlisted name is refused too'
fixture:
    - ../__fixtures__/stubs/
    - ../__fixtures__/fleet/
    - ../__fixtures__/lent-a/
runs:
    - command: 'secrets disallow session:a </dev/null'
      exit: 2
      stderr: |
          Error: refusing to disallow without --yes
          Hint: re-run with --yes
      files:
          .calls: absent
    - command: 'secrets disallow session:zz --yes'
      exit: 2
      stderr: |
          Error: "session:zz" is not on the lend list
          Hint: station secrets lists the lend list; station secrets allow session:zz adds it
    - command: 'secrets --json | /usr/bin/jq -c .lend_list'
      exit: 0
      stdout: |
          ["session:a"]
