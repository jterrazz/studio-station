description: 'a delete that fails in the VM exits 1 and the record keeps the name'
fixture:
    - ../__fixtures__/stubs/
    - ../__fixtures__/delete-fails/
    - ../__fixtures__/fleet/
    - ../__fixtures__/lent-a/
runs:
    - command: 'secrets recall --from api'
      exit: 1
      stderr: |
          Error: deleting the copies failed for "api": exit 1
          Hint: check the VM: station machines probe api
      files:
          .local/state/station/vms/api.json:
              contains: '"session:a"'
