description: 'a delete that fails in the VM exits 1 and the record keeps the name'
fixture:
    - ../../../__fixtures__/vms/
    - ../../../__fixtures__/daemon-vm/
    - ../__fixtures__/stubs/
    - ../__fixtures__/delete-fails/
    - ../__fixtures__/fleet/
    - ../__fixtures__/lent-a/
env: daemon
serve: sshd
runs:
    - command: '--version >/dev/null; engine-up; "$STATION" secrets recall --from api --yes; c=$?; engine-down; exit $c'
      exit: 1
      stderr: |
          Error: deleting the copies failed for "api": exit 1
          Hint: check the VM: station machines probe api
      files:
          .local/state/station/vms/api.json:
              contains: '"session:a"'
