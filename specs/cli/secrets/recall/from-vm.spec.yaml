description: 'recall deletes every name lent to the VM there and empties its record'
fixture:
    - ../../../__fixtures__/vms/
    - ../../../__fixtures__/engine-vm/
    - ../__fixtures__/stubs/
    - ../__fixtures__/fleet/
    - ../__fixtures__/lent-a/
env: engine
serve: sshd
runs:
    - command: '--version >/dev/null; engine-up; "$STATION" secrets recall --from api --yes; engine-down; /usr/bin/jq -c .lent .local/state/station/vms/api.json; /usr/bin/grep "^vm-sshd exec STUDIO" .calls'
      exit: 0
      stdout: |
          ●	session:a	recalled from api
          null
          vm-sshd exec STUDIO_CREDENTIALS_BACKEND=file studio credentials delete session:a
    - command: 'secrets recall --from api'
      exit: 0
      stdout: |
          	none
    - command: 'secrets recall'
      exit: 2
      stderr: |
          Error: recalling needs a source: --from <vm>
          Hint: station secrets recall --from <vm>
    - command: 'secrets recall --from mac-mini'
      exit: 2
      stderr: |
          Error: "mac-mini" is a host: secrets are lent to VMs only
          Hint: station machines lists the VMs
