description: 'recall deletes every name lent to the VM there and empties its record'
fixture:
    - ../__fixtures__/stubs/
    - ../__fixtures__/fleet/
    - ../__fixtures__/lent-a/
runs:
    - command: 'secrets recall --from api'
      exit: 0
      stdout: |
          ●	session:a	recalled from api
      files:
          .calls:
              equals: |
                  ssh api env STUDIO_CREDENTIALS_BACKEND=file studio credentials delete session:a
          .local/state/station/vms/api.json:
              equals: |
                  {
                    "image": "linux",
                    "lifetime": "lasting",
                    "name": "api",
                    "version": "1"
                  }
    - command: 'secrets recall --from api'
      exit: 0
      stdout: |
          	nothing to recall
    - command: 'secrets recall'
      exit: 2
      stderr: |
          Error: recalling needs a source: --from <vm>
          Hint: station secrets recall --from <vm>
    - command: 'secrets recall --from mac-mini'
      exit: 2
      stderr: |
          Error: "mac-mini" is a host: secrets are lent to VMs only
          Hint: station machines lists the VMs
