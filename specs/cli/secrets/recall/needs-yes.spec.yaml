description: 'taking back a lent copy piped without --yes is refused, exit 2, and the VM keeps its copy'
fixture:
    - ../../../__fixtures__/vms/
    - ../__fixtures__/stubs/
    - ../__fixtures__/fleet/
    - ../__fixtures__/lent-a/
runs:
    - command: 'secrets recall --from api </dev/null'
      exit: 2
      stderr: |
          Error: refusing to recall without --yes
          Hint: re-run with --yes
      files:
          .calls: absent
          .local/state/station/vms/api.json:
              contains: '"session:a"'
