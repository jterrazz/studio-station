description: 'recalling one name deletes only it, and rewrites a record of plain names with their term'
fixture:
    - ../../../__fixtures__/vms/
    - ../../../__fixtures__/daemon-vm/
    - ../__fixtures__/stubs/
    - ../__fixtures__/fleet-both/
    - ./__fixtures__/lent-both/
env: daemon
serve: sshd
runs:
    - command: '--version >/dev/null; engine-up; "$STATION" secrets recall --from api operator:claude:oauth-token; engine-down; /usr/bin/jq -c ''[.lent[]|[.name,((.until|fromdate)-(.at|fromdate))]]'' .local/state/station/vms/api.json; /usr/bin/grep "^vm-sshd exec STUDIO" .calls'
      exit: 0
      stdout: |
          ●	operator:claude:oauth-token	recalled from api
          [["session:a",43200]]
          vm-sshd exec STUDIO_CREDENTIALS_BACKEND=file studio credentials delete operator:claude:oauth-token
    - command: 'secrets recall --from api operator:claude:oauth-token'
      exit: 2
      stderr: |
          Error: "operator:claude:oauth-token" is not lent to "api"
          Hint: station secrets lists what was lent to which VM
