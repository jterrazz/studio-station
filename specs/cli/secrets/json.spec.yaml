description: 'secrets --json is station.secrets/v1: the lend list, who holds what, the kept account names'
fixture:
    - ./__fixtures__/stubs/
    - ./__fixtures__/fleet-both/
    - ./__fixtures__/lent-a/
runs:
    - command: 'secrets --json | /usr/bin/jq -r .schema'
      exit: 0
      stdout: |
          station.secrets/v1
    - command: 'secrets --json | /usr/bin/jq -c ''{lend_list, lent, kept}'''
      exit: 0
      stdout: |
          {"lend_list":["session:a","operator:claude:oauth-token"],"lent":{"api":["session:a"]},"kept":[]}
