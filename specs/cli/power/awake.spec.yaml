description: 'power awake holds one idle assertion through the daemon, and only --lid touches the clamshell'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/power/
env: engine
runs:
    - command: '--version > /dev/null; "$STATION" engine run 2> engine.log & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; : > .calls; "$STATION" power awake > /dev/null; /bin/cat .calls; "$STATION" power --json | /usr/bin/jq ''(.session.until|fromdate)-(.session.started_at|fromdate)''; "$STATION" power awake --lid --for 1h | /usr/bin/sed -E ''s/[0-9T:-]{19}Z/<until>/; s/[0-9]{2}:[0-9]{2}/HH:MM/''; /bin/cat .calls; "$STATION" power --json | /usr/bin/jq -c ''[.session.lid, .session.by, ((.session.until|fromdate)-(.session.started_at|fromdate) | . >= 3600 and . <= 3602)]''; kill $d; wait $d'
      exit: 0
      stdout: |
          power assert idle station: station power awake
          14400
          ●	awake	refreshed · until HH:MM (1h)
          power assert idle station: station power awake
          power clamshell disabled
          [true,"station power awake --lid --for 1h",true]
    - command: 'power awake --for 30h'
      exit: 2
      stderr: |
          Error: a Power session lasts at most 24h
          Hint: station power awake --for 24h
    - command: 'power awake --for 30s'
      exit: 2
      stderr: |
          Error: a Power session lasts at least 1m
          Hint: station power awake --for 1h
    - command: '--version > /dev/null; : > .calls; "$STATION" power awake --for 30h 2> /dev/null; "$STATION" power awake --for 30s 2> /dev/null; /usr/bin/wc -l < .calls | /usr/bin/tr -d " "'
      exit: 0
      stdout: |
          0
