description: 'tab 8 holds Power from its form, badges the header, and a guard''s end redraws it unasked'
fixture:
    - ../../__fixtures__/vms/
    - ../__fixtures__/power/
    - ../../__fixtures__/terminal/
env: terminal
runs:
    - command: '--version >/dev/null; "$STATION" daemon 2>/dev/null & d=$!; n=0; while [ ! -S .local/state/station/daemon.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; ( until [ "$(/usr/bin/grep -c ''power assert'' .calls 2> /dev/null)" = 2 ]; do /bin/sleep 0.2; done; /bin/sleep 1; echo 20 > power/battery; echo battery > power/source ) & w=$!; terminal --size 120x40 "$STATION" > /dev/null; c=$?; kill $w 2> /dev/null; kill $d; wait $d; exit $c'
      stdin: |
          see ? keys
          send 8
          see the Mac sleeps as macOS decides
          see a awake
          send a
          see Keep x awake
          see 4h
          send \r
          send \r
          send \r
          see awake until
          see started
          see host  ⏻ awake
          file .calls
          send s
          see ended the Power session
          send a
          see Keep x awake
          send \r
          send \r
          send \r
          see started
          within 10 see battery 20% on battery
          see 20% · on battery
          send q
      exit: 0
      files:
          .calls:
              contains:
                  - 'power assert idle station: station power awake'
                  - power release idle
