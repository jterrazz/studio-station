description: 'serious thermal pressure ends a session at once; heavy alone holds it and reads near'
fixture:
    - ../__fixtures__/vms/
    - ../__fixtures__/power/
env: daemon
runs:
    - command: '--version > /dev/null; "$STATION" daemon 2> daemon.log & d=$!; n=0; while [ ! -S .local/state/station/daemon.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" power awake > /dev/null; echo 2 > power/thermal; /bin/sleep 1; "$STATION" power | /usr/bin/grep -E "^(.	awake|.	thermal)" | /usr/bin/sed -E ''s/[0-9T:-]{19}Z/<until>/; s/[0-9]{2}:[0-9]{2}/HH:MM/''; echo 3 > power/thermal; /bin/sleep 1.5; "$STATION" power --json | /usr/bin/jq -c ''[.session, .last_end.reason, .last_end.detail]''; "$STATION" power awake; echo "exit $?"; kill $d; wait $d'
      exit: 0
      stdout: |
          ●	awake	on	<until>	station power awake
          ◐	thermal	heavy	the session ends at serious
          [null,"thermal","thermal trapping"]
          exit 1
      stderr: |
          Error: Power stays off: the Mac is under serious thermal pressure
          Hint: station power
