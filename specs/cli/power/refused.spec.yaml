description: 'a guard already past its threshold refuses the start, and nothing is asserted'
fixture:
    - ../../__fixtures__/vms/
    - ../__fixtures__/power/
env: engine
runs:
    - command: '--version > /dev/null; echo 18 > power/battery; echo battery > power/source; "$STATION" engine run 2> engine.log & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" power awake; echo "exit $?"; echo 80 > power/battery; echo 1 > power/lowpower; "$STATION" power awake; echo "exit $?"; /usr/bin/grep -c "power assert" .calls; kill $d; wait $d'
      exit: 0
      stdout: |
          exit 1
          exit 1
          0
      stderr: |
          Error: Power stays off: the battery is at 18% on battery
          Hint: station power
          Error: Power stays off: Low Power Mode is on
          Hint: station power
