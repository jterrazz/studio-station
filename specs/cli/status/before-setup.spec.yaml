description: 'while ~/.studio holds the old files, status shows a half-done setup and its repair'
fixture:
    - ../../__fixtures__/status-registered/
    - ./__fixtures__/studio-left/
runs:
    - command: 'overview | /usr/bin/grep -E ''^.	setup	'''
      exit: 0
      stdout: |
          ◐	setup	layout	station setup
    - command: 'status --json | /usr/bin/jq -c ''[.setup.state, (.setup.steps | map(.name + ":" + .state))]'''
      exit: 0
      stdout: |
          ["degraded",["name:ok","zshrc:ok","layout:degraded","tools:ok"]]
