description: 'status on a terminal fills in place then prints once, and asks brew and gh once'
fixture:
    - ../../__fixtures__/terminal/
    - ./__fixtures__/workspace/
    - ./__fixtures__/identity/
    - ../__fixtures__/recording/
    - ../__fixtures__/slow-gpg/
env: terminal
runs:
    - command: '--version >/dev/null; terminal --size 120x250 /usr/bin/env -u NO_COLOR COLUMNS=120 "$STATION" status --all | /usr/bin/grep -c "^ station status"'
      stdin: |
          within 1 see Machine
          within 1 see ◌ gpg key
          within 1 see ● git email
          see no answer in 2s
          gone ◌
          screen
      exit: 0
      stdout: |
          1
    - command: '--version >/dev/null; /usr/bin/grep -E "^(brew list --cask --versions|gh auth status)$" .calls | /usr/bin/sort | /usr/bin/uniq -c | /usr/bin/sed "s/^ *//"'
      exit: 0
      stdout: |
          1 brew list --cask --versions
          1 gh auth status
