description: 'status on a terminal lists each action with its fix, a job its removal, and a two-column Summary'
fixture:
    - ../../__fixtures__/terminal/
    - ../../__fixtures__/status-tools-mixed/
    - ../../__fixtures__/status-mac/
    - ../../__fixtures__/status-registered/
env: terminal
runs:
    - command: '--version >/dev/null; terminal --size 100x80 /usr/bin/env -u NO_COLOR COLUMNS=100 "$STATION" overview | /usr/bin/sed -e ''s|gui/[0-9]*/|gui/UID/|'''
      stdin: |
          scrollback
      exit: 0
      stdout: |4
           station status                                                                      macbook · host
           ──────────────────────────────────────────────────────────────────────────────────────────────────

           To do  6 ◐  1 ✗
             ✗ ai.jterrazz.y      failing · last exit 1
               → launchctl bootout gui/UID/ai.jterrazz.y && rm ~/Library/LaunchAgents/ai.jterrazz.y.plist
             ◐ brew               3 outdated  → station tools upgrade --via brew
             ◐ tools              3 on PATH, not managed by their method  → station tools
             ◐ macos              1 pending · softwareupdate -l
             ◐ backup-exclusions  tmutil not found
             ◐ ai.jterrazz.gone   orphan: its program is missing
               → launchctl bootout gui/UID/ai.jterrazz.gone &&
                 rm ~/Library/LaunchAgents/ai.jterrazz.gone.plist
             ◐ com.docker.vmnetd  orphan: Docker.app is gone
               → sudo launchctl bootout system/com.docker.vmnetd &&
                 sudo rm /Library/LaunchDaemons/com.docker.vmnetd.plist

