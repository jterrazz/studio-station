description: 'running OpenClaw and Hermes gateways are detected by process and read from their config'
fixture:
    - ./__fixtures__/processes/
    - ./__fixtures__/gateway/
    - ./__fixtures__/agents/
runs:
    - command: 'status --json | /usr/bin/jq -r ''.gateways | length'''
      exit: 0
      stdout: |
          7
    - command: 'status --json | /usr/bin/jq -r ''.gateways[] | [.name, .state, .value] | join("|")'''
      exit: 0
      stdout: |
          OpenClaw runtime|degraded|running
          OpenClaw config|ok|claude-opus
          OpenClaw Slack|ok|connected
          OpenClaw Telegram|degraded|check
          OpenClaw BlueBubbles|absent|not reported
          Hermes runtime|degraded|running
          Hermes config|ok|hermes-4
    - command: 'status --json | /usr/bin/jq -r ''.gateways[] | select(.name | endswith("runtime")) | .detail'''
      exit: 0
      stdout: |
          pid 4242 · user jterrazz.agent · port 18789 not listening
          pid 4343 · user jterrazz.agent · port 8642 not listening
    - command: 'status | /usr/bin/grep -c ''^# Gateways'''
      exit: 0
      stdout: |
          1
