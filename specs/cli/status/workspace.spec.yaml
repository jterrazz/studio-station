description: 'the workspace counts repositories, outdated dependencies, docker and caches'
fixture:
    - ./__fixtures__/workspace/
runs:
    - command: 'status --json | /usr/bin/jq -c ''.workspace.repositories | map([.path, .branch, .dirty])'''
      exit: 0
      stdout: |
          [["jterrazz/api","main",2],["jterrazz/web","feat/x",0],["other/tool","main",0]]
    - command: 'status --json | /usr/bin/jq -c ''.workspace.dependencies | map([.path, .manager, .outdated])'''
      exit: 0
      stdout: |
          [["jterrazz/api","go",1],["jterrazz/web","pnpm",2],["other/tool","npm",0]]
    - command: 'status --json | /usr/bin/jq -c ''.workspace.docker'''
      exit: 0
      stdout: |
          {"state":"ok","containers":2,"images":2,"volumes":1,"dangling_bytes":2000000,"total_bytes":3500000000}
    - command: 'status --json | /usr/bin/jq -c ''.workspace.disk | map([.name, .bytes])'''
      exit: 0
      stdout: |
          [["docker",3500000000],["homebrew",3000],["trash",500]]
    - command: 'status | /usr/bin/sed -n ''/^# Workspace/,/^# Identity/p'''
      exit: 0
      stdout: |
          # Workspace
          ●	repos	3	2 dirty
          ◐	deps	3 outdated	in 2 repos
          ●	docker	running	2 containers · 2 images
          ●	disk	3.5 GB	reclaimable: station clean
          # Identity
