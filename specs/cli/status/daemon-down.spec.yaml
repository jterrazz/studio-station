description: 'with tart and no answer the daemon is not installed, or stopped once its agent exists'
fixture: ../../__fixtures__/vms/
env: engine
runs:
    - command: 'status --json | /usr/bin/jq -c ''.station.daemon'''
      exit: 0
      stdout: |
          {"state":"degraded","running":false,"version":""}
    - command: 'status | /usr/bin/awk -F "\t" ''$2 == "engine"'''
      exit: 0
      stdout: |
          ◐	engine	not installed	station setup
    - command: '--version >/dev/null; /bin/mkdir -p Library/LaunchAgents; : >Library/LaunchAgents/com.jterrazz.station.engine.plist; "$STATION" status --json | /usr/bin/jq -c ''.station.daemon''; "$STATION" status | /usr/bin/awk -F "\t" ''$2 == "engine"'''
      exit: 0
      stdout: |
          {"state":"degraded","running":false,"version":""}
          ◐	engine	stopped	station engine start
    - command: '--version >/dev/null; /bin/rm bin/tart; "$STATION" status --json | /usr/bin/jq -c ''.station.daemon''; "$STATION" status | /usr/bin/awk -F "\t" ''$2 == "engine"'''
      exit: 0
      stdout: |
          {"state":"absent","running":false,"version":""}
          ○	engine	not needed until tart is installed
