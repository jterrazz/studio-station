description: 'a declared stray is a ◐ row of Workspace naming its tool and its repair; none, no row'
fixture: ./__fixtures__/strays/
runs:
    - command: 'overview </dev/null | /usr/bin/grep -e "^◐	go" -e "^◐	tart"'
      exit: 0
      stdout: |
          ◐	go	~/go	2 B · station disk move ~/go
          ◐	tart	~/.tart	2 B · station disk move ~/.tart
    - command: 'status --json | /usr/bin/jq -c ''.workspace.strays | map([.name, .path, .bytes > 0, .repair])'''
      exit: 0
      stdout: |
          [["go","~/go",true,"station disk move ~/go"],["tart","~/.tart",true,"station disk move ~/.tart"]]
    - command: '--version >/dev/null; /bin/rm -rf go .tart'
      exit: 0
    - command: 'status --json | /usr/bin/jq -c ''.workspace.strays'''
      exit: 0
      stdout: |
          []
