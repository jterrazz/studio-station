description: 'no status output holds a kept value or the Claude token the stubs hold'
fixture:
    - ./__fixtures__/keychain-and-studio/
    - ../../__fixtures__/status-registered/
runs:
    - command: 'status --json | /usr/bin/grep -c -e s3cr3t -e stub-value'
      exit: 1
      stdout: |
          0
    - command: 'overview | /usr/bin/grep -c -e s3cr3t -e stub-value'
      exit: 1
      stdout: |
          0
    - command: 'status --json | /usr/bin/jq -r ''.config[] | select(.name == "claude-token") | .state'''
      exit: 0
      stdout: |
          ok
