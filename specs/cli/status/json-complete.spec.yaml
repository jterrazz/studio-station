description: 'json and pipe wait for every probe, a late one answers ? and why, and none says pending'
fixture:
    - ./__fixtures__/workspace/
    - ./__fixtures__/identity/
    - ../__fixtures__/slow-gpg/
env: terminal
runs:
    - command: 'status --json | /usr/bin/jq -c ''.identity[] | select(.name == "gpg-key") | [.state, .value, .detail]'''
      timeout: 4000
      exit: 0
      stdout: |
          ["unknown","?","no answer in 2s"]
    - command: 'status | /usr/bin/grep "gpg key"'
      timeout: 4000
      exit: 0
      stdout: |
          ◐	gpg key	?	no answer in 2s
    - command: '--version >/dev/null; echo 1 > .gpg-sleep; "$STATION" status --json > out.json; /usr/bin/jq -c ''.identity[] | select(.name == "gpg-key") | [.state, .value]'' out.json; /usr/bin/jq -s length out.json; /usr/bin/grep -c pending out.json'
      exit: 1
      stdout: |
          ["ok","present"]
          1
          0
    - command: 'status | /usr/bin/grep -c "◌"'
      exit: 1
      stdout: |
          0
