description: 'an unregistered machine has a null name, nothing else is null, and its setup says what to run, once'
fixture: ./__fixtures__/mac/
env:
    - USER=tester
    - SHELL=/bin/zsh
runs:
    - command: 'status --json | /usr/bin/jq -c ''[paths(. == null) | map(tostring) | join(".")]'''
      exit: 0
      stdout: |
          ["machine.name"]
    - command: 'status --json | /usr/bin/jq -c ''[.setup.state, (.setup.steps[0] | [.name, .state, .detail])]'''
      exit: 0
      stdout: |
          ["absent",["name","absent","station setup --name <name>"]]
    - command: 'status | /usr/bin/head -4 | /usr/bin/cut -f1-3'
      exit: 0
      stdout: |
          # Machine
          ◐	name	unregistered
          ●	uptime	3d 4h
          ◐	setup	name
    - command: 'status --page | /usr/bin/jq -c ''[.sections[] | select(.id == "todo") | .items[].row.label | select(. == "name" or . == "setup")]'''
      exit: 0
      stdout: |
          ["setup"]
    - command: 'status | /usr/bin/grep -c -E ''host · Darwin 27.0.0 [a-z0-9_]+ · tester · zsh$'''
      exit: 0
      stdout: |
          1
