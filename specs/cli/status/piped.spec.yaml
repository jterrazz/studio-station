description: 'status without a terminal is tab-separated records, escape-free, with counts in glyph order'
fixture:
    - ./__fixtures__/tools-mixed/
runs:
    - command: 'status </dev/null | /usr/bin/head -1'
      exit: 0
      stdout: |
          # Machine	2 ◐	1 ○
    - command: 'status </dev/null | /usr/bin/grep -c "$(printf ''\033'')"'
      exit: 1
      stdout: |
          0
    - command: 'status | /usr/bin/grep -c -E ''^# Tools([[:space:]][0-9]+ (●|◐|○|✗))+$'''
      exit: 0
      stdout: |
          1
    - command: 'status | /usr/bin/grep ''^# Tools'' | /usr/bin/sed -E ''s/[0-9]+//g'' | /usr/bin/tr ''\t'' ''|'''
      exit: 0
      stdout: |
          # Tools| ●| ◐| ○
    - command: 'status | /usr/bin/grep -E ''^# (Machine|Environment|Workspace|Identity|Tools|Config)'' | /usr/bin/cut -f1'
      exit: 0
      stdout: |
          # Machine
          # Environment
          # Workspace
          # Identity
          # Tools
          # Config
