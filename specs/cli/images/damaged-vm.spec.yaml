description: 'a VM record that does not parse leaves the images listed, and counted as before'
fixture:
    - ./__fixtures__/stubs/
    - ./__fixtures__/recorded/
    - ./__fixtures__/damaged-vm/
runs:
    - command: 'images'
      exit: 0
      stdout: |
          ●	linux	2026.11.07	6.0 GB	1 VM	ghcr.io/cirruslabs/ubuntu:24.04
          ○	linux	2026.11.01	5.0 GB	0 VMs	older: station images delete linux@2026.11.01
