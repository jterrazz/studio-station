description: 'a --binary that does not exist is refused before the base is pulled'
fixture:
    - ../__fixtures__/stubs/
    - ./__fixtures__/build/
runs:
    - command: 'images build linux --binary $HOME/nowhere'
      exit: 2
      stderr: |
          Error: {{workdir}}/nowhere: no such file
          Hint: make build-linux, then station images build linux --binary .artifacts/go/station-linux-arm64
    - command: '--version > /dev/null; /usr/bin/grep -c ''^tart pull'' .calls'
      exit: 1
      stdout: |
          0
