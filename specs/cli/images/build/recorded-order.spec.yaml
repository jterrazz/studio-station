description: "a build copies station in, runs the recipe then the cleanup, waits for the poweroff, records"
fixture:
    - ../__fixtures__/stubs/
    - ./__fixtures__/build/
    - ./__fixtures__/served/
serve: sshd
runs:
    - command: 'images build linux --binary $HOME/station-linux'
      exit: 0
      stdout: |
          ●	linux	{{string}}	built
      files:
          .calls:
              contains:
                  - |-
                    tart pull ghcr.io/cirruslabs/ubuntu:24.04
                    tart clone ghcr.io/cirruslabs/ubuntu:24.04 station-build-linux
                    tart ip station-build-linux --wait 60
                  - "vm-sshd exec /bin/cat > '/tmp/station' && /bin/chmod 755 '/tmp/station'"
                  - "vm-sshd exec sudo env VM_USER='dev' IMAGE_KEY='ssh-ed25519 AAAAstub station-image' bash -s"
                  - 'vm-sshd exec sudo bash -s'
          .recipe.env:
              equals: |
                  VM_USER=dev
                  IMAGE_KEY=ssh-ed25519 AAAAstub station-image
          .recipe.stdin:
              contains:
                  - 'apt-get install -y libatomic1'
                  - 'station-intent.service'
                  - 'station-hostkeys.service'
          .cleanup.stdin:
              contains:
                  - 'pkill -KILL -u admin'
                  - 'userdel --remove admin'
                  - 'systemctl --no-block poweroff'
          .local/state/station/consoles/station-build-linux: absent
          .local/state/station/images/askpass: absent
          .runs:
              contains: 'tart run --no-graphics --no-audio --serial-path {{workdir}}/.local/state/station/consoles/station-build-linux station-build-linux'
    - command: '--version > /dev/null; /usr/bin/awk ''/^tart pull/{p=NR} /^tart clone/{c=NR} /^vm-sshd exec \/bin\/cat/{s=NR} /^vm-sshd exec sudo env/{a=NR} /^vm-sshd exec sudo bash -s$/{d=NR} /^tart stop/{t=NR} /^tart rename/{r=NR} END{print (p<c && c<s && s<a && a<d && d<t && t<r) ? "ordered" : "disordered"}'' .calls'
      exit: 0
      stdout: |
          ordered
    - command: '--version > /dev/null; /usr/bin/cmp vm/tmp/station station-linux && /bin/ls -l vm/tmp/station | /usr/bin/cut -c1-10'
      exit: 0
      stdout: |
          -rwxr-xr-x
    - command: '--version > /dev/null; /usr/bin/awk ''/^tart list/{n++} /^tart stop/{print n}'' .calls'
      exit: 0
      stdout: |
          3
    - command: '--version > /dev/null; /usr/bin/grep -c "^tart rename station-build-linux station-image-linux-$(/bin/date -u +%Y.%m.%d)$" .calls'
      exit: 0
      stdout: |
          1
    - command: '--version > /dev/null; /usr/bin/jq -r ''[.name, .base, (.recipe_sha | length)] | join(" ")'' .local/state/station/images/linux/$(/bin/date -u +%Y.%m.%d).json'
      exit: 0
      stdout: |
          linux ghcr.io/cirruslabs/ubuntu:24.04 64
