description: 'a bare build with the current recipe hash does nothing and never calls tart'
fixture:
    - ../__fixtures__/stubs/
    - ./__fixtures__/build/
    - ./__fixtures__/served/
serve: sshd
runs:
    - command: 'images build linux --binary $HOME/station-linux'
      exit: 0
      stdout: |
          ●	linux	{{string}}	built
    - command: 'images build'
      exit: 0
      stdout: |
          	none
    - command: '--version > /dev/null; /usr/bin/grep -c ''^tart pull'' .calls'
      exit: 0
      stdout: |
          1
