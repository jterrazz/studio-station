description: 'deleting an image piped without --yes is refused before tart is asked anything'
fixture:
    - ../__fixtures__/stubs/
    - ../__fixtures__/recorded/
runs:
    - command: 'images delete linux </dev/null'
      exit: 2
      stderr: |
          Error: refusing to delete without --yes
          Hint: re-run with --yes
    - command: '--version > /dev/null; /bin/test -e .calls || echo no tart call'
      exit: 0
      stdout: |
          no tart call
