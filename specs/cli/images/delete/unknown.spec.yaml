description: 'an unknown image and a version never built each name what is missing'
fixture:
    - ../__fixtures__/stubs/
    - ../__fixtures__/recorded/
runs:
    - command: 'images delete nope --yes'
      exit: 2
      stderr: |
          Error: unknown image "nope"
          Hint: the images are linux: station images build linux
    - command: 'images delete linux@1999.01.01 --yes'
      exit: 2
      stderr: |
          Error: image linux has no version 1999.01.01
          Hint: station images lists the versions
