description: 'start drops the stopped run''s guest session and answers once the new run''s guest connects'
fixture:
    - ../../../__fixtures__/vms/
    - ../../../__fixtures__/engine-vm/
env: engine
serve: sshd
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "42180-42199"}/'' .config/station/preferences.json; "$STATION" engine run 2>/dev/null & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --permanent --name api > /dev/null; "$STATION" machines stop api --yes > /dev/null; "$STATION" machines --json | /usr/bin/jq -r ".macs[0].vms[0] | [.state, .health.ssh] | @tsv"; echo 2 > vm/boot-seconds; "$STATION" machines start api > /dev/null; "$STATION" machines --json | /usr/bin/jq -r ".macs[0].vms[0] | [.state, .health.ssh] | @tsv"; [ "$(/usr/bin/grep -c "vm-sshd exec /usr/local/bin/station guest" .calls)" -ge 2 ] && echo "the new run has its own guest session"; "$STATION" machines stop api --yes > /dev/null; kill $d; wait $d'
      exit: 0
      stdout: |
          stopped	false
          running	true
          the new run has its own guest session
