description: 'start drops the stopped run''s guest session and answers once the new run''s guest connects'
fixture:
    - ../../../__fixtures__/vms/
    - ../../../__fixtures__/daemon-vm/
env: daemon
serve: sshd
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "42180-42199"}/'' .config/station/settings.json; "$STATION" daemon 2>/dev/null & d=$!; n=0; while [ ! -S .local/state/station/daemon.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --lifetime lasting --name api > /dev/null; "$STATION" machines stop api > /dev/null; "$STATION" machines --json | /usr/bin/jq -r ".hosts[0].vms[0] | [.state, .guest] | @tsv"; echo 2 > vm/boot-seconds; "$STATION" machines start api > /dev/null; "$STATION" machines --json | /usr/bin/jq -r ".hosts[0].vms[0] | [.state, .guest] | @tsv"; /usr/bin/grep -c "vm-sshd exec /usr/local/bin/station guest" .calls; "$STATION" machines stop api > /dev/null; kill $d; wait $d'
      exit: 0
      stdout: |
          stopped	absent
          running	connected
          2
