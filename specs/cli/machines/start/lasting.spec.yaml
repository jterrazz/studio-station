description: 'a lasting VM starts by enabling its agent, loading it when launchd does not hold it, and kicking it'
fixture:
    - ../../__fixtures__/vms/
    - ../__fixtures__/vm-api/
    - ./__fixtures__/joined-api/
runs:
    - command: 'machines start api'
      exit: 0
      stdout: |
          ●	api	started
      files:
          .calls:
              contains: |-
                  launchctl enable gui/{{int}}/com.jterrazz.station.vm.api
                  launchctl print gui/{{int}}/com.jterrazz.station.vm.api
                  launchctl bootstrap gui/{{int}} {{workdir}}/Library/LaunchAgents/com.jterrazz.station.vm.api.plist
                  launchctl kickstart gui/{{int}}/com.jterrazz.station.vm.api
