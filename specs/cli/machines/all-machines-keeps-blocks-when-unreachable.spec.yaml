description: 'an unreachable Mac leaves the blocks of its VMs alone: unknown is not gone'
fixture:
    - ../../__fixtures__/hosts-x-y/
    - ../../__fixtures__/machines-stubs/
    - ./__fixtures__/stale-blocks/
runs:
    - command: 'machines'
      exit: 0
      stdout: |
          ●	x	Mac	x	Online
          ✗	y	Mac	y	Unreachable
          # Needs you
          ✗	y	does not answer
      files:
          .ssh/config: { contains: '# >>> jterrazz machine gone >>>' }
