description: 'forgetting a host piped without --yes is refused, exit 2, and the host stays'
fixture: ../../../__fixtures__/hosts-x-y/
runs:
    - command: 'machines forget y </dev/null'
      exit: 2
      stderr: |
          Error: refusing to forget without --yes
          Hint: re-run with --yes
      files:
          .config/station/preferences.json: { contains: '"y"' }
