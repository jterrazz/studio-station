description: 'piped, every row has eight tab-separated fields and a VM row names its host'
fixture:
    - ./__fixtures__/hosts-x-y/
    - ./__fixtures__/stubs/
    - ./__fixtures__/fleet-y-answers/
    - ./__fixtures__/local-vm/
runs:
    - command: 'machines'
      exit: 0
      stdout: |
          ●	x	host			online	-	1 VM
          ✗	linux-1	linux	x	temporary	stale	-	station machines delete linux-1
          ●	y	host			online	100.64.0.2	1 VM
          ●	w	linux	y	lasting	running	-	4 cpus · 8 GB · 50.0 GB
    - command: 'machines | /usr/bin/awk -F''\t'' ''{ print NF }'' | /usr/bin/sort -u'
      exit: 0
      stdout: |
          8
    - command: 'machines | /usr/bin/awk -F''\t'' ''$3 != "host" && $4 == "" { n++ } END { print n + 0 }'''
      exit: 0
      stdout: |
          0
    - command: 'machines | /usr/bin/awk -F''\t'' ''$4 == "y"'' | /usr/bin/cut -f2'
      exit: 0
      stdout: |
          w
