description: 'unlock refuses this machine, an unknown one and a VM, exit 2'
fixture: ../__fixtures__/vm-record/
runs:
    - command: 'machines unlock x'
      exit: 2
      stderr: |
          Error: "x" is this machine
          Hint: pick another machine: run station machines for the fleet
    - command: 'machines unlock nope'
      exit: 2
      stderr: |
          Error: unknown machine "nope"
          Hint: run station machines for the fleet
    - command: 'machines unlock linux-1'
      exit: 2
      stderr: |
          Error: "linux-1" is a VM, not a host
          Hint: run station machines for the hosts
