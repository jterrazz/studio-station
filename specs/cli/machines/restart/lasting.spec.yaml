description: 'restart stops a lasting VM gracefully and the daemon runs it again'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/daemon-vm/
env: daemon
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "41320-41339"}/'' .config/station/settings.json; "$STATION" daemon & d=$!; n=0; while [ ! -S .local/state/station/daemon.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --lifetime lasting --name api > /dev/null; "$STATION" machines restart api --yes > /dev/null; echo "restart $?"; /usr/bin/grep -c "^sh -c" .calls; kill $d; wait $d'
      exit: 0
      stdout: |
          restart 0
          2
