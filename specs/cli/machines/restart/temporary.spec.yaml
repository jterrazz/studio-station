description: 'a temporary VM is not restarted from the host, whose poweroff would end it: its guest reboots it'
fixture:
    - ../../../__fixtures__/vms/
    - ../../__fixtures__/vm-t/
runs:
    - command: 'machines restart t --yes'
      exit: 2
      stderr: |
          Error: t is temporary: restarting it from the host would delete it
          Hint: ssh t sudo reboot
      files:
          .calls: absent
