description: 'restarting a host sends the FileVault authrestart, then waits for ssh to drop and to answer again'
fixture:
    - ../__fixtures__/hosts-x-y/
    - ../__fixtures__/stubs/
    - ../__fixtures__/down-then-up/
runs:
    - command: 'machines restart y --yes'
      exit: 0
      stdout: |
          ●	y	restarted
      files:
          .calls:
              equals: |
                  ssh -o ConnectTimeout=2 -o BatchMode=yes y sudo fdesetup authrestart -delayminutes 0
                  ssh -o ConnectTimeout=2 -o BatchMode=yes y true
                  ssh -o ConnectTimeout=2 -o BatchMode=yes y true
