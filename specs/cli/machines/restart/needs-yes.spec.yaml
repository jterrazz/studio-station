description: 'restarting a host piped without --yes is refused, exit 2, and nothing is reached'
fixture:
    - ../__fixtures__/hosts-x-y/
    - ../__fixtures__/stubs/
runs:
    - command: 'machines restart y </dev/null'
      exit: 2
      stderr: |
          Error: refusing to restart without --yes
          Hint: re-run with --yes
      files:
          .calls: absent
