description: 'a VM record on another host holds its name, even with its node offline'
fixture:
    - ../../../__fixtures__/vms/
    - ../../../__fixtures__/engine-vm/
    - ./__fixtures__/other-host/
env: engine
serve: sshd
runs:
    - command: '--version >/dev/null; "$STATION" engine run 2>/dev/null & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create | /usr/bin/tail -1 | /usr/bin/cut -f2; kill $d; wait $d'
      exit: 0
      stdout: |
          linux-2
