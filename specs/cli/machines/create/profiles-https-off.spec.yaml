description: 'with https off, the profiles export the tailnet URL with its http:// scheme'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/daemon-vm/
env: daemon
serve: sshd
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "42220-42239", "https": "off"}/'' .config/station/settings.json; "$STATION" daemon & d=$!; n=0; while [ ! -S .local/state/station/daemon.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --lifetime lasting --name api > /dev/null; /usr/bin/grep EXPO vm/.config/station/services.env; "$STATION" machines stop api > /dev/null; kill $d; wait $d'
      exit: 0
      stdout: |
          export EXPO_PACKAGER_PROXY_URL='http://macbook.tail1234.ts.net:42220'
