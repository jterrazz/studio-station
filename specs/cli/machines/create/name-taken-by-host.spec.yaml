description: 'a host''s name is held: the next VM takes the next integer; no tailnet is asked'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/daemon-vm/
env: daemon
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "41100-41119"}/'' .config/station/settings.json; /usr/bin/sed -i.bak ''s/"x": {}/"x": {}, "linux-1": {}/'' .config/station/settings.json; "$STATION" daemon & d=$!; n=0; while [ ! -S .local/state/station/daemon.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --lifetime temporary | /usr/bin/head -1 | /usr/bin/cut -f2; kill $d; wait $d'
      exit: 0
      stdout: |
          linux-2
