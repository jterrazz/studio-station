description: "an offline station node with no record frees its name; an untagged one keeps it"
fixture:
    - ../../__fixtures__/vms/
    - ./__fixtures__/leftover/
serve: tailscale
runs:
    - command: 'machines create --lifetime temporary | /usr/bin/cut -f2'
      exit: 0
      stdout: |
          linux-1
    - command: 'machines delete linux-1 --yes > /dev/null; /bin/cp answers/tailscale/untagged.json answers/tailscale/status.json; : > .joined'
      exit: 0
    - command: 'machines create --lifetime temporary | /usr/bin/cut -f2'
      exit: 0
      stdout: |
          linux-2
