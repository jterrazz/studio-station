description: 'a temporary VM: cloned, sized, run by the daemon, first boot over its guest, no tailnet, no dir'
fixture:
    - ../../../__fixtures__/vms/
    - ../../../__fixtures__/engine-vm/
env: engine
serve: sshd
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "41000-41019"}/'' .config/station/preferences.json; "$STATION" engine run 2>/dev/null & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --lifetime temporary; kill $d; wait $d'
      exit: 0
      stdout: |
          ●	linux-1	x	temporary	linux 2026.11.07	4 cpus · 8 GB
          ●	expo	8081	https://macbook.tail1234.ts.net:41000
          ●	vite	5173	https://macbook.tail1234.ts.net:41001
      files:
          .calls:
              contains:
                  - 'tart clone station-image-linux-2026.11.07 linux-1'
                  - 'tart set linux-1 --cpu 4 --memory 8192 --disk-size 50'
                  - 'vm-sshd exec sudo bash -s'
          .firstboot.stdin:
              contains:
                  - "hostnamectl set-hostname 'linux-1'"
                  - 'temporary VM: poweroff deletes it; reboot keeps it'
          Library/LaunchAgents/com.jterrazz.station.vm.linux-1.plist: absent
    - command: '--version >/dev/null; /usr/bin/awk ''/^tart clone/{c=NR} /^tart set/{s=NR} /^sh -c/{r=NR} /sudo bash -s$/{f=NR} END{print (c<s && s<r && r<f) ? "ordered" : "disordered"}'' .calls; /usr/bin/grep -c -E ''launchctl|tailscale up|--dir'' .calls .local/state/station/vms/linux-1.json .firstboot.stdin'
      exit: 1
      stdout: |
          ordered
          .calls:0
          .local/state/station/vms/linux-1.json:0
          .firstboot.stdin:0
