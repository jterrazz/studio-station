description: '--network bridged is for macOS VMs only; nat is the default and is recorded'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/daemon-vm/
env: daemon
serve: sshd
runs:
    - command: 'machines create --lifetime temporary --network bridged'
      exit: 2
      stderr: |
          Error: --network bridged is for macOS VMs
          Hint: it lets an iPhone on the Wi-Fi reach the VM; Linux VMs publish their services instead
      files:
          .calls: absent
    - command: 'machines create --lifetime temporary --network wifi'
      exit: 2
      stderr: |
          Error: unknown network "wifi": nat or bridged
          Hint: station machines create --network nat
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "41060-41079"}/'' .config/station/settings.json; "$STATION" daemon & d=$!; n=0; while [ ! -S .local/state/station/daemon.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --lifetime temporary --network nat --name n > /dev/null; /usr/bin/jq -r .network .local/state/station/vms/n.json; kill $d; wait $d'
      exit: 0
      stdout: |
          nat
