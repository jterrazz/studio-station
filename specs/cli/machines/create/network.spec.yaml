description: '--network bridged is for macOS VMs only; nat is the default and is recorded'
fixture:
    - ../../../__fixtures__/vms/
    - ../../../__fixtures__/engine-vm/
env: engine
serve: sshd
runs:
    - command: 'machines create --network bridged'
      exit: 2
      stderr: |
          Error: --network bridged is for macOS images: a linux workspace stays behind its Mac
          Hint: share its ports instead: station ports share
      files:
          .calls: absent
    - command: 'machines create --network wifi'
      exit: 2
      stderr: |
          Error: unknown network "wifi": nat or bridged
          Hint: station machines create, behind its Mac
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "41060-41079"}/'' .config/station/preferences.json; "$STATION" engine run 2>/dev/null & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --network nat --name n > /dev/null; /usr/bin/jq -r .network .local/state/station/vms/n.json; kill $d; wait $d'
      exit: 0
      stdout: |
          nat
