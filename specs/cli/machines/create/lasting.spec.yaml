description: 'a permanent workspace: its record wants it running on NAT, and the engine runs it'
fixture:
    - ../../../__fixtures__/vms/
    - ../../../__fixtures__/engine-vm/
env: engine
serve: sshd
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "41020-41039"}/'' .config/station/preferences.json; "$STATION" engine run 2>/dev/null & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --permanent --name api; kill $d; wait $d'
      exit: 0
      stdout: |
          ●	api	x	permanent	linux 2026.11.07	4 cpus · 4 GB
          ●	expo	8081	https://macbook.tail1234.ts.net:41020
          ●	vite	5173	https://macbook.tail1234.ts.net:41021
      files:
          .local/state/station/vms/api.json:
              contains:
                  - '"lifetime": "permanent"'
                  - '"want": "running"'
                  - '"network": "nat"'
          Library/LaunchAgents/com.jterrazz.station.vm.api.plist: absent
