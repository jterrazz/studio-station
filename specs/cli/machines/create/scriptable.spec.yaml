description: 'a script reads the new name from the second field, or the created document from --json'
fixture: ../../__fixtures__/vms/
serve: tailscale
runs:
    - command: 'machines create --lifetime temporary | /usr/bin/cut -f2'
      exit: 0
      stdout: |
          linux-1
    - command: 'machines create --lifetime temporary --json | /usr/bin/jq -r ''.schema, .name, .host, .lifetime, .version, .memory_bytes, .ip'''
      exit: 0
      stdout: |
          station.machines.created/v1
          linux-2
          x
          temporary
          2026.11.07
          8589934592
          100.64.0.42
