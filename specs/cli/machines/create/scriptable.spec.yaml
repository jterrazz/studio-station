description: 'a script reads the new name from the second field, or the created document from --json'
fixture:
    - ../../../__fixtures__/vms/
    - ../../../__fixtures__/engine-vm/
env: engine
serve: sshd
runs:
    - command: '--version >/dev/null; "$STATION" engine run 2>/dev/null & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create | /usr/bin/tail -1 | /usr/bin/cut -f2; kill $d; wait $d'
      exit: 0
      stdout: |
          linux-1
    - command: '--version >/dev/null; "$STATION" engine run 2>/dev/null & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --json | /usr/bin/jq -r ''.schema, .name, .host, .lifetime, .version, .memory_bytes, .ip''; kill $d; wait $d'
      exit: 0
      stdout: |
          station.machines.create-workspace/v1
          linux-2
          x
          throwaway
          2026.11.07
          4294967296
          127.0.0.1
