description: 'a refused mint creates nothing and points at the one-time admin action'
fixture:
    - ../../__fixtures__/vms/
    - ./__fixtures__/mint-refused/
serve: tailscale
runs:
    - command: 'machines create --lifetime temporary'
      exit: 1
      stderr: |
          Error: tailscale refused the VM-join request: requested tags are invalid or not permitted
          Hint: docs/reference/machines.md#vm-join
    - command: '--version > /dev/null; /usr/bin/grep -c "^tart clone" .calls'
      exit: 1
      stdout: |
          0
      files:
          .local/state/station/vms: absent
          Library: absent
