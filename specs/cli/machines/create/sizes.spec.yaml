description: "memory counts binary, disk decimal, a bare number is GB, an unknown unit is refused"
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/daemon-vm/
env: daemon
runs:
    - command: '--version >/dev/null; "$STATION" daemon & d=$!; n=0; while [ ! -S .local/state/station/daemon.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --lifetime temporary --memory 12G --disk 80G --cpus 2; kill $d; wait $d'
      exit: 0
      stdout: |
          ●	linux-1	x	temporary	linux 2026.11.07	2 cpus · 12 GB
          ●	expo	8081	→ https://macbook.tail1234.ts.net:40000
          ●	vite	5173	→ https://macbook.tail1234.ts.net:40001
      files:
          .calls: { contains: 'tart set linux-1 --cpu 2 --memory 12288 --disk-size 80' }
    - command: '--version >/dev/null; "$STATION" daemon & d=$!; n=0; while [ ! -S .local/state/station/daemon.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --lifetime temporary --memory 12 --name bare; kill $d; wait $d'
      exit: 0
      stdout: |
          ●	bare	x	temporary	linux 2026.11.07	4 cpus · 12 GB
          ●	expo	8081	→ https://macbook.tail1234.ts.net:40002
          ●	vite	5173	→ https://macbook.tail1234.ts.net:40003
      files:
          .calls: { contains: 'tart set bare --cpu 4 --memory 12288 --disk-size 50' }
    - command: '--version >/dev/null; "$STATION" daemon & d=$!; n=0; while [ ! -S .local/state/station/daemon.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --lifetime temporary --memory 512M --name half; kill $d; wait $d'
      exit: 0
      stdout: |
          ●	half	x	temporary	linux 2026.11.07	4 cpus · 0.5 GB
          ●	expo	8081	→ https://macbook.tail1234.ts.net:40004
          ●	vite	5173	→ https://macbook.tail1234.ts.net:40005
    - command: 'machines create --lifetime temporary --memory 12X'
      exit: 2
      stderr: |
          Error: --memory "12X" is not a size
          Hint: write a size with its unit: 512M, 8G, 1T
