description: 'machines --json is station.machines/v1: hosts holding their VMs, no top-level here'
fixture:
    - ./__fixtures__/hosts-x-y/
    - ./__fixtures__/stubs/
    - ./__fixtures__/fleet-y-answers/
    - ./__fixtures__/local-vm/
runs:
    - command: 'machines --json | /usr/bin/jq -r .schema'
      exit: 0
      stdout: |
          station.machines/v1
    - command: 'machines --json | /usr/bin/jq -r ''has("here") | tostring'''
      exit: 0
      stdout: |
          false
    - command: 'machines --json | /usr/bin/jq -r ''.hosts[0] | keys | join(" ")'''
      exit: 0
      stdout: |
          here name node reachable station_version user vms
    - command: 'machines --json | /usr/bin/jq -r ''[.hosts[].vms[] | .name + ":" + .lifetime + ":" + .state + ":" + .created_at] | join(" ")'''
      exit: 0
      stdout: |
          linux-1:temporary:stale:2026-11-07T10:00:00Z w:lasting:running:2026-11-07T10:00:00Z
    - command: 'machines --json | /usr/bin/jq -r ''.hosts[0].vms[0] | keys | join(" ")'''
      exit: 0
      stdout: |
          cpus created_at disk_bytes image kind lent lifetime memory_bytes name node state version
