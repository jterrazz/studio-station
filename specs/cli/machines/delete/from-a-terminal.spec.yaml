description: 'delete stops the run and removes the disk, the record, the files, the block and the leases'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/daemon-vm/
env: daemon
serve: sshd
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "41340-41359"}/'' .config/station/settings.json; "$STATION" daemon & d=$!; n=0; while [ ! -S .local/state/station/daemon.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" machines create --lifetime lasting --name api > /dev/null; "$STATION" machines delete api --yes; /bin/ls .local/state/station/vms; /usr/bin/jq -c ".leases" .local/state/station/leases.json; /usr/bin/grep -E "^tart delete|serve --https" .calls; /usr/bin/grep -c "Host api" .ssh/config; kill $d; wait $d'
      exit: 0
      stdout: |
          ●	api	deleted
          []
          tailscale serve --https=41340 off
          tailscale serve --https=41341 off
          tart delete api
          0
