description: 'with the daemon down delete acts directly and releases the leases and their serve entries'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/vm-api/
    - ../../__fixtures__/api-leases/
runs:
    - command: 'machines delete api --yes; /usr/bin/jq -c ".leases" .local/state/station/leases.json; /usr/bin/grep -E "^tart delete|serve --https" .calls'
      exit: 0
      stdout: |
          ●	api	deleted
          []
          tart delete api
          tailscale serve --https=40002 off
          tailscale serve --https=40000 off
