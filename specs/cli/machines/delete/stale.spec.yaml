description: 'a stale temporary VM is deleted by its verb: the VM goes from tart, with no tailnet call'
fixture:
    - ../../../__fixtures__/vms/
    - ../../__fixtures__/vm-t/
    - ../__fixtures__/stale-t/
runs:
    - command: 'machines delete t --confirm=t'
      exit: 0
      stdout: |
          ●	t	deleted
      files:
          .calls: { contains: 'tart delete t' }
          .local/state/station/vms/t.json: absent
          .tart-vms/t: absent
