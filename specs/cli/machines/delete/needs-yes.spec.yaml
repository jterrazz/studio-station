description: 'deleting a VM piped without --yes is refused, exit 2, and nothing is reached'
fixture:
    - ../../__fixtures__/vms/
    - ../__fixtures__/vm-api/
runs:
    - command: 'machines delete api </dev/null'
      exit: 2
      stderr: |
          Error: refusing to delete without --yes
          Hint: re-run with --yes
      files:
          .calls: absent
          .local/state/station/vms/api.json: exists
