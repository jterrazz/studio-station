description: 'machines pipe refuses before any byte: an unknown name, a host, --on, a VM'
fixture:
    - ../../__fixtures__/vms/
    - ../__fixtures__/local-vm/
env: daemon
runs:
    - command: 'machines pipe nope'
      exit: 2
      stdout: ''
      stderr: |
          Error: unknown machine "nope"
          Hint: run station machines for the fleet
    - command: 'machines pipe x'
      exit: 2
      stdout: ''
      stderr: |
          Error: "x" is a host, not a VM
          Hint: run station machines for the VMs
    - command: 'machines pipe linux-1 --on x'
      exit: 2
      stdout: ''
      stderr: |
          Error: --on does not apply to "machines pipe"
          Hint: run it on x itself: ssh x
    - command: '--version >/dev/null; STATION_MACHINE_KIND=linux "$STATION" machines pipe a'
      exit: 2
      stdout: ''
      stderr: |
          Error: this machine is a linux VM, and only a host does this
          Hint: run it on a host
