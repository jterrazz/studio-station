description: 'in userspace mode every block reaches its machine through the station daemon''s socket, and owns its host key'
fixture: ./__fixtures__/hosts-x-y/
runs:
    - command: 'machines'
      exit: 0
      stdout: |
          ●	x	host			online	-	0 VMs
          ◐	y	host			unreachable	-	-
      files:
          .ssh/config:
              equals: |
                  # >>> jterrazz machine y >>>
                  Host y
                    HostName y
                    User u
                    IdentityFile ~/.ssh/id_ed25519
                    ServerAliveInterval 30
                    ServerAliveCountMax 3
                    UserKnownHostsFile ~/.local/state/station/known_hosts/y
                    StrictHostKeyChecking accept-new
                    ProxyCommand tailscale --socket={{workdir}}/.local/state/station/tailscaled/tailscaled.sock nc %h %p
                  # <<< jterrazz machine y <<<
          .local/state/station/known_hosts: exists
