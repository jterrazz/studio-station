description: 'the gateway ports come from the environment, and the old port flags are gone'
fixture:
    - ../__fixtures__/hosts-x-y/
    - ../__fixtures__/stubs/
env:
    - OPENCLAW_GATEWAY_PORT=1234
    - API_SERVER_PORT=4321
runs:
    - command: 'machines probe y --json | /usr/bin/jq -r ''.checks[] | select(.name == "openclaw gateway" or .name == "hermes gateway") | .detail'' | /usr/bin/sed -E ''s/ (open|closed)$//'''
      exit: 0
      stdout: |
          port 1234
          port 4321
    - command: 'machines probe y --openclaw-port 1'
      exit: 2
      stderr: |
          Error: unknown flag: --openclaw-port
          Hint: run station machines probe --help
