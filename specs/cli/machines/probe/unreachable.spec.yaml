description: 'an unreachable machine is a finding in the rows, not a failure'
fixture:
    - ../__fixtures__/hosts-x-y/
    - ../__fixtures__/stubs/
    - ./__fixtures__/unreachable-y/
env:
    - OPENCLAW_GATEWAY_PORT=1
    - HERMES_GATEWAY_PORT=9
runs:
    - command: 'machines probe y'
      exit: 0
      stdout: |
          ✗	ping	127.0.0.1
          ✗	ssh	auth failed	or pre-boot: try station machines unlock y
          ✗	openclaw gateway	127.0.0.1	port 1 closed
          ✗	hermes gateway	127.0.0.1	port 9 closed
