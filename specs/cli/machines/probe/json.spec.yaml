description: 'probe --json is station.machines.probe/v1'
fixture:
    - ../__fixtures__/hosts-x-y/
    - ../__fixtures__/stubs/
env:
    - OPENCLAW_GATEWAY_PORT=1
    - HERMES_GATEWAY_PORT=9
runs:
    - command: 'machines probe y --json | /usr/bin/jq -r .schema'
      exit: 0
      stdout: |
          station.machines.probe/v1
    - command: 'machines probe y --json | /usr/bin/jq -r ''[.name, .user, .ip, .console] | join(" ")'''
      exit: 0
      stdout: |
          y u 127.0.0.1 owner
    - command: 'machines probe y --json | /usr/bin/jq -r ''.checks | map(.name + "=" + .state) | join(" ")'''
      exit: 0
      stdout: |
          ping=ok ssh=ok openclaw gateway=broken hermes gateway=broken console owner=ok
