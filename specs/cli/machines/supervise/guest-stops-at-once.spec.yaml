description: "a guest stopping four times in a minute without the intent is broken, never deleted"
fixture:
    - ../../__fixtures__/vms/
    - ./__fixtures__/vm-linux-1/
env: STATION_VM_AGENT=linux-1
runs:
    - command: 'machines supervise linux-1'
      exit: 1
      stderr: |
          Error: linux-1 stopped 4 times within 1m0s without a poweroff
          Hint: read its log: ~/.local/state/station/logs/linux-1.log
      files:
          .local/state/station/vms/linux-1.json: exists
    - command: '--version > /dev/null; /usr/bin/grep -c "^tart run" .calls; /usr/bin/grep -c "^tart delete" .calls'
      exit: 1
      stdout: |
          4
          0
