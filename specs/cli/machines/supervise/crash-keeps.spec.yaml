description: "a run ending in error deletes nothing, and the temporary VM shows stale"
fixture:
    - ../../__fixtures__/vms/
    - ./__fixtures__/vm-linux-1/
    - ./__fixtures__/runs-crash/
env: STATION_VM_AGENT=linux-1
runs:
    - command: 'machines supervise linux-1'
      exit: 1
      stderr: |
          Error: the run of linux-1 ended with exit 1: nothing was deleted
          Hint: read its log: ~/.local/state/station/logs/linux-1.log
      files:
          .local/state/station/vms/linux-1.json: exists
    - command: '--version > /dev/null; echo stopped > .tart-vms/linux-1; /usr/bin/grep -c "^tart delete" .calls'
      exit: 1
      stdout: |
          0
    - command: 'machines --here | /usr/bin/grep linux-1'
      exit: 0
      stdout: |
          ✗	linux-1	linux	x	temporary	stale	-	station machines delete linux-1
