description: "a declared poweroff leaves a lasting VM off and whole, the agent exiting 0"
fixture:
    - ../../__fixtures__/vms/
    - ./__fixtures__/lasting-linux-1/
    - ./__fixtures__/runs-poweroff/
env: STATION_VM_AGENT=linux-1
runs:
    - command: 'machines supervise linux-1'
      exit: 0
      files:
          .local/state/station/vms/linux-1.json: exists
          .api: absent
    - command: '--version > /dev/null; /usr/bin/grep -c -e "^tart delete" -e "^launchctl" .calls'
      exit: 1
      stdout: |
          0
