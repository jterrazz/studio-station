description: 'settings still holding the retired tailnet key write a Mac''s block with no ProxyCommand'
fixture:
    - ../../__fixtures__/hosts-x-y/
    - ./__fixtures__/retired-tailnet-key/
runs:
    - command: 'machines'
      exit: 0
      stdout: |
          ●	x	Mac	x	Online
          ✗	y	Mac	y	Unreachable
          # Needs you
          ✗	y	does not answer
      files:
          .ssh/config:
              equals: |
                  # >>> jterrazz machine y >>>
                  Host y
                    HostName y
                    User u
                    IdentityFile ~/.ssh/id_ed25519
                    ServerAliveInterval 30
                    ServerAliveCountMax 3
                    UserKnownHostsFile ~/.local/state/station/known_hosts/y
                    StrictHostKeyChecking accept-new
                  # <<< jterrazz machine y <<<
