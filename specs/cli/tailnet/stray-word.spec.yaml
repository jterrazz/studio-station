description: 'a stray word after the bare tailnet is refused, exit 2: one status only'
runs:
    - command: 'tailnet status'
      exit: 2
      stderr: |
          Error: unknown command "status" for "station tailnet"
          Hint: run station tailnet --help
    - command: 'tailnet login'
      exit: 2
      stderr: |
          Error: unknown command "login" for "station tailnet"
          Hint: run station tailnet --help
