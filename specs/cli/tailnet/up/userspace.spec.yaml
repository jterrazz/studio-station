description: 'up starts the userspace daemon, then connects with the keychain''s auth key on stdin, never --ssh'
fixture:
    - ./__fixtures__/authkey/
    - ../__fixtures__/stubs/
    - ./__fixtures__/authkey-in-keychain/
runs:
    - command: 'tailnet up'
      exit: 0
      stdout: |
          ●	tailnet	connected (userspace daemon)
          ◐	keep awake	not active
      files:
          .calls:
              equals: |
                  security find-generic-password -s station -a tailnet-authkey -w
                  tailscale --socket={{workdir}}/.local/state/station/tailscaled/tailscaled.sock status --json
                  tailscaled --tun=userspace-networking --state={{workdir}}/.local/state/station/tailscaled/tailscaled.state --socket={{workdir}}/.local/state/station/tailscaled/tailscaled.sock
                  tailscale --socket={{workdir}}/.local/state/station/tailscaled/tailscaled.sock status --json
                  tailscale --socket={{workdir}}/.local/state/station/tailscaled/tailscaled.sock up --hostname=x --auth-key=file:/dev/stdin
