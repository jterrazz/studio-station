description: 'a node that logged in before reconnects with no credential at all'
fixture:
    - ./__fixtures__/registered/
    - ../__fixtures__/stubs/
    - ../__fixtures__/running/
runs:
    - command: 'tailnet up </dev/null'
      exit: 0
      stdout: |
          ●	tailnet	connected (userspace daemon)
          ◐	keep awake	not active
      files:
          .calls:
              equals: |
                  tailscale --socket={{workdir}}/.local/state/station/tailscaled/tailscaled.sock status --json
                  tailscale --socket={{workdir}}/.local/state/station/tailscaled/tailscaled.sock up --hostname=x
