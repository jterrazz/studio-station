description: 'up piped with no login set up is refused before anything runs: the form needs a terminal'
fixture:
    - ../__fixtures__/login/
    - ../__fixtures__/stubs/
runs:
    - command: 'tailnet up </dev/null'
      exit: 2
      stderr: |
          Error: the tailnet login is not set up
          Hint: run it on a terminal: station tailnet up
      files:
          .calls: absent
