description: 'the App Store bundle''s executable answers first, run directly, even under launchd''s bare env'
fixture:
    - ../../__fixtures__/vms/
    - ../__fixtures__/tailscale-app-store/
env: daemon
runs:
    - command: 'tailnet --json | /usr/bin/jq -c ''[.variant, .cli]'''
      exit: 0
      stdout: |
          ["app-store","{{workdir}}/root/Applications/Tailscale.app/Contents/MacOS/Tailscale"]
      files:
          .calls:
              equals: |
                  tailscale-app-store status --json
                  tailscale-app-store serve status --json
    - command: 'tailnet | /usr/bin/grep -E ''^.	cli	'''
      exit: 0
      stdout: |
          ●	cli	{{workdir}}/root/Applications/Tailscale.app/Contents/MacOS/Tailscale	app-store
    - command: '--version >/dev/null; /usr/bin/env -u TERM -u TERM_PROGRAM -u SHLVL "$STATION" tailnet --json | /usr/bin/jq -c ''[.state, .connected, .variant]'''
      exit: 0
      stdout: |
          ["ok",true,"app-store"]
