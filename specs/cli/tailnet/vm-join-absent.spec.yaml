description: 'a host without the VM-join client says so, in the JSON and in the rows'
fixture:
    - ./__fixtures__/login/
    - ./__fixtures__/stubs/
    - ./__fixtures__/running/
runs:
    - command: 'tailnet --json | /usr/bin/jq -r .vm_join'
      exit: 0
      stdout: |
          absent
    - command: 'tailnet'
      exit: 0
      stdout: |
          ●	tailnet	Running (userspace daemon)
          ●	node	x	100.64.0.1
          ◐	keep awake	not active
          ●	login	userspace · login
          ○	VM join	not set up	docs/reference/machines.md#vm-join
          # Peers
          ●	w	100.64.0.9	tag:station-vm
          ○	y	100.64.0.2
