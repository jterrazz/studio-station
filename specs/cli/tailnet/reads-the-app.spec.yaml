description: 'tailnet reads the app and what it serves, and drives nothing'
fixture:
    - ../__fixtures__/vms/
    - ../__fixtures__/serving/
runs:
    - command: 'tailnet --json | /usr/bin/jq -c ''keys, [.serve[] | [.port, .station]]'''
      exit: 0
      stdout: |
          ["backend_state","cli","connected","dns_name","ip","name","peers","schema","serve","state","variant"]
          [[443,false],[40098,true],[40099,true]]
      files:
          .calls:
              equals: |
                  tailscale status --json
                  tailscale serve status --json
