description: 'no tailnet output holds a kept value or the Claude token, though the stubs hold them'
fixture:
    - ./__fixtures__/login/
    - ./__fixtures__/stubs/
    - ./__fixtures__/running/
    - ./__fixtures__/every-secret/
runs:
    - command: 'tailnet --json | /usr/bin/grep -c -e s3cr3t -e stub-value'
      exit: 1
      stdout: |
          0
    - command: 'tailnet | /usr/bin/grep -c -e s3cr3t -e stub-value'
      exit: 1
      stdout: |
          0
    - command: 'tailnet --json | /usr/bin/jq -r .vm_join'
      exit: 0
      stdout: |
          unknown
