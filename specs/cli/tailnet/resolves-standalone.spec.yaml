description: 'the Standalone app''s CLI answers before the one on PATH'
fixture:
    - ../../__fixtures__/vms/
    - ../__fixtures__/tailscale-standalone/
runs:
    - command: 'tailnet --json | /usr/bin/jq -c ''[.variant, .cli]'''
      exit: 0
      stdout: |
          ["standalone","{{workdir}}/root/usr/local/bin/tailscale"]
      files:
          .calls:
              equals: |
                  tailscale-standalone status --json
                  tailscale-standalone serve status --json
