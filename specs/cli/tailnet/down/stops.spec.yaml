description: 'down disconnects the userspace daemon through its own socket'
fixture:
    - ../__fixtures__/login/
    - ../__fixtures__/stubs/
    - ../__fixtures__/running/
runs:
    - command: 'tailnet down'
      exit: 0
      stdout: |
          ●	tailnet	disconnected (userspace daemon)
      files:
          .calls:
              equals: |
                  tailscale --socket={{workdir}}/.local/state/station/tailscaled/tailscaled.sock status --json
                  tailscale --socket={{workdir}}/.local/state/station/tailscaled/tailscaled.sock down
