description: 'a tailnet with no daemon is a state, absent, and the exit stays 0'
fixture: ./__fixtures__/login/
runs:
    - command: 'tailnet --json | /usr/bin/jq -r ''[.state, .daemon, .connected, .vm_join] | map(tostring) | join(" ")'''
      exit: 0
      stdout: |
          absent userspace false unknown
    - command: 'tailnet'
      exit: 0
      stdout: |
          ○	tailnet	userspace daemon is not running	station tailnet up
          ●	login	userspace · login
          ◐	VM join	not verified
