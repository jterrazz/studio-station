description: 'tailnet --json is station.tailnet/v1: the daemon, the node, the peers, and never a secret'
fixture:
    - ./__fixtures__/login/
    - ./__fixtures__/stubs/
    - ./__fixtures__/running/
runs:
    - command: 'tailnet --json | /usr/bin/jq -r .schema'
      exit: 0
      stdout: |
          station.tailnet/v1
    - command: 'tailnet --json | /usr/bin/jq -r ''[.daemon, .state, .backend_state, .name, .ip, .mode, .auth_method] | join(" ")'''
      exit: 0
      stdout: |
          userspace ok Running x 100.64.0.1 userspace login
    - command: 'tailnet --json | /usr/bin/jq -r ''.peers | map(.name + ":" + (.online | tostring) + ":" + (.tags | join(","))) | join(" ")'''
      exit: 0
      stdout: |
          w:true:tag:station-vm y:false:
    - command: 'tailnet --json | /usr/bin/jq -r ''keys | join(" ")'''
      exit: 0
      stdout: |
          auth_method backend_state connected daemon ip keep_awake mode name peers schema state vm_join
