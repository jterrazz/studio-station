description: 'a Linux VM lists docker with its own sizing and no host row; go reads its linux cache path'
fixture:
    - ./__fixtures__/docker/
    - ./__fixtures__/go/
env:
    - STATION_MACHINE_KIND=linux
runs:
    - command: 'storage --json | /usr/bin/jq -c ''[.rows[].name | select(. == "docker" or . == "tart" or . == "xcode" or . == "homebrew")]'''
      exit: 0
      stdout: |
          ["docker"]
    - command: 'storage --json | /usr/bin/jq -c ''.rows[] | select(.name == "docker") | .cache_bytes'''
      exit: 0
      stdout: |
          1800000000
    - command: 'storage --json | /usr/bin/jq -r ''.rows[] | select(.name == "go") | .paths[] | select(.level == "cache") | .path'''
      exit: 0
      stdout: |
          ~/.cache/go-build
          ~/.cache/go/mod
