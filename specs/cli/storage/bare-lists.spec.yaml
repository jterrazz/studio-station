description: 'bare storage lists every row by level, station first, and acts on nothing'
fixture: ./__fixtures__/go/
runs:
    - command: '--version >/dev/null; /bin/mkdir -p Library/Caches/go-build .cache/go/mod .local/share/go/bin .local/state/station/vms .local/state/station/images && /bin/dd if=/dev/zero of=Library/Caches/go-build/a bs=1048576 count=3 2>/dev/null && /bin/dd if=/dev/zero of=.cache/go/mod/m bs=1048576 count=1 2>/dev/null && /bin/dd if=/dev/zero of=.local/share/go/bin/t bs=1048576 count=1 2>/dev/null && echo "{}" > .local/state/station/vms/a.json && echo key > .local/state/station/images/key'
      exit: 0
    - command: 'storage </dev/null | /usr/bin/grep -n -e "^# " -e "go" -e "station" | /usr/bin/head -4'
      exit: 0
      stdout: |
          1:# Station
          2:●	station	0 B	kept 7 B
          3:# Runtimes
          4:●	go	4.2 MB	data 1.0 MB
    - command: 'storage </dev/null > /dev/null'
      exit: 0
      files:
          .calls: absent
          Library/Caches/go-build/a: exists
