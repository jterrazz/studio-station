description: 'storage on a terminal draws every existing row at once, sizes each as the walk answers, and a probe past its budget answers ?; piped, one document after the budget'
fixture:
    - ../__fixtures__/terminal/
    - ./__fixtures__/slow-docker/
    - ./__fixtures__/go/
env: terminal
runs:
    - command: '--version >/dev/null; /bin/mkdir -p .cache/go-build && echo x > .cache/go-build/a'
      exit: 0
    - command: '--version >/dev/null; terminal --size 120x80 /usr/bin/env -u NO_COLOR COLUMNS=120 STATION_MACHINE_KIND=linux "$STATION" storage | /usr/bin/grep -c "^ station storage"'
      stdin: |
          within 1 see ● station
          within 1 see ◌ docker
          see not sized within
          gone ◌
          screen
      exit: 0
      stdout: |
          1
    - command: '--version >/dev/null; STATION_MACHINE_KIND=linux "$STATION" storage > out.txt; /usr/bin/grep -c "◌" out.txt; /usr/bin/grep "^●	docker" out.txt'
      exit: 0
      stdout: |
          0
          ●	docker	?	not sized within 10 s
