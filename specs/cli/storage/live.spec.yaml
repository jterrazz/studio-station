description: 'storage on a terminal fills in place, a late size says ?, and last-known sizes are kept'
fixture:
    - ../__fixtures__/terminal/
    - ./__fixtures__/slow-docker/
    - ./__fixtures__/go/
env: terminal
runs:
    - command: '--version >/dev/null; /bin/mkdir -p .cache/go-build && echo x > .cache/go-build/a'
      exit: 0
    - command: '--version >/dev/null; terminal --size 120x80 /usr/bin/env -u NO_COLOR COLUMNS=120 STATION_MACHINE_KIND=linux "$STATION" storage | /usr/bin/grep -c "^ station storage"'
      stdin: |
          within 1 see ● station
          within 1 see ◌ docker
          see not sized within
          gone ◌
          screen
      exit: 0
      stdout: |
          1
    - command: '--version >/dev/null; STATION_MACHINE_KIND=linux "$STATION" storage > out.txt; /usr/bin/grep -c "◌" out.txt; /usr/bin/grep "^●	docker" out.txt'
      exit: 0
      stdout: |
          0
          ●	docker	?	not sized within 10 s
    - command: '--version >/dev/null; /usr/bin/jq -r --arg h "$HOME" ''.v, (.sizes[$h + "/.cache/go-build"].bytes)'' .cache/station/sizes.json'
      exit: 0
      stdout: |
          1
          2
    - command: '--version >/dev/null; echo yy > .cache/go-build/b; STATION_MACHINE_KIND=linux "$STATION" storage --json | /usr/bin/jq ''.rows[] | select(.name == "go") | .cache_bytes'''
      exit: 0
      stdout: |
          5
    - command: '--version >/dev/null; STATION_MACHINE_KIND=linux "$STATION" storage clean station > /dev/null; /bin/ls -A .cache/station'
      exit: 0
