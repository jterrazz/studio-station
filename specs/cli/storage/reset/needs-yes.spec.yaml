description: 'reset off a terminal refuses without --yes, exit 2, and runs nothing'
fixture: ./__fixtures__/pgrep-idle/
runs:
    - command: '--version >/dev/null; /bin/mkdir -p "Library/Application Support/Zed/db" && echo x > "Library/Application Support/Zed/db/x"'
      exit: 0
    - command: 'storage reset zed </dev/null'
      exit: 2
      stderr: |
          Error: refusing to reset without --yes
          Hint: re-run with --yes
      files:
          .calls: absent
          Library/Application Support/Zed/db/x: exists
