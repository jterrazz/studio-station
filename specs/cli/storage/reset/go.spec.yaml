description: 'reset go takes what go install and the checksum database left under GOPATH, and leaves the config'
fixture: ../__fixtures__/go/
runs:
    - command: '--version >/dev/null; /bin/mkdir -p .local/share/go/bin .local/share/go/pkg/sumdb/sum.golang.org .config/go && echo x > .local/share/go/bin/gopls && echo x > .local/share/go/pkg/sumdb/sum.golang.org/latest && echo GOPATH=x > .config/go/env'
      exit: 0
    - command: 'storage reset go --yes >/dev/null'
      exit: 0
      files:
          .local/share/go/bin/gopls: absent
          .local/share/go/pkg/sumdb: absent
          .config/go/env: exists
