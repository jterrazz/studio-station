description: 'storage on a terminal fills a sized row and its mark while a hung tool holds the inventory'
fixture:
    - ../__fixtures__/terminal/
    - ./__fixtures__/hung-docker/
    - ./__fixtures__/go/
env: terminal
runs:
    - command: '--version >/dev/null; /bin/mkdir -p .cache/go-build && /usr/bin/head -c 3000000 /dev/zero > .cache/go-build/a'
      exit: 0
    - command: '--version >/dev/null; terminal --size 120x80 /usr/bin/env -u NO_COLOR COLUMNS=120 STATION_MACHINE_KIND=linux "$STATION" storage > /dev/null'
      stdin: |
          within 1 see ● go  3.0 MB
      exit: 0
