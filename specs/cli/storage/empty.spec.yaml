description: 'on an empty HOME storage holds the station row only, and no stray'
runs:
    - command: 'storage --json | /usr/bin/jq -c ''[[.rows[].name], .strays]'''
      exit: 0
      stdout: |
          [["station"],[]]
    - command: 'storage </dev/null'
      exit: 0
      stdout: |
          # Station
          ●	station	0 B
