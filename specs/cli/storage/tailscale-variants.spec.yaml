description: 'the tailscale row sizes both variants'' containers and the wrapper, cleans and resets none'
fixture:
    - ../__fixtures__/tailscale-app-store/
env: daemon
runs:
    - command: '--version >/dev/null; /bin/mkdir -p Library/Containers/io.tailscale.ipn.macos Library/Containers/io.tailscale.ipn.macsys "Library/Group Containers/W5364U7YZB.group.io.tailscale.ipn.macos" "Library/Group Containers/group.W5364U7YZB.io.tailscale.shared" .local/bin && /bin/dd if=/dev/zero of=Library/Containers/io.tailscale.ipn.macos/x bs=1048576 count=1 2>/dev/null && /bin/dd if=/dev/zero of=Library/Containers/io.tailscale.ipn.macsys/y bs=1048576 count=1 2>/dev/null && echo z > "Library/Group Containers/W5364U7YZB.group.io.tailscale.ipn.macos/z" && echo w > "Library/Group Containers/group.W5364U7YZB.io.tailscale.shared/w" && printf "#!/bin/sh\nexec x \"\$@\"\n" > .local/bin/tailscale'
      exit: 0
    - command: 'storage --json | /usr/bin/jq -c ''.rows[] | select(.name == "tailscale") | [.kept_bytes >= 2097152, .clean, .reset, .installed, .installed_bytes > 0]'''
      exit: 0
      stdout: |
          [true,false,false,true,true]
    - command: 'storage --json | /usr/bin/jq -r ''.rows[] | select(.name == "tailscale") | .paths[] | .level + " " + .path'''
      exit: 0
      stdout: |
          kept ~/Library/Containers/io.tailscale.ipn.macos*
          kept ~/Library/Containers/io.tailscale.ipn.macsys*
          kept ~/Library/Containers/Tailscale
          kept ~/Library/Group Containers/*io.tailscale.ipn.macos
          kept ~/Library/Group Containers/*io.tailscale.ipn.macsys
          kept ~/Library/Group Containers/group.*.io.tailscale.shared
          kept ~/Library/Application Scripts/*io.tailscale.*
    - command: 'storage clean tailscale'
      exit: 2
      stderr: |
          Error: tailscale has no cache station can clean
          Hint: station storage
    - command: '--version >/dev/null; /usr/bin/find Library .local -type f | LC_ALL=C /usr/bin/sort'
      exit: 0
      stdout: |
          .local/bin/tailscale
          Library/Containers/io.tailscale.ipn.macos/x
          Library/Containers/io.tailscale.ipn.macsys/y
          Library/Group Containers/W5364U7YZB.group.io.tailscale.ipn.macos/z
          Library/Group Containers/group.W5364U7YZB.io.tailscale.shared/w
    - command: 'storage reset tailscale --yes'
      exit: 2
      stderr: |
          Error: tailscale has no data station can reset
          Hint: nothing to reset: the login is the Tailscale app's
