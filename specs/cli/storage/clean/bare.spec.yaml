description: 'bare clean empties every installed row''s caches with the official commands, asking nothing'
fixture:
    - ../../__fixtures__/system-tools/
    - ../__fixtures__/go/
    - ./__fixtures__/node/
runs:
    - command: '--version >/dev/null; /bin/mkdir -p Library/Caches/com.github.cirruslabs.tart .cache/npm/_npx/x && echo db > Library/Caches/com.github.cirruslabs.tart/Cache.db && echo x > .cache/npm/_npx/x/f'
      exit: 0
    - command: 'storage clean </dev/null | /usr/bin/grep -v -E "	(ghostty|zed|cursor|android-studio|xcode|discord|notion|obsidian|claude-desktop|orbstack|herdr-app|ollama|tailscale|lens)	"'
      exit: 0
      stdout: |
          ●	station	0 B freed
          ●	homebrew	0 B freed
          ●	mise	0 B freed
          ●	go	0 B freed
          ●	node	2 B freed
          ●	tart	3 B freed
      files:
          .calls:
              contains:
                  - 'go clean -cache -modcache'
                  - 'brew cleanup --prune=all'
                  - 'tart prune --entries=caches --older-than=0'
                  - 'npm cache clean --force'
          Library/Caches/com.github.cirruslabs.tart/Cache.db: absent
          .cache/npm/_npx/x: absent
    - command: '--version >/dev/null; /usr/bin/grep "^tart prune" .calls'
      exit: 0
      stdout: |
          tart prune --entries=caches --older-than=0
