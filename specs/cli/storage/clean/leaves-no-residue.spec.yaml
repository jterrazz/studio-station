description: 'clean empties every Linux cache, what tools write back and bun''s files in npm''s folder included'
fixture: ./__fixtures__/residue/
env:
    - STATION_MACHINE_KIND=linux
runs:
    - command: '--version >/dev/null; /bin/mkdir -p .cache && cd .cache && /bin/mkdir -p go-build/ab mise npm/_cacache npm/.bunx-1002/cowsay@1.6.0 sigstore-rust/tuf gopls/9aa7cf61 goimports && for f in go-build/ab/x mise/old npm/_cacache/x npm/11a2e1aa83860bd7.npm npm/.bunx-1002/cowsay@1.6.0/f sigstore-rust/tuf/root.json gopls/9aa7cf61/f goimports/f; do echo x > $f; done'
      exit: 0
    - command: 'storage clean </dev/null >/dev/null'
      exit: 0
    - command: 'storage --json | /usr/bin/jq -r ''.rows[].paths[] | select(.level == "cache" and .bytes > 0) | .path'''
      exit: 0
      stdout: ''
