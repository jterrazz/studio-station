description: 'a named clean refuses an unknown, uncleanable or misplaced tool and --yes, before acting'
fixture: ../__fixtures__/go/
runs:
    - command: 'storage clean nope'
      exit: 2
      stderr: |
          Error: no storage row named "nope"
          Hint: station storage
    - command: 'storage clean gpg'
      exit: 2
      stderr: |
          Error: gpg has no cache station can clean
          Hint: station storage
    - command: 'storage clean docker'
      exit: 2
      stderr: |
          Error: docker's place is linux; here is a host
          Hint: station storage
    - command: 'storage clean --yes'
      exit: 2
      stderr: |
          Error: unknown flag: --yes
          Hint: run station storage clean --help
      files:
          .calls: absent
