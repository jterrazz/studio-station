description: 'clean never touches a kept or a config file'
fixture:
    - ../../__fixtures__/system-tools/
    - ../__fixtures__/go/
    - ./__fixtures__/kept/
runs:
    - command: 'storage clean'
      exit: 0
      stdout: |
          ●	station	0 B freed
          ●	homebrew	0 B freed
          ●	mise	0 B freed
          ●	go	0 B freed
          ●	tart	0 B freed
      files:
          .local/state/station/vms/a.json: { equals: "{\"lifetime\":\"lasting\"}\n" }
          .local/state/station/images/key: { equals: "a private key\n" }
          .local/state/station/leases.json: { equals: "{\"schema\":\"station.leases/v1\",\"leases\":[]}\n" }
          .local/state/station/known_hosts/x: { equals: "x ssh-ed25519 AAAA\n" }
          .config/gh/hosts.yml: { equals: "github.com:\n    user: jterrazz\n" }
          .npmrc: { equals: "registry=https://r.example/\n" }
          .ssh/config: { equals: "Host x\n    User u\n" }
