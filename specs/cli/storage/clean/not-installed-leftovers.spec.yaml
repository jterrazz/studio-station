description: 'a tool not installed still has its leftovers deleted by path, so the repair status names works'
fixture:
    - ./__fixtures__/relocated/
    - ./__fixtures__/strays/
runs:
    - command: 'overview </dev/null | /usr/bin/grep "^◐	go"'
      exit: 0
      stdout: |
          ◐	go	~/go	2 B · station storage clean go
    - command: 'storage clean go'
      exit: 0
      stdout: |
          ●	go	2 B freed
      files:
          go: absent
          .npm/_cacache/x: exists
          .calls: absent
    - command: 'status --json | /usr/bin/jq -c ''.workspace.strays | map(.name)'''
      exit: 0
      stdout: |
          ["node"]
    - command: 'storage clean'
      exit: 0
      stdout: |
          ●	station	0 B freed
          ●	node	4 B freed
      files:
          .npm: absent
          .calls: absent
    - command: 'status --json | /usr/bin/jq -c ''.workspace.strays'''
      exit: 0
      stdout: |
          []
    - command: 'storage clean go'
      exit: 0
      stdout: |
          ○	go	not installed
