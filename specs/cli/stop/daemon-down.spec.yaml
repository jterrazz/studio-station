description: 'with the daemon down, stop ends the VMs whose run outlived it, then boots the agent out'
fixture:
    - ../__fixtures__/vms/
    - ../__fixtures__/launchctl/
env: daemon
runs:
    - command: '--version > /dev/null; /bin/mkdir -p Library/LaunchAgents .local/state/station/vms .local/state/station/runs; : > Library/LaunchAgents/com.jterrazz.station.daemon.plist; printf ''{"name":"api","image":"linux","version":"2026.11.07","lifetime":"lasting"}\n'' > .local/state/station/vms/api.json; s=$(/bin/sh -c ''/bin/sleep 9 > /dev/null 2>&1 & echo $!''); echo $s > .local/state/station/runs/api.pid; : > launchctl.loaded; "$STATION" stop; echo "exit $?"; "$STATION" stop --yes; echo "exit $?"; /bin/kill $s 2> /dev/null; /usr/bin/grep -E "^(ssh|tart|launchctl bootout)" .calls | /usr/bin/sed -E ''s/gui\/[0-9]+/gui\/U/''; /usr/bin/jq -r .want .local/state/station/vms/api.json'
      exit: 0
      stdout: |
          exit 2
          ●	api	stopped (lasting, disk kept)
          ●	daemon	stopped · com.jterrazz.station.daemon booted out
          exit 0
          tart list --source local --format json
          launchctl bootout gui/U/com.jterrazz.station.daemon
          stopped
      stderr: |
          Error: station stop stops api
          Hint: station stop --yes
