description: 'stop on a terminal asks first, No by default: enter declines, exits 1 and stops nothing'
fixture:
    - ../__fixtures__/vms/
    - ../__fixtures__/daemon-vm/
    - ../__fixtures__/launchctl/
    - ../__fixtures__/terminal/
env: terminal
serve: sshd
runs:
    - command: '--version > /dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "41620-41639"}/'' .config/station/settings.json; /bin/mkdir -p Library/LaunchAgents; : > Library/LaunchAgents/com.jterrazz.station.daemon.plist; "$STATION" start > /dev/null; "$STATION" machines create --lifetime temporary --name linux-1 > /dev/null; terminal --size 100x30 "$STATION" stop; echo "exit $?"; /usr/bin/grep -cE "^(tart delete|launchctl bootout)" .calls; "$STATION" machines --json | /usr/bin/jq -r ''.hosts[0].vms[0].state''; "$STATION" stop --yes > /dev/null'
      stdin: |
          see Stop everything on
          see linux-1 (temporary) will be deleted
          see the daemon stays stopped until station start or the next login
          send \r
      exit: 0
      stdout: |
          exit 1
          0
          running
