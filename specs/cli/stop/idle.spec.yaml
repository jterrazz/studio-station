description: 'stop with nothing running asks nothing; again, it is already stopped'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/launchctl/
env: engine
runs:
    - command: '--version > /dev/null; /bin/mkdir -p Library/LaunchAgents; : > Library/LaunchAgents/com.jterrazz.station.engine.plist; "$STATION" start > /dev/null; "$STATION" stop; /bin/kill -0 "$(/bin/cat engine.pid)" 2> /dev/null || echo gone; "$STATION" stop; /usr/bin/grep -c "^launchctl bootout gui/[0-9]*/com.jterrazz.station.engine$" .calls; "$STATION" machines create --lifetime temporary'
      exit: 1
      stdout: |
          ●	engine	stopped · com.jterrazz.station.engine booted out
          gone
          ●	engine	already stopped
          1
      stderr: |
          Error: the engine is stopped on x
          Hint: station engine start
    - command: 'stop --on mac-mini'
      exit: 2
      stderr: |
          Error: station stop acts on this host only
          Hint: ssh mac-mini station stop
    - command: '--version > /dev/null; STATION_MACHINE_KIND=linux "$STATION" stop'
      exit: 2
      stderr: |
          Error: station stop runs on a host; here is a VM
          Hint: ssh <host> station stop
