description: 'stop with nothing running asks nothing; again, it is already stopped'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/launchctl/
env: daemon
runs:
    - command: '--version > /dev/null; /bin/mkdir -p Library/LaunchAgents; : > Library/LaunchAgents/com.jterrazz.station.daemon.plist; "$STATION" start > /dev/null; "$STATION" stop; /bin/kill -0 "$(/bin/cat daemon.pid)" 2> /dev/null || echo gone; "$STATION" stop; /usr/bin/grep -c "^launchctl bootout gui/[0-9]*/com.jterrazz.station.daemon$" .calls; "$STATION" machines create --lifetime temporary'
      exit: 1
      stdout: |
          ●	daemon	stopped · com.jterrazz.station.daemon booted out
          gone
          ●	daemon	already stopped
          1
      stderr: |
          Error: the station daemon is stopped on x
          Hint: station start
    - command: 'stop --on mac-mini'
      exit: 2
      stderr: |
          Error: station stop acts on this host only
          Hint: ssh mac-mini station stop
    - command: '--version > /dev/null; STATION_MACHINE_KIND=linux "$STATION" stop'
      exit: 2
      stderr: |
          Error: station stop runs on a host; here is a VM
          Hint: ssh <host> station stop
