description: help lists the visible commands in their groups, and none of the hidden or deleted ones
runs:
    - command: help > help.txt
      exit: 0
      files:
          help.txt:
              contains:
                  - '  HERE'
                  - '  THE FLEET'
                  - '  SHORTCUTS'
                  - '  THE BINARY'
                  - '    status '
                  - '    tools '
                  - '    config '
                  - '    storage '
                  - '    machines '
                  - '    images '
                  - '    secrets '
                  - '    services '
                  - '    tailnet '
                  - '    run '
                  - '    setup '
                  - '    help '
    - command: --help | /usr/bin/grep -cE '^    (skills|clean|shell|completion|man|install|upgrade|remote|machine|vms|hosts|supervise|daemon|guest|pipe)( |$)'
      exit: 1
      stdout: |
          0
    - command: --help | /usr/bin/sed -n '/^  THE FLEET/,/^  SHORTCUTS/p' | /usr/bin/grep -oE '^    [a-z]+ ' | /usr/bin/tr -d ' '
      exit: 0
      stdout: |
          accounts
          images
          machines
          secrets
          services
          start
          stop
          tailnet
    - command: services --help | /usr/bin/sed -n '/^  COMMANDS/,/^  FLAGS/p' | /usr/bin/grep -oE '^    [a-z]+ ' | /usr/bin/tr -d ' '
      exit: 0
      stdout: |
          release
          url
    - command: tailnet --help | /usr/bin/grep -c 'COMMANDS'
      exit: 1
      stdout: |
          0
    - command: --help | /usr/bin/grep -ciwE 'role|server|self|address|identity|remove|init'
      exit: 1
      stdout: |
          0
    - command: --help | /usr/bin/grep -c -e '--on '
      exit: 0
      stdout: |
          1
    - command: --help | /usr/bin/sed -n '/^  HERE/,/^  THE FLEET/p' | /usr/bin/grep -oE '^    (status|tools|config|storage) ' | /usr/bin/tr -d ' '
      exit: 0
      stdout: |
          config
          status
          storage
          tools
    - command: status --help | /usr/bin/grep -ciwE 'role|server|self|address|identity|remove|init'
      exit: 1
      stdout: |
          0
    - command: tools --help | /usr/bin/grep -ciwE 'role|server|self|address|identity|remove|init'
      exit: 1
      stdout: |
          0
    - command: config --help | /usr/bin/grep -ciwE 'role|server|self|address|identity|remove|init'
      exit: 1
      stdout: |
          0
    - command: storage --help | /usr/bin/grep -ciwE 'role|server|self|address|identity|remove|init'
      exit: 1
      stdout: |
          0
    - command: machines --help | /usr/bin/grep -ciwE 'role|server|self|address|identity|remove|init'
      exit: 1
      stdout: |
          0
    - command: images --help | /usr/bin/grep -ciwE 'role|server|self|address|identity|remove|init'
      exit: 1
      stdout: |
          0
    - command: secrets --help | /usr/bin/grep -ciwE 'role|server|self|address|identity|remove|init'
      exit: 1
      stdout: |
          0
    - command: tailnet --help | /usr/bin/grep -ciwE 'role|server|self|address|identity|remove|init'
      exit: 1
      stdout: |
          0
    - command: run --help | /usr/bin/grep -ciwE 'role|server|self|address|identity|remove|init'
      exit: 1
      stdout: |
          0
    - command: setup --help | /usr/bin/grep -ciwE 'role|server|self|address|identity|remove|init'
      exit: 1
      stdout: |
          0
    - command: 'accounts >/dev/null 2>&1; echo "accounts $?"; "$STATION" power >/dev/null 2>&1; echo "power $?"; "$STATION" --help | /usr/bin/grep -cE ''^    (accounts|power) '''
      exit: 1
      stdout: |
          accounts 0
          power 127
          0
      stderr: |
          /bin/sh: : command not found
