description: 'the filter takes every key but esc and enter: q1i filters Tools and neither quits nor moves the tab'
fixture:
    - ../../__fixtures__/terminal/
    - ./__fixtures__/homebrew/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION"'
      stdin: |
          see Machine
          send 2
          see - Not installed
          send /q1i
          see / q1i
          gone - Not installed
          send \x1b
          gone / q1i
          see - Not installed
          send q
      exit: 0
