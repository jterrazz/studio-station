description: 'the footer ends with ? keys, and ? opens the tab''s keys grouped This tab, List, Global'
fixture:
    - ../__fixtures__/terminal/
    - ./__fixtures__/homebrew/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION"'
      stdin: |
          see Machine
          send 2
          see + Runtimes
          see ? keys
          send ?
          see This tab
          see i  install
          see 1-7  tab
          send x
          gone This tab
          see + Runtimes
          send q
      exit: 0
