description: 'the Config tab draws its items at once and fills each as its check answers'
fixture:
    - ../__fixtures__/terminal/
    - ../__fixtures__/slow-tmutil/
env: terminal
runs:
    - command: '--version >/dev/null; terminal --size 120x80 "$STATION"'
      stdin: |
          within 1 see Machine
          send 3
          within 1 see ◌ backup-exclusions
          within 1 see + Terminal
          send q
      exit: 0
