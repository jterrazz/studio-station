description: 'bare station on a terminal opens the TUI on Home with six tabs, and q leaves it, exit 0'
fixture:
    - ../__fixtures__/terminal/
    - ./__fixtures__/homebrew/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION"'
      stdin: |
          see station  Home · Tools · Config · Storage │ Fleet · Services
          see Machine
          see ? keys
          send q
      exit: 0
    - command: '--version >/dev/null; terminal --size 0x0 "$STATION"'
      stdin: |
          see station  Home · Tools · Config · Storage │ Fleet · Services
          send q
      exit: 0
