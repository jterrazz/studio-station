description: 'each Fleet key binds its rows: a VM delete asks, restarting this Mac is refused before any question'
fixture:
    - ../../__fixtures__/vms/
    - ../__fixtures__/vm-t/
    - ../../__fixtures__/terminal/
    - ./__fixtures__/homebrew/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION"'
      stdin: |
          see Machine
          send 5
          see - Images
          see └─ ● t
          send \x1b[B
          send \x1b[B
          send d
          see Delete t?
          send n
          gone Delete t?
          send \x1b[A
          send \x12
          see ✗ "x" is this mac
          send q
      exit: 0
    - command: '--version > /dev/null; /usr/bin/grep -c -E ''^(tart (stop|delete|run)|ssh) '' .calls'
      exit: 1
      stdout: |
          0
