description: 'the Fleet tab hints: d on a host says forget, s on a temporary VM says delete, ctrl+r wants the name'
fixture:
    - ../__fixtures__/vms/
    - ../__fixtures__/vm-t/
    - ../__fixtures__/terminal/
    - ./__fixtures__/homebrew/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION"'
      stdin: |
          see Machine
          send 5
          see - Images
          send \x1b[B
          send d
          see forget: f
          send \x1b[B
          send s
          see temporary: delete with d
          send \x1b[A
          send \x12
          see Restart x?
          screen
          send \x1b
          gone Restart x?
          send q
      exit: 0
      stdout: |4
           station   Status · Tools · Config · Storage │ Fleet                   x · host
           ──────────────────────────────────────────────────────────────────────────────
           - x                                                                   1 ●  1 ◐
             ◐ x        host                                                     online …
             ● t        linux                              x          temporary  running…
           - Services                                                                 1 ◐
             ◐ daemon                                                 x          not run…
           - Images                                                                   1 ●
             ● linux    2026.11.07                         20.0 GB    1 VM
           - Secrets
               none
               none
           - Tailnet                                                                  2 ●
             ● tailnet  Running · macbook.tail1234.ts.net
             ● node     x                                  192.0.2.1


           ┌────────────────────────────────────────────────────────────┐
           │ ┃ Restart x?                                               │
           │ ┃ type x to confirm                                        │
           │ ┃ >                                                        │
           └────────────────────────────────────────────────────────────┘

           ↑↓ move · space fold · n create · enter open · s start/stop · ? more
    - command: '--version > /dev/null; /usr/bin/grep -c -E ''^(tart (stop|delete|run)|ssh) '' .calls'
      exit: 1
      stdout: |
          0
