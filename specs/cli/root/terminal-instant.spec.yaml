description: 'the TUI draws every row of every tab at once and fills each as its probe answers, the active tab first; a late probe says why; one reading per run; q leaves nothing running'
fixture:
    - ../__fixtures__/terminal/
    - ./__fixtures__/homebrew/
    - ../status/__fixtures__/identity/
    - ../status/__fixtures__/slow-gpg/
    - ../status/__fixtures__/recording-gh/
env: terminal
runs:
    - command: '--version >/dev/null; terminal --size 120x80 "$STATION"'
      stdin: |
          within 1 see Machine
          within 1 see ◌ gpg key
          within 2 see ● github
          send 4
          within 1 see - Station
          within 1 see ● station
          send 1
          see ◌ gpg key
          see no answer in 2s
          send 2
          see - Runtimes
          send 5
          within 1 see Fleet
          send q
      exit: 0
    - command: '--version >/dev/null; /usr/bin/grep -E "^(brew list --cask --versions|gh auth status)$" .calls | /usr/bin/sort | /usr/bin/uniq -c | /usr/bin/sed "s/^ *//"; /bin/kill -0 "$(/bin/cat .gpg-pid)" 2>/dev/null || echo gone'
      exit: 0
      stdout: |
          1 brew list --cask --versions
          1 gh auth status
          gone
