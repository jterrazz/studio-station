description: 'the Services tab holds the Tailscale line, each Mac''s range, and stops sharing another Mac''s port'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/terminal/
    - ./__fixtures__/fleet-services/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION"'
      stdin: |
          see Machine
          send 6
          see 40000-40099
          screen
          send \x1b[B
          send \x1b[B
          send \x1b[B
          send \x1b[B
          send \x1b[B
          send x
          within 30 see Stop sharing w:3000?
          send y
          within 30 see not shared
          send q
      exit: 0
      stdout: |4
           station  Home · Tools · Config · Storage │ Fleet · Services · Accounts · 8   x
           ──────────────────────────────────────────────────────────────────────────────
           - Tailscale                                                                1 ●
             ● Tailscale  signed in · macbook.tail1234.ts.net · ports are shared
           - x  40000-40999 · 0 reserved · 1000 free · 20 per VM                      1 ◐
                       state
             ◐ engine  the engine is not installed  → station setup
           - y  40000-40099 · 1 reserved · 99 free · 20 per VM                        1 ●
                          port  url                              state   process
             ● w  3000 → 40000  https://y.tail1234.ts.net:40000  shared  node













           ↑↓ move  enter detail  / filter  space fold  r reload  q quit  ? keys
    - command: '--version > /dev/null; /usr/bin/grep -o ''y -- sh -c .* station engine attach'' .calls | /usr/bin/sort -u'
      exit: 0
      stdout: |
          y -- sh -c 'PATH="$HOME/.local/bin:/usr/local/bin:$PATH" exec station "$@"' station engine attach
