description: 'the Fleet tab''s Services are the fleet''s: every host''s range, another host''s service'
fixture:
    - ../__fixtures__/vms/
    - ../__fixtures__/terminal/
    - ./__fixtures__/fleet-services/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION"'
      stdin: |
          see Machine
          send 5
          see - Images
          screen
          send \x1b[B
          send \x1b[B
          send \x1b[B
          send \x1b[B
          send \x1b[B
          send \x1b[B
          send \x1b[B
          send x
          see released
          send q
      exit: 0
      stdout: |4
           station   Status · Tools · Config · Storage │ Fleet                   x · host
           ──────────────────────────────────────────────────────────────────────────────
           - x                                                                        1 ◐
             ◐ x        host                                                            …
           - y                                                                        1 ◐
             ◐ y        host                                                            …
           - Services · x  40000-40999 · 0 leased · 1000 free · 20 per VM             1 ◐
             ◐ daemon                                                                   …
           - Services · y  40000-40099 · 1 leased · 99 free · 20 per VM               1 ●
             ● w        3000                               https://y.tail1234.ts.net:400…
           - Images                                                                   1 ●
             ● linux    2026.11.07                         20.0 GB                      …
           - Secrets
               none
               none
           - Tailnet                                                                  2 ●
             ● tailnet  Running · macbook.tail1234.ts.net
             ● node     x                                  192.0.2.1





           ↑↓ move · space fold · n create · enter open · s start/stop · ? more
    - command: '--version > /dev/null; /usr/bin/grep -o ''y -- sh -c .* station services release w:3000 --yes'' .calls'
      exit: 0
      stdout: |
          y -- sh -c 'PATH="$HOME/.local/bin:/usr/local/bin:$PATH" exec station "$@"' station services release w:3000 --yes
