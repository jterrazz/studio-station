description: 'the Services tab is the fleet''s: every host''s range, another host''s service'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/terminal/
    - ./__fixtures__/fleet-services/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION"'
      stdin: |
          see Machine
          send 6
          see 40000-40099
          screen
          send \x1b[B
          send \x1b[B
          send \x1b[B
          send x
          see released
          send q
      exit: 0
      stdout: |4
           station  Home · Tools · Config · Storage │ Fleet · Services · Accounts · 8   x
           ──────────────────────────────────────────────────────────────────────────────
           - x  40000-40999 · 0 leased · 1000 free · 20 per VM                        1 ◐
                       state
             ◐ daemon  not installed  → station setup
           - y  40000-40099 · 1 leased · 99 free · 20 per VM                          1 ●
                          port  url                              state      process
             ● w  3000 → 40000  https://y.tail1234.ts.net:40000  published  node















           ↑↓ move  enter detail  / filter  space fold  r reload  q quit  ? keys
    - command: '--version > /dev/null; /usr/bin/grep -o ''y -- sh -c .* station services release w:3000.*'' .calls'
      exit: 0
      stdout: |
          y -- sh -c 'PATH="$HOME/.local/bin:/usr/local/bin:$PATH" exec station "$@"' station services release w:3000
