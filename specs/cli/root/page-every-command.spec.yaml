description: 'every read answers --page with station.page/v1, its page id, ready and titled sections'
fixture:
    - ../__fixtures__/estate/
runs:
    - command: 'overview --page | /usr/bin/jq -r ''[.schema, .id, .state, all(.sections[]; .title != "")] | @tsv'''
      exit: 0
      stdout: |
          station.page/v1	home	ready	true
    - command: 'overview --all --page | /usr/bin/jq -r ''[.schema, .id, .state, all(.sections[]; .title != "")] | @tsv'''
      exit: 0
      stdout: |
