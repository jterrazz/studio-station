description: 'install asks nothing (its call confirms nothing), runs brew off the TUI, the status bar names it'
fixture:
    - ../../__fixtures__/terminal/
    - ./__fixtures__/homebrew/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION"'
      stdin: |
          see Machine
          send 2
          see + Runtimes
          send /bat\r
          see ○ bat
          send \x1b[B
          send i
          see ● installed bat
          see ● bat  1.0
          screen
          send \x1b[A
          gone ● installed bat
          send q
      exit: 0
      stdout: |4
           station  Home · Tools · Config · Storage │ Fleet · Services · 7 · 8       host
           ──────────────────────────────────────────────────────────────────────────────
           / bat
           - CLI Tools                                                           1 ●  9 ○
             ● bat  1.0  brew

















           ● installed bat
           ↑↓ move  i install  u uninstall  U upgrade  enter detail  / filter  ? keys
      files:
          .calls:
              contains:
                  - |-
                    brew bundle install --no-upgrade --file=-
                    brew "bat"
    - command: '--version > /dev/null; /usr/bin/grep -c ''bundle'' .calls'
      exit: 0
      stdout: |
          1
