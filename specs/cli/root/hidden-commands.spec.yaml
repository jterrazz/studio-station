description: the hidden plumbing still answers, completion zsh and the man page, and no help lists it
runs:
    - command: completion zsh > completion.zsh
      exit: 0
      files:
          completion.zsh:
              contains: 'compdef _station station'
    - command: man > station.1
      exit: 0
      files:
          station.1:
              contains: '.TH STATION 1'
    - command: machines --help | /usr/bin/sed -n '/^  COMMANDS/,/^  FLAGS/p' | /usr/bin/grep -oE '^    [a-z]+ ' | /usr/bin/tr -d ' '
      exit: 0
      stdout: |
          add
          create
          delete
          forget
          probe
          restart
          start
          stop
          unlock
    - command: machines --help | /usr/bin/grep -cwE 'supervise|pipe'
      exit: 1
      stdout: |
          0
    - command: --help | /usr/bin/grep -cwE 'daemon|guest'
      exit: 1
      stdout: |
          0
