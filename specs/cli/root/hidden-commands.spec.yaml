description: the hidden plumbing still answers, completion zsh and the man page
runs:
    - command: completion zsh > completion.zsh
      exit: 0
      files:
          completion.zsh:
              contains: 'compdef _station station'
    - command: man > station.1
      exit: 0
      files:
          station.1:
              contains: '.TH STATION 1'
