description: 'enter on a Tools row shows its detail in full with the tab''s keys, and esc goes back'
fixture:
    - ../../__fixtures__/terminal/
    - ./__fixtures__/homebrew/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION"'
      stdin: |
          see Machine
          send 2
          see - Not installed
          send /bat\r
          see ○ bat
          send \x1b[B
          send \r
          see method
          screen
          send \x1b
          gone method
          see ○ bat
          send q
      exit: 0
      stdout: |4
           station  Home · Tools · Config · Storage │ Fleet · Services · 7 · 8       host
           ──────────────────────────────────────────────────────────────────────────────
           / bat
           bat                                                                         ○
             method    brew
             category  Not installed
             fix       station apps install bat
             keys      i install  x remove  u update















           esc back  ↑↓ move  i install  x remove  u update  enter detail  ? keys
