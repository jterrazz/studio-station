description: 'a Mac''s page streams every segment at once: Activity''s three windows, its Awake, its upkeep'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/socket-client/
    - ../../__fixtures__/power/
env: engine
runs:
    - command: '--version > /dev/null; "$STATION" engine run 2> engine.log & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; ( printf ''{"v":2,"id":"1","watch":"page","in":{"pages":["menubar.machine:x"]}}\n''; /bin/sleep 4 ) | socket .local/state/station/engine.sock > mac.jsonl; /usr/bin/jq -c ''select(.out.event=="page")|.out.page|[.id, [.segments[]?.id], [.sections[]?|[.id, .segment]]]'' mac.jsonl | /usr/bin/tail -1; /usr/bin/jq -c ''select(.out.event=="page")|[.out.page.sections[]?|select(.id=="care")|.items[]|(.row // .group.head)|[.id, .label, .verb, (.cells[0].text // .cells[0].kind)]]'' mac.jsonl | /usr/bin/tail -1; /usr/bin/jq -c ''select(.out.event=="page")|[.out.page.actions[]?|select(.rows==["awake"])|[.id, .run.call]]'' mac.jsonl | /usr/bin/tail -1; /usr/bin/jq -c ''select(.out.event=="page")|[.out.page.sections[]?|select(.segment=="activity")|[.id, .title, ([.picker[]?|select(.picked)|.id]|first)]]'' mac.jsonl | /usr/bin/tail -1; kill $d; wait $d'
      exit: 0
      stdout: |
          ["menubar.machine",["overview","activity","ports","accounts"],[["summary",null],["gauges","overview"],["vms","overview"],["care","overview"],["window-6m","activity"],["window-1h","activity"],["window-24h","activity"],["memory","activity"],["processes","activity"],["public","ports"],["private","ports"],["https","ports"],["accounts:needs-you","accounts"],["accounts:shared","accounts"],["accounts:signed-in:x","accounts"]]]
          [["awake","Sleeps as usual","awake-keep","off"],["upkeep","Upkeep",null,"all fine"]]
          [["awake-keep","awake.keep"]]
          [["window-6m","Last 6 minutes","window-1h"],["window-1h","Last hour","window-1h"],["window-24h","Last 24 hours","window-1h"],["memory","Memory",null],["processes","Top processes",null]]
