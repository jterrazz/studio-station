description: 'a watch of pages gets its live keys every 2 s, one tick for every watch, no page on a tick'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/power/
env: engine
runs:
    - command: '--version > /dev/null; "$STATION" engine run 2> engine.log & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; for w in home other; do ( printf ''{"v":2,"id":"1","watch":"page","in":{"pages":["menubar"]}}\n''; /bin/sleep 9 ) | /usr/bin/nc -U .local/state/station/engine.sock > "$w.jsonl" & done; /bin/sleep 9.5; /usr/bin/jq -c ''select(.out.event=="page")|.out.page.live|map(split(":")[0])'' home.jsonl | /usr/bin/tail -1; /usr/bin/jq -r ''select(.out.event=="sample")|.out.at'' home.jsonl | /usr/bin/wc -l | /usr/bin/awk ''{print "samples at least 3:", ($1 >= 3)}''; /usr/bin/jq -s -r ''(map(select(.out.event=="page")|.out.page.live)|last) as $live | [.[]|select(.out.event=="sample")|.out.values|keys|. - $live|length == 0] | all | "every sample holds the page keys alone: \(.)"'' home.jsonl; /usr/bin/jq -s -r ''[.[]|select(.out.event=="sample")|.out.values|to_entries[]|select(.key|startswith("cpu:"))|.value.items[0].kind] | unique | "This Mac CPU read as: \(.)"'' home.jsonl; /usr/bin/jq -s ''[.[]|select(.out.event=="sample")|{(.out.at): .out.values}]|add'' home.jsonl > a.json; /usr/bin/jq -s ''[.[]|select(.out.event=="sample")|{(.out.at): .out.values}]|add'' other.jsonl > b.json; /usr/bin/jq -n -r --slurpfile a a.json --slurpfile b b.json ''[$a[0] | keys[] | select($b[0][.] != null) | $a[0][.] == $b[0][.]] | "ticks both watches saw: \(length >= 2), each the same values: \(all)"''; /usr/bin/jq -s -r ''(map(.out.event) | index("sample")) as $i | .[$i:] | map(select(.out.event=="page")) | length | "pages after the first sample at most 2: \(. <= 2)"'' home.jsonl; kill $d; wait $d'
      exit: 0
      stdout: |
          ["cpu","memory"]
          samples at least 3: 1
          every sample holds the page keys alone: true
          This Mac CPU read as: ["percent"]
          ticks both watches saw: true, each the same values: true
          pages after the first sample at most 2: true
