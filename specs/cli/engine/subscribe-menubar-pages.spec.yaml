description: 'the engine streams the menu bar''s own pages, each of the subject after its colon'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/power/
env: engine
runs:
    - command: '--version > /dev/null; "$STATION" engine run 2> engine.log & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; for p in menubar.ports menubar.awake menubar.activity:6m menubar.activity:24h menubar.accounts menubar.needs menubar.find; do ( printf ''{"v":2,"id":"1","watch":"page","in":{"pages":["%s"]}}\n'' "$p"; /bin/sleep 4 ) | /usr/bin/nc -U .local/state/station/engine.sock > "$p.jsonl"; /usr/bin/jq -c ''select(.out.stream)|.out.pages'' "$p.jsonl"; /usr/bin/jq -r ''select(.out.event=="page")|.out.page.state'' "$p.jsonl" | /usr/bin/uniq | /usr/bin/head -2 | /usr/bin/paste -sd " " -; /usr/bin/jq -c ''select(.out.event=="page")|[.out.page.id, [.out.page.sections[]?.id], .out.page.error.message]'' "$p.jsonl" | /usr/bin/tail -1; done; /usr/bin/jq -r ''select(.out.event=="page")|.out.page.sections[]?|select(.id=="graphs")|.title'' menubar.activity:6m.jsonl menubar.activity:24h.jsonl | /usr/bin/uniq; /usr/bin/jq -c ''select(.out.event=="page")|[.out.page.actions[]?|select(.on=="page")|[.id,.run.call]]'' menubar.ports.jsonl | /usr/bin/tail -1; for p in menubar.nothing:6m; do printf ''{"v":2,"id":"1","watch":"page","in":{"pages":["%s"]}}\n'' "$p" | /usr/bin/nc -U .local/state/station/engine.sock | /usr/bin/jq -c ''.error.code''; done; kill $d; wait $d'
      exit: 0
      stdout: |
          ["menubar.ports"]
          loading ready
          ["menubar.ports",["summary","tailnet","private","ranges"],null]
          ["menubar.awake"]
          loading ready
          ["menubar.awake",["this-mac","guards"],null]
          ["menubar.activity:6m"]
          loading ready
          ["menubar.activity",["machine","graphs"],null]
          ["menubar.activity:24h"]
          loading ready
          ["menubar.activity",["machine","graphs"],null]
          ["menubar.accounts"]
          loading ready
          ["menubar.accounts",["needs-you","signed-in:x"],null]
          ["menubar.needs"]
          loading ready
          ["menubar.needs",["summary","needs-you"],null]
          ["menubar.find"]
          loading ready
          ["menubar.find",["machines","actions","sections"],null]
          Over the last 6 min
          Over the last 24 h
          [["declare-public","ports.declare"]]
          "unknown_page"
