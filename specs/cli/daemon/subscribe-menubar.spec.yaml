description: 'the menubar watch streams the popover from frame to ready, read only while watched'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/power/
env: engine
runs:
    - command: '--version > /dev/null; "$STATION" engine run 2> engine.log & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; : > .calls; /bin/sleep 3; /usr/bin/grep -c -E "^(launchctl|sysctl|tart|tailscale) " .calls; ( printf ''{"v":2,"id":"1","watch":"page","in":{"pages":["menubar"]}}\n''; /bin/sleep 8 ) | /usr/bin/nc -U .local/state/station/engine.sock > stream.jsonl & s=$!; /bin/sleep 2; printf ''{"v":2,"id":"2","call":"engine.refresh","in":{"pages":["menubar"]}}\n{"v":2,"id":"3","call":"engine.refresh","in":{"pages":["nope"]}}\n'' | /usr/bin/nc -U .local/state/station/engine.sock | /usr/bin/jq -c ''[.id, (.error == null), .error.code]''; wait $s; /usr/bin/jq -c ''select(.out.stream)|[.id, .out.pages]'' stream.jsonl; /usr/bin/jq -r ''select(.out.event=="page")|.out.page.state'' stream.jsonl | /usr/bin/uniq | /usr/bin/head -2; /usr/bin/jq -c ''select(.out.event=="page")|[.out.page.id, [.out.page.sections[].id]]'' stream.jsonl | /usr/bin/tail -1; /usr/bin/jq -c ''select(.out.event=="page")|[.out.page.actions[]|select(.on=="page")|[.id, .run.call // "terminal"]]'' stream.jsonl | /usr/bin/tail -1; /usr/bin/jq -c ''select(.out.event=="page")|[.out.page.actions[]|select(.on=="row")|[.id, .run.call, .rows]]'' stream.jsonl | /usr/bin/tail -1; /usr/bin/grep -c -E "^(launchctl|sysctl|tart) " .calls | /usr/bin/awk ''{print ($1 > 0)}''; kill $d; wait $d'
      exit: 0
      stdout: |
          0
          ["2",true,null]
          ["3",false,"unknown_page"]
          ["1",["menubar"]]
          loading
          ready
          ["menubar",["todo","fleet","power"]]
          [["new-vm","machines.create-workspace"],["open-station","terminal"],["stop-all","engine.stop"]]
          [["power-awake","awake.keep",["awake"]]]
          1
