description: 'a second daemon finds the first answering and refuses'
fixture:
    - ../__fixtures__/vms/
    - ../__fixtures__/daemon-vm/
env: daemon
runs:
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/"vm_user": "vmu"/"vm_user": "vmu", "services": {"range": "41420-41439"}/'' .config/station/settings.json; "$STATION" daemon & d=$!; n=0; while [ ! -S .local/state/station/daemon.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; "$STATION" daemon; kill $d; wait $d'
      exit: 0
      stderr: |
          Error: a station daemon already runs (pid {{int}})
          Hint: station status shows it
