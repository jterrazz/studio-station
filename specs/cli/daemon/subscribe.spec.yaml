description: 'subscribe streams the power page on each change and a notice on a guard end, refusing unknown pages'
fixture:
    - ../__fixtures__/vms/
    - ../__fixtures__/power/
env: daemon
runs:
    - command: '--version > /dev/null; "$STATION" daemon 2> daemon.log & d=$!; n=0; while [ ! -S .local/state/station/daemon.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; ( printf ''{"v":1,"id":"1","op":"subscribe","pages":["power"]}\n''; /bin/sleep 1; printf ''{"v":1,"id":"2","op":"ping"}\n''; /bin/sleep 4 ) | /usr/bin/nc -U .local/state/station/daemon.sock > stream.jsonl & s=$!; /bin/sleep 0.5; "$STATION" power awake > /dev/null; /bin/sleep 1; "$STATION" power sleep > /dev/null; /bin/sleep 0.5; "$STATION" power awake > /dev/null; /bin/sleep 0.5; echo 20 > power/battery; echo battery > power/source; wait $s; /usr/bin/jq -c ''select(.id)|[.id, .ok, .result.stream]'' stream.jsonl; /usr/bin/jq -r ''select(.event=="page")|.page.id'' stream.jsonl | /usr/bin/sort -u; /usr/bin/jq -r ''select(.event=="page")|.page.sections[0].items[0].row.cells[0].kind'' stream.jsonl | /usr/bin/uniq; /usr/bin/jq -c ''select(.event=="notice")|.notice'' stream.jsonl; printf ''{"v":1,"id":"3","op":"subscribe","pages":["nope"]}\n'' | /usr/bin/nc -U .local/state/station/daemon.sock | /usr/bin/jq -c ''[.ok, .error.code]''; kill $d; wait $d'
      exit: 0
      stdout: |
          ["1",true,"station.page/v1"]
          power
          off
          on
          off
          on
          off
          {"kind":"power_ended","text":"Power ended: battery 20% on battery"}
          [false,"unknown_page"]
