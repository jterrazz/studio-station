description: 'the power watch streams each change and a guard''s end, and refuses an unknown page'
fixture:
    - ../../__fixtures__/vms/
    - ../../__fixtures__/power/
env: engine
runs:
    - command: '--version > /dev/null; "$STATION" engine run 2> engine.log & d=$!; n=0; while [ ! -S .local/state/station/engine.sock ] && [ $n -lt 50 ]; do /bin/sleep 0.1; n=$((n+1)); done; ( printf ''{"v":2,"id":"1","watch":"page","in":{"pages":["power"]}}\n''; /bin/sleep 1; printf ''{"v":2,"id":"2","call":"engine.hello"}\n''; /bin/sleep 4 ) | /usr/bin/nc -U .local/state/station/engine.sock > stream.jsonl & s=$!; /bin/sleep 0.5; "$STATION" awake 4h > /dev/null; /bin/sleep 1; "$STATION" awake off > /dev/null; /bin/sleep 0.5; "$STATION" awake 4h > /dev/null; /bin/sleep 0.5; echo 20 > power/battery; echo battery > power/source; wait $s; /usr/bin/jq -c ''select(.out.stream)|[.id, .out.stream]'' stream.jsonl; /usr/bin/jq -c ''select(.id != "1")|.id'' stream.jsonl; /usr/bin/jq -r ''select(.out.event=="page")|.out.page.id'' stream.jsonl | /usr/bin/sort -u; /usr/bin/jq -r ''select(.out.event=="page")|.out.page.sections[0].items[0].row.cells[0].kind'' stream.jsonl | /usr/bin/uniq; /usr/bin/jq -c ''select(.out.event=="notice")|.out.notice'' stream.jsonl; printf ''{"v":2,"id":"3","watch":"page","in":{"pages":["nope"]}}\n'' | /usr/bin/nc -U .local/state/station/engine.sock | /usr/bin/jq -c ''[.out == null, .error.code]''; kill $d; wait $d'
      exit: 0
      stdout: |
          ["1","station.page/v1"]
          power
          off
          on
          off
          on
          off
          {"kind":"power_ended","text":"Awake stopped on This Mac: battery 20 %"}
          [true,"unknown_page"]
