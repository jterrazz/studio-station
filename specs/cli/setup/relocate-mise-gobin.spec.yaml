description: 'setup turns off mise''s GOBIN under the owner''s own [settings], so go install lands in {data}/go/bin'
fixture: ./__fixtures__/mise-config/
runs:
    - command: 'setup --name m </dev/null'
      exit: 0
      stdout: |
          ●	name	m
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	bunfig, go env, mise config, npmrc
          ○	tools	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ○	daemon	not needed until tart is installed
      files:
          .config/mise/config.toml: { equals: "[tools]\ngo = \"1.27.3\"\n\n[settings]\ngo_set_gobin = false\nexperimental = true\n" }
    - command: 'setup </dev/null'
      exit: 0
      stdout: |
          ●	name	m
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	nothing to do
          ○	tools	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ○	daemon	not needed until tart is installed
