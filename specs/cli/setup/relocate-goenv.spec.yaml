description: 'GOENV names go''s env file; GOENV=off writes none and says so'
env:
    - GOENV=$WORKDIR/genv
runs:
    - command: 'setup --name m </dev/null'
      exit: 0
      stdout: |
          ●	name	m
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	bunfig, go env, npmrc
          ○	tools	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ○	daemon	not needed until tart is installed
      files:
          genv: exists
          Library/Application Support/go/env: absent
