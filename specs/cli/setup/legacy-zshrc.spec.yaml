description: 'the old workstation block is replaced by the station block, foreign lines byte for byte'
fixture:
    - ./__fixtures__/legacy-zshrc/
runs:
    - command: 'setup --name t'
      exit: 0
      stdout: |
          ●	name	t
          ●	zshrc
          ●	layout	nothing to move
      files:
          .zshrc:
              equals: |
                  # Created by `pipx` on 2025-06-21 19:39:12
                  export PATH="$PATH:/Users/owner/.local/bin"



                  # mDNS browser helper functions
                  open_app() { open "https://app.local/" ; }

                  # >>> station >>>
                  export PATH="$HOME/.local/bin:$PATH"
                  command -v station >/dev/null 2>&1 && eval "$(station shell zsh)"
                  # <<< station <<<
