description: 'with tart running, setup moves nothing and names the relocate step and what to stop'
fixture:
    - ./__fixtures__/tart-store/
    - ../__fixtures__/process-running/
runs:
    - command: 'setup --name m </dev/null'
      exit: 1
      stdout: |
          ●	name	m
          ●	zshrc
          ●	layout	nothing to retire
          ✗	relocate	tart is running: its files cannot move under it
          ○	daemon	not needed until tart is installed
      stderr: |
          Error: setup step relocate: tart is running: its files cannot move under it
          Hint: stop the lasting VMs and delete the temporary ones (station machines), then station setup
      files:
          .tart/vms/station-image-linux-2026.11.01/config.json: exists
          .local/share/station/vms: absent
