description: 'a daemon launchd loads but cannot start is a failed step, never a running row'
fixture:
    - ../__fixtures__/vms/
    - ./__fixtures__/launchctl-fails-kickstart/
runs:
    - command: 'setup </dev/null'
      exit: 1
      stdout: |
          ●	name	x
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	bunfig, go env, npmrc
          ○	tools	missing: homebrew mise git tailscale: run station setup on a terminal
          ✗	daemon	launchctl kickstart exited 5: Could not kickstart service: 5: Input/output error
      stderr: |
          Error: setup step daemon: launchctl kickstart exited 5: Could not kickstart service: 5: Input/output error
          Hint: fix it, then run station setup again: it resumes
