description: 'setup moves ~/.studio: settings and dns; the userspace tailscaled is retired, not moved'
fixture:
    - ./__fixtures__/stubs/
    - ./__fixtures__/v1-studio/
env:
    - USER=tester
runs:
    - command: 'setup'
      exit: 0
      stdout: |
          ●	name	base
          ●	zshrc
          ●	layout	moved to the XDG folders
          ●	layout	userspace tailscaled retired; its node "base" stays at https://login.tailscale.com/admin/machines until you remove it
          ●	relocate	bunfig, go env, npmrc
          ○	tools	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ○	daemon	not needed until tart is installed
      files:
          .config/station/settings.json:
              equals: |
                  {
                    "here": "base",
                    "hosts": {
                      "base": {},
                      "mini": {
                        "user": "agent",
                        "key": "~/.ssh/id_mini"
                      }
                    },
                    "vm_user": "tester",
                    "user_email": "owner@example.com"
                  }
          .calls:
              equals: |
                  security delete-generic-password -s station -a vm-join-id
                  security delete-generic-password -s station -a vm-join-secret
                  security delete-generic-password -s station -a tailnet-authkey
          .local/state/station/tailscaled: absent
          .local/state/station/dns/quad9-dns.mobileconfig: exists
          .studio: absent
    - command: 'setup'
      exit: 0
      stdout: |
          ●	name	base
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	nothing to do
          ○	tools	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ○	daemon	not needed until tart is installed
      files:
          .studio: absent
