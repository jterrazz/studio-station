description: 'setup boots out the per-VM agents of stopped VMs; a lasting one stopped by its owner stays so'
fixture:
    - ../../__fixtures__/vms/
    - ./__fixtures__/old-agents/
runs:
    - command: 'setup </dev/null'
      exit: 0
      stdout: |
          ●	name	x
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	bunfig, go env, mise config, npmrc
          ○	tools	missing: homebrew mise git tailscale: run station setup on a terminal
          ●	daemon	running {{string}}
      files:
          .calls:
              contains:
                  - 'launchctl bootout gui/{{int}}/com.jterrazz.station.vm.t'
                  - 'launchctl bootout gui/{{int}}/com.jterrazz.station.vm.api'
          Library/LaunchAgents/com.jterrazz.station.vm.t.plist: absent
          Library/LaunchAgents/com.jterrazz.station.vm.api.plist: absent
          .local/state/station/vms/api.json:
              contains: '"want": "stopped"'
