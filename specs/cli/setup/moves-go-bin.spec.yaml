description: 'setup moves what go install put in ~/go/bin into its new home, by rename'
fixture: ./__fixtures__/go-bin/
runs:
    - command: 'setup --name m </dev/null'
      exit: 0
      stdout: |
          ●	name	m
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	go env, npmrc, moved ~/go
          ○	tools	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ○	daemon	not needed until tart is installed
      files:
          .local/share/go/bin/foo: { equals: "foo binary\n" }
          go: absent
