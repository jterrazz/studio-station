description: 'a malformed name on a fresh host is refused and nothing is written'
runs:
    - command: 'setup --name Bad_Name'
      exit: 2
      stderr: |
          Error: "Bad_Name" is not a machine name
          Hint: use lowercase letters, digits and -, 1 to 40 characters
      files:
          .zshrc: absent
          .config: absent
