description: 'a symlink to the App Store bundle''s CLI crashes, so setup replaces it with the wrapper'
fixture:
    - ../__fixtures__/system-tools/
    - ../../__fixtures__/tailscale-app-store/
env: engine
runs:
    - command: '--version >/dev/null; /bin/rm bin/tailscale; /bin/mkdir -p .local/bin; /bin/ln -s "$PWD/root/Applications/Tailscale.app/Contents/MacOS/Tailscale" .local/bin/tailscale; "$STATION" setup --name m </dev/null | /usr/bin/grep -E ''^.	tools''; /bin/ls -l .local/bin/tailscale | /usr/bin/cut -c1'
      exit: 0
      stdout: |
          ●	tools	tailscale wrapper written: ~/.local/bin/tailscale
          -
      files:
          .local/bin/tailscale:
              equals: |
                  #!/bin/sh
                  exec {{workdir}}/root/Applications/Tailscale.app/Contents/MacOS/Tailscale "$@"
          root/Applications/Tailscale.app/Contents/MacOS/Tailscale:
              contains:
                  - 'The Tailscale app''s CLI as the specs need it'
