description: 'XDG_CONFIG_HOME moves settings.json and nothing is written to the default folder'
env:
    - XDG_CONFIG_HOME=$WORKDIR/c
runs:
    - command: 'setup --name t'
      exit: 0
      stdout: |
          ●	name	t
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	bunfig, go env, mise config, npmrc
          ○	tools	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ○	engine	not needed until tart is installed
      files:
          c/station/settings.json:
              contains: '"here": "t",'
          .config: absent
          .studio: absent
