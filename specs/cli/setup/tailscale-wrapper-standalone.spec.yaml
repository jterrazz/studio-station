description: 'the Standalone app brings its own CLI: setup writes no wrapper'
fixture:
    - ../__fixtures__/system-tools/
    - ../__fixtures__/tailscale-standalone/
env: daemon
runs:
    - command: '--version >/dev/null; /bin/rm bin/tailscale; "$STATION" setup --name m </dev/null | /usr/bin/grep -E ''^.	tools'''
      exit: 0
      stdout: |
          ●	tools
      files:
          .local/bin/tailscale: absent
