description: 'a rerun after the retirement finds nothing to retire and prints no retired row'
fixture:
    - ../../__fixtures__/setup-stubs/
    - ../../__fixtures__/userspace-era/
env:
    - USER=tester
runs:
    - command: 'setup > /dev/null; echo 44 > .security-delete'
      exit: 0
    - command: 'setup'
      exit: 0
      stdout: |
          ●	name	m
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	nothing to do
          ○	tools	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ○	daemon	not needed until tart is installed
