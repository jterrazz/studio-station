description: 'on a terminal, setup offers the local host name, made a machine name, and registers it on enter'
fixture:
    - ../../__fixtures__/terminal/
    - ./__fixtures__/local-host-name/
    - ../__fixtures__/system-tools/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION" setup'
      stdin: |
          see jean-baptiste-s-macbook-pro
          send \r
          see tools
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq -r .here .config/station/settings.json'
      exit: 0
      stdout: |
          jean-baptiste-s-macbook-pro
