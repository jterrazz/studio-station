description: 'the owner''s own lines stay first, byte for byte, and station''s key follows'
fixture: ./__fixtures__/npmrc-registry/
runs:
    - command: 'setup --name m </dev/null'
      exit: 0
      stdout: |
          ●	name	m
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	bunfig, go env, mise config, npmrc
          ○	tools	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ○	engine	not needed until tart is installed
    - command: '--version >/dev/null; /bin/cat .npmrc'
      exit: 0
      stdout: |
          registry=https://r.example/
          cache={{workdir}}/.cache/npm
