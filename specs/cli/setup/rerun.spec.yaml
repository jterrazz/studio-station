description: 'a second setup changes nothing: one block, the same rows, the same name accepted'
fixture:
    - ./__fixtures__/legacy-zshrc/
runs:
    - command: 'setup --name t'
      exit: 0
      stdout: |
          ●	name	t
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	bunfig, go env, mise config, npmrc
          ○	tools	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ○	daemon	not needed until tart is installed
      files:
          .zshrc:
              contains: |
                  # >>> station >>>
                  export PATH="$HOME/.local/bin:$PATH"
                  command -v station >/dev/null 2>&1 && eval "$(station shell zsh)"
                  # <<< station <<<
    - command: 'setup'
      exit: 0
      stdout: |
          ●	name	t
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	nothing to do
