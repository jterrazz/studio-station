description: 'a VM running under its old agent refuses the migration: nothing is booted out'
fixture:
    - ../__fixtures__/vms/
    - ./__fixtures__/old-agents/
env: daemon
runs:
    - command: '--version >/dev/null; echo running > .tart-vms/api; "$STATION" setup </dev/null'
      exit: 1
      stdout: |
          ●	name	x
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	go env, npmrc
          ○	tools	missing: homebrew mise git tailscale: run station setup on a terminal
          ✗	daemon	api still runs under its round-3 agent
      stderr: |
          Error: setup step daemon: api still runs under its round-3 agent
          Hint: stop the lasting VMs and delete the temporary ones (station machines), then station setup
      files:
          Library/LaunchAgents/com.jterrazz.station.vm.api.plist: exists
