description: 'on a Linux VM with XDG_CONFIG_HOME, go''s env file and mise''s config move with it'
env:
    - STATION_MACHINE_KIND=linux
    - XDG_CONFIG_HOME=$WORKDIR/x
runs:
    - command: 'setup'
      exit: 0
      stdout: |
          ●	zshrc
          ●	relocate	bunfig, go env, mise config, npmrc
      files:
          x/go/env: exists
          x/mise/config.toml: exists
          .config/go: absent
