description: 'a settings.json that differs from the converted config.json is never overwritten'
fixture:
    - ../../__fixtures__/setup-stubs/
    - ../../__fixtures__/v1-studio/
    - ./__fixtures__/other-settings/
env:
    - USER=tester
runs:
    - command: 'setup'
      exit: 1
      stdout: |
          ●	name	elsewhere
          ●	zshrc
          ✗	layout	{{workdir}}/.config/station/settings.json already exists with different content
          ●	relocate	bunfig, go env, mise config, npmrc
          ○	tools	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ○	engine	not needed until tart is installed
      stderr: |
          Error: setup step layout: {{workdir}}/.config/station/settings.json already exists with different content
          Hint: keep one of the two files, then run station setup again
      files:
          .studio/config.json: exists
          .calls: absent
          .config/station/settings.json:
              equals: |
                  {
                    "here": "elsewhere",
                    "hosts": {
                      "elsewhere": {}
                    },
                    "vm_user": "someone"
                  }
