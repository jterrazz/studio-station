description: 'a live userspace tailscaled is stopped and retired by a background re-exec of setup'
fixture:
    - ../../__fixtures__/setup-stubs/
    - ../../__fixtures__/v1-studio/
    - ./__fixtures__/detached/
env:
    - USER=tester
    - STATION_EXECUTABLE=$WORKDIR/bin/stub-station
runs:
    - command: '--version >/dev/null; echo $PPID > .studio/tailscale/tailscaled.pid'
      exit: 0
    - command: 'setup'
      exit: 0
      stdout: |
          ●	name	base
          ●	zshrc
          ◐	layout	the userspace tailscaled stops in the background	{{workdir}}/.local/state/station/logs/setup.log
          ●	relocate	bunfig, go env, mise config, npmrc
          ○	tools	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ○	daemon	not needed until tart is installed
      files:
          .studio/tailscale/tailscaled.state: exists
          .local/state/station/logs/setup.log: exists
    - command: '--version'
      exit: 0
      stdout: |
          station {{string}} ({{sha}})
      files:
          .calls:
              equals: |
                  station setup STATION_XDG_DETACHED=1
