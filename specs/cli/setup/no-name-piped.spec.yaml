description: 'piped without a name, setup does the rest and says how to name the host'
runs:
    - command: 'setup'
      exit: 0
      stdout: |
          ○	name	not set: station setup --name <name>
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	bunfig, go env, mise config, npmrc
          ○	tools	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ○	engine	not needed until tart is installed
      files:
          .zshrc:
              equals: |
                  # >>> station >>>
                  export PATH="$HOME/.local/bin:$PATH"
                  command -v station >/dev/null 2>&1 && eval "$(station shell zsh)"
                  # <<< station <<<
          .config/station: absent
