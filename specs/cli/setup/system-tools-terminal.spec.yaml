description: 'on a terminal, setup installs the missing system tools, Homebrew first, then one bundle'
fixture:
    - ../__fixtures__/terminal/
    - ./__fixtures__/system-installers/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION" setup --name m'
      stdin: |
          see installed homebrew mise git tart tailscale
      exit: 0
    - command: '--version >/dev/null; /bin/cat .calls'
      exit: 0
      stdout: |
          bash [-c] [script="$(curl -fsSL "$0")" && exec bash -c "$script" bash "$@"] [https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh]
          brew bundle install --no-upgrade --file=-
          brew "mise"
          brew "tailscale"
          bash [-c] [xcode-select --install]
          bash [-c] [d="$HOME/.local/share"; case "$XDG_DATA_HOME" in /*) d="$XDG_DATA_HOME" ;; esac; mkdir -p "$d/station/tart" "$d/station/vms" "$HOME/.local/bin" && curl -fsSL https://github.com/cirruslabs/tart/releases/latest/download/tart.tar.gz | tar -xz -C "$d/station/tart"]
