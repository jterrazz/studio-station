description: 'the tailscale formula without the app is left alone: setup asks for the app'
fixture:
    - ../__fixtures__/system-tools/
    - ./__fixtures__/tailscale-formula/
runs:
    - command: 'setup --name m </dev/null'
      exit: 0
      stdout: |
          ●	name	m
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	bunfig, go env, mise config, npmrc
          ○	tools	missing: tailscale: run station setup on a terminal
          ○	engine	launchd is not here to run it
      files:
          .calls: absent
