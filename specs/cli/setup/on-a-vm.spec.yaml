description: 'on a VM setup writes the block only, and a name is refused'
env:
    - STATION_MACHINE_KIND=linux
runs:
    - command: 'setup'
      exit: 0
      stdout: |
          ●	zshrc
      files:
          .zshrc:
              equals: |
                  # >>> station >>>
                  export PATH="$HOME/.local/bin:$PATH"
                  command -v station >/dev/null 2>&1 && eval "$(station shell zsh)"
                  # <<< station <<<
          .config: absent
    - command: 'setup --name x'
      exit: 2
      stderr: |
          Error: a VM's name is given when it is created
          Hint: run station setup without --name
