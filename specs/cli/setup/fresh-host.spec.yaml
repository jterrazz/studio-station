description: 'setup on an empty HOME registers the host and writes the zshrc block, with no .studio'
env:
    - USER=tester
runs:
    - command: 'setup --name macbook'
      exit: 0
      stdout: |
          ●	name	macbook
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	go env, npmrc
          ○	tools	missing: homebrew mise git tart tailscale: run station setup on a terminal
          ○	daemon	not needed until tart is installed
      files:
          .config/station/settings.json:
              equals: |
                  {
                    "here": "macbook",
                    "hosts": {
                      "macbook": {}
                    },
                    "vm_user": "tester"
                  }
          .zshrc:
              equals: |
                  # >>> station >>>
                  export PATH="$HOME/.local/bin:$PATH"
                  command -v station >/dev/null 2>&1 && eval "$(station shell zsh)"
                  # <<< station <<<
          .studio: absent
