description: 'in a VM whose studio fails, or holds no token, a new shell still starts: no export line, exit 0'
fixture:
    - ./__fixtures__/studio/
    - ./__fixtures__/studio-fails/
env:
    - STATION_MACHINE_KIND=macos
runs:
    - command: 'shell zsh | /usr/bin/grep -c ''CLAUDE_CODE_OAUTH_TOKEN'''
      exit: 1
      stdout: |
          0
    - command: 'shell zsh > /dev/null'
      exit: 0
      files:
          .calls:
              contains: 'studio credentials export operator:claude:oauth-token'
