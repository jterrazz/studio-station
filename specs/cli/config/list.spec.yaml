description: 'bare config lists the items placed here by category, each with what it says about the machine'
fixture:
    - ./__fixtures__/states/
    - ./__fixtures__/security/
    - ./__fixtures__/git/
runs:
    - command: 'config'
      exit: 0
      stdout: |
          # Terminal	1 ●	3 ○
          ●	hushlogin	Silence the terminal login message	~/.hushlogin
          ○	ghostty-dotfiles	The Ghostty config and its Catppuccin themes	needs ghostty · station apps install ghostty
          ○	tmux-dotfiles	The tmux config	needs tmux · station apps install tmux
          ○	starship-dotfiles	The Starship prompt config	needs starship · station apps install starship
          # Security	2 ●	4 ○
          ●	git-signing	Sign every commit with a GPG key	commit.gpgsign=true
          ○	ssh-key	An ed25519 SSH key, kept in the Keychain	station config install ssh-key
          ●	github-login	The GitHub CLI logged in over SSH	authenticated
          ○	spotlight-exclude	Exclude ~/Developer from Spotlight (guided, opens Settings)	station config install spotlight-exclude
          ○	dns	Encrypted DNS via Quad9 (DoH)	station config install dns
          ○	claude-token	The Claude Code subscription token a VM may borrow	station config install claude-token
          # Editor	1 ○
          ○	zed-dotfiles	The Zed settings and its formatter config	needs zed · station apps install zed
          # System	1 ◐	3 ○
          ○	dock-reset	Reset the dock to the system defaults	run once · station config install dock-reset
          ○	dock-spacer	Add a small spacer tile to the dock	run once · station config install dock-spacer
          ◐	backup-exclusions	Keep ~/.cache and station's VMs out of Time Machine	tmutil not found
          ○	tart-launcher	The tart launcher: Tart's home is station's VMs folder	station config install tart-launcher
          # Headless	2 ●	2 ○
          ○	autologin	GUI auto-login for jterrazz.agent (FileVault-aware)	station config install autologin
          ●	power	Always-on power policy (no sleep, autorestart, wake)	always-on policy applied
          ○	lock-after-login	A LaunchAgent that locks the screen ~20s after auto-login	station config install lock-after-login
          ●	sshd	macOS Remote Login (sshd)	Remote Login on
    - command: 'config --json | /usr/bin/jq -r ''.items[] | select(.name | IN("hushlogin", "git-signing", "dock-reset", "power", "sshd", "github-login")) | "\(.name):\(.state):\(.detail)"'''
      exit: 0
      stdout: |
          hushlogin:ok:~/.hushlogin
          git-signing:ok:commit.gpgsign=true
          github-login:ok:authenticated
          dock-reset:absent:run once
          power:ok:always-on policy applied
          sshd:ok:Remote Login on
