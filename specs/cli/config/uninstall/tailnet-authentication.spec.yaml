description: 'uninstalling tailnet-auth drops the kept key and resets the choice, keeping the rest of settings'
fixture:
    - ../__fixtures__/security/
    - ./__fixtures__/settings-authkey/
runs:
    - command: 'config uninstall tailnet-auth --yes'
      exit: 0
      stdout: |
          ●	tailnet-auth
          ●	auth key	removed from the keychain
          ●	settings	back to the defaults
      files:
          .calls:
              equals: |
                  security delete-generic-password -s station -a tailnet-authkey
          .config/station/settings.json:
              equals: |
                  {
                    "here": "x",
                    "tailnet": {
                      "mode": "userspace",
                      "auth_method": "login"
                    },
                    "lend_list": [
                      "session:a"
                    ]
                  }
