description: 'on a terminal uninstall asks: no keeps it with one block, ctrl-c exits 130, yes runs it'
fixture:
    - ../../../__fixtures__/terminal/
    - ../__fixtures__/tmutil/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION" config uninstall backup-exclusions'
      stdin: |
          see Uninstall backup-exclusions?
          send n
          see Hint: --yes skips the question
          screen
      exit: 1
      stdout: |
          ┃ Uninstall backup-exclusions?
          ┃
          Error: backup-exclusions kept: you said no
          Hint: --yes skips the question
      files:
          .calls: absent
    - command: '--version >/dev/null; terminal "$STATION" config uninstall backup-exclusions'
      stdin: |
          see Uninstall backup-exclusions?
          send \x03
          screen
      exit: 130
      stdout: |
          ┃ Uninstall backup-exclusions?
          ┃
      files:
          .calls: absent
    - command: '--version >/dev/null; terminal "$STATION" config uninstall backup-exclusions'
      stdin: |
          see Uninstall backup-exclusions?
          send y
      exit: 0
      files:
          .calls:
              contains: 'tmutil removeexclusion'
