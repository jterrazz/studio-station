description: 'uninstalling vm-join removes both keychain accounts'
fixture: ../__fixtures__/security/
runs:
    - command: 'config uninstall vm-join --yes'
      exit: 0
      stdout: |
          ●	vm-join
          ●	vm-join-id	removed from the keychain
          ●	vm-join-secret	removed from the keychain
      files:
          .calls:
              equals: |
                  security delete-generic-password -s station -a vm-join-id
                  security delete-generic-password -s station -a vm-join-secret
