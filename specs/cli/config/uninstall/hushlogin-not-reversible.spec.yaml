description: 'an item station cannot undo is refused before any question'
runs:
    - command: 'config uninstall hushlogin </dev/null'
      exit: 2
      stderr: |
          Error: hushlogin cannot be uninstalled by station
          Hint: station applies it but cannot undo it: undo it by hand
    - command: 'config uninstall ghostty-dotfiles --yes'
      exit: 2
      stderr: |
          Error: ghostty-dotfiles cannot be uninstalled by station
          Hint: station applies it but cannot undo it: undo it by hand
