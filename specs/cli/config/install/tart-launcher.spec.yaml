description: 'tart-launcher writes the one launcher, executable; it cannot be uninstalled'
runs:
    - command: 'config install tart-launcher'
      exit: 0
      stdout: |
          ●	tart-launcher	~/.local/bin/tart: written
    - command: '--version >/dev/null; /bin/ls -l .local/bin/tart | /usr/bin/cut -c1-10; /usr/bin/head -4 .local/bin/tart'
      exit: 0
      stdout: |
          -rwxr-xr-x
          #!/bin/sh
          d="$HOME/.local/share"
          case "$XDG_DATA_HOME" in /*) d="$XDG_DATA_HOME" ;; esac
          TART_HOME="$d/station/vms" exec "$d/station/tart/tart.app/Contents/MacOS/tart" "$@"
    - command: 'config uninstall tart-launcher --yes'
      exit: 2
      stderr: |
          Error: tart-launcher cannot be uninstalled by station
          Hint: station applies it but cannot undo it: undo it by hand
