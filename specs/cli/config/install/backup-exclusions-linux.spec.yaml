description: 'backup-exclusions is a host item: a Linux VM refuses it'
fixture: ../__fixtures__/tmutil/
env:
    - STATION_MACHINE_KIND=linux
runs:
    - command: 'config install backup-exclusions'
      exit: 2
      stderr: |
          Error: backup-exclusions's place is host; here is linux
          Hint: run it on a host: station config install backup-exclusions --on <host>
      files:
          .calls: absent
