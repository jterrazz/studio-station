description: 'on a terminal tailnet-auth keeps the key in the keychain alone, a login drops it, none is refused'
fixture:
    - ../../__fixtures__/terminal/
    - ../__fixtures__/security/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION" config install tailnet-auth'
      stdin: |
          see ┃ Daemon
          send \r
          see ┃ Login
          send \x1b[B
          send \r
          see ┃ Auth key
          send tskey-secret-1\r
          see ●
          screen
      exit: 0
      stdout: |
          Configure tailnet-auth
            Daemon
            > auto
              userspace

            Login
              login
            > authkey

          ┃ Auth key
          ┃ required when the login is authkey
          ●       tailnet-auth
          ●       auth key        kept in the keychain
          ●       settings        auto · authkey
      files:
          .calls:
              equals: |
                  security -i
                  add-generic-password -U -s station -a "tailnet-authkey" -w "tskey-secret-1"
    - command: '--version >/dev/null; /usr/bin/jq -c .tailnet .config/station/settings.json'
      exit: 0
      stdout: |
          {"mode":"auto","auth_method":"authkey"}
    - command: '--version >/dev/null; /usr/bin/grep -c tskey .config/station/settings.json'
      exit: 1
      stdout: |
          0
    - command: '--version >/dev/null; /bin/rm .calls; terminal "$STATION" config install tailnet-auth'
      stdin: |
          see ┃ Daemon
          send \x1b[B
          send \r
          see ┃ Login
          send \r
          see ┃ Auth key
          send \r
          see ●
      exit: 0
      files:
          .calls:
              equals: |
                  security delete-generic-password -s station -a tailnet-authkey
    - command: '--version >/dev/null; /usr/bin/jq -c .tailnet .config/station/settings.json'
      exit: 0
      stdout: |
          {"mode":"userspace","auth_method":"login"}
    - command: '--version >/dev/null; /bin/rm .calls; terminal "$STATION" config install tailnet-auth'
      stdin: |
          see ┃ Daemon
          send \r
          see ┃ Login
          send \x1b[B
          send \r
          see ┃ Auth key
          send \r
          see Hint:
          screen
      exit: 1
      stdout: |
          Configure tailnet-auth
            Daemon
            > auto
              userspace

            Login
              login
            > authkey

          ┃ Auth key
          ┃ required when the login is authkey
          ✗       tailnet-auth    failed: an authkey login needs the auth key
          Error: 1 of 1 config items failed
          Hint: re-run it: station config install tailnet-auth
      files:
          .calls: absent
