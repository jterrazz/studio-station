description: 'on a terminal the Claude token reaches studio on stdin and the lend list once; no studio, no token'
fixture:
    - ../../../__fixtures__/terminal/
    - ../__fixtures__/studio/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION" config install claude-token'
      stdin: |
          see ┃ Claude Code token
          send sk-ant-oat01-x\r
          see ●
          screen
      exit: 0
      stdout: |
          Configure claude-token
          ┃ Claude Code token
          ┃ run `claude setup-token` and paste the token
          ●       claude-token
          ●       operator:claude:oauth-token     kept by the studio credential store
          ●       lend list       holds operator:claude:oauth-token
    - command: '--version >/dev/null; terminal "$STATION" config install claude-token'
      stdin: |
          see ┃ Claude Code token
          send sk-ant-oat01-x\r
          see ●
      exit: 0
      files:
          .calls:
              equals: |
                  studio credentials import
                  {"operator:claude:oauth-token":"sk-ant-oat01-x"}
                  studio credentials import
                  {"operator:claude:oauth-token":"sk-ant-oat01-x"}
    - command: '--version >/dev/null; /usr/bin/jq -c .lend_list .config/station/preferences.json'
      exit: 0
      stdout: |
          ["operator:claude:oauth-token"]
    - command: '--version >/dev/null; /usr/bin/grep -c sk-ant .config/station/preferences.json'
      exit: 1
      stdout: |
          0
    - command: '--version >/dev/null; /bin/rm bin/studio .calls; terminal --size 120x24 "$STATION" config install claude-token'
      stdin: |
          see ┃ Claude Code token
          send sk-ant-oat01-x\r
          see Hint:
          screen
      exit: 1
      stdout: |
          Configure claude-token
          ┃ Claude Code token
          ┃ run `claude setup-token` and paste the token
          ✗       claude-token    failed: claude-token is kept by the studio CLI, which is not on PATH
          Error: 1 of 1 config items failed
          Hint: re-run it: station config install claude-token
      files:
          .calls: absent
