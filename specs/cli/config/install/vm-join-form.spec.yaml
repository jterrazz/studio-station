description: 'on a terminal vm-join asks the OAuth client and keeps both values in the keychain, never in argv'
fixture:
    - ../../__fixtures__/terminal/
    - ../__fixtures__/security/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION" config install vm-join'
      stdin: |
          see ┃ OAuth client id
          send kid\r
          see ┃ OAuth client secret
          send ksecret\r
          see vm-join-secret
          screen
      exit: 0
      stdout: |
          Configure vm-join
            OAuth client id
            > kid

          ┃ OAuth client secret
          ●       vm-join
          ●       vm-join-id      kept in the keychain
          ●       vm-join-secret  kept in the keychain
      files:
          .calls:
              equals: |
                  security -i
                  add-generic-password -U -s station -a "vm-join-id" -w "kid"
                  security -i
                  add-generic-password -U -s station -a "vm-join-secret" -w "ksecret"
