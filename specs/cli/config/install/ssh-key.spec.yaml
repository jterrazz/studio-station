description: 'on a terminal, ssh-key keeps the key there, adds the Keychain stanza once and leaves the lines it found'
fixture:
    - ../../root/__fixtures__/terminal/
    - ./__fixtures__/ssh-key/
env: terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION" config install ssh-key'
      stdin: |
          see ssh-ed25519 AAAA u
      exit: 0
    - command: '--version >/dev/null; terminal "$STATION" config install ssh-key'
      stdin: |
          see already configured
      exit: 0
      files:
          .ssh/config:
              equals: |
                  Host work
                    User w

                  Host *
                    AddKeysToAgent yes
                    UseKeychain yes
                    IdentityFile ~/.ssh/id_ed25519
          .ssh/id_ed25519:
              equals: |
                  private
