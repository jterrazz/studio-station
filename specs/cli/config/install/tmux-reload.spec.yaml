description: 'the tmux config is written, then a running tmux is told to read it'
fixture: ./__fixtures__/tmux/
runs:
    - command: 'config install tmux-dotfiles'
      exit: 0
      stdout: |
          ●	tmux-dotfiles
          ●	~/.tmux.conf	written
          ●	tmux	reloaded
      files:
          .tmux.conf: exists
          .calls:
              equals: |
                  tmux source-file
