description: 'config --json is station.config/v1: an item per row with its category, places, state and detail'
runs:
    - command: 'config --json | /usr/bin/jq -r .schema'
      exit: 0
      stdout: |
          station.config/v1
    - command: 'config --json | /usr/bin/jq -r ''.items[0] | keys | join(" ")'''
      exit: 0
      stdout: |
          category detail name places state
    - command: 'config --json | /usr/bin/jq -r ''[.items[].category] | unique | join(" ")'''
      exit: 0
      stdout: |
          Editor Headless Network Security System Terminal
    - command: 'config --json | /usr/bin/jq -r ''.items[] | select(.name == "power") | .places | join(",")'''
      exit: 0
      stdout: |
          host
