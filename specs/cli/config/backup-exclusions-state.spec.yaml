description: 'backup-exclusions is ok with both excluded, degraded with one, unknown without tmutil'
fixture: ./__fixtures__/tmutil/
runs:
    - command: 'config --json | /usr/bin/jq -r ''.items[] | select(.name == "backup-exclusions") | .state'''
      exit: 0
      stdout: |
          ok
    - command: '--version >/dev/null; /bin/mkdir -p answers/tmutil && echo 1 > answers/tmutil/excluded'
      exit: 0
    - command: 'config --json | /usr/bin/jq -r ''.items[] | select(.name == "backup-exclusions") | .state'''
      exit: 0
      stdout: |
          degraded
    - command: '--version >/dev/null; /bin/rm bin/tmutil'
      exit: 0
    - command: 'config --json | /usr/bin/jq -r ''.items[] | select(.name == "backup-exclusions") | .state'''
      exit: 0
      stdout: |
          unknown
