description: 'reset is rm then rmi: the same two sequences, containers first'
fixture: ./__fixtures__/docker/
runs:
    - command: 'run docker reset --yes'
      exit: 0
      stdout: |
          ●	containers	2 removed
          ●	images	1 removed
      files:
          .calls:
              equals: |
                  docker ps -aq
                  docker rm -vf c1 c2
                  docker images -aq
                  docker rmi -f i1
