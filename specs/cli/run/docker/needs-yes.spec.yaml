description: 'rm, rmi and reset refuse off a terminal without --yes, exit 2, and call nothing'
fixture: ./__fixtures__/docker/
runs:
    - command: 'run docker rm'
      exit: 2
      stderr: |
          Error: refusing to remove every container without --yes
          Hint: re-run with --yes
    - command: 'run docker rmi'
      exit: 2
      stderr: |
          Error: refusing to remove every image without --yes
          Hint: re-run with --yes
    - command: 'run docker reset'
      exit: 2
      stderr: |
          Error: refusing to remove every container and image without --yes
          Hint: re-run with --yes
      files:
          .calls: absent
