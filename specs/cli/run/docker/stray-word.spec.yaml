description: 'run docker without a shortcut, or with two, exits 2 before any question'
fixture: ./__fixtures__/docker/
runs:
    - command: 'run docker'
      exit: 2
      stderr: |
          Error: name a docker shortcut: rm, rmi, reset
          Hint: station run docker reset --yes
    - command: 'run docker rm rmi --yes'
      exit: 2
      stderr: |
          Error: one docker shortcut at a time
          Hint: station run docker rm --yes
      files:
          .calls: absent
