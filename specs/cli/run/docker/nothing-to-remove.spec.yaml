description: 'with no container and no image reset removes nothing and says so'
fixture:
    - ./__fixtures__/docker/
    - ./__fixtures__/nothing/
runs:
    - command: 'run docker reset --yes'
      exit: 0
      stdout: |
          ●	containers	none to remove
          ●	images	none to remove
      files:
          .calls:
              equals: |
                  docker ps -aq
                  docker images -aq
