description: 'bare run prints its menu on stderr and exits 2 with no error block; --help exits 0'
runs:
    - command: 'run 2> menu.txt || echo "run exited $?"'
      exit: 0
      stdout: |
          run exited 2
      files:
          menu.txt:
              contains:
                  - 'docker <rm|rmi|reset>'
                  - 'git [command]'
    - command: 'run 2>&1 | /usr/bin/grep -c ''Error:'''
      exit: 1
      stdout: |
          0
    - command: 'run --help > help.txt'
      exit: 0
      files:
          help.txt:
              contains:
                  - 'docker <rm|rmi|reset>'
                  - 'git [command]'
