description: 'bare run git prints the ten shortcuts on stderr and exits 2, stdout empty, no error block'
runs:
    - command: 'run git 2> menu.txt || echo "run git exited $?"'
      exit: 0
      stdout: |
          run git exited 2
      files:
          menu.txt:
              contains:
                  - '    branches '
                  - '    chore <message...> '
                  - '    feat <message...> '
                  - '    fix <message...> '
                  - '    log '
                  - '    push '
                  - '    status '
                  - '    sync '
                  - '    unwip '
                  - '    wip '
    - command: 'run git 2>&1 | /usr/bin/grep -c ''Error:'''
      exit: 1
      stdout: |
          0
