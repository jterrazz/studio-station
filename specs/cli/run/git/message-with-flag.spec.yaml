description: 'a commit message holding --json or -m reaches git untouched, as one word'
fixture: ./__fixtures__/git/
runs:
    - command: 'run git feat handle --json flag'
      exit: 0
      files:
          .calls:
              equals: |
                  git <add> <.>
                  git <commit> <-m> <feat: handle --json flag>
    - command: 'run git fix -m again'
      exit: 0
      files:
          .calls:
              contains: 'git <commit> <-m> <fix: -m again>'
