description: 'sync pulls even when fetch -p fails: that one failure is ignored'
fixture:
    - ./__fixtures__/git/
    - ./__fixtures__/fetch-fails/
runs:
    - command: 'run git sync'
      exit: 0
      stderr: |
          fatal: fetch failed
      files:
          .calls:
              equals: |
                  git <fetch> <-p>
                  git <pull>
