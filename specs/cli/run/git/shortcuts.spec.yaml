description: 'each of the ten git shortcuts hands git its own argv, a message as ONE word; git prints on stdout'
fixture: ./__fixtures__/git/
runs:
    - command: 'run git branches'
      exit: 0
    - command: 'run git chore tidy the tests'
      exit: 0
    - command: 'run git feat add login'
      exit: 0
    - command: 'run git fix off by one'
      exit: 0
    - command: 'run git log'
      exit: 0
    - command: 'run git push'
      exit: 0
    - command: 'run git status'
      exit: 0
      stdout: |
          On branch main
    - command: 'run git sync'
      exit: 0
    - command: 'run git unwip'
      exit: 0
    - command: 'run git wip'
      exit: 0
      files:
          .calls:
              equals: |
                  git <branch>
                  git <add> <.>
                  git <commit> <-m> <chore: tidy the tests>
                  git <add> <.>
                  git <commit> <-m> <feat: add login>
                  git <add> <.>
                  git <commit> <-m> <fix: off by one>
                  git <log> <--oneline> <-10>
                  git <push> <-u> <origin> <HEAD>
                  git <status>
                  git <fetch> <-p>
                  git <pull>
                  git <reset> <--soft> <HEAD~1>
                  git <reset> <HEAD>
                  git <add> <--all>
                  git <commit> <-m> <WIP>
