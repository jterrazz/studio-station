description: 'config, config install and config uninstall run settings, apply and off, with the new words'
env: two-macs
runs:
    - command: 'config | /usr/bin/grep -c hushlogin'
      exit: 0
      stdout: |
          1
      stderr: |
          → now: station settings
    - command: 'config install hushlogin'
      exit: 0
      stdout: |
          ●	hushlogin	~/.hushlogin: created
      stderr: |
          → now: station settings apply hushlogin
    - command: 'config uninstall hushlogin --yes'
      exit: 0
      stdout: |
          ●	hushlogin	~/.hushlogin: removed
      stderr: |
          → now: station settings off hushlogin --yes
    - command: 'config --json | /usr/bin/jq -r .schema'
      exit: 0
      stdout: |
          station.settings.list/v1
