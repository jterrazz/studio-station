description: 'station status, the v2 word, prints the overview and names station overview, hidden from the help'
env: two-macs
runs:
    - command: 'status 2>notice.txt | /usr/bin/head -1; /bin/cat notice.txt'
      exit: 0
      stdout: |
          # Machine
          → now: station overview
    - command: 'help | /usr/bin/grep -c "status"'
      exit: 1
      stdout: |
          0
