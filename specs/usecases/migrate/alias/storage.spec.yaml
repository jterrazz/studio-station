description: 'storage, storage clean and storage reset run disk, free and erase, and say the new words'
env: two-macs
runs:
    - command: 'storage | /usr/bin/head -1'
      exit: 0
      stdout: |
          ◐	This Mac	388.0 GB free · 994.0 GB total · 1 misplaced folder	station disk move ~/.tart
      stderr: |
          → now: station disk
    - command: 'storage clean go'
      exit: 0
      stdout: |
          ●	go	19.4 GB freed
          ●	Freed	19.4 GB	nothing is lost
      stderr: |
          → now: station disk free go
    - command: 'storage reset xcode'
      exit: 2
      stderr: |
          → now: station disk erase xcode
          Error: refusing without the name typed: xcode
          Hint: in a script: --confirm=xcode
    - command: 'storage reset xcode --confirm=xcode'
      exit: 0
      stdout: |
          ●	xcode	5.8 GB erased
      stderr: |
          → now: station disk erase xcode --confirm=xcode
    - command: 'storage --json | /usr/bin/jq -r .schema'
      exit: 0
      stdout: |
          station.disk.read/v1
