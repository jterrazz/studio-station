description: 'run git <shortcut> runs git''s own alias with the same words, named on stderr'
fixture: ./__fixtures__/git/
env: two-macs
runs:
    - command: 'settings apply git-shortcuts'
      exit: 0
      stdout: |
          ●	git-shortcuts	~/.gitconfig [alias]: written
    - command: 'run git wip'
      exit: 0
      stderr: |
          → now: git wip
      files:
          .calls:
              equals: |
                  git <wip>
    - command: 'run git feat handle --json flag'
      exit: 0
      stderr: |
          → now: git feat handle --json flag
      files:
          .calls:
              contains: 'git <feat> <handle> <--json> <flag>'
    - command: 'run git log'
      exit: 0
      stderr: |
          → now: git lg
      files:
          .calls:
              contains: 'git <lg>'
