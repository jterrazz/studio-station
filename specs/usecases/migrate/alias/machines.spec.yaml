description: 'the v2 words create --lifetime, --always-on and machines probe run the v3 command, named on stderr'
env: two-macs
runs:
    - command: 'machines create box --lifetime lasting | /usr/bin/tail -1'
      exit: 0
      stdout: |
          ●	box	Created	Permanent · 4 CPU · 4 GB · 20 GB
      stderr: |
          → now: station machines create box --permanent
    - command: 'machines create infra-2 --always-on --on mac-mini | /usr/bin/grep infra-2'
      exit: 0
      stdout: |
          ●	infra-2	is a server	always on · 4 CPU · 8 GB · 50 GB
      stderr: |
          → now: station machines create infra-2 --server
    - command: 'machines probe jterrazz-macbook-pro | /usr/bin/head -1'
      exit: 0
      stdout: |
          # Needs you
      stderr: |
          → now: station machines jterrazz-macbook-pro
    - command: 'machines probe jterrazz-macbook-pro --json | /usr/bin/jq -c ''{schema, machine: .machine.name}'''
      exit: 0
      stdout: |
          {"schema":"station.overview.read/v1","machine":"jterrazz-macbook-pro"}
    - command: 'machines probe infra'
      exit: 0
      stdout: |
          	On infra:
          	Ports	Public 0 · Private 0
          	SSH	ssh infra
          	Apps, settings, accounts: not managed by station
          # Health
          ●	Running
          ●	Has an address	192.168.64.5
          ●	SSH answers
          ●	Size	8 CPU · 24 GB · 80 GB
          ●	Own Tailscale device	infra
      stderr: |
          → now: station machines infra
