description: 'station stop and station start run engine stop and engine start, and say the new words on stderr'
env: two-macs
runs:
    - command: 'stop --yes'
      exit: 0
      stdout: |
          ●	engine	stopped 1 VM (linux-1) · the engine stopped
      stderr: |
          → now: station engine stop --yes
    - command: 'start'
      exit: 0
      stdout: |
          ●	engine	running · {{string}}
      stderr: |
          → now: station engine start
