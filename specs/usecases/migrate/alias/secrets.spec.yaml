description: 'secrets, lend --to and recall --from run accounts, share and take-back, naming one account'
env: two-macs
runs:
    - command: 'secrets | /usr/bin/head -1'
      exit: 0
      stdout: |
          ●	github	signed in	jterrazz	read:org · repo
      stderr: |
          → now: station accounts
    - command: 'secrets recall --from linux-1 --yes'
      exit: 0
      stdout: |
          ●	github	taken back from linux-1
          ●	claude	taken back from linux-1
      stderr: |
          → now: station accounts take-back <account> --from=linux-1 --yes
    - command: '--version >/dev/null; /usr/bin/jq -c ''[(.macs["linux-1"].secrets // {} | keys), (.macs["jterrazz-macbook-pro"].stores.shares["linux-1"] // [] | map(.name))]'' world.json'
      exit: 0
      stdout: |
          [[],[]]
    - command: 'secrets lend --to linux-1'
      exit: 0
      stdout: |
          ●	claude	shared with linux-1	12 h
          ●	github	shared with linux-1	12 h
      stderr: |
          → now: station accounts share <account> --with=linux-1
    - command: '--version >/dev/null; /usr/bin/jq -c ''[(.macs["linux-1"].secrets // {} | keys), (.macs["jterrazz-macbook-pro"].stores.shares["linux-1"] // [] | map(.name))]'' world.json'
      exit: 0
      stdout: |
          [["operator:claude:oauth-token","session:github"],["operator:claude:oauth-token","session:github"]]
    - command: 'secrets --json | /usr/bin/jq -r .schema'
      exit: 0
      stdout: |
          station.accounts.list/v1
