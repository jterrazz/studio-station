description: 'secrets, lend --to and recall --from run accounts, share and take-back, and say so'
env: two-macs
runs:
    - command: 'secrets | /usr/bin/head -1'
      exit: 0
      stdout: |
          ●	github	signed in	jterrazz	read:org · repo
      stderr: |
          → now: station accounts
    - command: 'secrets recall --from linux-1 --yes'
      exit: 0
      stdout: |
          ●	github	taken back from linux-1
          ●	claude	taken back from linux-1
      stderr: |
          → now: station accounts take-back --from linux-1 --yes
    - command: 'secrets lend --to linux-1'
      exit: 0
      stdout: |
          ●	claude	shared with linux-1	12 h
          ●	github	shared with linux-1	12 h
      stderr: |
          → now: station accounts share --with linux-1
    - command: 'secrets --json | /usr/bin/jq -r .schema'
      exit: 0
      stdout: |
          station.accounts.list/v1
