description: 'secrets allow and disallow are refused, exit 2, the hint the share list'
env: two-macs
runs:
    - command: 'secrets allow session:openpanel'
      exit: 2
      stderr: |
          Error: station secrets allow is retired: the share list is written by hand
          Hint: the share list is share_list in ~/.config/station/preferences.json
    - command: 'secrets disallow session:github --yes'
      exit: 2
      stderr: |
          Error: station secrets disallow is retired: the share list is written by hand
          Hint: the share list is share_list in ~/.config/station/preferences.json
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].preferences | [.share_list, .lend_list]'' world.json'
      exit: 0
      stdout: |
          [null,null]
