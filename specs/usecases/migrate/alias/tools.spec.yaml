description: 'station tools and its verbs run station apps and its verbs, and say the new words on stderr'
env: two-macs
runs:
    - command: 'tools | /usr/bin/head -1'
      exit: 0
      stdout: |
          # Updates	3 ◐
      stderr: |
          → now: station apps
    - command: 'tools install jq'
      exit: 0
      stdout: |
          ●	jq	1.8.1	brew	already installed
      stderr: |
          → now: station apps install jq
    - command: 'tools uninstall jq --yes'
      exit: 0
      stdout: |
          ●	jq		brew
      stderr: |
          → now: station apps remove jq --yes
    - command: 'tools upgrade --via brew'
      exit: 0
      stdout: |
          ●	ghostty	1.2.1	cask
          ●	gh	2.98.0	brew
      stderr: |
          → now: station apps update --manager=brew
    - command: 'tools --json | /usr/bin/jq -r .schema'
      exit: 0
      stdout: |
          station.apps.list/v1
