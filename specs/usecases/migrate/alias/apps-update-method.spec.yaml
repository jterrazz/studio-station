description: 'v3.0''s apps update --method runs --manager, skills read as skill, with its now-line'
env: two-macs
runs:
    - command: 'apps update --method brew'
      exit: 0
      stdout: |
          ●	gh	2.98.0	brew
      stderr: |
          → now: station apps update --manager brew
    - command: 'apps update --method skills'
      exit: 0
      stdout: |
          ●	every app is up to date on This Mac
      stderr: |
          → now: station apps update --manager skill
    - command: 'apps update --help | /usr/bin/grep -c -- --method'
      exit: 1
      stdout: |
          0
