description: 'a record saying throwaway or permanent, temporary or lasting reads as ephemeral or persistent'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].vms["linux-1"].kept.lifetime = "throwaway" | .macs["jterrazz-macbook-pro"].vms.api.kept.lifetime = "permanent"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'machines --this-mac | /usr/bin/grep -E "linux-1|api"'
      exit: 0
      stdout: |
          ○	api	Workspace	jterrazz-macbook-pro	Stopped · persistent	4 CPU	8 GB
          ●	linux-1	Workspace	jterrazz-macbook-pro	Running · ephemeral	4 CPU	8 GB
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].vms["linux-1"].kept.lifetime = "temporary" | .macs["jterrazz-macbook-pro"].vms.api.kept.lifetime = "lasting"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'machines --this-mac | /usr/bin/grep -E "linux-1|api"'
      exit: 0
      stdout: |
          ○	api	Workspace	jterrazz-macbook-pro	Stopped · persistent	4 CPU	8 GB
          ●	linux-1	Workspace	jterrazz-macbook-pro	Running · ephemeral	4 CPU	8 GB
