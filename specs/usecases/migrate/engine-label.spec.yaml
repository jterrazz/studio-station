description: 'the v2 job com.jterrazz.station.daemon is removed once; the engine runs under its new label'
env: fresh-v2
runs:
    - command: 'setup > /dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].jobs | keys'' world.json'
      exit: 0
      stdout: |
          ["com.jterrazz.station.engine"]
    - command: 'engine --json | /usr/bin/jq -r .engine.state'
      exit: 0
      stdout: |
          running
