description: 'an engine older than station reads as running, the two versions named, and setup to match them'
env: two-macs
runs:
    - command: 'world upgrade jterrazz-macbook-pro v3.0.0'
      exit: 0
    - command: 'engine'
      exit: 0
      stdout: |
          ◐	engine	running · v3.0.0 · up 3 d · 1 VM	the engine runs v3.0.0, station is {{string}}	station setup
