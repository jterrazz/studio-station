description: 'the engine read is station.engine.read/v1: its state, version, uptime and VMs, and no stop while it runs'
env: two-macs
runs:
    - command: 'engine --json | /usr/bin/jq -c ''[.schema, .engine.state, (.engine.version | length > 0), (.engine.up_s >= 259200), .engine.vms, .engine.stopped_at, .engine.stopped_by]'''
      exit: 0
      stdout: |
          ["station.engine.read/v1","running",true,true,1,null,null]
