description: 'low Power Mode ends a keep-awake, and says so'
env: two-macs
runs:
    - command: 'awake 4h'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	stays awake until 14:00
    - command: 'world low-power on'
      exit: 0
    - command: 'awake | /usr/bin/sed -n 1,2p'
      exit: 0
      stdout: |
          # Awake
          ◐	jterrazz-macbook-pro	Awake stopped · Low Power Mode on
    - command: '--version >/dev/null; /usr/bin/jq -c ''[.macs["jterrazz-macbook-pro"].power.holds, [.told[] | .Text]]'' world.json'
      exit: 0
      stdout: |
          [null,["Awake stopped: Low Power Mode on"]]
