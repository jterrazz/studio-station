description: 'a keep-awake ends at its term: the assertion goes, and the lid sleeps the Mac again'
env: two-macs
runs:
    - command: 'awake 4h --lid'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	stays awake until 14:00 · lid closed
    - command: 'world advance 4h'
      exit: 0
    - command: 'awake | /usr/bin/sed -n 1,2p'
      exit: 0
      stdout: |
          # Awake
          ○	jterrazz-macbook-pro	Sleeps normally
    - command: '--version >/dev/null; /usr/bin/jq -c ''[(.macs["jterrazz-macbook-pro"].power | {holds, clamshell}), [.told[] | .Text]]'' world.json'
      exit: 0
      stdout: |
          [{"holds":null,"clamshell":null},["Awake stopped: its 4h ended"]]
