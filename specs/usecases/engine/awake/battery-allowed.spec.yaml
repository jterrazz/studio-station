description: 'with --battery a --lid keep-awake stays awake unplugged with its lid closed'
env: two-macs
runs:
    - command: 'awake 4h --lid --battery'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	stays awake until 14:00 · lid closed · on battery allowed
    - command: 'world close-lid'
      exit: 0
    - command: 'world unplug'
      exit: 0
    - command: 'awake | /usr/bin/sed -n 1,2p'
      exit: 0
      stdout: |
          # Awake
          ●	jterrazz-macbook-pro	Awake until 14:00 · lid closed · on battery allowed · 3h 59m left
    - command: '--version >/dev/null; /usr/bin/jq -c ''[(.macs["jterrazz-macbook-pro"].power | {holds, clamshell}), .told]'' world.json'
      exit: 0
      stdout: |
          [{"holds":["station: station awake 4h --lid --battery"],"clamshell":true},null]
