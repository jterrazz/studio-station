description: 'a reboot of its Mac leaves every workspace stopped and kept: a workspace never starts by itself'
env: two-macs
runs:
    - command: 'world reboot jterrazz-macbook-pro'
      exit: 0
    - command: 'machines --this-mac'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	Mac	jterrazz-macbook-pro	Engine running
          ○	api	Workspace	jterrazz-macbook-pro	Stopped · permanent	4 CPU	8 GB
          ○	linux-1	Workspace	jterrazz-macbook-pro	Stopped · throwaway	4 CPU	8 GB	ended with its Mac
