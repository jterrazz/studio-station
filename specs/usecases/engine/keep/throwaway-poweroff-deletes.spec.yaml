description: 'a throwaway workspace whose guest powers off is deleted by the engine, its disk with it'
env: two-macs
runs:
    - command: 'world poweroff-inside linux-1'
      exit: 0
    - command: 'machines --here'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	Mac	jterrazz-macbook-pro	Engine running
          ○	api	Workspace	jterrazz-macbook-pro	Stopped · permanent	4 CPU	8 GB
