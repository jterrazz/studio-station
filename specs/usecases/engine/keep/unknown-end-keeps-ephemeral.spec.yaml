description: 'an ephemeral workspace whose run ends for no reason anyone can read is kept, never deleted'
env: two-macs
runs:
    - command: 'world fault Hypervisor.Ended'
      exit: 0
    - command: 'world poweroff-inside linux-1'
      exit: 0
    - command: 'machines --this-mac'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	Mac	jterrazz-macbook-pro	Engine running
          ○	api	Workspace	jterrazz-macbook-pro	Stopped · persistent	4 CPU	8 GB
          ◐	linux-1	Workspace	jterrazz-macbook-pro	Ended unexpectedly · ephemeral	4 CPU	8 GB
          # Needs you
          ◐	linux-1	ended unexpectedly	station machines start linux-1
