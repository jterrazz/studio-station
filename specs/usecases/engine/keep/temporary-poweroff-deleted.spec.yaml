description: 'a temporary VM whose guest powers off is deleted by the engine, its disk with it'
env: two-macs
runs:
    - command: 'world poweroff-inside linux-1'
      exit: 0
    - command: 'machines --here'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	host			online	-	1 VM
          ○	api	linux	jterrazz-macbook-pro	lasting	stopped	-	4 cpus · 8 GB · 50.0 GB
