description: 'a workspace that reboots four times within a minute is stopped as a loop, and kept'
env: two-macs
runs:
    - command: 'world reboot-inside linux-1'
      exit: 0
    - command: 'world reboot-inside linux-1'
      exit: 0
    - command: 'world reboot-inside linux-1'
      exit: 0
    - command: 'world reboot-inside linux-1'
      exit: 0
    - command: 'machines --here'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	Mac	jterrazz-macbook-pro	Engine running
          ○	api	Workspace	jterrazz-macbook-pro	Stopped · permanent	4 CPU	8 GB
          ✗	linux-1	Workspace	jterrazz-macbook-pro	Broken · throwaway	4 CPU	8 GB	stopped 4 times within 60 s
          # Needs you
          ✗	linux-1	stopped 4 times within 60 s	station machines delete linux-1
