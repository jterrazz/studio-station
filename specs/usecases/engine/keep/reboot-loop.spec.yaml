description: 'a workspace whose three boots within a minute end in reboots is stopped as a loop, and kept'
env: two-macs
runs:
    - command: 'world reboot-inside linux-1'
      exit: 0
    - command: 'world reboot-inside linux-1'
      exit: 0
    - command: 'machines --here'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	Mac	jterrazz-macbook-pro	Engine running
          ○	api	Workspace	jterrazz-macbook-pro	Stopped · permanent	4 CPU	8 GB
          ●	linux-1	Workspace	jterrazz-macbook-pro	Running · throwaway	4 CPU	8 GB
    - command: 'world reboot-inside linux-1'
      exit: 0
    - command: 'machines --here'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	Mac	jterrazz-macbook-pro	Engine running
          ○	api	Workspace	jterrazz-macbook-pro	Stopped · permanent	4 CPU	8 GB
          ✗	linux-1	Workspace	jterrazz-macbook-pro	In a loop · throwaway	4 CPU	8 GB	rebooting in a loop · stopped
          # Needs you
          ✗	linux-1	rebooting in a loop, stopped	station machines delete linux-1
