description: 'once a run stayed up 10 min, the next crash waits 5 s again, and the count goes on'
env: two-macs
runs:
    - command: 'world crash infra'
      exit: 0
    - command: 'machines infra | /usr/bin/grep Restarts'
      exit: 0
      stdout: |
          ●	Restarts	↺ 1 · last just now
    - command: 'world crash infra'
      exit: 0
    - command: 'machines infra --json | /usr/bin/jq -c ''[.restarts, .restarted_after_s]'''
      exit: 0
      stdout: |
          [2,10]
    - command: 'world advance 10m'
      exit: 0
    - command: 'world crash infra'
      exit: 0
    - command: 'machines infra --json | /usr/bin/jq -c ''[.restarts, .restarted_after_s]'''
      exit: 0
      stdout: |
          [3,5]
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-mac-mini"].vms.infra | ((.up_at | fromdate) - (.down_at | fromdate)) as $down | [$down >= 5, $down <= 6]'' world.json'
      exit: 0
      stdout: |
          [true,true]
