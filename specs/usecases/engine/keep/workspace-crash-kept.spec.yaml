description: 'a workspace whose run crashes is kept, never started again: the owner starts or deletes it'
env: two-macs
runs:
    - command: 'world crash linux-1'
      exit: 0
    - command: 'machines --here'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	mac			online	-	2 VMs
          ○	api	workspace	jterrazz-macbook-pro	permanent	stopped	-	4 cpus · 8 GB · 50.0 GB
          ◐	linux-1	workspace	jterrazz-macbook-pro	throwaway	stale	-	ended unexpectedly · start or delete it
