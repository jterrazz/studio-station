description: 'a port that listens outside the rights is flagged with them and never reserved nor served'
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/linux-1.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: linux-1
          machine: { kind: workspace }
          ports: { open: 3000-3999, to: private }
      exit: 0
    - command: 'world listen linux-1 "*:8443" node'
      exit: 0
    - command: 'ports | /usr/bin/grep "	8443	"'
      exit: 0
      stdout: |
          ◐	linux-1	8443	private		listens, not allowed (open: 3000-3999)	node	station ports share linux-1 8443
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"] | {reserved: [(.stores.reservations // [])[] | [.guest_port, .host_port, .to]], shared: [(.tailnet.shares // [])[] | [.Port, .Reserved, .To]], funnel: .tailnet.funnel}'' world.json'
      exit: 0
      stdout: |
          {"reserved":[],"shared":[],"funnel":null}
