description: 'a port open to local is carried to its Mac''s loopback alone: no serve, its link the local one'
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/linux-1.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: linux-1
          machine: { kind: workspace }
          ports: { open: 3000-3999, to: local }
      exit: 0
    - command: 'world listen linux-1 "*:3000" node'
      exit: 0
    - command: 'ports | /usr/bin/grep "	3000	"'
      exit: 0
      stdout: |
          ●	linux-1	3000	this machine only	http://127.0.0.1:{{port}}	shared	node
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"] | {reserved: [(.stores.reservations // [])[] | select(.guest_port != 5173 and .guest_port != 7000) | [.guest_port, .host_port, .to]], shared: [(.tailnet.shares // [])[] | [.Port, .Reserved, .To]], funnel: .tailnet.funnel}'' world.json'
      exit: 0
      stdout: |
          {"reserved":[[3000,40000,"local"]],"shared":[[40001,40001,"private"],[40002,40002,"private"]],"funnel":null}
