description: 'a port the rights except is flagged, its neighbours shared'
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/linux-1.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: linux-1
          machine: { kind: workspace }
          ports: { open: 3000-3999, to: private, except: [3001] }
      exit: 0
    - command: 'world listen linux-1 "*:3000" node'
      exit: 0
    - command: 'world listen linux-1 "*:3001" node'
      exit: 0
    - command: 'ports | /usr/bin/grep -e "	3000	" -e "	3001	"'
      exit: 0
      stdout: |
          ●	linux-1	3000	private	https://jterrazz-macbook-pro.tail1234.ts.net:40000	shared	node	probably Node or Next
          ◐	linux-1	3001	private		listens, not allowed (open: 3000-3999; except: 3001)	node	station ports share linux-1 3001
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"] | {reserved: [(.stores.reservations // [])[] | [.guest_port, .host_port, .to]], shared: [(.tailnet.shares // [])[] | [.Port, .Reserved, .To]], funnel: .tailnet.funnel}'' world.json'
      exit: 0
      stdout: |
          {"reserved":[[3000,40000,null]],"shared":[[40000,40000,"private"]],"funnel":null}
