description: 'a new port is reserved past one the Mac already listens on: the next free port is taken and shared'
env: two-macs
runs:
    - command: 'world listen jterrazz-macbook-pro 127.0.0.1:40000 postgres'
      exit: 0
    - command: 'world listen linux-1 "*:8000" python'
      exit: 0
    - command: 'ports | /usr/bin/grep 8000'
      exit: 0
      stdout: |
          ●	linux-1	8000	https://jterrazz-macbook-pro.tail1234.ts.net:40003	shared	python
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"] | {reserved: [.stores.reservations[] | select(.guest_port == 8000) | .host_port], shared: [.tailnet.shares[].Reserved]}'' world.json'
      exit: 0
      stdout: |
          {"reserved":[40003],"shared":[40001,40002,40003]}
