description: 'a port that listens again is shared on the same reserved port, at the same URL'
env: two-macs
runs:
    - command: 'world unlisten linux-1 5173'
      exit: 0
    - command: 'ports | /usr/bin/grep 5173'
      exit: 0
      stdout: |
          ○	linux-1	5173	https://jterrazz-macbook-pro.tail1234.ts.net:40001	not listening · reserved 40001		vite
    - command: 'world listen linux-1 "*:5173" node'
      exit: 0
    - command: 'ports | /usr/bin/grep 5173'
      exit: 0
      stdout: |
          ●	linux-1	5173	https://jterrazz-macbook-pro.tail1234.ts.net:40001	shared	node	vite
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"] | {reserved: [(.stores.reservations // [])[] | [.vm, .guest_port, .host_port]], shared: [(.tailnet.shares // [])[] | .Reserved]}'' world.json'
      exit: 0
      stdout: |
          {"reserved":[["linux-1",5173,40001],["linux-1",7000,40002]],"shared":[40002,40001]}
