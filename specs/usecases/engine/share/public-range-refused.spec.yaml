description: 'a Machinefile opening a public range is refused: nothing shared, each port flagged with why'
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/linux-1.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: linux-1
          machine: { kind: workspace }
          ports: { open: 3000-3999, to: public }
      exit: 0
    - command: 'world listen linux-1 "*:3000" node'
      exit: 0
    - command: 'ports | /usr/bin/grep "	3000	"'
      exit: 0
      stdout: |
          ◐	linux-1	3000	private		listens, not allowed (~/.config/station/machinefiles/linux-1.yaml:4: public opens ports one by one, never a range (3000-3999))	node	station ports share linux-1 3000
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"] | {reserved: [(.stores.reservations // [])[] | [.guest_port, .host_port, .to]], shared: [(.tailnet.shares // [])[] | [.Port, .Reserved, .To]], funnel: .tailnet.funnel}'' world.json'
      exit: 0
      stdout: |
          {"reserved":[],"shared":[],"funnel":null}
