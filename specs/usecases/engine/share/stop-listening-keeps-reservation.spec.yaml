description: 'a shared port that stops listening is unshared, and keeps its reserved port'
env: two-macs
runs:
    - command: 'world unlisten linux-1 5173'
      exit: 0
    - command: 'world advance 5s'
      exit: 0
    - command: 'ports | /usr/bin/grep 5173'
      exit: 0
      stdout: |
          ○	linux-1	5173	private	https://jterrazz-macbook-pro.tail1234.ts.net:40001	not listening · reserved 40001		probably Vite
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"] | {reserved: [(.stores.reservations // [])[] | [.vm, .guest_port, .host_port]], shared: [(.tailnet.shares // [])[] | .Reserved]}'' world.json'
      exit: 0
      stdout: |
          {"reserved":[["linux-1",5173,40001],["linux-1",7000,40002]],"shared":[40002]}
