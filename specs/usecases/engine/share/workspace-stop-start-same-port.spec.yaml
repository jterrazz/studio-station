description: 'a workspace stopped and started again shares its port on the same reserved port and URL'
env: two-macs
runs:
    - command: 'machines start api'
      exit: 0
      stdout: |
          ●	api	started
    - command: 'world listen api "*:3000" node'
      exit: 0
    - command: 'ports | /usr/bin/grep "api	3000"'
      exit: 0
      stdout: |
          ●	api	3000	private	https://jterrazz-macbook-pro.tail1234.ts.net:40000	shared	node
    - command: 'machines stop api --yes'
      exit: 0
      stdout: |
          ●	api	stopped, kept
    - command: 'ports | /usr/bin/grep "api	3000"'
      exit: 0
      stdout: |
          ○	api	3000	private	https://jterrazz-macbook-pro.tail1234.ts.net:40000	not shared while api is stopped · reserved 40000
    - command: 'machines start api'
      exit: 0
      stdout: |
          ●	api	started
    - command: 'world listen api "*:3000" node'
      exit: 0
    - command: 'ports | /usr/bin/grep "api	3000"'
      exit: 0
      stdout: |
          ●	api	3000	private	https://jterrazz-macbook-pro.tail1234.ts.net:40000	shared	node
