description: 'a Funnel port the owner funneled outside station is never replaced: its public port is refused'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].tailnet.shares += [{Port: 443, Path: "/", Scheme: "https", Target: "http://127.0.0.1:8080", To: "public"}] | .macs["jterrazz-macbook-pro"].tailnet.funnel = [443]'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'world edit jterrazz-macbook-pro machinefiles/linux-1.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: linux-1
          machine: { kind: workspace }
          ports: { open: [3000], to: public }
      exit: 0
    - command: 'world listen linux-1 "*:3000" node'
      exit: 0
    - command: 'ports | /usr/bin/grep "	3000	"'
      exit: 0
      stdout: |
          ◐	linux-1	3000	public	https://jterrazz-macbook-pro.tail1234.ts.net:443	local only · serve: Funnel port 443 already serves an entry station did not make	node
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"] | {reserved: [(.stores.reservations // [])[] | select(.vm == "linux-1") | [.guest_port, .host_port, .to, .by]], shared: [(.tailnet.shares // [])[] | [.Port, .Path, .Reserved, .To]], funnel: .tailnet.funnel}'' world.json'
      exit: 0
      stdout: |
          {"reserved":[[3000,40000,"public",null]],"shared":[[443,"/",0,"public"]],"funnel":[443]}
