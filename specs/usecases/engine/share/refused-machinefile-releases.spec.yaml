description: 'a Machinefile the decoder refuses, read at the next run, releases every reservation the rights made'
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/linux-1.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: linux-1
          machine: { kind: workspace }
          ports: { open: 3000-3999, to: public }
      exit: 0
    - command: 'machines stop linux-1 --yes'
      exit: 0
      stdout: |
          ●	linux-1	stopped, kept
    - command: 'machines start linux-1'
      exit: 0
      stdout: |
          ●	linux-1	started
    - command: 'ports | /usr/bin/grep linux-1'
      exit: 0
      stdout: |
          ◐	linux-1	5173	private		listens, not allowed (~/.config/station/machinefiles/linux-1.machine.yaml:4: public opens ports one by one, never a range (3000-3999))	node	probably Vite · station ports share linux-1 5173
          ◐	linux-1	7000	private		listens, not allowed (~/.config/station/machinefiles/linux-1.machine.yaml:4: public opens ports one by one, never a range (3000-3999))	server	station ports share linux-1 7000
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"] | {reserved: [(.stores.reservations // [])[] | select(.vm == "linux-1") | [.guest_port, .host_port, .to, .by]], shared: [(.tailnet.shares // [])[] | [.Port, .Path, .Reserved, .To]], funnel: .tailnet.funnel}'' world.json'
      exit: 0
      stdout: |
          {"reserved":[],"shared":[],"funnel":null}
