description: 'rights narrowed from public to private: the engine that adopts the VM unfunnels what they close'
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/linux-1.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: linux-1
          machine: { kind: workspace }
          ports: { open: [3000, 3001], to: public }
      exit: 0
    - command: 'world listen linux-1 "*:3000" node'
      exit: 0
    - command: 'world listen linux-1 "*:3001" node'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"] | {reserved: [(.stores.reservations // [])[] | select(.vm == "linux-1") | [.guest_port, .host_port, .to, .by]], shared: [(.tailnet.shares // [])[] | [.Port, .Path, .Reserved, .To]], funnel: .tailnet.funnel}'' world.json'
      exit: 0
      stdout: |
          {"reserved":[[3000,40000,"public",null],[3001,40001,"public",null]],"shared":[[443,"/",40000,"public"],[8443,"/",40001,"public"]],"funnel":[443,8443]}
    - command: 'world edit jterrazz-macbook-pro machinefiles/linux-1.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: linux-1
          machine: { kind: workspace }
          ports: { open: [3000], to: private }
      exit: 0
    - command: 'world engine-crash jterrazz-macbook-pro'
      exit: 0
    - command: 'ports | /usr/bin/grep linux-1'
      exit: 0
      stdout: |
          ●	linux-1	3000	private	https://jterrazz-macbook-pro.tail1234.ts.net:40000	shared	node
          ◐	linux-1	3001	private		listens, not allowed (open: 3000)	node	station ports share linux-1 3001
          ◐	linux-1	5173	private		listens, not allowed (open: 3000)	node	vite · station ports share linux-1 5173
          ◐	linux-1	7000	private		listens, not allowed (open: 3000)	server	station ports share linux-1 7000
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"] | {reserved: [(.stores.reservations // [])[] | select(.vm == "linux-1") | [.guest_port, .host_port, .to, .by]], shared: [(.tailnet.shares // [])[] | [.Port, .Path, .Reserved, .To]], funnel: .tailnet.funnel}'' world.json'
      exit: 0
      stdout: |
          {"reserved":[[3000,40000,null,null]],"shared":[[40000,"/",40000,"private"]],"funnel":null}
