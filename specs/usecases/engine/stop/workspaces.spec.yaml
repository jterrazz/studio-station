description: 'stop everything stops the running VM, keeps its disk, and stops the engine'
env: two-macs
runs:
    - command: 'engine stop --yes'
      exit: 0
      stdout: |
          ●	engine	stopped 1 VM (linux-1) · sharing off · the engine stopped
    - command: 'engine'
      exit: 0
      stdout: |
          ◐	engine	stopped · since {{string}} by station engine stop	station engine start
    - command: 'machines --this-mac'
      exit: 0
      stdout: |
          ✗	jterrazz-macbook-pro	Mac	jterrazz-macbook-pro	Engine stopped
          ○	api	Workspace	jterrazz-macbook-pro	Stopped · persistent	4 CPU	8 GB
          ○	linux-1	Workspace	jterrazz-macbook-pro	Stopped · ephemeral	4 CPU	8 GB
          # Needs you
          ✗	This Mac	has its engine stopped	station engine start
