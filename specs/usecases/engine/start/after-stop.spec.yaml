description: 'start runs the engine again; the VMs the stop stopped stay stopped'
env: engine-stopped
runs:
    - command: 'engine start'
      exit: 0
      stdout: |
          ●	engine	running · {{string}}
    - command: 'machines --this-mac'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	Mac	jterrazz-macbook-pro	Engine running
          ○	api	Workspace	jterrazz-macbook-pro	Stopped · persistent	4 CPU	8 GB
          ○	linux-1	Workspace	jterrazz-macbook-pro	Stopped · ephemeral	4 CPU	8 GB
