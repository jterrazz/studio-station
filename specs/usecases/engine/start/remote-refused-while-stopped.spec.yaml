description: 'a Mac whose engine is stopped refuses a start sent through --on, reads as stopped, starts again'
env: two-macs
runs:
    - command: 'machines stop infra --on jterrazz-mac-mini --confirm=infra'
      exit: 0
      stdout: |
          ●	infra	stopped · wanted state: Stopped
    - command: 'engine stop --yes --on jterrazz-mac-mini'
      exit: 0
      stdout: |
          ●	engine	the engine stopped
    - command: 'machines start infra --on jterrazz-mac-mini'
      exit: 1
      stderr: |
          Error: the engine is stopped on This Mac
          Hint: station engine start
    - command: 'engine --on jterrazz-mac-mini'
      exit: 0
      stdout: |
          ◐	engine	stopped · since 10:01 by station engine stop	station engine start
    - command: 'engine start --on jterrazz-mac-mini'
      exit: 0
      stdout: |
          ●	engine	running · {{string}}
