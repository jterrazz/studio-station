description: 'the engine samples each machine every 60 s, every 2 s while a surface watches it'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; for i in 1 2 3 4 5; do "$STATION" world advance 1m; done; /usr/bin/jq -r ''.macs["jterrazz-macbook-pro"].engine.activity | to_entries[] | .key as $m | (.value.series.coarse | map(.at | fromdate)) as $t | [range(1; $t | length) | $t[.] - $t[. - 1]] | "\($m): never closer than 60 s: \(min >= 60), never 2 min without one: \(max < 120)"'' world.json'
      exit: 0
      stdout: |
          jterrazz-macbook-pro: never closer than 60 s: true, never 2 min without one: true
          linux-1: never closer than 60 s: true, never 2 min without one: true
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].engine.watched = true'' world.json > w.json && /bin/mv w.json world.json; for i in 1 2 3 4 5; do "$STATION" world advance 2s; done; /usr/bin/jq -r ''.macs["jterrazz-macbook-pro"].engine.activity | to_entries[] | .key as $m | (.value.series.fine[-6:] | map(.at | fromdate)) as $t | [range(1; $t | length) | $t[.] - $t[. - 1]] | "\($m): watched, the closest two samples \(min) s apart"'' world.json'
      exit: 0
      stdout: |
          jterrazz-macbook-pro: watched, the closest two samples 2 s apart
          linux-1: watched, the closest two samples 2 s apart
