description: 'each Mac''s engine keeps the history of itself and its own VMs; This Mac keeps none of the mini''s'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" world advance 1m; /usr/bin/jq -c ''.macs | to_entries[] | select(.value.engine) | [.key, (.value.engine.activity | keys)]'' world.json'
      exit: 0
      stdout: |
          ["jterrazz-mac-mini",["infra","jterrazz-mac-mini"]]
          ["jterrazz-macbook-pro",["jterrazz-macbook-pro","linux-1"]]
