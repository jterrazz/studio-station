description: 'on battery at 20 % needs a look: Battery low, fixed by plugging in'
env:
    - on-battery
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].power.Percent = 20 | .macs["jterrazz-macbook-pro"].meter = {"sample": {"cpus": 10, "mem_total": 17179869184}, "top": {"cpu": [], "memory": []}}'' world.json > w.json && /bin/mv w.json world.json; "$STATION" world advance 1m; "$STATION" activity | /usr/bin/grep -E "Battery"'
      exit: 0
      stdout: |
          ◐	Battery low: 20 %	plug in
          	Battery	20 % · on battery
