description: 'this Mac under 5 % free is told once; at 8 % it is not told'
env:
    - disk-low
    - engine
runs:
    - command: '--version >/dev/null; for i in 1 2 3; do "$STATION" world advance 1m; done; /usr/bin/jq -c ''[(.told // [])[] | select(.Kind == "disk_low") | .Text]'' world.json'
      exit: 0
      stdout: |
          ["This Mac: 4 % of its disk is free"]
    - command: '--version >/dev/null; /usr/bin/jq ''.told = [] | .macs["jterrazz-macbook-pro"].disk.free = 79520000000 | .macs["jterrazz-macbook-pro"].engine.activity = {}'' world.json > w.json && /bin/mv w.json world.json; for i in 1 2 3; do "$STATION" world advance 1m; done; /usr/bin/jq -c ''[(.told // [])[] | select(.Kind == "disk_low") | .Text]'' world.json; "$STATION" activity | /usr/bin/grep "Disk almost full"'
      exit: 0
      stdout: |
          []
          ◐	Disk almost full: 8 % free	station disk
