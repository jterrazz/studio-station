description: 'after 30 min watched the engine holds 6 min and 30 min of points; restarted, none from before'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].engine.watched = true'' world.json > w.json && /bin/mv w.json world.json; for i in $(/usr/bin/seq 30); do "$STATION" world advance 1m; done; /usr/bin/jq -r ''.macs["jterrazz-macbook-pro"].engine.activity["jterrazz-macbook-pro"].series | (.fine | map(.at | fromdate)) as $f | (.coarse | map(.at | fromdate)) as $c | "6 min window: \($f | length > 0), spans at most 6 min: \($f[-1] - $f[0] <= 360)", "24 h window: a point a minute: \($c | length > 30), spans 30 min and more: \($c[-1] - $c[0] >= 1800)"'' world.json'
      exit: 0
      stdout: |
          6 min window: true, spans at most 6 min: true
          24 h window: a point a minute: true, spans 30 min and more: true
    - command: '--version >/dev/null; /usr/bin/jq -r ''.now'' world.json > crashed; "$STATION" world engine-crash jterrazz-macbook-pro; "$STATION" world advance 1m; /usr/bin/jq -r --arg crashed "$(/bin/cat crashed)" ''.macs["jterrazz-macbook-pro"].engine | "points from before the restart: \([.activity["jterrazz-macbook-pro"].series | .fine[], .coarse[] | select(.at < $crashed)] | length)"'' world.json'
      exit: 0
      stdout: |
          points from before the restart: 0
