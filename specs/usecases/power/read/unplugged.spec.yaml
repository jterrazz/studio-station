description: 'a laptop unplugged, down to 35 %, its lid closed, reads so at once'
env: two-macs
runs:
    - command: 'world unplug'
      exit: 0
    - command: 'world battery 35'
      exit: 0
    - command: 'world close-lid'
      exit: 0
    - command: 'power'
      exit: 0
      stdout: |
          ●	awake	off
          ●	battery	35% · on battery
          ●	low power	off
          ●	thermal	nominal
          ●	lid	closed on battery
          # Reading
          lid	closed
          source	battery · 35% · not charging
          low power	off
          thermal	nominal (0)
