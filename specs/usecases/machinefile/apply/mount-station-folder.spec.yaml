description: 'a vm.mounts guest folder that holds station''s own folder of the VM is refused'
env: in-workspace
runs:
    - command: 'world edit linux-1 machinefiles/linux-1.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: linux-1
          machine: { kind: workspace, system: { os: ubuntu } }
          vm:
            mounts:
              - { computer: ~/notes, guest: ~/.config }
      exit: 0
    - command: 'apply --yes'
      exit: 2
      stderr: |
          Error: ~/.config/station/machinefiles/linux-1.machine.yaml:4: mount folder "~/.config" of the VM holds ~/.config/station, station's own files, which no mount reaches: mount a folder beside it
          Hint: fix that line: station never rewrites a Machinefile
