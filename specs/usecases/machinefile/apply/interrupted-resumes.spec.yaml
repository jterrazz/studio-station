description: 'ctrl-c during apply says station apply resumes, the lock keeps what finished, the next apply ends'
fixture:
    - ../../__fixtures__/homebrew/
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [fd, eza]
      exit: 0
    - command: 'world hold Bundler.Bundle'
      exit: 0
    - command: '--version >/dev/null; terminal /usr/bin/env -u NO_COLOR "$STATION" apply'
      stdin: |
          see Installing fd
          send \x03
          scrollback
      exit: 130
      stdout: |
          jterrazz-macbook-pro · 2 to install · 1 present

          To install
            ○ fd   brew
            ○ eza  brew

          → station apply  carries it out
          ✗ jterrazz-macbook-pro interrupted · 1 changed

          Changes
            ● homebrew  5.0.1   script  the manager of fd
            ● fd        10.3.0  brew
            ○ eza               brew    not run · station apply resumes

          → station apply  resumes
    - command: '--version >/dev/null; /usr/bin/jq -r ''.macs["jterrazz-macbook-pro"].files["machinefiles/jterrazz-macbook-pro.lock"]'' world.json'
      exit: 0
      stdout: |+
          lock: station.lock/v1
          machinefile: jterrazz-macbook-pro
          apps:
              - name: fd
                method: brew
                version: 10.3.0
              - name: homebrew
                method: script
                version: 5.0.1

    - command: 'apply'
      exit: 0
      stdout: |
          # To install
          ○	eza	brew
          ●	homebrew	5.0.1	script	the manager of fd
          ●	fd	10.3.0	brew
          ●	eza	0.23.4	brew
    - command: 'drift'
      exit: 0
      stdout: |
          # Packages
          ●	homebrew	script	present
          ●	fd	brew	present
          ●	eza	brew	present
