description: 'a failing run.boot line ends its step broken, its last lines said, counted as a step'
env: in-workspace
runs:
    - command: 'world edit linux-1 machinefiles/linux-1.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: linux-1
          machine: { kind: workspace, system: { os: ubuntu } }
          run:
            boot: |
              git clone https://github.com/jterrazz/studio-os.git ~/Developer/studio-os
      exit: 0
    - command: 'world fault Shell.Run'
      exit: 0
    - command: 'apply --phase boot --yes'
      exit: 1
      stdout: |
          # To run
          ○	git clone https://github.com/jterrazz/studio-os.git ~/Developer/studio-os	run.boot	linux-1
          ✗	run.boot		linux-1	1 line · exited 1: bash: line 1: the line failed; station: exit 1 at: git clone https://github.com/jterrazz/studio-os.git ~/Developer/studio-os
      stderr: |
          Error: 1 of 1 steps failed
          Hint: station apply
