description: 'a block as station last wrote it is written anew when its option moves; one edited since is left'
fixture: ../../__fixtures__/homebrew/
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro catalog/command-line/served.yaml'
      stdin: |
          package: station.package/v1
          kind: app
          name: served
          description: An app whose block names its port
          provides: [served]
          options:
              - name: port
                label: Port
                type: integer
                required: true
          methods:
              - os: macos
                brew: eza
                shell:
                    - id: station:served
                      zsh: |
                          export SERVED_PORT={{ option.port }}
      exit: 0
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [{ name: served, options: { port: 8080 } }]
      exit: 0
    - command: 'init > /dev/null'
      exit: 0
    - command: 'apply > /dev/null'
      exit: 0
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [{ name: served, options: { port: 9090 } }]
      exit: 0
    - command: 'drift'
      exit: 0
      stdout: |
          # Items
          ●	homebrew	script	present
          ●	served	brew	present · port 9090
          ○	served	shell	outdated · ~/.zshrc [station:served]
    - command: 'plan'
      exit: 0
      stdout: |
          # To set
          ○	served	shell	~/.zshrc [station:served]: 1 line · station's earlier text, written anew
    - command: 'plan --diff'
      exit: 0
      stdout: |
          --- ~/.zshrc [station:served]
          +++ station's ~/.zshrc [station:served]
          @@ -1,1 +1,1 @@
          -export SERVED_PORT=8080
          +export SERVED_PORT=9090
    - command: 'apply'
      exit: 0
      stdout: |
          # To set
          ○	served	shell	~/.zshrc [station:served]: 1 line · station's earlier text, written anew
          ●	homebrew	5.0.1	script	the manager of served
          ●	served	0.23.4	brew	port 9090
          ●	served		shell	~/.zshrc [station:served]: written
    - command: '--version >/dev/null; /usr/bin/grep SERVED .zshrc'
      exit: 0
      stdout: |
          export SERVED_PORT=9090
    - command: '--version >/dev/null; /usr/bin/sed -i.bak ''s/9090/7070/'' .zshrc'
      exit: 0
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [{ name: served, options: { port: 8080 } }]
      exit: 0
    - command: 'apply'
      exit: 0
      stdout: |
          # Left as it is
          ◐	served	shell	~/.zshrc [station:served] · edited by hand: station plan --diff shows how
          ●	homebrew	5.0.1	script	the manager of served
          ●	served	0.23.4	brew	port 8080
          ◐	served		shell	~/.zshrc [station:served]: edited by hand: left as it is
    - command: '--version >/dev/null; /usr/bin/grep SERVED .zshrc'
      exit: 0
      stdout: |
          export SERVED_PORT=7070
