description: 'apply --remove undoes a script app the ledger holds and leaves one the owner installed'
fixture: ../../__fixtures__/homebrew/
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro catalog/command-line/scripted.yaml'
      stdin: |
          package: station.package/v1
          kind: app
          name: scripted
          description: A tool a script puts down and takes back
          provides: [scripted]
          version-read:
              pattern: 'scripted v(\d+\.\d+\.\d+)'
          methods:
              - os: macos
                script:
                    check: scripted --version
                    run: install-scripted
                    undo: uninstall-scripted
      exit: 0
    - command: 'world edit jterrazz-macbook-pro catalog/command-line/byhand.yaml'
      stdin: |
          package: station.package/v1
          kind: app
          name: byhand
          description: A tool a script puts down and takes back
          provides: [byhand]
          version-read:
              pattern: 'byhand v(\d+\.\d+\.\d+)'
          methods:
              - os: macos
                script:
                    check: byhand --version
                    run: install-byhand
                    undo: uninstall-byhand
      exit: 0
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [jq]
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].apps.shell = {installed: {"install-scripted": "1.2.0", "install-byhand": "1.0.0"}} | .macs["jterrazz-macbook-pro"].stores.ledger = [{package: "scripted", method: "shell", machinefile: "jterrazz-macbook-pro", at: "2026-11-01T09:00:00Z"}]'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'apply --remove --yes'
      exit: 0
      stdout: |
          # Extra
          ?	scripted	shell	installed by station for jterrazz-macbook-pro, listed no longer
          ●	homebrew	5.0.1	script	the manager of jq
          ●	jq	1.8.1	brew
          ●	scripted		shell	removed
    - command: 'apps | /usr/bin/grep -e "	scripted	" -e "	byhand	"'
      exit: 0
      stdout: |
          ○	scripted		shell	station apps install scripted
          ●	byhand	1.0.0	shell
