description: apply --remove takes an app and its block together, your lines untouched
fixture: ../../__fixtures__/homebrew/
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].apps.brew.offers["postgresql@18"] = "18.1"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [jq, postgres]
      exit: 0
    - command: 'init > /dev/null'
      exit: 0
    - command: '--version >/dev/null; printf ''alias ll="ls -l"\n'' >> .zshrc'
      exit: 0
    - command: 'apply > /dev/null'
      exit: 0
    - command: '--version >/dev/null; /bin/cat .zshrc'
      exit: 0
      stdout: |
          # >>> station >>>
          export PATH="$HOME/.local/bin:$PATH"
          command -v station >/dev/null 2>&1 && eval "$(station shell zsh)"
          # <<< station <<<
          # >>> station:postgres/path >>>
          [[ -d /opt/homebrew/opt/postgresql@18/bin ]] && path=(/opt/homebrew/opt/postgresql@18/bin $path)
          # <<< station:postgres/path <<<
          alias ll="ls -l"
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [jq]
      exit: 0
    - command: 'plan'
      exit: 0
      stdout: |
          # Extra
          ?	postgres	brew	installed by station for jterrazz-macbook-pro, listed no longer
          ?	postgres	shell	~/.zshrc [station:postgres/path] · written by station, goes with postgres
    - command: 'apply --remove --yes'
      exit: 0
      stdout: |
          # Extra
          ?	postgres	brew	installed by station for jterrazz-macbook-pro, listed no longer
          ?	postgres	shell	~/.zshrc [station:postgres/path] · written by station, goes with postgres
          ●	homebrew	5.0.1	script	the manager of jq
          ●	jq	1.8.1	brew
          ●	postgres		brew	removed
          ●	postgres		shell	~/.zshrc [station:postgres/path]: removed
    - command: '--version >/dev/null; /bin/cat .zshrc'
      exit: 0
      stdout: |
          # >>> station >>>
          export PATH="$HOME/.local/bin:$PATH"
          command -v station >/dev/null 2>&1 && eval "$(station shell zsh)"
          # <<< station <<<
          alias ll="ls -l"
