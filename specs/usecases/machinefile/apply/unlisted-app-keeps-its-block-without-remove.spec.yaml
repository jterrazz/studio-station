description: an app listed no longer keeps its block at a bare apply, as it stays installed
fixture: ../../__fixtures__/homebrew/
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].apps.brew.offers["postgresql@18"] = "18.1"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [jq, postgres]
      exit: 0
    - command: 'init > /dev/null'
      exit: 0
    - command: 'apply > /dev/null'
      exit: 0
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [jq]
      exit: 0
    - command: 'apply'
      exit: 0
      stdout: |
          # Extra
          ?	postgres	brew	installed by station for jterrazz-macbook-pro, listed no longer
          ?	postgres	shell	~/.zshrc [station:postgres/path] · written by station, listed no longer
          ●	homebrew	5.0.1	script	the manager of jq
          ●	jq	1.8.1	brew
    - command: '--version >/dev/null; /usr/bin/grep -c station:postgres/path .zshrc'
      exit: 0
      stdout: |
          2
    - command: 'apps | /usr/bin/grep postgres'
      exit: 0
      stdout: |
          ●	postgres	18.1	brew
    - command: 'drift'
      exit: 0
      stdout: |
          # Items
          ●	homebrew	script	present
          ●	jq	brew	present
          ?	postgres	brew	extra · installed by station for jterrazz-macbook-pro, listed no longer
          ?	postgres	shell	extra · ~/.zshrc [station:postgres/path] · written by station, listed no longer
