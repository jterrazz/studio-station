description: 'a VM whose sudo asks a password is refused off a terminal like a Mac: the machine answers'
env: bridged-macos
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.this_mac = "macos-1" | del(.macs["macos-1"].passwordless)'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'world edit macos-1 machinefiles/macos-1.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: macos-1
          machine: { kind: workspace, system: { os: macos } }
          apps: [jq]
      exit: 0
    - command: 'apply'
      exit: 2
      stdout: |
          # Asks you
          ◐	homebrew		asks your password once
          # To install
          ○	homebrew	script	the manager of jq
          ○	jq	brew
      stderr: |
          Error: homebrew asks your password: apply asks it on a terminal, and this run has none
          Hint: run station apply on a terminal
