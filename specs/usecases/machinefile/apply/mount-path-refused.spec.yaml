description: 'a vm.mounts entry whose folder is not a path from / or ~/ is refused before anything runs'
env: in-workspace
runs:
    - command: 'world edit linux-1 machinefiles/linux-1.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: linux-1
          machine: { kind: workspace, system: { os: ubuntu } }
          vm:
            mounts:
              - { computer: Developer/notes, guest: ~/notes }
      exit: 0
    - command: 'apply --yes'
      exit: 2
      stderr: |
          Error: ~/.config/station/machinefiles/linux-1.machine.yaml:4: mount folder "Developer/notes" of the computer is not a path from / or ~/
          Hint: fix that line: station never rewrites a Machinefile
