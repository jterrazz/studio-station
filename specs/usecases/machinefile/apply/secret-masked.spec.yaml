description: 'a vault: reference is shown as itself in the plan and the run, never the secret it names'
fixture: ../../__fixtures__/homebrew/
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].vault = {"claude": "c2stYW50LXNlY3JldC0xMjM="}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          settings: { claude-token: { token: 'vault:claude' } }
      exit: 0
    - command: 'apply > run.txt 2>&1; /bin/cat run.txt'
      exit: 0
      stdout: |
          # To set
          ○	claude-token	builtin	token vault:claude
          ●	claude-token		builtin	token vault:claude · claude-token: applied
    - command: '--version >/dev/null; /usr/bin/grep -c sk-ant-secret run.txt'
      exit: 1
      stdout: |
          0
