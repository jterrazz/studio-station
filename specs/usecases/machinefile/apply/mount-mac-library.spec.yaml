description: 'a vm.mounts folder inside the Mac''s ~/Library is refused: it holds the Mac''s own data'
env: in-workspace
runs:
    - command: 'world edit linux-1 machinefiles/linux-1.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: linux-1
          machine: { kind: workspace, system: { os: ubuntu } }
          vm:
            mounts:
              - { computer: ~/Library/Keychains, guest: ~/keys }
      exit: 0
    - command: 'apply --yes'
      exit: 2
      stderr: |
          Error: ~/.config/station/machinefiles/linux-1.machine.yaml:4: mount folder "~/Library/Keychains" of the computer is in ~/Library, the Mac's own data, which no mount reaches
          Hint: fix that line: station never rewrites a Machinefile
