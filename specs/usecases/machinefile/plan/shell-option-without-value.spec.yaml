description: a block naming an option with no value is a plan error, never an empty string
fixture: ../../__fixtures__/homebrew/
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro catalog/command-line/served.yaml'
      stdin: |
          package: station.package/v1
          kind: app
          name: served
          description: An app whose block names its port
          provides: [served]
          options:
              - name: port
                label: Port
                type: integer
                required: true
          methods:
              - os: macos
                brew: eza
                shell:
                    - id: station:served
                      zsh: |
                          export SERVED_PORT={{ option.port }}
      exit: 0
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [served]
      exit: 0
    - command: 'plan'
      exit: 2
      stderr: |
          Error: served's shell: station:served: option port has no value (~/.config/station/machinefiles/jterrazz-macbook-pro.machine.yaml)
          Hint: station explain
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [{ name: served, options: { port: 8080 } }]
      exit: 0
    - command: 'init > /dev/null'
      exit: 0
    - command: 'apply > /dev/null'
      exit: 0
    - command: '--version >/dev/null; /bin/cat .zshrc | /usr/bin/grep SERVED'
      exit: 0
      stdout: |
          export SERVED_PORT=8080
