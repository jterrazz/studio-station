description: 'a Mac whose sudo asks no password plans Homebrew asking nothing: the machine answers'
env: fresh
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].passwordless = true'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [jq]
      exit: 0
    - command: 'plan'
      exit: 0
      stdout: |
          # To install
          ○	homebrew	script	the manager of jq
          ○	jq	brew
