description: 'prefer puts a manager first: the plan names it, apply installs by it at the version asked'
fixture: ../../__fixtures__/homebrew/
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro catalog/command-line/fd.yaml'
      stdin: |
          package: station.package/v1
          kind: app
          name: fd
          description: A simple, fast alternative to find
          provides: [fd]
          methods:
              - { os: macos, brew: fd }
              - { os: macos, mise: { name: fd, version: latest } }
      exit: 0
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          prefer: [mise]
          apps: [{ name: fd, version: '10.2.0' }]
      exit: 0
    - command: 'explain apps.fd'
      exit: 0
      stdout: |
          # jterrazz-macbook-pro
          	apps.fd	10.2.0	user	jterrazz-macbook-pro
          	apps.fd.method	mise	user	fd
          	apps.fd.because	preferred	user	fd
    - command: 'plan'
      exit: 0
      stdout: |
          # To install
          ○	fd	mise
    - command: 'apply'
      exit: 0
      stdout: |
          # To install
          ○	fd	mise
          ●	homebrew	5.0.1	script	the manager of mise
          ●	mise	2026.10.1	brew	the manager of fd
          ●	fd	10.2.0	mise
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].stores.ledger | map([.package, .method])'' world.json'
      exit: 0
      stdout: |
          [["fd","mise"]]
    - command: 'apps fd | /usr/bin/head -1'
      exit: 0
      stdout: |
          ●	fd	10.2.0	mise
    - command: 'drift'
      exit: 0
      stdout: |
          # Packages
          ●	homebrew	script	present
          ●	mise	brew	present
          ●	fd	mise	present
