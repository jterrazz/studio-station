description: 'brew cannot pin: the plan says the lock records a version, apply installs the newest'
fixture: ../../__fixtures__/homebrew/
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [ripgrep]
      exit: 0
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.lock'
      stdin: |
          lock: station.lock/v1
          machinefile: jterrazz-macbook-pro
          apps:
              - { name: ripgrep, method: brew, version: 14.0.0 }
      exit: 0
    - command: 'plan'
      exit: 0
      stdout: |
          # To install
          ○	ripgrep	brew	recorded 14.0.0
    - command: 'explain apps.ripgrep'
      exit: 0
      stdout: |
          # jterrazz-macbook-pro
          	apps.ripgrep	listed	user	jterrazz-macbook-pro
          	apps.ripgrep.method	brew	lock	jterrazz-macbook-pro
          	apps.ripgrep.because	locked	lock	jterrazz-macbook-pro
    - command: 'apply'
      exit: 0
      stdout: |
          # To install
          ○	ripgrep	brew	recorded 14.0.0
          ●	homebrew	5.0.1	script	the manager of ripgrep
          ●	ripgrep	1.0.0	brew
    - command: '--version >/dev/null; /usr/bin/jq -r ''.macs["jterrazz-macbook-pro"].files["machinefiles/jterrazz-macbook-pro.lock"]'' world.json'
      exit: 0
      stdout: |+
          lock: station.lock/v1
          machinefile: jterrazz-macbook-pro
          apps:
              - name: homebrew
                method: script
                version: 5.0.1
              - name: ripgrep
                method: brew
                version: 1.0.0

