description: 'off a terminal, an unresolved clone is pulled, and a newest commit that asks is put back'
fixture: ../../__fixtures__/homebrew/
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro catalog/command-line/rooted.yaml'
      stdin: |
          package: station.package/v1
          kind: app
          name: rooted
          description: a tool whose brew update asks root
          provides: [rooted]
          methods:
              - { os: macos, brew: rooted, needs: [sudo] }
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].apps.brew.installed.rooted = "1.0.0" | .macs["jterrazz-macbook-pro"].apps.brew.behind.rooted = "1.1.0" | .macs["jterrazz-macbook-pro"].preferences.machinefile = {source: {name: "studio", url: "https://example.com/studio.git"}} | .macs["jterrazz-macbook-pro"].clones = {"https://example.com/studio.git": "1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d"} | .sources = {"https://example.com/studio.git": {head: "ffffffffffffffffffffffffffffffffffffffff", commits: {"1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d": {"machinefiles/jterrazz-macbook-pro.machine.yaml": "machinefile: station.machinefile/v1\nname: jterrazz-macbook-pro\nmachine: { kind: computer, system: { os: macos } }\napps: [rooted, no-such-app]\n"}, "ffffffffffffffffffffffffffffffffffffffff": {"machinefiles/jterrazz-macbook-pro.machine.yaml": "machinefile: station.machinefile/v1\nname: jterrazz-macbook-pro\nmachine: { kind: computer, system: { os: macos } }\napps: [rooted]\n"}}, parents: {"ffffffffffffffffffffffffffffffffffffffff": "1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d"}}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'upgrade'
      exit: 2
      stderr: |
          Error: rooted asks your password: upgrade asks it on a terminal, and this run has none
          Hint: run station upgrade on a terminal
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].clones'' world.json'
      exit: 0
      stdout: |
          {"https://example.com/studio.git":"1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d"}
