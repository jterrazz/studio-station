description: 'apply reads the shared source where its clone stands, upgrade moves it forward to the newest'
fixture: ../../__fixtures__/homebrew/
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].preferences.machinefile = {source: {name: "studio", url: "https://example.com/studio.git"}} | .sources = {"https://example.com/studio.git": {head: "1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d", commits: {"1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d": {"machinefiles/jterrazz-macbook-pro.machine.yaml": "machinefile: station.machinefile/v1\nname: jterrazz-macbook-pro\nmachine: { kind: computer, system: { os: macos } }\napps: [jq]\n"}, "ffffffffffffffffffffffffffffffffffffffff": {"machinefiles/jterrazz-macbook-pro.machine.yaml": "machinefile: station.machinefile/v1\nname: jterrazz-macbook-pro\nmachine: { kind: computer, system: { os: macos } }\napps: [jq, gh]\n"}}, parents: {"ffffffffffffffffffffffffffffffffffffffff": "1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d"}}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'apply'
      exit: 0
      stdout: |
          ●	homebrew	5.0.1	script	the manager of jq
          ●	jq	1.8.1	brew
    - command: '--version >/dev/null; /usr/bin/jq ''.sources["https://example.com/studio.git"].head = "ffffffffffffffffffffffffffffffffffffffff"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'apply'
      exit: 0
      stdout: |
          ●	homebrew	5.0.1	script	the manager of jq
          ●	jq	1.8.1	brew
    - command: 'upgrade'
      exit: 0
      stdout: |
          ●	homebrew	5.0.1	script
          ●	jq	1.8.1	brew
          ●	gh	2.98.0	brew
          # Lock
          ●	gh		added, 2.98.0 by brew
          ●	shared source		studio@fffffff, was studio@1a2b3c4
    - command: 'apply'
      exit: 0
      stdout: |
          ●	homebrew	5.0.1	script	the manager of jq
          ●	jq	1.8.1	brew
          ●	gh	2.98.0	brew
