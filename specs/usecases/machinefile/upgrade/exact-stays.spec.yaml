description: 'three numbers hold node at that one version, and a newer one waits'
fixture: ../../__fixtures__/homebrew/
env: versions
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [gh, { name: node, version: '22.11.0' }]
      exit: 0
    - command: 'apply'
      exit: 0
      stdout: |
          ●	homebrew	5.0.1	script	the manager of gh
          ◐	gh	2.97.0	brew	outdated
          ●	mise	2026.10.1	brew	the manager of node
          ◐	node	22.11.0	mise	outdated
    - command: 'upgrade'
      exit: 0
      stdout: |
          ●	homebrew	5.0.1	script
          ●	mise	2026.10.1	brew
          ●	node	22.11.0	mise	held at 22.11.0
          ●	gh	2.98.0	brew
          # Lock
          ●	gh		2.98.0 by brew, was 2.97.0 by brew
          # Waiting
          ◐	node		25.1.0 available: change '22.11.0' to '25.1.0' in ~/.config/station/machinefiles/jterrazz-macbook-pro.machine.yaml
