description: 'a branch rewritten past the clone''s commit is not taken: upgrade goes on from the clone and says why'
fixture: ../../__fixtures__/homebrew/
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].preferences.machinefile = {source: {name: "studio", url: "https://example.com/studio.git"}} | .sources = {"https://example.com/studio.git": {head: "1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d", commits: {"1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d": {"machinefiles/jterrazz-macbook-pro.yaml": "machinefile: station.machinefile/v1\nname: jterrazz-macbook-pro\nmachine: { kind: computer, system: { os: macos } }\napps: [jq]\n"}, "ffffffffffffffffffffffffffffffffffffffff": {"machinefiles/jterrazz-macbook-pro.yaml": "machinefile: station.machinefile/v1\nname: jterrazz-macbook-pro\nmachine: { kind: computer, system: { os: macos } }\napps: [jq, gh]\n"}, "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee": {"machinefiles/jterrazz-macbook-pro.yaml": "machinefile: station.machinefile/v1\nname: jterrazz-macbook-pro\nmachine: { kind: computer, system: { os: macos } }\napps: [jq, gh]\n"}}, parents: {"ffffffffffffffffffffffffffffffffffffffff": "1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d"}}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'apply'
      exit: 0
      stdout: |
          ●	homebrew	5.0.1	script	the manager of jq
          ●	jq	1.8.1	brew
    - command: '--version >/dev/null; /usr/bin/jq ''.sources["https://example.com/studio.git"].head = "eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'upgrade'
      exit: 0
      stdout: |
          ●	homebrew	5.0.1	script
          ●	jq	1.8.1	brew
          # Source
          ◐	shared source		not pulled, read where its clone stands: its branch is at eeeeeee, which does not follow 1a2b3c4, the commit its clone is at (a force-push, a rewritten history or another default branch): station keeps 1a2b3c4: delete ~/.cache/station/sources/studio to take the branch as it is now
    - command: 'apply'
      exit: 0
      stdout: |
          ●	homebrew	5.0.1	script	the manager of jq
          ●	jq	1.8.1	brew
    - command: '--version >/dev/null; /usr/bin/jq ''del(.macs["jterrazz-macbook-pro"].clones)'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'upgrade'
      exit: 0
      stdout: |
          ●	homebrew	5.0.1	script
          ●	jq	1.8.1	brew
          ●	gh	2.98.0	brew
          # Lock
          ●	gh		added, 2.98.0 by brew
          ●	shared source		studio@eeeeeee, was studio@1a2b3c4
