description: 'a range of java keeps the catalog''s vendor: 21 installs temurin-21, and a newer temurin major waits'
fixture: ../../__fixtures__/homebrew/
env: versions
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].apps.mise.versions.java = ["21.0.2+13", "temurin-21.0.12+7.0.LTS", "temurin-21.0.13+9.0.LTS", "27.0.1+0", "temurin-27.0.1+0"]'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [{ name: java, version: '21' }]
      exit: 0
    - command: 'apply'
      exit: 0
      stdout: |
          # To install
          ○	java	mise
          ●	homebrew	5.0.1	script	the manager of mise
          ●	mise	2026.10.1	brew	the manager of java
          ●	java	temurin-21.0.13+9.0.LTS	mise
    - command: 'upgrade'
      exit: 0
      stdout: |
          ●	homebrew	5.0.1	script
          ●	mise	2026.10.1	brew
          ●	java	temurin-21.0.13+9.0.LTS	mise	within 21
          # Waiting
          ◐	java		temurin-27.0.1+0 available: change '21' to '27' in ~/.config/station/machinefiles/jterrazz-macbook-pro.yaml
