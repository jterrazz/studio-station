description: 'three numbers hold java at its vendor''s build of them: 21.0.13 is temurin-21.0.13+9.0.LTS'
fixture: ../../__fixtures__/homebrew/
env: versions
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [{ name: java, version: '21.0.13' }]
      exit: 0
    - command: 'apply'
      exit: 0
      stdout: |
          # To install
          ○	java	mise
          ●	homebrew	5.0.1	script	the manager of mise
          ●	mise	2026.10.1	brew	the manager of java
          ●	java	temurin-21.0.13+9.0.LTS	mise
    - command: 'plan'
      exit: 0
    - command: 'upgrade'
      exit: 0
      stdout: |
          ●	homebrew	5.0.1	script
          ●	mise	2026.10.1	brew
          ●	java	temurin-21.0.13+9.0.LTS	mise	held at 21.0.13
          # Waiting
          ◐	java		temurin-27.0.1+0 available: change '21.0.13' to '27.0.1' in ~/.config/station/machinefiles/jterrazz-macbook-pro.yaml
