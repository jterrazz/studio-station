description: 'an option the item lacks or a secret written out is refused; a vault: reference is a secret'
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          settings:
              autologin: { colour: blue }
      exit: 0
    - command: 'explain'
      exit: 2
      stderr: |
          Error: autologin's colour: no option of autologin (~/.config/station/machinefiles/jterrazz-macbook-pro.yaml:5)
          Hint: station explain
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          settings:
              autologin: { password: hunter2 }
      exit: 0
    - command: 'explain'
      exit: 2
      stderr: |
          Error: autologin's password: a secret is a vault: reference (`vault:<name>`), never written out (~/.config/station/machinefiles/jterrazz-macbook-pro.yaml:5)
          Hint: station explain
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          settings:
              autologin: { password: "vault:agent-password" }
      exit: 0
    - command: 'explain settings.autologin'
      exit: 0
      stdout: |
          # jterrazz-macbook-pro
          	settings.autologin	listed	user	jterrazz-macbook-pro
          	settings.autologin.method	builtin	built-in	autologin
          	settings.autologin.because	its one method for macos	built-in	autologin
          	settings.autologin.password	vault:agent-password	user	jterrazz-macbook-pro
