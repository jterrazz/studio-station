description: 'an app with no method for the system stops the plan, and says how to make it optional'
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/studio-linux.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: studio-linux
          machine: { kind: workspace, system: { os: ubuntu, version: '24.04' } }
          apps: [ghostty]
      exit: 0
    - command: 'explain --machinefile studio-linux'
      exit: 2
      stderr: |
          Error: ghostty has no method for ubuntu 24.04 (listed, ~/.config/station/machinefiles/studio-linux.machine.yaml:4)
          Hint: list it as { name: ghostty, optional: true } to skip it there
