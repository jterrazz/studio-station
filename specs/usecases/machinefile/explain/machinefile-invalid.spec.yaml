description: 'a Machinefile with an unknown key or an anchor is refused at its line, and never rewritten'
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [jq]
          tint: blue
      exit: 0
    - command: 'explain'
      exit: 2
      stderr: |
          Error: ~/.config/station/machinefiles/jterrazz-macbook-pro.machine.yaml: unmarshal errors: line 5: field tint not found in type catalog.Machinefile
          Hint: fix that line: station never rewrites a Machinefile
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: &mine [jq]
      exit: 0
    - command: 'explain'
      exit: 2
      stderr: |
          Error: ~/.config/station/machinefiles/jterrazz-macbook-pro.machine.yaml:4: an anchor (&mine): write the value out
          Hint: fix that line: station never rewrites a Machinefile
