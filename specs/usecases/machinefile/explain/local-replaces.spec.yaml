description: 'the owner''s jq item replaces the built-in one whole, and its method says so'
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [jq]
      exit: 0
    - command: 'explain apps.jq'
      exit: 0
      stdout: |
          # jterrazz-macbook-pro
          	apps.jq	listed	user	jterrazz-macbook-pro
          	apps.jq.method	brew	built-in	jq
          	apps.jq.because	its one method for macos	built-in	jq
    - command: 'world edit jterrazz-macbook-pro catalog/command-line/jq.yaml'
      stdin: |
          package: station.package/v1
          kind: app
          name: jq
          description: Command-line JSON processor, from mise everywhere
          provides: [jq]
          methods:
              - os: any
                mise: { name: jq, version: latest }
      exit: 0
    - command: 'explain apps.jq'
      exit: 0
      stdout: |
          # jterrazz-macbook-pro
          	apps.jq	listed	user	jterrazz-macbook-pro
          	apps.jq.method	mise	user	jq
          	apps.jq.because	its one method for macos	user	jq
