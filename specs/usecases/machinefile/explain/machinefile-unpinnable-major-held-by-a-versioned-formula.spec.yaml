description: 'brew holds a major only by a versioned formula (postgresql@18): a range asked of it is refused'
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [{ name: postgres, version: '17' }]
      exit: 0
    - command: 'explain apps.postgres'
      exit: 2
      stderr: |
          Error: postgres 17: brew holds only its newest, never 17 (~/.config/station/machinefiles/jterrazz-macbook-pro.yaml:4)
          Hint: no method of postgres for this system holds it: drop its version, or list a versioned item (postgresql@18)
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [postgres]
      exit: 0
    - command: 'explain apps.postgres'
      exit: 0
      stdout: |
          # jterrazz-macbook-pro
          	apps.postgres	listed	user	jterrazz-macbook-pro
          	apps.postgres.method	brew	built-in	postgres
          	apps.postgres.because	its one method for macos	built-in	postgres
