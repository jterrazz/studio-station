description: 'a shared source unreadable at its pinned commit stops explain, naming source and commit'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].preferences.machinefile = {source: {name: "studio", url: "https://example.com/studio.git", commit: "1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d"}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'explain --machinefile station-macos'
      exit: 1
      stderr: |
          Error: the source studio cannot be read at 1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d: no such commit in the repository
          Hint: check its url and commit in ~/.config/station/preferences.json
