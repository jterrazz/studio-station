description: 'a computer that says vm, itself or through a file it extends, is refused naming the file'
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          extends: [station-macos]
      exit: 0
    - command: 'explain'
      exit: 2
      stderr: |
          Error: jterrazz-macbook-pro is a computer, and built-in/machinefiles/station-macos.yaml says vm: vm is a workspace's or a server's
          Hint: remove vm, or say kind: workspace or server
