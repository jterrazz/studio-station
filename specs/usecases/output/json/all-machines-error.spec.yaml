description: '--all-machines --json, the mini offline: every machine kept, one that did not answer with its error'
env: mini-offline
runs:
    - command: 'accounts --all-machines --json | /usr/bin/jq -c ''.schema, .machine.label, (.machines[] | [.machine.label, .machine.kind, .machine.on, (.accounts | length), .error]), .skipped'''
      exit: 0
      stdout: |
          "station.accounts.list/v1"
          "This Mac"
          ["This Mac","mac",null,8,null]
          ["api","workspace","jterrazz-macbook-pro",0,{"type":"refused","code":"account.vm-stopped","message":"api is stopped"}]
          ["linux-1","workspace","jterrazz-macbook-pro",2,null]
          ["mac-mini","mac",null,0,{"type":"unreachable","code":null,"message":"does not answer"}]
          []
    - command: 'activity --all-machines --json | /usr/bin/jq -c ''.machines[] | select(.machine.this_mac | not) | select(.machine.kind == "mac") | [.machine.label, .error]'''
      exit: 0
      stdout: |
          ["mac-mini",{"type":"unreachable","code":null,"message":"does not answer"}]
