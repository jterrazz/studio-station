description: 'a pipe never cuts: at 30 columns every path, URL and fix is whole, and no read prints …'
env:
    - two-macs
    - engine
runs:
    - command: 'background | /usr/bin/grep com.docker.vmnetd'
      exit: 0
      stdout: |
          ◐	com.docker.vmnetd	root	idle	Docker.app (gone)	/Library/LaunchDaemons/com.docker.vmnetd.plist · sudo launchctl bootout system/com.docker.vmnetd && sudo rm /Library/LaunchDaemons/com.docker.vmnetd.plist
    - command: '--version >/dev/null; COLUMNS=30 "$STATION" background | /usr/bin/grep com.docker.vmnetd; COLUMNS=30 "$STATION" ports | /usr/bin/grep 5173'
      exit: 0
      stdout: |
          ◐	com.docker.vmnetd	root	idle	Docker.app (gone)	/Library/LaunchDaemons/com.docker.vmnetd.plist · sudo launchctl bootout system/com.docker.vmnetd && sudo rm /Library/LaunchDaemons/com.docker.vmnetd.plist
          ●	linux-1	5173	private	https://jterrazz-macbook-pro.tail1234.ts.net:40001	shared	node	vite
    - command: '--version >/dev/null; for read in overview apps settings disk ports accounts background awake machines images engine activity; do COLUMNS=30 "$STATION" $read --all > $read.txt 2>/dev/null || COLUMNS=30 "$STATION" $read > $read.txt; done; /bin/cat *.txt | /usr/bin/grep -c "…"'
      exit: 1
      stdout: |
          0
