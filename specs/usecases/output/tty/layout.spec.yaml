description: 'a read on an 80-column terminal: the first line sums it up, Needs you first, one line per calm section, then the next steps'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 80x40 /usr/bin/env -u NO_COLOR COLUMNS=80 "$STATION" overview'
