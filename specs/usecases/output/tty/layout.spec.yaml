description: 'an 80-column read: its first line, Needs you first, one line per calm section, the next steps'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 80x40 /usr/bin/env -u NO_COLOR COLUMNS=80 "$STATION" overview'
      stdin: |
          scrollback
      exit: 0
      stdout: |
          This Mac · jterrazz-macbook-pro · 9 things need you · Engine running

          Needs you
            ✗ npm sign-in expired     npm login
            ✗ com.jterrazz.brain.x-snapshot is failing, last exit 2
              station background remove com.jterrazz.brain.x-snapshot
            ◐ 1 mise update waiting   station apps update --method mise
            ◐ 2 brew updates waiting  station apps update --method brew
            ◐ Firewall: off           System Settings > Network > Firewall
            4 more: station overview --all
          Activity    memory 12.4 of 16 GB · 388 GB free
          Apps        ● 5 ok · ◐ 3 updates · ○ 100 not installed
          Settings    set by station · ● 0 of 17 · checked · ● 8 of 9
          Disk        ◐ 388 GB free · 34.8 GB can rebuild · ◐ 1 misplaced
          Ports       Public 0 · Private 2
          Accounts    ● 6 · ✗ npm
          Background  ● 10 · ✗ 1 failing · ◐ 3 orphans
          Awake       ○ sleeps normally
          VMs         ○ api stopped · ● linux-1 running

          → station background remove com.jterrazz.brain.x-snapshot
          → station overview --all  for every line
    - command: '--version >/dev/null; terminal --size 80x60 /usr/bin/env -u NO_COLOR COLUMNS=80 "$STATION" apps'
      stdin: |
          scrollback
      exit: 0
      stdout: |
          This Mac · 108 apps for this Mac · 3 updates · 100 not installed

          Updates
            ◐ node     22.11.0 → 24.11.0  mise  update available
              → station apps update node
            ◐ ghostty  1.2.0 → 1.2.1      cask  update available
              → station apps update ghostty
            ◐ gh       2.97.0 → 2.98.0    brew  update available
              → station apps update gh
          Not installed  ○ 100 · homebrew, mas, uv, cocoapods, pnpm, skills, bun, java, …
          OK             ● 5 · mise, go, bat, jq, lazygit
          Not for this machine  7 apps live on other machines

          → station apps install <app...>
          → station apps update
          → station apps --all  for every row
