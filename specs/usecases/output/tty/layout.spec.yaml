          OK             ● 5 · mise, go, bat, jq, lazygit
          Not for this machine  8 apps live on other machines

          → station apps update            the 3 updates
          → station apps install <app...>  install some
    - command: '--version >/dev/null; terminal --size 80x60 /usr/bin/env -u NO_COLOR COLUMNS=80 "$STATION" settings'
