description: 'an 80-column read: first line, Needs you, one line per calm section, next steps, glyphs coloured'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 80x40 /usr/bin/env -u NO_COLOR COLUMNS=80 "$STATION" overview'
      stdin: |
          paint plain=38;2;202;211;245 bold=1;38;2;202;211;245 good=38;2;166;218;149 warn=38;2;238;212;159 bad=38;2;237;135;150 muted=38;2;165;173;203 subtle=38;2;110;115;141
      exit: 0
      stdout: |
          {bold This Mac} · jterrazz-macbook-pro · 9 things need you · Engine running

          {bold Needs you}
            {bad ✗} {bold npm sign-in expired}     npm login
            {bad ✗} {bold com.jterrazz.brain.x-snapshot is failing, last exit 2}
              station background remove com.jterrazz.brain.x-snapshot
            {warn ◐} {bold 1 mise update waiting}   station apps update --manager mise
            {warn ◐} {bold 2 brew updates waiting}  station apps update --manager brew
            {warn ◐} {bold Firewall: off}           System Settings > Network > Firewall
            4 more: station overview --all
          {bold Activity}    memory 12.4 of 16 GB · 388 GB free
          {bold Apps}        {good ●} 5 ok · {warn ◐} 3 updates · {muted ○} 105 not installed
          {bold Settings}    set by station · {muted ○} 0 of 19 · checked · {good ●} 8 of 9
          {bold Disk}        {warn ◐} 388 GB free · 34.8 GB can rebuild · {warn ◐} 1 misplaced
          {bold Ports}       Public 0 · Private 2
          {bold Accounts}    {good ●} 6 · {bad ✗} npm
          {bold Background}  {good ●} 10 · {bad ✗} 1 failing · {warn ◐} 3 orphans
          {bold Awake}       {muted ○} sleeps normally
          {bold VMs}         {muted ○} api stopped · {good ●} linux-1 running

          {muted →} station background remove com.jterrazz.brain.x-snapshot
          {muted →} station overview --all  {muted for every line}
    - command: '--version >/dev/null; terminal --size 80x60 /usr/bin/env -u NO_COLOR COLUMNS=80 "$STATION" apps'
      stdin: |
          scrollback
      exit: 0
      stdout: |
          This Mac · 113 apps for this Mac · 3 updates · 105 not installed

          Updates
            ◐ node     22.11.0 → 24.11.0  mise  update available
              → station apps update node
            ◐ ghostty  1.2.0 → 1.2.1      cask  update available
