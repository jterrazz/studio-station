description: 'station background remove of a root task is refused with the command to run yourself; station never runs sudo and the task stays'
env: two-macs
runs:
    - command: 'background remove com.docker.vmnetd --yes'
      exit: 2
      stderr: |
          Error: com.docker.vmnetd runs as root: station never runs sudo
          Hint: sudo launchctl bootout system/com.docker.vmnetd && sudo rm /Library/LaunchDaemons/com.docker.vmnetd.plist
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].jobs["com.docker.vmnetd"] | [.Loaded, .File]'' world.json'
      exit: 0
      stdout: |
          [true,"/Library/LaunchDaemons/com.docker.vmnetd.plist"]
