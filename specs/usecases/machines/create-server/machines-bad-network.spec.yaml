description: 'a server on a network station does not know is refused, its code on the wire'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.error) | .error | {code, subject, message}'''
      stdin: |
          {"v":2,"id":"1","call":"machines.create-server","in":{"Name":"infra","Image":"station-linux","Network":"wifi"}}
      exit: 0
      stdout: |
          {"code":"machines.bad-network","subject":"wifi","message":"unknown network \"wifi\": nat or bridged"}
