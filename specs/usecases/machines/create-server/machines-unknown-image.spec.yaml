description: 'a server of an image station does not know is refused, its code on the wire'
env:
    - two-macs
    - engine
runs:
    - command: 'machines create infra --server --image linux'
      exit: 2
      stderr: |
          Error: unknown image "linux"
          Hint: station images for the images
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.error) | .error | {code, subject, message}'''
      stdin: |
          {"v":2,"id":"1","call":"machines.create-server","in":{"Name":"infra","Image":"linux"}}
      exit: 0
      stdout: |
          {"code":"machines.unknown-image","subject":"linux","message":"unknown image \"linux\""}
