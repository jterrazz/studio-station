description: 'a server asked by a session named "you" is refused before anything is made, its code on the wire'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; STATION_SESSION=you "$STATION" machines create infra --server'
      exit: 2
      stderr: |
          Error: STATION_SESSION "you" is not a session's name
          Hint: name the session in lowercase letters, digits and "-", 1 to 40 characters, never "you"
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.error) | .error | {code, subject, message}'''
      stdin: |
          {"v":2,"id":"1","call":"machines.create-server","in":{"Name":"infra","Creator":"you"}}
      exit: 0
      stdout: |
          {"code":"machines.bad-creator","subject":"you","message":"STATION_SESSION \"you\" is not a session's name"}
