description: 'no image on This Mac: a server''s create asks to build it, refused off a terminal, --yes builds'
env: one-mac
runs:
    - command: 'machines create infra --server'
      exit: 2
      stderr: |
          Error: image station-linux is not built on jterrazz-macbook-pro
          Hint: station images build station-linux
    - command: 'machines --json | /usr/bin/jq -c ''[.macs[].vms[].name]'''
      exit: 0
      stdout: |
          []
    - command: 'machines create infra --server --yes'
      exit: 2
      stderr: |
          Error: this station is a dev build: there is no release binary to put in the image
          Hint: make build-linux, then station images build station-linux --binary .artifacts/go/station-linux-arm64
