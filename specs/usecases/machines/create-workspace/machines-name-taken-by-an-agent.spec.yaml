description: 'a name an agent holds names no new VM: an agent run by hand on it never shares a name'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["linux-3"] = {self: {kind: "workspace", system: {OS: "linux"}}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'agents start "Write the changelog" --on linux-1 --name docs-bot'
      exit: 0
      stdout: |
          	On linux-1:
          ●	docs-bot	starts · claudecode · Write the changelog
    - command: 'machines create docs-bot'
      exit: 2
      stderr: |
          Error: "docs-bot" is taken (an agent on linux-1)
          Hint: pick another name
    - command: 'agents start "Write the release notes" --on linux-1 --name linux-2·2'
      exit: 0
      stdout: |
          	On linux-1:
          ●	linux-2·2	starts · claudecode · Write the release notes
    - command: 'machines create linux-2'
      exit: 2
      stderr: |
          Error: "linux-2" is taken (agent linux-2·2 on linux-1)
          Hint: pick another name
    - command: 'machines create >/dev/null'
      exit: 0
    - command: 'world agent-prompt linux-3 s-1 "Review the auth refresh"'
      exit: 0
    - command: 'agents'
      exit: 0
      stdout: |
          # Agents	3 ●
          ●	docs-bot	claudecode	working	Write the changelog	linux-1	jterrazz-macbook-pro	1m ago
          ●	linux-2·2	claudecode	working	Write the release notes	linux-1	jterrazz-macbook-pro	49s ago
          ●	linux-3	claudecode	working	Review the auth refresh	linux-3	jterrazz-macbook-pro	12s ago
