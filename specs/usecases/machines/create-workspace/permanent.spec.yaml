description: '--permanent makes a workspace kept until deleted, in the outcome and in its record'
env: two-macs
runs:
    - command: 'machines create api-2 --permanent | /usr/bin/tail -1'
      exit: 0
      stdout: |
          ●	api-2	Created	Permanent · 4 CPU · 4 GB · 20 GB
    - command: 'machines --here | /usr/bin/grep api-2'
      exit: 0
      stdout: |
          ●	api-2	Workspace	jterrazz-macbook-pro	Running · permanent	4 CPU	4 GB
