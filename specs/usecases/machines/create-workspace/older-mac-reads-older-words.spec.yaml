description: 'an older Mac is sent permanent for --persistent and no lifetime by default, and makes both'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-mac-mini"].station = "v3.0.0"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'machines create keep --persistent --on jterrazz-mac-mini | /usr/bin/tail -1'
      exit: 0
      stdout: |
          ●	keep	Created	Persistent · 4 CPU · 4 GB · 20 GB
    - command: 'machines create box --on jterrazz-mac-mini | /usr/bin/tail -1'
      exit: 0
      stdout: |
          ●	box	Created	Ephemeral · 4 CPU · 4 GB · 20 GB
