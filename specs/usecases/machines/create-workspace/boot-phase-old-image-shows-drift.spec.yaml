description: 'a workspace from an image its Machinefile moved on from shows that drift at its first start'
fixture: ../../__fixtures__/build/
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/studio-linux.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: studio-linux
          machine: { kind: workspace, system: { os: ubuntu, version: '24.04' } }
          extends: [station-linux]
          vm: { image: { bake: [mise, git] } }
      exit: 0
    - command: 'images build studio-linux --binary $HOME/station-linux >/dev/null'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq ''(.macs["jterrazz-macbook-pro"].stores.images[] | select(.name == "studio-linux") | .lock) = "lock: station.lock/v1\nmachinefile: studio-linux\napps:\n  - { name: mise, method: script, version: 2026.11.1 }\n  - { name: git, method: apt }\n"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'world edit jterrazz-macbook-pro machinefiles/studio-linux.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: studio-linux
          machine: { kind: workspace, system: { os: ubuntu, version: '24.04' } }
          extends: [station-linux]
          vm: { image: { bake: [mise, git, jq] } }
      exit: 0
    - command: 'machines create web --from studio-linux'
      exit: 0
      stdout: |
          ●	Running
          ●	Has an address	192.168.64.5
          ●	SSH answers
          ●	vite	5173	https://jterrazz-macbook-pro.tail1234.ts.net:40003
          ●	expo	8081	https://jterrazz-macbook-pro.tail1234.ts.net:40000
          ●	Boot phase	studio-linux
          ◐	Drift	from its image	jq is not baked into the image
          ●	web	Created	Persistent · 4 CPU · 4 GB · 20 GB
    - command: 'machines delete web --confirm=web'
      exit: 0
      stdout: |
          ●	web	deleted
    - command: 'machines create web --from studio-linux --json | /usr/bin/jq -c ''{template, boot}'''
      exit: 0
      stdout: |
          {"template":"studio-linux","boot":{"shares":[],"drift":["jq is not baked into the image"]}}
