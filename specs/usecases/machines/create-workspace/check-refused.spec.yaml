description: 'a health check is for servers: a workspace create with --check is refused, nothing made'
env: two-macs
runs:
    - command: 'machines create box --check https://box:5173'
      exit: 2
      stderr: |
          Error: a health check is for servers
          Hint: station machines create <name> --server --check <url>
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].vms.box'' world.json'
      exit: 0
      stdout: |
          null
