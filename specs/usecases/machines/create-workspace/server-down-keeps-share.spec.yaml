description: 'a create that fits only in the share a down server keeps is refused'
env: two-macs
runs:
    - command: 'world fault Hypervisor.Boot'
      exit: 0
    - command: 'world crash infra'
      exit: 0
    - command: 'machines create --memory 40G --on mac-mini'
      exit: 2
      stderr: |
          Error: not enough memory on This Mac: 40 GB asked, 36 GB left for VMs
          Hint: ask for less: --memory 36G
    - command: 'machines --json | /usr/bin/jq -c ''[.macs[1].vms[] | .name]'''
      exit: 0
      stdout: |
          ["infra"]
