description: 'a workspace is ephemeral or persistent: always on is refused, its code on the wire'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.error) | .error | {code, subject, message}'''
      stdin: |
          {"v":2,"id":"1","call":"machines.create-workspace","in":{"Request":{"Name":"api","Lifetime":"always-on"}}}
      exit: 0
      stdout: |
          {"code":"machines.bad-lifetime","subject":"always-on","message":"unknown lifetime \"always-on\": ephemeral or persistent"}
