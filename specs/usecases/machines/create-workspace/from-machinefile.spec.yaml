description: 'create --from makes its image, sized and kept as its vm says, recorded, and runs its boot phase'
fixture: ../../__fixtures__/build/
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/studio-linux.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: studio-linux
          machine: { kind: workspace, system: { os: ubuntu, version: '24.04' } }
          extends: [station-linux]
          vm: { lifetime: persistent, resources: { cpus: 6, memory: 3G, disk: 30G } }
          apps: [jq]
      exit: 0
    - command: 'images build studio-linux --binary $HOME/station-linux >/dev/null'
      exit: 0
    - command: 'machines create web --from studio-linux'
      exit: 0
      stdout: |
          ●	Running
          ●	Has an address	192.168.64.5
          ●	SSH answers
          ●	vite	5173	https://jterrazz-macbook-pro.tail1234.ts.net:40003
          ●	expo	8081	https://jterrazz-macbook-pro.tail1234.ts.net:40000
          ●	Boot phase	studio-linux
          ●	web	Created	Persistent · 6 CPU · 3 GB · 30 GB
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].vms["web"] | {image: .kept.image, template: .kept.template, lifetime: .kept.lifetime, size, ran: [.guest.ran[]? | select(startswith("/usr/local/bin/station guest serve") | not)]}'' world.json'
      exit: 0
      stdout: |
          {"image":"studio-linux","template":"studio-linux","lifetime":"persistent","size":{"CPUs":6,"Memory":3221225472,"Disk":30000000000},"ran":["sudo bash -s -- \"$HOME\" \"$(id -un)\"","sudo bash -s","bash -s","/usr/local/bin/station apply --machinefile 'studio-linux' --phase boot </dev/null"]}
