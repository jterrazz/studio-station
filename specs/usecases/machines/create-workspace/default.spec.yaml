description: 'a bare create makes linux-2: throwaway, 4 CPU, 4 GB, 20 GB, the smallest free name'
env: two-macs
runs:
    - command: 'machines create'
      exit: 0
      stdout: |
          ●	linux-2	jterrazz-macbook-pro	throwaway	linux 1	4 cpus · 4 GB
          ●	expo	8081	{{url}}
          ●	vite	5173	{{url}}
          ◐	services	Serve is off on the tailnet: enable HTTPS certificates in the Tailscale admin console
    - command: 'machines --here'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	Mac	jterrazz-macbook-pro	Engine running
          ○	api	Workspace	jterrazz-macbook-pro	Stopped · permanent	4 CPU	8 GB
          ●	linux-1	Workspace	jterrazz-macbook-pro	Running · throwaway	4 CPU	8 GB
          ●	linux-2	Workspace	jterrazz-macbook-pro	Running · throwaway	4 CPU	4 GB
