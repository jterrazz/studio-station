description: 'with no hypervisor installed, create is refused before anything is made, and the hint installs tart'
env: no-tart
runs:
    - command: 'machines create'
      exit: 2
      stderr: |
          Error: tart is not installed on This Mac
          Hint: station apps install tart
    - command: 'machines --json | /usr/bin/jq -c ''[.macs[].vms[]]'''
      exit: 0
      stdout: |
          []
