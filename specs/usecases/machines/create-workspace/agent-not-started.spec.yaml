description: 'a workspace whose station does not answer is kept with its task; its agent did not start'
env: two-macs
runs:
    - command: 'machines create --task "Build the landing page" --agent'
      exit: 1
      stderr: |
          Error: linux-2 is ready, but its agent did not start: linux-2 does not answer
          Hint: station agents start --task <task> --on linux-2
    - command: 'machines --this-mac | /usr/bin/grep linux-2'
      exit: 0
      stdout: |
          ●	linux-2	Workspace	jterrazz-macbook-pro	Running · throwaway	4 CPU	4 GB
