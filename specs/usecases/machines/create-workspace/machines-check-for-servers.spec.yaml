description: 'a health check is for servers: a workspace create with --check is refused, nothing made'
env:
    - two-macs
    - engine
runs:
    - command: 'machines create box --check https://box:5173'
      exit: 2
      stderr: |
          Error: a health check is for servers
          Hint: station machines create <name> --server --check <url>
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].vms.box'' world.json'
      exit: 0
      stdout: |
          null
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.error) | .error | {code, subject, message}'''
      stdin: |
          {"v":2,"id":"1","call":"machines.create-workspace","in":{"Request":{"Name":"box","Check":"https://box:5173"}}}
      exit: 0
      stdout: |
          {"code":"machines.check-for-servers","subject":null,"message":"a health check is for servers"}
