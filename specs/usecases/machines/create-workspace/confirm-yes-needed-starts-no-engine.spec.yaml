description: 'a create refused for its build question installs no engine: the engine starts only with the create'
env: no-engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''del(.macs["jterrazz-macbook-pro"].stores.images, .macs["jterrazz-macbook-pro"].vms)'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'machines create </dev/null'
      exit: 2
      stderr: |
          Error: image station-linux is not built on jterrazz-macbook-pro
          Hint: station images build station-linux
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].jobs // {} | keys'' world.json'
      exit: 0
      stdout: |
          []
