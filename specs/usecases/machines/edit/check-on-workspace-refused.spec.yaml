description: 'a health check is for servers: an edit that gives a workspace one is refused, nothing changed'
env: two-macs
runs:
    - command: 'machines edit linux-1 --check https://linux-1:5173'
      exit: 2
      stderr: |
          Error: a health check is for servers
          Hint: a workspace's health is three steps: station machines linux-1
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].vms["linux-1"].kept | {lifetime, check}'' world.json'
      exit: 0
      stdout: |
          {"lifetime":"throwaway","check":null}
