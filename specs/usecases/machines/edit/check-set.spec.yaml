description: 'a server''s health check is set by edit, in its record, for its next health run; it keeps running'
env: two-macs
runs:
    - command: 'machines edit infra --on mac-mini --check infra:6443'
      exit: 0
      stdout: |
          ●	infra	health check infra:6443, from its next health run
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-mac-mini"].vms.infra | {check: .kept.check, running: (.pid > 0)}'' world.json'
      exit: 0
      stdout: |
          {"check":"infra:6443","running":true}
