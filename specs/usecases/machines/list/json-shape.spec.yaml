description: 'machines --json is station.machines.list/v1: each Mac, its VMs with their wanted state, health, restarts and size in bytes, the findings'
env: two-macs
runs:
    - command: 'machines --json | /usr/bin/jq -c ''{schema, findings, macs: [.macs[] | {name, label, this_mac, reachable, engine: .engine.state, vms: [.vms[] | {name, kind, lifetime, state, wanted, health, restarts, size}]}]}'''
      exit: 0
      stdout: |
          {"schema":"station.machines.list/v1","findings":[],"macs":[{"name":"jterrazz-macbook-pro","label":"This Mac","this_mac":true,"reachable":true,"engine":"running","vms":[{"name":"api","kind":"workspace","lifetime":"permanent","state":"stopped","wanted":"stopped","health":{"running":false,"address":false,"ssh":false},"restarts":0,"size":{"cpus":4,"memory_bytes":8589934592,"disk_bytes":50000000000}},{"name":"linux-1","kind":"workspace","lifetime":"throwaway","state":"running","wanted":"running","health":{"running":true,"address":true,"ssh":true},"restarts":0,"size":{"cpus":4,"memory_bytes":8589934592,"disk_bytes":50000000000}}]},{"name":"jterrazz-mac-mini","label":"mac-mini","this_mac":false,"reachable":true,"engine":"running","vms":[{"name":"infra","kind":"workspace","lifetime":"permanent","state":"running","wanted":"running","health":{"running":true,"address":true,"ssh":true},"restarts":0,"size":{"cpus":8,"memory_bytes":25769803776,"disk_bytes":80000000000}}]}]}
    - command: 'machines --json | /usr/bin/jq -r ''.macs[0].vms[0] | keys | join(" ")'''
      exit: 0
      stdout: |
          bridged created_at health image ip kind lifetime name restarts size state wanted
