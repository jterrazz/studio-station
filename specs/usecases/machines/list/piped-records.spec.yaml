description: 'piped, each machine is one record: its glyph, name, kind, Mac, state, CPU and memory; cut -f2 is the name, cut -f4 its Mac'
env: two-macs
runs:
    - command: 'machines'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	Mac	jterrazz-macbook-pro	Engine running
          ○	api	Workspace	jterrazz-macbook-pro	Stopped · permanent	4 CPU	8 GB
          ●	linux-1	Workspace	jterrazz-macbook-pro	Running · throwaway	4 CPU	8 GB
          ●	jterrazz-mac-mini	Mac	jterrazz-mac-mini	Engine running
          ●	infra	Workspace	jterrazz-mac-mini	Running · permanent	8 CPU	24 GB
    - command: 'machines | /usr/bin/awk -F''\t'' ''$4 == "jterrazz-mac-mini"'' | /usr/bin/cut -f2'
      exit: 0
      stdout: |
          jterrazz-mac-mini
          infra
