description: 'a full list remembers when each Mac answered, so one that stops answering shows its last answer and its VMs'
env: two-macs
runs:
    - command: 'machines >/dev/null'
      exit: 0
    - command: 'world power-cut jterrazz-mac-mini'
      exit: 0
    - command: 'machines | /usr/bin/grep -A1 "jterrazz-mac-mini	Mac"'
      exit: 0
      stdout: |
          ✗	jterrazz-mac-mini	Mac	jterrazz-mac-mini	Unreachable · last answer 10:00
          ?	infra	Workspace	jterrazz-mac-mini	Unknown · permanent	8 CPU	24 GB
