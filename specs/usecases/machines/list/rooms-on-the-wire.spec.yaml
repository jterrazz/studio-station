description: 'machines.list gives each Mac its room by name and the roomiest Mac, in bytes'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -s -c ''[.[] | select(.out)] | last | .out | {Roomiest, Rooms: [.Rooms[] | {Mac, Total: .Capacity.Total, Free: .Capacity.Free}]}'''
      stdin: |
          {"v":2,"id":"1","watch":"machines.list","in":{}}
      exit: 0
      stdout: |
          {"Roomiest":"jterrazz-mac-mini","Rooms":[{"Mac":"jterrazz-macbook-pro","Total":17179869184,"Free":4294967296},{"Mac":"jterrazz-mac-mini","Total":68719476736,"Free":38654705664}]}
