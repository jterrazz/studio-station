description: 'a VM being created is listed from its first frame: its step, its progress, its memory held'
env: creating
runs:
    - command: 'machines --json | /usr/bin/jq -c ''.macs[0] | {vms: [.vms[] | {name, state, birth}], capacity: (.capacity | {free_bytes, vms})}'''
      exit: 0
      stdout: |
          {"vms":[{"name":"linux-4","state":"creating","birth":{"progress":400,"step":"booting"}}],"capacity":{"free_bytes":12884901888,"vms":[{"name":"linux-4","memory_bytes":8589934592}]}}
    - command: 'machines'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	Mac	jterrazz-macbook-pro	Engine running
          	linux-4	Workspace	jterrazz-macbook-pro	Creating · throwaway	4 CPU	8 GB	booting
