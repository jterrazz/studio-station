description: 'a desktop Mac whose engine heard macOS say it goes to sleep is asleep once silent, not unreachable'
env: two-macs
runs:
    - command: 'world will-sleep jterrazz-mac-mini'
      exit: 0
    - command: 'machines --json | /usr/bin/jq -c ''.macs[] | select(.name == "jterrazz-mac-mini") | {reach, laptop: .hardware.laptop}'''
      exit: 0
      stdout: |
          {"reach":"answers","laptop":false}
    - command: 'world offline jterrazz-mac-mini'
      exit: 0
    - command: 'world advance 2m'
      exit: 0
    - command: 'machines --json | /usr/bin/jq -c ''.macs[] | select(.name == "jterrazz-mac-mini") | {reachable, reach}'''
      exit: 0
      stdout: |
          {"reachable":false,"reach":"asleep"}
    - command: 'machines | /usr/bin/grep -w Mac'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	Mac	jterrazz-macbook-pro	Engine running
          ○	jterrazz-mac-mini	Mac	jterrazz-mac-mini	Asleep · last answer 10:00
