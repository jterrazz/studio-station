description: 'a Mac that runs an older station says which, and to update station there; the read exits 0'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - mini-old
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 100x30 /usr/bin/env -u NO_COLOR COLUMNS=100 "$STATION" machines'
      stdin: |
          scrollback
      exit: 0
      stdout: |4
           station machines                                                       jterrazz-macbook-pro · host
           ──────────────────────────────────────────────────────────────────────────────────────────────────

           5 machines · 4 running · 1 stopped · 1 needs you
               MACHINE     KIND       STATE                         CPU    MEMORY
             ● This Mac    Mac        Engine running
             ├─ ○ api      Workspace  Stopped · permanent           4 CPU  8 GB
             └─ ● linux-1  Workspace  Running · throwaway           4 CPU  8 GB
             ◐ mac-mini    Mac        Engine running · runs v3.0.0
             └─ ● infra    Workspace  Running · permanent           8 CPU  24 GB

           Needs you
             ◐ mac-mini  runs v3.0.0  update station there (scripts/install.sh)
    - command: 'machines --json | /usr/bin/jq -c ''.findings'''
      exit: 0
      stdout: |
          [{"severity":"needs-a-look","section":"overview","subject":"mac-mini","text":"mac-mini runs v3.0.0","fix":"update station there (scripts/install.sh)"}]
