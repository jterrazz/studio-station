description: 'a Mac that does not answer is forgotten here all the same, whatever --on aims at'
env: mini-offline
runs:
    - command: 'machines forget mac-mini --on linux-1 --yes'
      exit: 0
      stdout: |
          ●	mac-mini	forgotten · nothing changed on it
    - command: '--version >/dev/null; /usr/bin/jq -c ''[.macs["jterrazz-macbook-pro"].preferences.macs, .macs["jterrazz-mac-mini"].locked]'' world.json'
      exit: 0
      stdout: |
          [null,true]
