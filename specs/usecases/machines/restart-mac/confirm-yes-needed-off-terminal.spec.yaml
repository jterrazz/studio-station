description: 'a Mac restart piped without --yes is refused, exit 2, and the Mac is not restarted'
env: two-macs
runs:
    - command: 'machines restart mac-mini'
      exit: 2
      stderr: |
          Error: refusing to restart without --yes
          Hint: re-run with --yes
    - command: '--version >/dev/null; /usr/bin/jq -r ''.macs["jterrazz-mac-mini"].engine.started_at'' world.json'
      exit: 0
      stdout: |
          2026-10-23T09:00:00Z
