description: 'a VM its hypervisor refuses to boot stays stopped, and the owner reads why'
env: two-macs
runs:
    - command: 'world fault Hypervisor.Boot'
      exit: 0
    - command: 'machines start api'
      exit: 1
      stderr: |
          Error: the hypervisor refused to boot it, as the world scripted it
          Hint: station machines
    - command: 'machines --here'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	mac			online	-	2 VMs
          ○	api	workspace	jterrazz-macbook-pro	permanent	stopped	-	4 cpus · 8 GB · 50.0 GB
          ●	linux-1	workspace	jterrazz-macbook-pro	throwaway	running	192.168.64.5	4 cpus · 8 GB · 50.0 GB
