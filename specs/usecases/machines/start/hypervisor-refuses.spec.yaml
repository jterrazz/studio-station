description: 'a VM its hypervisor refuses to boot stays stopped, and the owner reads why'
env: two-macs
runs:
    - command: 'world fault Hypervisor.Boot'
      exit: 0
    - command: 'machines start api'
      exit: 1
      stderr: |
          Error: the hypervisor refused to boot it, as the world scripted it
          Hint: station machines
    - command: 'machines --this-mac'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	Mac	jterrazz-macbook-pro	Engine running
          ○	api	Workspace	jterrazz-macbook-pro	Stopped · persistent	4 CPU	8 GB
          ●	linux-1	Workspace	jterrazz-macbook-pro	Running · ephemeral	4 CPU	8 GB
