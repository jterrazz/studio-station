description: 'a stopped permanent workspace starts once its guest answers, and its record wants it running'
env: two-macs
runs:
    - command: 'machines start api'
      exit: 0
      stdout: |
          ●	api	started
    - command: 'machines --here'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	Mac	jterrazz-macbook-pro	Engine running
          ●	api	Workspace	jterrazz-macbook-pro	Running · permanent	4 CPU	8 GB
          ●	linux-1	Workspace	jterrazz-macbook-pro	Running · throwaway	4 CPU	8 GB
