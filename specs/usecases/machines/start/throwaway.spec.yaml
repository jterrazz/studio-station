description: 'a stopped throwaway workspace starts again with its disk: a throwaway may be stopped and started'
env: two-macs
runs:
    - command: 'machines stop linux-1 --yes'
      exit: 0
      stdout: |
          ●	linux-1	stopped, kept
    - command: 'machines start linux-1'
      exit: 0
      stdout: |
          ●	linux-1	started
    - command: 'machines --here'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	Mac	jterrazz-macbook-pro	Engine running
          ○	api	Workspace	jterrazz-macbook-pro	Stopped · permanent	4 CPU	8 GB
          ●	linux-1	Workspace	jterrazz-macbook-pro	Running · throwaway	4 CPU	8 GB
