description: 'a server of another Mac restarts through that Mac with no question: a new run, still wanted running'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-mac-mini"].vms.infra | {pid, want: .kept.want}'' world.json'
      exit: 0
      stdout: |
          {"pid":2001,"want":"running"}
    - command: 'machines restart infra --on mac-mini'
      exit: 0
      stdout: |
          ●	Running
          ●	Has an address	192.168.64.5
          ●	SSH answers
          ●	infra	restarted
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-mac-mini"].vms.infra | {pid, want: .kept.want}'' world.json'
      exit: 0
      stdout: |
          {"pid":1002,"want":"running"}
    - command: 'machines | /usr/bin/grep infra'
      exit: 0
      stdout: |
          ●	infra	Server	jterrazz-mac-mini	Running · always on	8 CPU	24 GB
