description: 'an always-on server whose vm.mounts folder is gone from the Mac starts without it, saying why'
fixture: ../../__fixtures__/build/
env: two-macs
runs:
    - command: '--version >/dev/null; /bin/mkdir -p data'
      exit: 0
    - command: 'world edit jterrazz-macbook-pro machinefiles/studio-linux.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: studio-linux
          machine: { kind: workspace, system: { os: ubuntu, version: '24.04' } }
          extends: [station-linux]
          vm:
            lifetime: persistent
            mounts: [{ computer: ~/data, guest: /data }]
      exit: 0
    - command: 'images build studio-linux --binary $HOME/station-linux >/dev/null'
      exit: 0
    - command: 'machines create web --from studio-linux >/dev/null'
      exit: 0
    - command: '--version >/dev/null; /bin/rmdir data; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].vms["web"].kept.lifetime = "always-on"'' world.json > world.next && /bin/mv world.next world.json'
      exit: 0
    - command: 'machines restart web >/dev/null'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].vms["web"] | {folders: .booted.folders}'' world.json'
      exit: 0
      stdout: |
          {"folders":[]}
    - command: 'machines --json | /usr/bin/jq -r ''.macs[].vms[] | select(.name == "web") | .detail'''
      exit: 0
      stdout: |
          {{workdir}}/data, which web's Machinefile studio-linux shares at /data, is no folder of this Mac: the server starts without it
