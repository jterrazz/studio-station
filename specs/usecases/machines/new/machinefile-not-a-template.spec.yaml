description: 'machines.new from a file no VM is made from is refused, its code on the wire'
env:
    - two-macs
    - engine
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/shell-bits.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: shell-bits
          apps: [jq]
      exit: 0
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.error) | .error | {code, subject, message}'''
      stdin: |
          {"v":2,"id":"1","watch":"machines.new","in":{"From":"shell-bits"}}
      exit: 0
      stdout: |
          {"code":"machinefile.not-a-template","subject":"shell-bits","message":"shell-bits makes no image: an image is made from a VM's Machinefile that says its vm.image.from"}
