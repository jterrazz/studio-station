description: 'a delete off a terminal without --confirm is refused before anything is deleted'
env: two-macs
runs:
    - command: 'machines delete linux-1'
      exit: 2
      stderr: |
          Error: refusing without the name typed: linux-1
          Hint: in a script: --confirm=linux-1
    - command: 'machines --this-mac'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	Mac	jterrazz-macbook-pro	Engine running
          ○	api	Workspace	jterrazz-macbook-pro	Stopped · persistent	4 CPU	8 GB
          ●	linux-1	Workspace	jterrazz-macbook-pro	Running · ephemeral	4 CPU	8 GB
