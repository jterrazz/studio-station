description: 'stop never destroys: a temporary VM is refused, and it keeps running'
env: two-macs
runs:
    - command: 'machines stop linux-1'
      exit: 2
      stderr: |
          Error: linux-1 is temporary: stopping it would delete it
          Hint: station machines delete linux-1
    - command: 'machines --here'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	host			online	-	2 VMs
          ○	api	linux	jterrazz-macbook-pro	lasting	stopped	-	4 cpus · 8 GB · 50.0 GB
          ●	linux-1	linux	jterrazz-macbook-pro	temporary	running	192.168.64.5	4 cpus · 8 GB · 50.0 GB
