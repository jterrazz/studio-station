description: 'on a terminal, stop asks yes or no; yes stops the workspace and keeps it'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 100x20 /usr/bin/env -u NO_COLOR COLUMNS=100 "$STATION" machines stop linux-1'
      stdin: |
          within 10 see Stop linux-1?
          send y
          within 20 exit 0
          screen
      exit: 0
      stdout: |
          ┃ Stop linux-1? It is kept, stopped, until you start it
          ┃
           station machines stop                                                  jterrazz-macbook-pro · host
           ──────────────────────────────────────────────────────────────────────────────────────────────────

           Changes
             ● linux-1  stopped, kept
    - command: 'machines | /usr/bin/grep linux-1'
      exit: 0
      stdout: |
          ○	linux-1	Workspace	jterrazz-macbook-pro	Stopped · throwaway	4 CPU	8 GB
