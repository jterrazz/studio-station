description: 'on a terminal, stop asks yes or no; no leaves it running and exits 1'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 100x20 /usr/bin/env -u NO_COLOR COLUMNS=100 "$STATION" machines stop linux-1'
      stdin: |
          within 10 see Stop linux-1?
          send n
          within 20 exit 1
          screen
      exit: 1
      stdout: |
          ┃ Stop linux-1? It is kept, stopped, until you start it
          ┃
          Error: linux-1 kept: you said no
          Hint: --yes skips the question
    - command: 'machines | /usr/bin/grep linux-1'
      exit: 0
      stdout: |
          ●	linux-1	Workspace	jterrazz-macbook-pro	Running · ephemeral	4 CPU	8 GB
