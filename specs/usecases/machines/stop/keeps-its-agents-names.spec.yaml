description: 'a stopped workspace still holds its agents'' names: no new agent or VM takes one'
env: mini-workspace
runs:
    - command: 'agents start "Write the changelog" --on linux-1 --name docs-bot'
      exit: 0
      stdout: |
          	On linux-1:
          ●	docs-bot	starts · claudecode · Write the changelog
    - command: 'machines stop linux-1 --yes'
      exit: 0
      stdout: |
          ●	linux-1	stopped, kept · its agent docs-bot stopped
    - command: 'agents start "Write the release notes" --on ci-1 --name docs-bot'
      exit: 2
      stderr: |
          Error: an agent is already named docs-bot
          Hint: name it another way: --name <name>
    - command: 'machines create docs-bot'
      exit: 2
      stderr: |
          Error: "docs-bot" is taken (an agent on linux-1)
          Hint: pick another name
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].vms["linux-1"].kept.agents'' world.json'
      exit: 0
      stdout: |
          ["docs-bot"]
    - command: 'machines start linux-1'
      exit: 0
      stdout: |
          ●	linux-1	started
    - command: 'agents'
      exit: 0
      stdout: |
          # Agents	1 ○
          ○	docs-bot	claudecode	finished · its workspace stopped	Write the changelog	linux-1	jterrazz-macbook-pro	2m ago
