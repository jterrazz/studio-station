description: 'off a terminal, a server stop without its name typed is refused before any effect'
env: two-macs
runs:
    - command: 'machines stop infra --on mac-mini'
      exit: 2
      stderr: |
          Error: refusing without the name typed: infra
          Hint: in a script: --confirm=infra
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-mac-mini"].vms.infra | {running: (.pid > 0), want: .kept.want}'' world.json'
      exit: 0
      stdout: |
          {"running":true,"want":"running"}
