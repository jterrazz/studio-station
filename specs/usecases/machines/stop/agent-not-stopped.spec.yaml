description: 'an agent a workspace stop could not stop is said under it; the workspace stops all the same'
env: two-macs
runs:
    - command: 'agents start "Build the landing page" --on linux-1'
      exit: 0
      stdout: |
          	On linux-1:
          ●	linux-1	starts · claudecode · Build the landing page
    - command: 'world fault Journal.Write 1 times'
      exit: 0
    - command: 'machines stop linux-1 --yes'
      exit: 0
      stdout: |
          ●	linux-1	stopped, kept
          ◐	linux-1	linux-1 did not stop: the agents' journal could not be read
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].vms["linux-1"].pid'' world.json'
      exit: 0
      stdout: |
          null
