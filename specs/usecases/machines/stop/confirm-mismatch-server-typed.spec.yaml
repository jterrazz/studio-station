description: 'on a terminal, a server stop asks its name typed; a wrong name stops nothing and exits 1'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 100x20 /usr/bin/env -u NO_COLOR COLUMNS=100 "$STATION" machines stop infra --on mac-mini'
      stdin: |
          within 10 see Type infra
          send inf\r
          within 20 exit 1
          screen
      exit: 1
      stdout: |
          Stop infra? It will not start at its Mac's boot nor restart until you start it
          ┃ Type infra to stop it:
          Error: not stopped: you typed "inf", not "infra"
          Hint: in a script: --confirm=infra
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-mac-mini"].vms.infra | {running: (.pid > 0), want: .kept.want}'' world.json'
      exit: 0
      stdout: |
          {"running":true,"want":"running"}
