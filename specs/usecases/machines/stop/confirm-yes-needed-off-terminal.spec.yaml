description: 'a stop off a terminal without --yes is refused before anything stops, and the workspace still runs'
env: two-macs
runs:
    - command: 'machines stop linux-1'
      exit: 2
      stderr: |
          Error: refusing to stop without --yes
          Hint: re-run with --yes
    - command: 'machines --here'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	mac			online	-	2 VMs
          ○	api	workspace	jterrazz-macbook-pro	permanent	stopped	-	4 cpus · 8 GB · 50.0 GB
          ●	linux-1	workspace	jterrazz-macbook-pro	throwaway	running	192.168.64.5	4 cpus · 8 GB · 50.0 GB
