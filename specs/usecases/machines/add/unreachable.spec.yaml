description: 'a Mac that does not answer is not added: no preference, no ssh block'
env: one-mac
runs:
    - command: 'world offline jterrazz-mac-mini'
      exit: 0
    - command: 'machines add jterrazz-mac-mini'
      exit: 1
      stderr: |
          Error: mac-mini does not answer
          Hint: station machines mac-mini
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"] | [.preferences.macs, (.ssh.blocks // {})]'' world.json'
      exit: 0
      stdout: |
          [null,{}]
