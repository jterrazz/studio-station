description: 'add refuses a bad name, exit 2, before it reaches any Mac, its code on the wire'
env:
    - two-macs
    - engine
runs:
    - command: 'machines add Bad_Name'
      exit: 2
      stderr: |
          Error: "Bad_Name" is not a valid name
          Hint: use lowercase letters, digits and "-", 1 to 40 characters
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.error) | .error | {code, subject, message}'''
      stdin: |
          {"v":2,"id":"1","call":"machines.add","in":{"Name":"Bad_Name"}}
      exit: 0
      stdout: |
          {"code":"machines.bad-name","subject":"Bad_Name","message":"\"Bad_Name\" is not a valid name"}
