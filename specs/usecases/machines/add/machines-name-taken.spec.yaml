description: 'add refuses a Mac already added, exit 2, before it reaches any Mac'
env: two-macs
runs:
    - command: 'machines add jterrazz-mac-mini'
      exit: 2
      stderr: |
          Error: machine "jterrazz-mac-mini" already exists
          Hint: station machines forget jterrazz-mac-mini first, to change it
    - command: 'machines add --name jterrazz-mac-mini'
      exit: 2
      stderr: |
          Error: machine "jterrazz-mac-mini" already exists
          Hint: station machines forget jterrazz-mac-mini first, to change it
