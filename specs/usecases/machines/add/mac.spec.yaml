description: 'adding a Mac whose ssh and station answer writes its ssh block, and it appears in All machines'
env: one-mac
runs:
    - command: 'machines add jterrazz-mac-mini'
      exit: 0
      stdout: |
          ●	mac-mini	added · ssh answers · station {{string}}
    - command: 'machines | /usr/bin/grep mac-mini'
      exit: 0
      stdout: |
          ●	jterrazz-mac-mini	Mac	jterrazz-mac-mini	Engine running
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].ssh.blocks'' world.json'
      exit: 0
      stdout: |
          {"jterrazz-mac-mini":{}}
