description: 'on a terminal, unlock opens the pre-boot session of a Mac waiting at FileVault after a power cut; once its disk is unlocked it answers on Tailscale again'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - mini-offline
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 100x20 /usr/bin/env -u NO_COLOR COLUMNS=100 "$STATION" machines unlock mac-mini'
      stdin: |
          within 20 exit 0
          screen
      exit: 0
      stdout: |4
           station machines unlock                                                jterrazz-macbook-pro · host
           ──────────────────────────────────────────────────────────────────────────────────────────────────

           Changes
             ● mac-mini  unlocked · on Tailscale again
    - command: 'machines | /usr/bin/grep mac-mini'
      exit: 0
      stdout: |
          ●	jterrazz-mac-mini	Mac	jterrazz-mac-mini	Engine running
          ●	infra	Workspace	jterrazz-mac-mini	Running · permanent	8 CPU	24 GB
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-mac-mini"] | [.locked, .offline]'' world.json'
      exit: 0
      stdout: |
          [null,null]
