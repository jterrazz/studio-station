description: 'deleting linux-1 takes every copy it held with it: no share of it is left'
env: two-macs
runs:
    - command: 'machines delete linux-1 --confirm=linux-1'
      exit: 0
      stdout: |
          ●	linux-1	deleted
    - command: '--version >/dev/null; /usr/bin/jq -c ''[.macs["jterrazz-macbook-pro"].vms["linux-1"], (.macs["jterrazz-macbook-pro"].stores.shares["linux-1"] // [] | map(.name))]'' world.json'
      exit: 0
      stdout: |
          [null,[]]
    - command: 'accounts | /usr/bin/grep -A1 "^# Shared"'
      exit: 0
      stdout: |
          # Shared with VMs
          	none
