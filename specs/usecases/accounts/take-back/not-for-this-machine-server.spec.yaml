description: 'a take-back is a Mac''s: run on a server it is refused, exit 2'
env: two-macs
runs:
    - command: 'accounts take-back github --from linux-1 --on infra --yes'
      exit: 2
      stderr: |
          Error: infra is a server: station does not manage its accounts
          Hint: manage it with your own tooling: ssh infra
