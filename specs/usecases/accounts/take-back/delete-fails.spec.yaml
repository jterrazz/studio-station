description: 'a take-back the VM fails to delete exits 1, and the VM and the share keep the copy'
env: two-macs
runs:
    - command: 'world fault Guest.Exec'
      exit: 0
    - command: 'accounts take-back github --from linux-1 --yes'
      exit: 1
      stderr: |
          Error: deleting the copies failed for "linux-1": exit 1
          Hint: check the VM: station machines linux-1
    - command: '--version >/dev/null; /usr/bin/jq -c ''[(.macs["linux-1"].secrets // {} | keys), (.macs["jterrazz-macbook-pro"].stores.shares["linux-1"] // [] | map(.name))]'' world.json'
      exit: 0
      stdout: |
          [["operator:claude:oauth-token","session:github"],["session:github","operator:claude:oauth-token"]]
