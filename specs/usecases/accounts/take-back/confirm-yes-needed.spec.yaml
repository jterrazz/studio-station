description: 'a take-back piped without --yes is refused, exit 2, and the VM keeps its copy until it ends'
env: two-macs
runs:
    - command: 'accounts take-back github --from linux-1'
      exit: 2
      stderr: |
          Error: refusing to take-back without --yes
          Hint: re-run with --yes
    - command: '--version >/dev/null; /usr/bin/jq -c ''[(.macs["linux-1"].secrets // {} | keys), (.macs["jterrazz-macbook-pro"].stores.shares["linux-1"] // [] | map(.name))]'' world.json'
      exit: 0
      stdout: |
          [["operator:claude:oauth-token","session:github"],["session:github","operator:claude:oauth-token"]]
