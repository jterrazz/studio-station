description: 'a take-back answered y deletes linux-1''s copy, and the row leaves Shared with VMs'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; NO_COLOR= terminal --size 100x30 "$STATION" accounts take-back github --from linux-1'
      stdin: |
          see Take GitHub back from linux-1?
          send y
          scrollback
      exit: 0
      stdout: |
          ┃ Take GitHub back from linux-1?
          ┃
          github · taken back from linux-1
    - command: '--version >/dev/null; /usr/bin/jq -c ''[(.macs["linux-1"].secrets // {} | keys), (.macs["jterrazz-macbook-pro"].stores.shares["linux-1"] // [] | map(.name))]'' world.json'
      exit: 0
      stdout: |
          [["operator:claude:oauth-token"],["operator:claude:oauth-token"]]
    - command: 'accounts | /usr/bin/grep -A2 "^# Shared"'
      exit: 0
      stdout: |
          # Shared with VMs
          ●	claude	linux-1	11 h left
