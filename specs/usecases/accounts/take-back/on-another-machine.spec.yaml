description: 'a share the mini made is taken back --on the mini: ci-1''s copy is deleted there'
env: mini-workspace
runs:
    - command: 'accounts share github --with ci-1 --on jterrazz-mac-mini'
      exit: 0
      stdout: |
          ●	github	shared with ci-1	12 h
    - command: 'accounts take-back github --from ci-1 --on jterrazz-mac-mini --yes'
      exit: 0
      stdout: |
          ●	github	taken back from ci-1
    - command: '--version >/dev/null; /usr/bin/jq -c ''[.macs["ci-1"].secrets, .macs["jterrazz-mac-mini"].stores.shares]'' world.json'
      exit: 0
      stdout: |
          [null,null]
