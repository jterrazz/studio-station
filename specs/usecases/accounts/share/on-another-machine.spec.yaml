description: 'the same share --on the mini copies the mini''s own GitHub sign-in into ci-1, and the mini lists it'
env: mini-workspace
runs:
    - command: 'accounts share github --with ci-1 --on jterrazz-mac-mini'
      exit: 0
      stdout: |
          	On mac-mini:
          ●	github	shared with ci-1	12 h
    - command: '--version >/dev/null; /usr/bin/jq -c ''[(.macs["ci-1"].secrets["session:github"] == .macs["jterrazz-mac-mini"].secrets["session:github"]), [.macs["jterrazz-mac-mini"].stores.shares["ci-1"][].name], .macs["jterrazz-macbook-pro"].stores.shares["ci-1"]]'' world.json'
      exit: 0
      stdout: |
          [true,["session:github"],null]
    - command: 'accounts --on jterrazz-mac-mini | /usr/bin/grep -A1 "^# Shared"'
      exit: 0
      stdout: |
          # Shared with VMs
          ●	github	ci-1	12 h left
