description: 'the refusal''s own hint runs: --on mac-mini shares from the mini''s sign-in'
env: mini-workspace
runs:
    - command: 'accounts share github --with ci-1'
      exit: 2
      stderr: |
          Error: ci-1 is on mac-mini: share from mac-mini's accounts
          Hint: station accounts share github --with ci-1 --on mac-mini
    - command: 'accounts share github --with ci-1 --on mac-mini'
      exit: 0
      stdout: |
          	On mac-mini:
          ●	github	shared with ci-1	12 h
