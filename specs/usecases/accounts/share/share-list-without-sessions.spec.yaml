description: 'a share list edited down to the Claude token refuses GitHub and still shares Claude'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].preferences.share_list = ["operator:claude:oauth-token"] | del(.macs["linux-1"].secrets) | del(.macs["jterrazz-macbook-pro"].stores.shares)'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'accounts share github --with linux-1'
      exit: 2
      stderr: |
          Error: github is not on the share list
          Hint: the share list is share_list in ~/.config/station/preferences.json
    - command: 'accounts share claude --with linux-1'
      exit: 0
      stdout: |
          ●	claude	shared with linux-1	12 h
    - command: '--version >/dev/null; /usr/bin/jq -c ''[(.macs["linux-1"].secrets // {} | keys), (.macs["jterrazz-macbook-pro"].stores.shares["linux-1"] // [] | map(.name))]'' world.json'
      exit: 0
      stdout: |
          [["operator:claude:oauth-token"],["operator:claude:oauth-token"]]
