description: 'a server keeps its own secrets on its own Mac too: the call refuses it, exit 2, nothing copied'
env: two-macs
runs:
    - command: 'accounts share github --with infra --on jterrazz-mac-mini'
      exit: 2
      stderr: |
          Error: infra is a server: station shares no account with it
          Hint: give it its secrets with your own tooling
    - command: '--version >/dev/null; /usr/bin/jq -c ''[.macs.infra.secrets, .macs["jterrazz-mac-mini"].stores.shares]'' world.json'
      exit: 0
      stdout: |
          [null,null]
