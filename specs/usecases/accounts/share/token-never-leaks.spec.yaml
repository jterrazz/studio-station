description: 'a shared secret reaches the VM''s credential store and no output or file station writes'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''del(.macs["linux-1"].secrets) | del(.macs["jterrazz-macbook-pro"].stores.shares)'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: '--version >/dev/null; { "$STATION" accounts share claude --with linux-1; "$STATION" accounts share github --with linux-1; "$STATION" accounts; "$STATION" accounts --json; "$STATION" accounts --page; "$STATION" accounts --on linux-1 --json; "$STATION" accounts --all-machines; } 2>&1 | /usr/bin/grep -c -e fake-claude-token -e fake-session-github'
      exit: 1
      stdout: |
          0
    - command: '--version >/dev/null; /usr/bin/grep -rl -e fake-claude-token -e fake-session-github . | /usr/bin/grep -v "^./world.json$"; /usr/bin/jq -c ''[(.macs["linux-1"].secrets | keys), (.macs["linux-1"].secrets["operator:claude:oauth-token"] == .macs["jterrazz-macbook-pro"].secrets["operator:claude:oauth-token"])]'' world.json'
      exit: 0
      stdout: |
          [["operator:claude:oauth-token","session:github"],true]
