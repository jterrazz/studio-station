description: 'share github --with linux-1 --for 4h puts the session in linux-1''s store for 4 h'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''del(.macs["linux-1"].secrets) | del(.macs["jterrazz-macbook-pro"].stores.shares)'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'accounts share github --with linux-1 --for 4h'
      exit: 0
      stdout: |
          ●	github	shared with linux-1	4 h
    - command: '--version >/dev/null; /usr/bin/jq -c ''[(.macs["linux-1"].secrets // {} | to_entries | map([.key, (.value == $mac[.key])])), (.macs["jterrazz-macbook-pro"].stores.shares["linux-1"] // [] | map([.name, (((.until|fromdate) - (.at|fromdate)) / 3600)]))]'' --argjson mac "$(/usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].secrets'' world.json)" world.json'
      exit: 0
      stdout: |
          [[["session:github",true]],[["session:github",4]]]
    - command: 'accounts | /usr/bin/grep -A3 "^# Shared"'
      exit: 0
      stdout: |
          # Shared with VMs
          ●	github	linux-1	4 h left
