description: 'without the studio CLI on This Mac, a share is refused before anything is read, naming it'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].absent = ["studio"]'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'accounts share github --with linux-1 --for 4h'
      exit: 2
      stderr: |
          Error: studio is required by account sharing
          Hint: install studio, then run it again
