description: 'sharing with a stopped VM is refused, exit 2, its hint the start; nothing copied'
env: two-macs
runs:
    - command: 'accounts share github --with api'
      exit: 2
      stderr: |
          Error: api is stopped
          Hint: station machines start api
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].stores.shares.api'' world.json'
      exit: 0
      stdout: |
          null
