description: 'sharing Claude while it is not signed in here: refused, exit 2, nothing copied'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''del(.macs["linux-1"].secrets) | del(.macs["jterrazz-macbook-pro"].stores.shares)'' world.json > w.json && /bin/mv w.json world.json; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].identities.claude = {"State": "absent", "Reason": "unset"}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'accounts share claude --with linux-1'
      exit: 2
      stderr: |
          Error: Claude is not signed in on This Mac
          Hint: station settings apply claude-token
    - command: '--version >/dev/null; /usr/bin/jq -c ''[(.macs["linux-1"].secrets // {} | to_entries | map([.key, (.value == $mac[.key])])), (.macs["jterrazz-macbook-pro"].stores.shares["linux-1"] // [] | map([.name, (((.until|fromdate) - (.at|fromdate)) / 3600)]))]'' --argjson mac "$(/usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].secrets'' world.json)" world.json'
      exit: 0
      stdout: |
          [[],[]]
