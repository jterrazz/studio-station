description: '--all-machines with the mini offline: the mini does not answer, the others filled'
env: mini-offline
runs:
    - command: 'accounts --all-machines | /usr/bin/grep -e "^# " -e "does not answer" -e "	github	"'
      exit: 0
      stdout: |
          # jterrazz-macbook-pro
          ●	github	signed in	jterrazz	read:org · repo
          # Shared with VMs
          # api
          # linux-1
          ●	github	signed in	jterrazz	repo
          # Shared with VMs
          # jterrazz-mac-mini
          ✗	jterrazz-mac-mini	does not answer
