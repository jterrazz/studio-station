description: '--on linux-1: what linux-1 is signed into, and the shares it holds'
env: two-macs
runs:
    - command: 'accounts --on linux-1'
      exit: 0
      stdout: |
          ●	github	signed in	jterrazz	repo
          ●	git	signed in	jterrazz
          # Shared with VMs
          ●	github	linux-1	11 h left
          ●	claude	linux-1	11 h left
