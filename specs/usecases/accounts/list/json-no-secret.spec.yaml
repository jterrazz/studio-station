description: 'accounts --json is station.accounts.list/v1, and no secret byte is in it'
env:
    - two-macs
    - engine
runs:
    - command: 'accounts --json | /usr/bin/jq -c ''[.schema, .machine, [.accounts[] | [.name, .shareable]], [.shares[] | [.account, .vm]], .share_list]'''
      exit: 0
      stdout: |
          ["station.accounts.list/v1",{"name":"jterrazz-macbook-pro","kind":"mac"},[["github",true],["npm",false],["claude",true],["tailscale",false],["cloudflare",false],["git",false],["ssh",false],["docker",false]],[["github","linux-1"],["claude","linux-1"]],["session:*","operator:claude:oauth-token"]]
    - command: '--version >/dev/null; "$STATION" accounts --json | /usr/bin/grep -c -e fake-session-github -e fake-claude-token'
      exit: 1
      stdout: |
          0
