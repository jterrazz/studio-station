description: 'an npm sign-in the registry refuses reads expired, with its fix command'
env: two-macs
runs:
    - command: 'accounts | /usr/bin/grep "	npm	"'
      exit: 0
      stdout: |
          ✗	npm	expired			token refused	npm login
    - command: 'accounts --json | /usr/bin/jq -c ''.accounts[] | select(.name == "npm") | [.state, .detail, .fix]'''
      exit: 0
      stdout: |
          ["expired","token refused","npm login"]
