description: 'with the engine stopped station activity samples twice, 1 s apart, and keeps no history'
env:
    - engine-stopped
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].meter = {"sample": {"at": "2026-11-04T10:00:00Z", "cpu_busy": 3400000, "cpu_total": 10000000, "cpus": 10, "load": [2.8, 3.1, 2.9], "mem_used": 13314398618, "mem_total": 17179869184, "pressure": "normal", "swap_used": 1288490188, "disk_read": 182000000000, "disk_written": 96000000000, "net_in": 38000000000, "net_out": 4600000000, "boot": "2026-11-01T06:00:00Z"}, "per_second": {"cpu_busy": 340, "cpu_total": 1000, "disk_read": 4100000, "disk_written": 1300000, "net_in": 2100000, "net_out": 210000}, "top": {"cpu": [{"pid": 4100, "name": "Zed", "value": 9}], "memory": [{"pid": 4100, "name": "Zed", "value": 2040109465}]}}'' world.json > w.json && /bin/mv w.json world.json; "$STATION" activity | /usr/bin/head -4'
      exit: 0
      stdout: |
          ●	This Mac	up 3d 8h · rates over 1 s
          # Now
          	CPU	34 % of 10 CPU · load 2.8 3.1 2.9
          	Memory	12.4 of 16 GB · pressure normal · swap 1.2 GB
    - command: 'activity --json | /usr/bin/jq -c ''{source, window_s, history_since_at, history, read: .disk.read_bytes_per_s}'''
      exit: 0
      stdout: |
          {"source":"direct","window_s":1,"history_since_at":null,"history":null,"read":4100000}
