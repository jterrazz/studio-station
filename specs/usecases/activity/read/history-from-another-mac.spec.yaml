description: 'another Mac''s history is its own engine''s, since that engine started'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; for i in 1 2 3 4 5; do "$STATION" world advance 1m; done; "$STATION" activity --on mac-mini --json --history | /usr/bin/jq -c --slurpfile w world.json ''{machine: .machine.name, since_its_engine: (.history_since_at == $w[0].macs["jterrazz-mac-mini"].engine.started_at), not_this_macs: (.history_since_at != $w[0].macs["jterrazz-macbook-pro"].engine.started_at), points: (.history.points | length >= 5)}'''
      exit: 0
      stdout: |
          {"machine":"mac-mini","since_its_engine":true,"not_this_macs":true,"points":true}
