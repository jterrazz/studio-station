description: 'an offline Mac is its own row; the others are filled, a meter that counted nothing reads ?'
env:
    - mini-offline
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].meter = {"sample": {"at": "2026-11-04T10:00:00Z", "cpu_busy": 3400000, "cpu_total": 10000000, "cpus": 10, "load": [2.8, 3.1, 2.9], "mem_used": 13314398618, "mem_total": 17179869184, "pressure": "normal", "swap_used": 1288490188, "disk_read": 182000000000, "disk_written": 96000000000, "net_in": 38000000000, "net_out": 4600000000, "boot": "2026-11-01T06:00:00Z"}, "per_second": {"cpu_busy": 340, "cpu_total": 1000, "disk_read": 4100000, "disk_written": 1300000, "net_in": 2100000, "net_out": 210000}, "top": {"cpu": [{"pid": 4100, "name": "Zed", "value": 9}], "memory": [{"pid": 4100, "name": "Zed", "value": 2040109465}]}}'' world.json > w.json && /bin/mv w.json world.json; "$STATION" activity --all-machines'
      exit: 0
      stdout: |
          ●	All machines	4 machines · 2 answering · rates over 1 s
          # Machines
          ●	This Mac	Mac	34 %	12.4/16 GB	4.1/1.3 MB/s	2.1/0.2 MB/s
          ○	api	Workspace	Stopped
          ●	linux-1	Workspace	?	?	?	?
          ✗	mac-mini	Mac	does not answer
    - command: 'activity --all-machines --json | /usr/bin/jq -c ''.machines[] | [.machine.name, .state, .error]'''
      exit: 0
      stdout: |
          ["jterrazz-macbook-pro","answering",null]
          ["api","stopped",null]
          ["linux-1","answering",null]
          ["jterrazz-mac-mini","does-not-answer",{"type":"unreachable","code":null,"message":"does not answer"}]
