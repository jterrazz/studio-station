description: 'counters that go back between two samples (a reboot) give rates of zero, never negative'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].engine.menubar = "open"'' world.json > w.json && /bin/mv w.json world.json; for i in 1 2 3 4 5 6; do "$STATION" world advance 2s; done; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].meter.sample |= (.at = "2026-11-04T10:00:00Z" | .cpu_busy = 0 | .cpu_total = 0 | .disk_read = 0 | .disk_written = 0 | .net_in = 0 | .net_out = 0) | .macs["jterrazz-macbook-pro"].meter |= del(.per_second)'' world.json > w.json && /bin/mv w.json world.json; "$STATION" world advance 2s; "$STATION" activity --json | /usr/bin/jq -c ''{source, cpu: .cpu.busy_percent, read: .disk.read_bytes_per_s, write: .disk.write_bytes_per_s, in: .network.in_bytes_per_s, out: .network.out_bytes_per_s}'''
      exit: 0
      stdout: |
          {"source":"engine","cpu":0,"read":0,"write":0,"in":0,"out":0}
