description: 'activity --json is station.activity.read/v1; a VM has no thermal, the mini no battery'
env: two-macs
runs:
    - command: 'activity --json | /usr/bin/jq -c ''{schema, machine, source, cpu, memory, disk, network, thermal, battery, up_s, top: .top.by_cpu[0], findings}'''
      exit: 0
      stdout: |
          {"schema":"station.activity.read/v1","machine":{"name":"jterrazz-macbook-pro","label":"This Mac","kind":"mac","on":null,"this_mac":true},"source":"direct","cpu":{"busy_percent":34,"cpus":10,"load":[2.8,3.1,2.9]},"memory":{"used_bytes":13314398618,"total_bytes":17179869184,"pressure":"normal","swap_used_bytes":1288490188},"disk":{"free_bytes":388000000000,"total_bytes":994000000000,"read_bytes_per_s":4100000,"write_bytes_per_s":1300000,"read_since_boot_bytes":182016400000,"written_since_boot_bytes":96005200000},"network":{"in_bytes_per_s":2100000,"out_bytes_per_s":210000,"received_since_boot_bytes":38008400000,"sent_since_boot_bytes":4600840000},"thermal":{"level":"nominal","cpu_celsius":null},"battery":{"percent":96,"state":"charging","health_percent":98,"cycles":112},"up_s":273604,"top":{"name":"tart","pid":1001,"vm":null,"cpu_percent":18,"memory_bytes":null},"findings":[]}
    - command: 'activity --on linux-1 --json | /usr/bin/jq -c ''{machine, thermal, battery}'''
      exit: 0
      stdout: |
          {"machine":{"name":"linux-1","label":"linux-1","kind":"workspace","on":"jterrazz-macbook-pro","this_mac":false},"thermal":null,"battery":null}
    - command: 'activity --on jterrazz-mac-mini --json | /usr/bin/jq -c ''{machine: .machine.name, thermal, battery}'''
      exit: 0
      stdout: |
          {"machine":"jterrazz-mac-mini","thermal":{"level":"nominal","cpu_celsius":null},"battery":null}
