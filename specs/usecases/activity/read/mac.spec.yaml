description: 'station activity on This Mac: rates over the last 10 s while watched, else sampled now 1 s apart'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].engine.menubar = "open"'' world.json > w.json && /bin/mv w.json world.json; for i in 1 2 3 4 5 6; do "$STATION" world advance 2s; done; "$STATION" activity'
      exit: 0
      stdout: |
          ●	This Mac	up 3d 4h · rates over the last 10 s
          # Now
          	CPU	34 % of 10 CPU · load 2.8 3.1 2.9
          	Memory	12.4 of 16 GB · pressure normal · swap 1.2 GB
          	Disk	388 GB free of 994 GB
          	Disk read	4.1 MB/s · 182 GB since boot
          	Disk write	1.3 MB/s · 96.1 GB since boot
          	Network	in 2.1 MB/s · out 210 KB/s
          	Network total	received 38.2 GB · sent 4.6 GB since boot
          ●	Thermal	Nominal
          	Battery	96 % · charging · health 98 % · 112 cycles
          # Top processes
          	Top by CPU	tart (linux-1) 18 % · Zed 9 % · WindowServer 4 %
          	Top by memory	tart (linux-1) 4.1 GB · Zed 1.9 GB · WindowServer 0.6 GB
    - command: '--version >/dev/null; /usr/bin/jq ''del(.macs["jterrazz-macbook-pro"].engine.menubar)'' world.json > w.json && /bin/mv w.json world.json; for i in 1 2 3 4 5; do "$STATION" world advance 1m; done; "$STATION" world advance 20s; "$STATION" activity | /usr/bin/head -1; "$STATION" activity --json | /usr/bin/jq -c ''{source, window_s, kept: (.history_since_at != null), sampled_now: (((.generated_at | fromdate) - (.boot_at | fromdate) - .up_s) | fabs <= 3)}'''
      exit: 0
      stdout: |
          ●	This Mac	up 3d 4h · rates over 1 s
          {"source":"direct","window_s":1,"kept":true,"sampled_now":true}
