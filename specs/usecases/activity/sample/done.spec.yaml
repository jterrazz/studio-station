description: 'a sample reads This Mac''s counters into its history'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" world advance 1m; /usr/bin/jq -r ''.macs["jterrazz-macbook-pro"].engine.activity["jterrazz-macbook-pro"].series.fine | .[-1] | "sampled: \(.at != null), memory read: \(.mem_used > 0), disk read: \(.disk_total > 0)"'' world.json'
      exit: 0
      stdout: |
          sampled: true, memory read: true, disk read: true
