description: 'each checked setting not as expected needs a fix with its own fix path, never a station command'
env: two-macs
runs:
    - command: 'world reads jterrazz-macbook-pro filevault off'
      exit: 0
    - command: 'world reads jterrazz-macbook-pro sip off'
      exit: 0
    - command: 'world reads jterrazz-macbook-pro gatekeeper off'
      exit: 0
    - command: 'world reads jterrazz-macbook-pro automatic-updates off'
      exit: 0
    - command: 'world reads jterrazz-macbook-pro system-updates "1 pending"'
      exit: 0
    - command: 'settings | /usr/bin/sed -n ''/^# Checked/,$p'''
      exit: 0
      stdout: |
          # Checked	3 ●	6 ◐
          ◐	filevault	off	System Settings > Privacy & Security > FileVault
          ◐	firewall	off	System Settings > Network > Firewall
          ◐	sip	off	Recovery > Terminal > csrutil enable
          ◐	automatic-updates	off	System Settings > General > Software Update > Automatic updates
          ◐	gatekeeper	off	System Settings > Privacy & Security > Security
          ◐	macos-updates	1 update waiting	System Settings > General > Software Update
          ●	screen-lock	as expected · locks after 2 min
          ●	remote-login	as expected · off
          ●	time-machine	as expected · last backup 2 d ago
          # Not for this machine
          –	1 not for this machine	VMs only
    - command: 'overview --all --json | /usr/bin/jq -c ''[.findings[] | select(.section == "settings") | .fix | with_entries(select(.value != null)) | keys]'''
      exit: 0
      stdout: |
          [["path"],["path"],["path"],["path"],["path"],["path"]]
