description: 'a workspace lists the settings that live there, the Mac-only ones folded with their reason'
env: in-workspace
runs:
    - command: 'settings'
      exit: 0
      stdout: |
          # Set by station	4 ○
          ○	hushlogin	not applied	station settings apply hushlogin
          ○	tmux-dotfiles	not applied · needs tmux	station tools install tmux
          ○	starship-dotfiles	not applied · needs starship	station tools install starship
          ○	github-login	not applied · needs gh	station tools install gh
          # Not for this machine
          –	15 not for this machine	Macs and macOS VMs only · Mac only
    - command: 'settings --all | /usr/bin/grep -c ''not for this machine'''
      exit: 0
      stdout: |
          15
