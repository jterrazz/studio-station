description: 'the matrix: a column per Mac and workspace, a server apart, counts without –, Needs a look first'
env: two-macs
runs:
    - command: 'settings apply dns --on jterrazz-mac-mini'
      exit: 0
      stdout: |
          	On mac-mini:
          ●	dns	dns: applied
    - command: 'settings apply tart-launcher'
      exit: 0
      stdout: |
          ●	tart-launcher	~/.local/bin/tart: written
    - command: '--version >/dev/null; printf ''# mine\n'' >> .local/bin/tart'
      exit: 0
    - command: 'settings --all-machines'
      exit: 0
      stdout: |
          # Needs a look
          ◐	jterrazz-macbook-pro	tart-launcher	changed since just now	station settings diff tart-launcher
          ◐	jterrazz-macbook-pro	firewall	off	System Settings > Network > Firewall
          # Machines
          ●	jterrazz-macbook-pro	Mac	read
          ●	jterrazz-mac-mini	Mac	read
          ●	linux-1	Workspace	read
          ?	api	Workspace	stopped · not read since the engine started
          –	infra	Server	not checked: station does not manage its settings
          # Set by station
          ◐	tart-launcher	◐	○	–	?	0/2
          ○	17 more	○ 0/16	○ 1/16	○ 0/7	?	1/39
          # Always-on Mac
          ○	5 settings	○	○ 3/5	–	?	3/5
          # Checked
          ◐	firewall	◐	●	–	?	1/2
          ●	8 more	● 8/8	● 8/8	–	?	16/16
