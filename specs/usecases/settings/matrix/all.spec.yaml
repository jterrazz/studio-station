description: '--all-machines --all unfolds the matrix: each setting on its own row, none folded into a count'
env: two-macs
runs:
    - command: 'settings --all-machines | /usr/bin/grep -e "settings	" -e "more	"'
      exit: 0
      stdout: |
          ○	20 settings	○ 0/19	○ 1/19	○ 0/7	?	1/45
          ○	5 settings	○	○ 3/5	–	?	3/5
          ●	8 more	● 8/8	● 8/8	–	?	16/16
    - command: 'settings --all-machines --all | /usr/bin/grep -c -e "settings	" -e "more	"'
      exit: 1
      stdout: |
          0
    - command: 'settings --all-machines --all | /usr/bin/sed -n "/^# Always-on Mac/,/^# Checked/p"'
      exit: 0
      stdout: |
          # Always-on Mac
          ●	autologin	○	●	–	?	1/1
          ○	lock-after-login	○	○	–	?	0/1
          ●	never-sleeps	○	●	–	?	1/1
          ●	restart-after-power-cut	○	●	–	?	1/1
          ○	sshd	○	○	–	?	0/1
          # Checked
    - command: 'settings --all-machines --all | /usr/bin/grep -c "^[^#].*	[0-9]*/[0-9]*$"'
      exit: 0
      stdout: |
          34
