description: 'a stopped workspace shows its last read with its age, unknown once This Mac''s engine restarted'
env: two-macs
runs:
    - command: 'settings apply starship-dotfiles --on linux-1'
      exit: 0
      stdout: |
          ●	starship-dotfiles	~/.config/starship.toml: written
    - command: 'settings --all-machines --all | /usr/bin/grep -e "	Workspace	" -e "starship-dotfiles"'
      exit: 0
      stdout: |
          ●	linux-1	Workspace	read
          ?	api	Workspace	stopped · not read since the engine started
          ●	starship-dotfiles	●	●	●	?	3/3
    - command: 'machines stop linux-1 --yes'
      exit: 0
      stdout: |
          ●	linux-1	stopped, kept
    - command: 'world advance 2h'
      exit: 0
    - command: 'settings --all-machines --all | /usr/bin/grep -e "	Workspace	" -e "starship-dotfiles"'
      exit: 0
      stdout: |
          ?	api	Workspace	stopped · not read since the engine started
          ○	linux-1	Workspace	stopped · last read 2 h ago
          ●	starship-dotfiles	●	●	?	●	3/3
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].engine.settings // {} | keys'' world.json'
      exit: 0
      stdout: |
          ["linux-1"]
    - command: 'world engine-crash jterrazz-macbook-pro'
      exit: 0
    - command: 'settings --all-machines --all | /usr/bin/grep -e "	Workspace	" -e "starship-dotfiles"'
      exit: 0
      stdout: |
          ?	api	Workspace	stopped · not read since the engine started
          ?	linux-1	Workspace	stopped · not read since the engine started
          ●	starship-dotfiles	●	●	?	?	2/2
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].engine.settings // {} | keys'' world.json'
      exit: 0
      stdout: |
          []
