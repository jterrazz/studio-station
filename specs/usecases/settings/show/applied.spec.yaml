description: 'settings <setting> is its detail: state, group, what it does, where, and where it lives'
env: two-macs
runs:
    - command: 'settings apply tart-launcher'
      exit: 0
      stdout: |
          ●	tart-launcher	~/.local/bin/tart: written
    - command: 'world advance 3h'
      exit: 0
    - command: 'settings tart-launcher'
      exit: 0
      stdout: |
          ●	tart-launcher	applied · ~/.local/bin/tart
          # Detail
          group	Set by station
          does	The tart launcher: Tart's home is station's VMs folder
          lives on	Macs
          where	~/.local/bin/tart
          applied	3 h ago
    - command: 'settings restart-after-power-cut'
      exit: 0
      stdout: |
          ○	restart-after-power-cut	not applied	station settings apply restart-after-power-cut
          # Detail
          group	Set by station · Always-on Mac
          does	Restarts after a power cut, and wakes for the network
          lives on	Macs
