description: 'off a terminal, a setting that asks a value is refused before any question or effect'
env: two-macs
runs:
    - command: 'settings apply claude-token </dev/null'
      exit: 2
      stderr: |
          Error: claude-token asks a value: run it on a terminal
          Hint: station settings apply claude-token
    - command: 'settings claude-token --json | /usr/bin/jq -r .setting.state'
      exit: 0
      stdout: |
          not-applied
    - command: 'settings apply ssh-key </dev/null'
      exit: 2
      stderr: |
          Error: ssh-key asks a value: run it on a terminal
          Hint: station settings apply ssh-key
