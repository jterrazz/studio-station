description: 'a bare apply applies every Not applied setting that asks nothing and has its app'
env: two-macs
runs:
    - command: 'settings apply'
      exit: 0
      stdout: |
          ●	hushlogin	~/.hushlogin: created
          ●	spotlight-exclude	spotlight-exclude: applied
          ●	dns	dns: applied
          ●	dock-reset	dock-reset: applied
          ●	dock-spacer	dock-spacer: applied
          ●	backup-exclusions	backup-exclusions: applied
          ●	tart-launcher	~/.local/bin/tart: written
    - command: 'settings | /usr/bin/grep -E ''^#|○'''
      exit: 0
      stdout: |
          # Set by station	7 ●	8 ○
          ○	ghostty-dotfiles	not applied · needs ghostty	station apps install ghostty
          ○	tmux-dotfiles	not applied · needs tmux	station apps install tmux
          ○	starship-dotfiles	not applied · needs starship	station apps install starship
          ○	git-signing	not applied · needs gpg	station apps install gpg
          ○	ssh-key	not applied	station settings apply ssh-key
          ○	github-login	not applied · needs gh	station apps install gh
          ○	claude-token	not applied	station settings apply claude-token
          ○	zed-dotfiles	not applied · needs zed	station apps install zed
          # Always-on Mac
          ○	Always-on Mac	4 · for a Mac that hosts servers
          # Checked	8 ●	1 ◐
    - command: 'settings apply'
      exit: 0
      stdout: |
          	none
