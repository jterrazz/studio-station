description: 'docker-shortcuts puts dclean, dclean-images and dreset in the zsh block; each asks before it removes'
fixture: ../../__fixtures__/docker/
env: two-macs
runs:
    - command: 'shell zsh | /usr/bin/grep -c ''^dclean()'''
      exit: 1
      stdout: |
          0
    - command: 'settings apply docker-shortcuts'
      exit: 0
      stdout: |
          ●	docker-shortcuts	zsh block: dclean, dclean-images, dreset added
    - command: 'shell zsh | /usr/bin/grep -E ''^(dclean|dclean-images|dreset)\(\)'''
      exit: 0
      stdout: |
          dclean() {
          dclean-images() {
          dreset() {
    - command: 'shell zsh | /usr/bin/sed -n ''/^_station_docker_ask()/,$p'' > block.zsh; echo n | /bin/bash -c ''. ./block.zsh; dclean'''
      exit: 1
      stdout: |
          Remove every container? [y/N] kept: you said no
      files:
          .calls: absent
    - command: '--version >/dev/null; echo y | /bin/bash -c ''. ./block.zsh; dclean'''
      exit: 0
      stdout: |
          Remove every container? [y/N] 2 containers removed
      files:
          .calls:
              equals: |
                  docker ps -aq
                  docker rm -vf c1 c2
    - command: 'settings docker-shortcuts | /usr/bin/sed -n 1p'
      exit: 0
      stdout: |
          ●	docker-shortcuts	applied · zsh block
