description: 'apply --all-machines: applied where it lives, a server skipped, each admin setting with its command'
env: two-macs
runs:
    - command: 'settings apply starship-dotfiles --all-machines'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	starship-dotfiles · ~/.config/starship.toml: written
          ●	jterrazz-mac-mini	starship-dotfiles · ~/.config/starship.toml: written
          ●	linux-1	starship-dotfiles · ~/.config/starship.toml: written
          –	api	skipped (stopped)
          –	infra	skipped (server)
    - command: '--version >/dev/null; test -f .config/starship.toml && echo written here'
      exit: 0
      stdout: |
          written here
    - command: 'settings --on jterrazz-mac-mini --json | /usr/bin/jq -r ''.settings[] | select(.name == "starship-dotfiles") | .state'''
      exit: 0
      stdout: |
          applied
    - command: 'settings --on linux-1 --json | /usr/bin/jq -r ''.settings[] | select(.name == "starship-dotfiles") | .state'''
      exit: 0
      stdout: |
          applied
    - command: 'settings apply sshd dns --all-machines'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	dns · dns: applied
          ○	jterrazz-macbook-pro	sshd · needs admin rights · sudo station settings apply sshd
          ●	jterrazz-mac-mini	dns · dns: applied
          ○	jterrazz-mac-mini	sshd · needs admin rights · ssh -t jterrazz-mac-mini sudo station settings apply sshd
          –	linux-1	skipped (sshd is for Macs only)
          –	api	skipped (stopped)
          –	infra	skipped (server)
    - command: 'settings --on jterrazz-mac-mini --json | /usr/bin/jq -r ''.settings[] | select(.name == "sshd") | .state'''
      exit: 0
      stdout: |
          not-applied
    - command: 'settings --on jterrazz-mac-mini --json | /usr/bin/jq -r ''.settings[] | select(.name == "dns") | .state'''
      exit: 0
      stdout: |
          applied
    - command: 'settings --json | /usr/bin/jq -r ''.settings[] | select(.name == "sshd") | .state'''
      exit: 0
      stdout: |
          not-applied
