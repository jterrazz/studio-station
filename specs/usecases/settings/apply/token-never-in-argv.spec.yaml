description: 'the Claude token is never an argument: no flag takes it, a value on the line is refused'
env: two-macs
runs:
    - command: 'settings apply claude-token --token sk-ant-oat01-x'
      exit: 2
      stderr: |
          Error: unknown flag: --token
          Hint: run station settings apply --help
    - command: 'settings apply claude-token sk-ant-oat01-x'
      exit: 2
      stderr: |
          Error: claude-token asks a value: run it on a terminal
          Hint: station settings apply claude-token
    - command: '--version >/dev/null; /usr/bin/grep -c sk-ant world.json'
      exit: 1
      stdout: |
          0
