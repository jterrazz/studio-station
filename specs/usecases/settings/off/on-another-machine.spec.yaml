description: 'off on another Mac turns it off there only'
env: two-macs
runs:
    - command: 'settings apply dns --on jterrazz-mac-mini'
      exit: 0
      stdout: |
          	On jterrazz-mac-mini:
          ●	dns	dns: applied
    - command: 'settings off dns --yes --on jterrazz-mac-mini'
      exit: 0
      stdout: |
          	On jterrazz-mac-mini:
          ●	dns	dns: undone
    - command: 'settings dns --on jterrazz-mac-mini --json | /usr/bin/jq -r .setting.state'
      exit: 0
      stdout: |
          off-here
    - command: 'settings dns --json | /usr/bin/jq -r .setting.state'
      exit: 0
      stdout: |
          not-applied
