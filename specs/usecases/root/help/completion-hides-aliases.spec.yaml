description: 'completion offers the commands of the help, never a hidden alias or plumbing'
env: one-mac
runs:
    - command: '__complete "" 2>/dev/null | /usr/bin/grep -v "^:" | /usr/bin/cut -f1'
      exit: 0
      stdout: |
          accounts
          activity
          apps
          awake
          background
          disk
          engine
          help
          images
          machines
          overview
          ports
          run
          settings
          setup
          use
    - command: 'completion zsh | /usr/bin/grep -c "compdef _station station"'
      exit: 0
      stdout: |
          1
