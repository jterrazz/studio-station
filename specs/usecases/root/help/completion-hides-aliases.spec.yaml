description: 'completion offers the commands of the help, in its order, never a hidden alias or plumbing'
env: one-mac
runs:
    - command: '__complete "" 2>/dev/null | /usr/bin/grep -v "^:" | /usr/bin/cut -f1'
      exit: 0
      stdout: |
          overview
          activity
          apps
          settings
          disk
          ports
          accounts
          background
          awake
          machines
          images
          engine
          use
          init
          plan
          apply
          drift
          explain
          agents
          help
    - command: 'completion zsh | /usr/bin/grep -c "compdef _station station"'
      exit: 0
      stdout: |
          1
