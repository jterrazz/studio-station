description: 'help on a word station does not know is the unknown command block, exit 2, also after a known one'
env: one-mac
runs:
    - command: 'help frobnicate'
      exit: 2
      stderr: |
          Error: unknown command "frobnicate"
          Hint: station help
    - command: 'help machines frobnicate'
      exit: 2
      stderr: |
          Error: unknown command "machines frobnicate"
          Hint: station help
