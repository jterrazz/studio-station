description: 'a word station does not know is one block that points to the help, exit 2, stdout empty'
env: one-mac
runs:
    - command: 'frobnicate'
      exit: 2
      stderr: |
          Error: unknown command "frobnicate"
          Hint: station help
    - command: 'workstation'
      exit: 2
      stderr: |
          Error: unknown command "workstation"
          Hint: station help
