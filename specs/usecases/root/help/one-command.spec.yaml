description: 'station help <command> prints that command, its commands, flags and examples'
env: one-mac
runs:
    - command: 'help ports | /usr/bin/grep -E "^  [A-Z]|^    [a-z]+ " | /usr/bin/sed -E "s/ +$//"'
      exit: 0
      stdout: |4
            What your VMs share on the tailnet, at which URL, and whether the tailnet carries it
            USAGE
              station ports [command] [--flags]
            EXAMPLES
              station ports
              station ports --all-machines
              station ports --json
              station ports share linux-1 3000
              station ports stop-sharing linux-1 3000
            COMMANDS
              share <vm> <port> [--flags]         Reserve a VM's port now and share it on the tailnet, its URL printed before anything listens; inside a VM, the port alone
            FLAGS
