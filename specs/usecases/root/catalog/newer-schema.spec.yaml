description: 'an item file of the owner''s in a newer schema is refused with update station'
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro catalog/command-line/jq.yaml'
      stdin: |
          item: station.catalog/v2
          kind: app
          name: jq
      exit: 0
    - command: 'apps'
      exit: 2
      stderr: |
          Error: ~/.config/station/catalog/command-line/jq.yaml is station.catalog/v2, newer than this station reads (station.catalog/v1)
          Hint: update station
