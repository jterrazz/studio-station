description: 'on a terminal the walk shows every row at its last size Muted, then fills: none arrives or leaves'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: 'disk > /dev/null'
      exit: 0
    - command: 'world slow jterrazz-macbook-pro 5s'
      exit: 0
    - command: '--version >/dev/null; terminal --size 120x80 /usr/bin/env -u NO_COLOR COLUMNS=120 "$STATION" disk'
      stdin: |
          within 1 see ◌ starship  100.0 MB
          screen
          gone ◌
          scrollback
      exit: 0
      stdout: |4
