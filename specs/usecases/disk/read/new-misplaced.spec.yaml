description: 'a ~/go that appears at the home root is misplaced at the next read, on the page and in the JSON'
env: two-macs
runs:
    - command: 'disk | /usr/bin/grep -c "~/go"'
      exit: 1
      stdout: |
          0
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].disk.files["~/go/pkg/mod/cache/x"] = 2300000000'' world.json > next.json && /bin/mv next.json world.json'
      exit: 0
    - command: 'disk | /usr/bin/grep -e "^◐" -e "^# Misplaced"'
      exit: 0
      stdout: |
          ◐	This Mac	388.0 GB free of 994.0 GB · 2 misplaced folders	station disk move ~/.tart
          # Misplaced
          ◐	~/.tart	73.3 GB	misplaced · tart · station disk move ~/.tart
          ◐	~/go	2.3 GB	misplaced · go · station disk move ~/go
    - command: 'disk --json | /usr/bin/jq -c .findings'
      exit: 0
      stdout: |
          ["~/.tart is misplaced","~/go is misplaced"]
