description: 'disk erase --on another Mac erases that Mac''s data, its name typed there, and this Mac keeps its own'
env: two-macs
runs:
    - command: 'disk erase claude --confirm=claude --on jterrazz-mac-mini'
      exit: 0
      stdout: |
          ●	claude	2.0 GB erased
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs | {mini: .["jterrazz-mac-mini"].disk.files["~/.claude/projects/x"], here: .["jterrazz-macbook-pro"].disk.files["~/.claude/projects/x"]}'' world.json'
      exit: 0
      stdout: |
          {"mini":null,"here":3600000000}
