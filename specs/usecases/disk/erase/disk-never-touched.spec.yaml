description: 'an erase of a Never touched row is refused: station erases no key, token or setting'
env: two-macs
runs:
    - command: 'disk erase ssh --confirm=ssh'
      exit: 2
      stderr: |
          Error: ~/.ssh is never touched: station erases no key, token or setting
          Hint: station disk
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].disk.files["~/.ssh/known_hosts"]'' world.json'
      exit: 0
      stdout: |
          100000
