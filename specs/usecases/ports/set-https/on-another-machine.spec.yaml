description: 'HTTPS links set with --on are kept by that Mac, never by This Mac'
env: two-macs
runs:
    - command: 'ports https off --on mac-mini'
      exit: 0
      stdout: |
          	On mac-mini:
          ●	HTTPS links off	shared ports get an http:// link
    - command: '--version >/dev/null; /usr/bin/jq -c ''[.macs["jterrazz-mac-mini"].preferences.ports.https, .macs["jterrazz-macbook-pro"].preferences.ports.https]'' world.json'
      exit: 0
      stdout: |
          ["off",null]
