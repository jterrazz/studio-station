description: 'a share sent with --on reserves on that Mac, at its tailnet name; This Mac reserves nothing'
env: two-macs
runs:
    - command: 'ports share infra 8080 --on jterrazz-mac-mini'
      exit: 0
      stdout: |
          https://jterrazz-mac-mini.tail1234.ts.net:40000
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs | {mini: [.["jterrazz-mac-mini"].stores.reservations[] | [.vm, .guest_port, .host_port]], here: [.["jterrazz-macbook-pro"].stores.reservations[].guest_port]}'' world.json'
      exit: 0
      stdout: |
          {"mini":[["infra",8080,40000]],"here":[5173,7000]}
