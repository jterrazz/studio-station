description: 'a share on a VM sharing 20 ports is refused with the most a VM may, and nothing is reserved'
env: range-full
runs:
    - command: 'ports share linux-1 9000'
      exit: 1
      stderr: |
          Error: linux-1 has 20 shared ports, the most a VM may
          Hint: station ports stop-sharing linux-1 <port>
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"] | {reserved: (.stores.reservations | length), nine: [.stores.reservations[] | select(.guest_port == 9000)], shared: (.tailnet.shares | length)}'' world.json'
      exit: 0
      stdout: |
          {"reserved":20,"nine":[],"shared":20}
