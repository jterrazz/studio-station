description: 'a share of 22, of a port below 1024, or of no port is refused, and nothing is reserved'
env: two-macs
runs:
    - command: 'ports share linux-1 22'
      exit: 2
      stderr: |
          Error: port 22 is never shared
          Hint: station never shares port 22 nor a port below 1024
    - command: 'ports share linux-1 80'
      exit: 2
      stderr: |
          Error: port 80 is never shared
          Hint: station never shares port 22 nor a port below 1024
    - command: 'ports share linux-1 x'
      exit: 2
      stderr: |
          Error: "x" is not a port
          Hint: a port is a number from 1 to 65535
    - command: '--version >/dev/null; /usr/bin/jq -c ''[.macs["jterrazz-macbook-pro"].stores.reservations[].guest_port]'' world.json'
      exit: 0
      stdout: |
          [5173,7000]
