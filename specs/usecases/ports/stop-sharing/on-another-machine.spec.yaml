description: 'stop sharing sent with --on releases on that Mac and is remembered there, not on This Mac'
env: two-macs
runs:
    - command: 'ports share infra 8080 --on jterrazz-mac-mini'
      exit: 0
      stdout: |
          https://jterrazz-mac-mini.tail1234.ts.net:40000
    - command: 'ports stop-sharing infra 8080 --on jterrazz-mac-mini --yes'
      exit: 0
      stdout: |
          ●	infra:8080	not shared
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs | {mini: [.["jterrazz-mac-mini"].stores.reservations[]?], remembered: .["jterrazz-mac-mini"].preferences.services.not_shared, here: .["jterrazz-macbook-pro"].preferences.services}'' world.json'
      exit: 0
      stdout: |
          {"mini":[],"remembered":["infra:8080"],"here":null}
