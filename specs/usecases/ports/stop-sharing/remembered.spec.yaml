description: 'stop sharing is remembered: the next listen is not shared, until a share shares it again'
env: two-macs
runs:
    - command: 'ports stop-sharing linux-1 7000 --yes'
      exit: 0
      stdout: |
          ●	linux-1:7000	not shared
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"] | {reserved: [.stores.reservations[].guest_port], shared: [.tailnet.shares[].Reserved], remembered: .preferences.ports.not_shared}'' world.json'
      exit: 0
      stdout: |
          {"reserved":[5173],"shared":[40001],"remembered":["linux-1:7000"]}
    - command: 'world unlisten linux-1 7000'
      exit: 0
    - command: 'world listen linux-1 "*:7000" server'
      exit: 0
    - command: 'ports'
      exit: 0
      stdout: |
          ●	Tailscale	signed in · jterrazz-macbook-pro.tail1234.ts.net · ports are shared
          # Private: shared with you on Tailscale	2 ●
          ●	linux-1	5173	private	https://jterrazz-macbook-pro.tail1234.ts.net:40001	shared	node	vite
          ●	linux-1	7000	private		behind jterrazz-macbook-pro, not shared	server
          	Reserved on This Mac: 1 of 1000 (40000-40999), 999 free
    - command: 'ports share linux-1 7000'
      exit: 0
      stdout: |
          https://jterrazz-macbook-pro.tail1234.ts.net:40000
    - command: 'ports | /usr/bin/grep 7000'
      exit: 0
      stdout: |
          ●	linux-1	7000	private	https://jterrazz-macbook-pro.tail1234.ts.net:40000	shared	server
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"] | {shared: ([.tailnet.shares[].Reserved] | sort), remembered: .preferences.ports.not_shared}'' world.json'
      exit: 0
      stdout: |
          {"shared":[40000,40001],"remembered":null}
