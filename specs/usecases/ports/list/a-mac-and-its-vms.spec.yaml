description: 'ports --on the mini lists the mini''s ports and its server''s, with the mini''s reserved ports'
env: two-macs
runs:
    - command: 'world listen jterrazz-mac-mini "*:5000" ControlCenter'
      exit: 0
    - command: 'world listen infra "*:443" traefik'
      exit: 0
    - command: 'world listen infra "*:6443" k3s'
      exit: 0
    - command: 'ports --on jterrazz-mac-mini'
      exit: 0
      stdout: |
          ●	Tailscale	signed in · jterrazz-mac-mini.tail1234.ts.net · ports are shared
          # Needs you: reachable outside Tailscale, not declared public	1 ✗
          ✗	jterrazz-mac-mini	5000	needs you	AirPlay Receiver	*:5000 all interfaces	declared no	System Settings > General > AirDrop & Handoff > AirPlay Receiver
          # Public: reachable from anywhere else, internet or LAN, declared	1 ●
          ●	infra	443	public	traefik	*:443 all interfaces	declared · cloudflare-tunnel
          # Private: shared with you on Tailscale	1 ●
          ●	infra	6443	private		own Tailscale device: infra	Kubernetes API
          	Reserved on jterrazz-mac-mini: 0 of 1000 (40000-40999), 1000 free
