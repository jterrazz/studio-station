description: 'each Mac''s reserved ports are one line, and one range object per Mac in JSON'
env: two-macs
runs:
    - command: 'ports | /usr/bin/grep Reserved'
      exit: 0
      stdout: |
          	Reserved on This Mac: 2 of 1000 (40000-40999), 998 free
    - command: 'ports --all-machines | /usr/bin/grep Reserved'
      exit: 0
      stdout: |
          	Reserved on This Mac: 2 of 1000 (40000-40999), 998 free
          	Reserved on jterrazz-mac-mini: 0 of 1000 (40000-40999), 1000 free
    - command: 'ports --all-machines --json | /usr/bin/jq -c ''.range[]'''
      exit: 0
      stdout: |
          {"mac":"jterrazz-macbook-pro","from":40000,"to":40999,"reserved":2,"free":998}
          {"mac":"jterrazz-mac-mini","from":40000,"to":40999,"reserved":0,"free":1000}
