description: 'station ports --all unfolds the ports that listen on their machine only'
env: two-macs
runs:
    - command: 'world listen jterrazz-macbook-pro 127.0.0.1:5432 postgres'
      exit: 0
    - command: 'world listen jterrazz-macbook-pro "[::1]:8080" python'
      exit: 0
    - command: 'ports | /usr/bin/grep -e "machine only" -e 5432'
      exit: 0
      stdout: |
          	2 more listen on their machine only
    - command: 'ports --all'
      exit: 0
      stdout: |
          ●	Tailscale	signed in · jterrazz-macbook-pro.tail1234.ts.net · ports are shared
          # Private: shared with you on Tailscale	2 ●
          ●	linux-1	5173	private	https://jterrazz-macbook-pro.tail1234.ts.net:40001	shared	node	vite
          ●	linux-1	7000	private	jterrazz-macbook-pro.tail1234.ts.net:40002	shared	server
          # Listens on its machine only	2 ●
          ●	jterrazz-macbook-pro	5432	this machine only	postgres	127.0.0.1:5432 this machine
          ●	jterrazz-macbook-pro	8080	this machine only	python	::1:8080 this machine
          	Reserved on This Mac: 2 of 1000 (40000-40999), 998 free
