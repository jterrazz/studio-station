description: 'macos-1, bridged onto the LAN, listening on every interface is reachable outside Tailscale and needs you'
env: bridged-macos
runs:
    - command: 'ports | /usr/bin/grep -e "^#" -e "✗"'
      exit: 0
      stdout: |
          # Needs you: reachable outside Tailscale, not declared public	1 ✗
          ✗	macos-1	8081	node	*:8081 all interfaces	declared no
          # Private: shared with you on Tailscale	3 ●
    - command: 'ports --json | /usr/bin/jq -c ''.findings'''
      exit: 0
      stdout: |
          ["macos-1: port 8081 is reachable outside Tailscale"]
    - command: 'overview | /usr/bin/grep 8081'
      exit: 0
      stdout: |
          ✗	macos-1: port 8081 is reachable outside Tailscale
