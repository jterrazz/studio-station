description: 'with This Mac signed out of Tailscale its ports are local only, said first with the fix'
env: tailscale-out
runs:
    - command: 'ports | /usr/bin/cut -f1-3,5-'
      exit: 0
      stdout: |
          ✗	Tailscale	is signed out on This Mac: ports are local only
          # Private: shared with you on Tailscale	2 ◐
          ◐	linux-1	5173	local only · Tailscale is signed out	node	vite
          ◐	linux-1	7000	local only · Tailscale is signed out	server
          	Reserved on This Mac: 2 of 1000 (40000-40999), 998 free
    - command: 'ports --json | /usr/bin/jq -c ''.tailscale.state'''
      exit: 0
      stdout: |
          "signed-out"
