description: 'ports --json is station.ports.list/v1: class, bind, reserved, url, the range, Tailscale''s variant'
env: two-macs
runs:
    - command: 'ports --json | /usr/bin/jq -S -c ''.schema, keys, .ports[0], .range, .tailscale'''
      exit: 0
      stdout: |
          "station.ports.list/v1"
          ["findings","generated_at","local_only","machine","ports","range","schema","tailscale"]
          {"bind":["0.0.0.0"],"class":"private","declared":null,"machine":"linux-1","port":5173,"process":"node","proto":"http","reserved":40001,"state":"shared","url":"https://jterrazz-macbook-pro.tail1234.ts.net:40001"}
          [{"free":998,"from":40000,"mac":"jterrazz-macbook-pro","reserved":2,"to":40999}]
          {"cli":"/Applications/Tailscale.app/Contents/MacOS/Tailscale","dns_name":"jterrazz-macbook-pro.tail1234.ts.net","ip":"100.64.0.1","name":"jterrazz-macbook-pro","serve":"on","state":"on","variant":"app-store"}
    - command: 'ports --json | /usr/bin/jq -c ''[.ports[] | [.machine, .port, .state, .reserved, .url]]'''
      exit: 0
      stdout: |
          [["linux-1",5173,"shared",40001,"https://jterrazz-macbook-pro.tail1234.ts.net:40001"],["linux-1",7000,"shared",40002,"jterrazz-macbook-pro.tail1234.ts.net:40002"]]
