description: 'a share is listed under its audience, and its JSON says it: public, to public'
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro machinefiles/linux-1.machine.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: linux-1
          machine: { kind: workspace }
          ports: { open: [3000, 3001], to: public }
      exit: 0
    - command: 'world listen linux-1 "*:3000" node'
      exit: 0
    - command: 'ports | /usr/bin/grep "^#\|	3000	"'
      exit: 0
      stdout: |
          # Public: shared with the internet	1 ●
          ●	linux-1	3000	public	https://jterrazz-macbook-pro.tail1234.ts.net:443	shared	node	probably Node or Next
          # Private: shared with you on Tailscale	2 ◐
    - command: 'ports --json | /usr/bin/jq -c ''[.ports[] | select(.port == 3000) | [.class, .to, .state]]'''
      exit: 0
      stdout: |
          [["public","public","shared"]]
