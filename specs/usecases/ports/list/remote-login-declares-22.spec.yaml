description: 'the Remote login setting declares 22 on the mini, off takes it back, a laptop declares none'
env: two-macs
runs:
    - command: 'world listen jterrazz-mac-mini "*:22" sshd'
      exit: 0
    - command: 'ports --on jterrazz-mac-mini | /usr/bin/grep 22'
      exit: 0
      stdout: |
          ✗	jterrazz-mac-mini	22	needs you	SSH	*:22 all interfaces	declared no
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-mac-mini"].root = true'' world.json > next.json && /bin/mv next.json world.json'
      exit: 0
    - command: 'settings apply sshd --on jterrazz-mac-mini'
      exit: 0
      stdout: |
          	On jterrazz-mac-mini:
          ●	sshd	sshd: applied
    - command: 'ports --on jterrazz-mac-mini | /usr/bin/grep -e 22 -e "^# Public"'
      exit: 0
      stdout: |
          # Public: reachable from anywhere else, internet or LAN, declared	1 ●
          ●	jterrazz-mac-mini	22	public	SSH	*:22 all interfaces	your LAN · Remote login · by Settings
    - command: 'ports --on jterrazz-mac-mini --json | /usr/bin/jq -c ''[.findings, [.ports[] | select(.port == 22) | .declared]]'''
      exit: 0
      stdout: |
          [[],[{"via":"lan","by":"sshd","seen":true}]]
    - command: 'settings off sshd --on jterrazz-mac-mini --yes'
      exit: 0
      stdout: |
          	On jterrazz-mac-mini:
          ●	sshd	sshd: undone
    - command: 'ports --on jterrazz-mac-mini | /usr/bin/grep 22'
      exit: 0
      stdout: |
          ✗	jterrazz-mac-mini	22	needs you	SSH	*:22 all interfaces	declared no
    - command: '--version >/dev/null; /usr/bin/jq -c ''[.macs["jterrazz-mac-mini"].stores.declarations[] | .machine + ":" + (.port|tostring)]'' world.json'
      exit: 0
      stdout: |
          ["infra:443"]
    - command: 'world listen jterrazz-macbook-pro "*:22" sshd'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].root = true'' world.json > next.json && /bin/mv next.json world.json'
      exit: 0
    - command: 'settings apply sshd --on jterrazz-macbook-pro'
      exit: 0
      stdout: |
          ●	sshd	sshd: applied
    - command: 'ports --on jterrazz-macbook-pro | /usr/bin/grep -w 22'
      exit: 0
      stdout: |
          ✗	jterrazz-macbook-pro	22	needs you	SSH	*:22 all interfaces	declared no
    - command: '--version >/dev/null; /usr/bin/jq -c ''[.macs[].stores.declarations // [] | .[] | .machine + ":" + (.port|tostring)]'' world.json'
      exit: 0
      stdout: |
          ["infra:443"]
