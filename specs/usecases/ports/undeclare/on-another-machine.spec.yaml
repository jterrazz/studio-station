description: 'an undeclare sent with --on forgets the declaration that Mac keeps'
env: two-macs
runs:
    - command: 'ports undeclare infra 443 --yes --on jterrazz-mac-mini'
      exit: 0
      stdout: |
          	On mac-mini:
          ●	443 on infra	not declared
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-mac-mini"].stores.declarations'' world.json'
      exit: 0
      stdout: |
          null
