description: 'undeclaring a port nothing declared is refused with where to look'
env: two-macs
runs:
    - command: 'ports undeclare jterrazz-mac-mini 6000 --yes'
      exit: 2
      stderr: |
          Error: 6000 on jterrazz-mac-mini is not declared public
          Hint: station ports --on jterrazz-mac-mini
