description: 'infra''s 443 via a Cloudflare Tunnel is Public with its tunnel seen while cloudflared runs inside'
env: two-macs
runs:
    - command: 'world listen infra "*:443" traefik'
      exit: 0
    - command: 'world listen infra 127.0.0.1:20241 cloudflared'
      exit: 0
    - command: 'ports declare infra 443 --via cloudflare-tunnel'
      exit: 0
      stdout: |
          ●	443 on infra	declared public (Cloudflare Tunnel)
    - command: 'ports --on jterrazz-mac-mini | /usr/bin/grep -e 443 -e "^# Public"'
      exit: 0
      stdout: |
          # Public: reachable from anywhere else, internet or LAN, declared	1 ●
          ●	infra	443	public	traefik	*:443 all interfaces	Cloudflare Tunnel · tunnel seen
    - command: 'ports --on jterrazz-mac-mini --json | /usr/bin/jq -c ''[.ports[] | select(.port == 443) | .declared]'''
      exit: 0
      stdout: |
          [{"via":"cloudflare-tunnel","seen":true}]
