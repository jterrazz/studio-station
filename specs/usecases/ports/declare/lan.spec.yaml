description: 'the mini''s 5000 declared public on the LAN moves from Needs you to Public, its route seen'
env: two-macs
runs:
    - command: 'world listen jterrazz-mac-mini "*:5000" ControlCenter'
      exit: 0
    - command: 'ports declare jterrazz-mac-mini 5000 --via lan'
      exit: 0
      stdout: |
          ●	5000 on jterrazz-mac-mini	declared public (your LAN)
    - command: 'ports --on jterrazz-mac-mini | /usr/bin/grep -e 5000 -e "^#"'
      exit: 0
      stdout: |
          # Public: reachable from anywhere else, internet or LAN, declared	1 ●
          ●	jterrazz-mac-mini	5000	public	AirPlay Receiver	*:5000 all interfaces	your LAN · listens on the LAN
          # Private: shared with you on Tailscale
    - command: 'ports --on jterrazz-mac-mini --json | /usr/bin/jq -c ''[.findings, [.ports[] | select(.port == 5000) | [.class, .declared]]]'''
      exit: 0
      stdout: |
          [[],[["public",{"via":"lan","seen":true}]]]
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs | map_values(.stores.declarations // [] | map(.machine + ":" + (.port|tostring) + " " + .via))'' world.json'
      exit: 0
      stdout: |
          {"infra":[],"jterrazz-mac-mini":["infra:443 cloudflare-tunnel","jterrazz-mac-mini:5000 lan"],"jterrazz-macbook-pro":[],"linux-1":[]}
