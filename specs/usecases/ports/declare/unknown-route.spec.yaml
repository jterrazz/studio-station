description: 'a route station does not know is refused with the three it does, and nothing is declared'
env: two-macs
runs:
    - command: 'ports declare jterrazz-mac-mini 443 --via ngrok'
      exit: 2
      stderr: |
          Error: "ngrok" is not a route station knows
          Hint: --via is one of cloudflare-tunnel, tailscale-funnel, lan
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-mac-mini"].stores.declarations'' world.json'
      exit: 0
      stdout: |
          [{"machine":"infra","port":443,"via":"cloudflare-tunnel"}]
