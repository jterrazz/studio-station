description: 'inside a workspace, setup writes the shell block and the layout, never a name nor an engine'
env: in-workspace
runs:
    - command: 'setup'
      exit: 0
      stdout: |
          ●	zshrc
          ●	relocate	bunfig, go env, mise settings, npmrc
    - command: '--version >/dev/null; /usr/bin/grep -c "^# >>> station >>>$" .zshrc'
      exit: 0
      stdout: |
          1
    - command: 'setup --name x'
      exit: 2
      stderr: |
          Error: a VM's name is given when it is created
          Hint: run station setup without --name
