description: 'on a Mac with only the App Store Tailscale, setup writes ~/.local/bin/tailscale as a two-line script, never a symlink'
fixture: ../../../__fixtures__/tailscale-app-store/
env: fresh
runs:
    - command: 'setup --name jterrazz-macbook-pro | /usr/bin/grep -o "tailscale wrapper written: ~/.local/bin/tailscale"'
      exit: 0
      stdout: |
          tailscale wrapper written: ~/.local/bin/tailscale
      files:
          .local/bin/tailscale:
              equals: |
                  #!/bin/sh
                  exec {{workdir}}/root/Applications/Tailscale.app/Contents/MacOS/Tailscale "$@"
    - command: '--version >/dev/null; /bin/test -L .local/bin/tailscale || /bin/ls -l .local/bin/tailscale | /usr/bin/cut -c1-10'
      exit: 0
      stdout: |
          -rwxr-xr-x
