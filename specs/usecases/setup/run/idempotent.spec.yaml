description: 'a second setup finds every step as the first left it, and changes nothing in the world'
env: two-macs
runs:
    - command: 'setup > /dev/null; /usr/bin/jq -S ''del(.now)'' world.json > first.json'
      exit: 0
    - command: 'setup'
      exit: 0
      stdout: |
          ●	name	jterrazz-macbook-pro
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	nothing to do
          ●	engine	running {{string}}
          ○	apps	missing: homebrew git tart tailscale: run station setup on a terminal
          ●	settings
          ○	ssh-key	next: station settings apply ssh-key
          ○	spotlight-exclude	next: station settings apply spotlight-exclude
          ○	dns	next: station settings apply dns
          ○	claude-token	next: station settings apply claude-token
          ○	dock-reset	next: station settings apply dock-reset
          ○	dock-spacer	next: station settings apply dock-spacer
    - command: '--version >/dev/null; /usr/bin/jq -S ''del(.now)'' world.json | /usr/bin/cmp - first.json && echo unchanged'
      exit: 0
      stdout: |
          unchanged
