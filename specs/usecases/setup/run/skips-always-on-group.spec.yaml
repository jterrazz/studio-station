description: 'setup on a fresh MacBook applies none of the Always-on Mac group and never asks for root'
env: fresh
runs:
    - command: 'setup --name jterrazz-macbook-pro | /usr/bin/grep -c -i -E "auto-login|autologin|never sleeps|remote login|sshd|power|lock-after-login"'
      exit: 1
      stdout: |
          0
    - command: '--version >/dev/null; /usr/bin/jq -c ''[.as_root, .macs["jterrazz-macbook-pro"].stores.applied]'' world.json'
      exit: 0
      stdout: |
          [null,null]
