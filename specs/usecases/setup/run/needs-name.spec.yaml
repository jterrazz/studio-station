description: 'piped on a Mac with no name, setup is refused before any step, and says how to name it'
env: fresh
runs:
    - command: 'setup'
      exit: 2
      stderr: |
          Error: this Mac needs a name: setup asks it on a terminal
          Hint: station setup --name <name>
      files:
          .zshrc: absent
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"] | [.preferences, .jobs]'' world.json'
      exit: 0
      stdout: |
          [null,null]
