description: 'setup on a fresh Mac asks its name, sets up every step and lists what needs the owner'
fixture: ../../../__fixtures__/terminal/
env:
    - fresh
    - terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION" setup'
      stdin: |
          see Name this machine
          send \r
          see dock-spacer
          screen
      exit: 0
      stdout: |
          ┃ Name this machine
          ┃ lowercase letters, digits and -, as in macbook or mac-mini
          ●       name    jterrazz-macbook-pro
          ●       zshrc
          ●       layout  nothing to retire
          ●       relocate        bunfig, go env, mise config, npmrc
          ●       engine  running {{string}}
          ●       apps    installed homebrew mise git tart tailscale
          ●       settings        applied hushlogin backup-exclusions git-shortcuts
          ○       ssh-key next: station settings apply ssh-key
          ○       spotlight-exclude       next: station settings apply spotlight-exclude
          ○       dns     next: station settings apply dns
          ○       claude-token    next: station settings apply claude-token
          ○       dock-reset      next: station settings apply dock-reset
          ○       dock-spacer     next: station settings apply dock-spacer
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"] | [.preferences.here, (.jobs | keys), .engine.stopped]'' world.json; /usr/bin/grep -c "^# >>> station >>>$" .zshrc; /bin/test -f .hushlogin && echo quiet login applied'
      exit: 0
      stdout: |
          ["jterrazz-macbook-pro",["com.jterrazz.station.engine"],null]
          1
          quiet login applied
