description: 'a name that breaks the name rule is refused and nothing is written'
env: fresh
runs:
    - command: 'init --name Mac_1'
      exit: 2
      stderr: |
          Error: "Mac_1" is not a machine name
          Hint: use lowercase letters, digits and -, 1 to 40 characters
      files:
          .zshrc: absent
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].preferences'' world.json'
      exit: 0
      stdout: |
          null
