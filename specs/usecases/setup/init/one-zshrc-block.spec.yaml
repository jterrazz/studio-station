description: 'init replaces a v2 station block by the one block, never a second, keeping the owner''s lines'
fixture: ./__fixtures__/v2-zshrc/
env: fresh-v2
runs:
    - command: 'init > /dev/null'
      exit: 0
    - command: 'init > /dev/null; /usr/bin/grep -c "^# >>> station >>>$" .zshrc; /bin/cat .zshrc'
      exit: 0
      stdout: |
          1
          export EDITOR=vim


          alias gs='git status'

          # >>> station >>>
          export PATH="$HOME/.local/bin:$PATH"
          command -v station >/dev/null 2>&1 && eval "$(station shell zsh)"
          # <<< station <<<
