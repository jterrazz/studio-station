description: 'a second init finds every step as the first left it, and changes nothing in the world'
env: two-macs
runs:
    - command: 'init > /dev/null; /usr/bin/jq -S ''del(.now)'' world.json > first.json'
      exit: 0
    - command: 'init'
      exit: 0
      stdout: |
          ●	name	jterrazz-macbook-pro
          ●	zshrc
          ●	layout	nothing to retire
          ●	relocate	nothing to do
          # Machinefile
          	none bound by init: init --machinefile binds one
    - command: '--version >/dev/null; /usr/bin/jq -S ''del(.now)'' world.json | /usr/bin/cmp - first.json && echo unchanged'
      exit: 0
      stdout: |
          unchanged
