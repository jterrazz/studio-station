description: 'a named Mac refuses another name, and keeps its own'
env: two-macs
runs:
    - command: 'init --name other'
      exit: 2
      stderr: |
          Error: this Mac is named "jterrazz-macbook-pro", not "other"
          Hint: run station init without --name
    - command: 'init --name jterrazz-macbook-pro | /usr/bin/head -1'
      exit: 0
      stdout: |
          ●	name	jterrazz-macbook-pro
