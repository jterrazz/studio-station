description: 'station apps --all lists every row of every group, the apps of other machines too, which the bare list only counts'
env: two-macs
runs:
    - command: 'apps | /usr/bin/grep -A1 "^# Not for this machine"'
      exit: 0
      stdout: |
          # Not for this machine
          	7 apps live on other machines
    - command: 'apps --all | /usr/bin/grep -A2 "^# Not for this machine"'
      exit: 0
      stdout: |
          # Not for this machine	7 –
          –	docker			Linux VMs only
          –	hermes			VMs only
