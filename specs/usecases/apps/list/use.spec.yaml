description: 'the five apps the fleet depends on say system beside their method; the exploration dev tools do not'
fixture: ../../../__fixtures__/stubs/
runs:
    - command: 'apps --all | /usr/bin/awk -F "\t" ''$4 ~ / · system$/ { print $2 }'' | /usr/bin/sort | /usr/bin/tr "\n" " "'
      exit: 0
      stdout: |-
          git homebrew mise tailscale tart 
    - command: 'apps --all | /usr/bin/awk -F "\t" ''$2 ~ /^(node|xcode|orbstack|cocoapods|xcodegen|android-studio|lens)$/ { print $2, $4 }'''
      exit: 0
      stdout: |
          cocoapods brew
          node mise
          android-studio cask
          xcode mas
          xcodegen brew
          orbstack cask
          lens cask
