description: 'a macOS VM lists the dev apps a Mac keeps as exploration'
fixture: ../../../__fixtures__/stubs/
env:
    - STATION_MACHINE_KIND=macos
runs:
    - command: 'apps --json | /usr/bin/jq -r ''.apps[] | select(.name | IN("dia", "node", "ollama", "browser-use", "xcode")) | "\(.name) \(.lives_on)"'''
      exit: 0
      stdout: |
          node every-machine
          xcode mac-only
          browser-use vms-only
