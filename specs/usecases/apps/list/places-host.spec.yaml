description: 'a host lists dia, ollama, the exploration dev tools and node, and no VM-only app'
fixture: ../../../__fixtures__/stubs/
runs:
    - command: 'apps --json | /usr/bin/jq -r ''.apps[] | select(.name | IN("dia", "node", "ollama", "browser-use", "xcode")) | "\(.name) \(.lives_on)"'''
      exit: 0
      stdout: |
          node every-machine
          xcode mac-only
          ollama mac-only
          dia mac-only
    - command: 'apps --json | /usr/bin/jq -r ''[.apps[] | select(.name | IN("xcode", "cocoapods", "xcodegen", "android-studio", "lens", "orbstack", "multipass", "utm", "browser-use"))] | length'''
      exit: 0
      stdout: |
          6
