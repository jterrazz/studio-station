description: 'a move to a manager the app has no method by here, an unknown manager or none is refused, exit 2'
env: two-macs
runs:
    - command: 'apps move jq --to mise'
      exit: 2
      stderr: |
          Error: jq has no method mise here, only brew
          Hint: station apps move jq --to brew
