      exit: 2
      stderr: |
          Error: unknown manager "nope"
          Hint: --to takes brew, cask, mas, mise, skill, uv, bun, npm
    - command: 'apps move jq'
      exit: 2
      stderr: |
          Error: give the manager it moves to
          Hint: --to takes brew, cask, mas, mise, skill, uv, bun, npm
