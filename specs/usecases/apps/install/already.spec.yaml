description: 'installing an app already installed says so with the version it holds and changes nothing, exit 0'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; NO_COLOR= terminal --size 100x30 "$STATION" apps install jq'
      stdin: |
          scrollback
      exit: 0
      stdout: |4
           station apps install                               jterrazz-macbook-pro · host
           ──────────────────────────────────────────────────────────────────────────────

           Changes
             ● jq  1.8.1  brew  already installed
    - command: 'apps install jq'
      exit: 0
      stdout: |
          ●	jq	1.8.1	brew	already installed
