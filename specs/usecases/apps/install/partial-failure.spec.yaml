description: 'one of two installs fails: what finished stays installed, the failure is in our words, exit 1'
env: two-macs
runs:
    - command: 'world fault Installer.Install 1 times'
      exit: 0
    - command: 'apps install claude ripgrep'
      exit: 1
      stdout: |
          ✗	claude		script	the install failed: its output is in ~/.local/state/station/logs/apps.log
          ●	ripgrep	1.0.0	brew
      stderr: |
          Error: 1 of 2 apps failed
          Hint: station apps install claude
    - command: 'apps ripgrep | /usr/bin/head -1'
      exit: 0
      stdout: |
          ●	ripgrep	1.0.0	brew
