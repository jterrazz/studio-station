description: 'station apps install ripgrep --on linux-1 installs it inside the workspace; This Mac still has none'
env:
    - two-macs
    - engine
runs:
    - command: 'apps install ripgrep --on linux-1'
      exit: 0
      stdout: |
          	On linux-1:
          ●	ripgrep	1.0.0	mise
    - command: '--version >/dev/null; "$STATION" apps ripgrep --on linux-1 | /usr/bin/sed -n 2p; "$STATION" apps ripgrep | /usr/bin/head -1'
      exit: 0
      stdout: |
          ●	ripgrep	1.0.0	mise
          ○	ripgrep		brew	station apps install ripgrep
