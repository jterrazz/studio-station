description: 'an app brings what it requires: homebrew joins the run, said first with why, then named on the page'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - bare-mac
    - terminal
runs:
    - command: '--version >/dev/null; NO_COLOR= terminal --size 100x30 "$STATION" apps install gh'
      stdin: |
          scrollback
      exit: 0
      stdout: |
          ▸ Installing homebrew · required by gh · asks your password once
          ✓ Installed 2 apps on This Mac

          Changes
            ● homebrew      5.0.1  script  required by gh
            ● gh            1.0.0  brew
            ● github-login                 github-login

          → exec zsh  so this shell finds what homebrew installed
    - command: 'apps | /usr/bin/grep -e "	homebrew	" -e "	gh	"'
      exit: 0
      stdout: |
          ●	homebrew	5.0.1	script
          ●	gh	1.0.0	brew
