description: 'an app''s detail --on linux-1 is read inside the workspace: its method and version there'
env: two-macs
runs:
    - command: 'apps node --on linux-1 | /usr/bin/head -4'
      exit: 0
      stdout: |
          	On linux-1:
          ●	node	22.11.0	mise
          # Detail
          method	mise
