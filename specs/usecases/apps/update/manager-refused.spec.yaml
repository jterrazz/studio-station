description: 'names with --manager, a bare or unknown --manager and the old manager flags are refused, exit 2'
env: two-macs
runs:
    - command: 'apps update gh --manager brew'
      exit: 2
      stderr: |
          Error: name apps or give --manager, not both
          Hint: station apps update --manager brew
    - command: 'apps update --manager nope'
      exit: 2
      stderr: |
          Error: unknown manager "nope"
          Hint: --manager takes brew, cask, mas, mise, skill, uv, bun, npm
    - command: 'apps update --manager'
      exit: 2
      stderr: |
          Error: flag needs an argument: --manager
          Hint: run station apps update --help
    - command: 'apps update --brew'
      exit: 2
      stderr: |
          Error: unknown flag: --brew
          Hint: run station apps update --help
    - command: 'apps update --all'
      exit: 2
      stderr: |
          Error: unknown flag: --all
          Hint: run station apps update --help
