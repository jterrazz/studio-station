description: 'with the mini silent after a power cut, --all-machines updates the rest and says the mini did not answer, exit 1'
env: mini-offline
runs:
    - command: 'apps update --all-machines'
      exit: 1
      stdout: |
          ●	jterrazz-macbook-pro	updated 3 apps
          –	api	skipped (stopped)
          ●	linux-1	every app is up to date
          ✗	jterrazz-mac-mini	jterrazz-mac-mini does not answer
      stderr: |
          Error: 1 of 4 machines failed
          Hint: station machines
