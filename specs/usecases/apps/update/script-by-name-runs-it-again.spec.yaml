description: 'an update by name runs a script app again, and a bare update, which reads no currency, leaves it'
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro catalog/command-line/scripted.yaml'
      stdin: |
          item: station.catalog/v1
          kind: app
          name: scripted
          description: A tool a script puts down and takes back
          provides: [scripted]
          version-read:
              pattern: 'scripted v(\d+\.\d+\.\d+)'
          methods:
              - os: macos
                script:
                    check: scripted --version
                    run: install-scripted
                    undo: uninstall-scripted
      exit: 0
    - command: 'apps install scripted'
      exit: 0
      stdout: |
          ●	scripted	1.0.0	shell
    - command: 'apps update'
      exit: 0
      stdout: |
          ●	ghostty	1.2.1	cask
          ●	gh	2.98.0	brew
          ●	node	24.11.0	mise
    - command: 'apps update scripted'
      exit: 0
      stdout: |
          ●	scripted	1.0.0	shell
