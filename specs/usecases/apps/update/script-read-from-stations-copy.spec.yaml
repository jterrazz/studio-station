description: 'a script app is read from the copy station installed, never from a shim ahead of it on the PATH'
fixture: ./__fixtures__/scripted-shim/
env: two-macs
runs:
    - command: 'world edit jterrazz-macbook-pro catalog/command-line/scripted.yaml'
      stdin: |
          package: station.package/v1
          kind: app
          name: scripted
          description: A tool a script puts down and takes back
          provides: [scripted]
          version-read:
              pattern: 'scripted v(\d+\.\d+\.\d+)'
          methods:
              - os: macos
                script:
                    check: scripted --version
                    run: install-scripted
                    undo: uninstall-scripted
      exit: 0
    - command: 'world edit jterrazz-macbook-pro machinefiles/jterrazz-macbook-pro.yaml'
      stdin: |
          machinefile: station.machinefile/v1
          name: jterrazz-macbook-pro
          machine: { kind: computer, system: { os: macos } }
          apps: [scripted]
      exit: 0
    - command: 'apps scripted | /usr/bin/head -1'
      exit: 0
      stdout: |
          ○	scripted		shell	station apps install scripted
    - command: 'apply'
      exit: 0
      stdout: |
          # To install
          ○	scripted	shell
          ●	scripted	1.0.0	shell
    - command: '--version >/dev/null; /usr/bin/jq -r ''.macs["jterrazz-macbook-pro"].files["machinefiles/jterrazz-macbook-pro.lock"]'' world.json'
      exit: 0
      stdout: |+
          lock: station.lock/v1
          machinefile: jterrazz-macbook-pro
          apps:
              - name: scripted
                method: shell
                version: 1.0.0

    - command: 'apps update scripted'
      exit: 0
      stdout: |
          ●	scripted	1.0.0	shell
    - command: 'apps remove scripted --yes'
      exit: 1
      stdout: |
          ✗	scripted		shell	undone, but scripted still answers at ~/.local/share/mise/shims/scripted
      stderr: |
          Error: 1 of 1 apps failed
          Hint: re-run it: station apps remove scripted
    - command: 'apps scripted | /usr/bin/head -1'
      exit: 0
      stdout: |
          ○	scripted		shell	station apps install scripted
