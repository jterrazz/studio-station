description: 'station apps update --method brew updates the brew and cask rows that wait, never another method''s'
env: two-macs
runs:
    - command: 'apps update --method brew'
      exit: 0
      stdout: |
          ●	ghostty
          ●	gh
    - command: 'apps | /usr/bin/grep -A3 "^# Updates"'
      exit: 0
      stdout: |
          # Updates	1 ◐
          ◐	node	22.11.0	mise	update available · station apps update node
          # Not installed	100 ○
          ○	homebrew		script · system	station apps install homebrew
