description: 'station apps update --manager brew updates the brew and cask rows that wait, never another manager''s'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-macbook-pro"].apps.skill = {installed: {"agent-browser": "1.0.0"}, behind: {"agent-browser": "1.1.0"}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'apps update --manager brew'
      exit: 0
      stdout: |
          ●	ghostty	1.2.1	cask
          ●	gh	2.98.0	brew
    - command: 'apps | /usr/bin/grep -A3 "^# Updates"'
      exit: 0
      stdout: |
          # Updates	1 ◐
          ◐	agent-browser-skill	1.0.0	skill	update available · station apps update agent-browser-skill
          # Not installed	104 ○
          ○	cocoapods		brew	station apps install cocoapods
