description: 'names with --method, a bare or unknown --method and the old manager flags are refused, exit 2'
env: two-macs
runs:
    - command: 'apps update gh --method brew'
      exit: 2
      stderr: |
          Error: name apps or give --method, not both
          Hint: station apps update --method brew
    - command: 'apps update --method nope'
      exit: 2
      stderr: |
          Error: unknown method "nope"
          Hint: --method takes brew, npm, bun, uv, mise, skills
    - command: 'apps update --method'
      exit: 2
      stderr: |
          Error: flag needs an argument: --method
          Hint: run station apps update --help
    - command: 'apps update --brew'
      exit: 2
      stderr: |
          Error: unknown flag: --brew
          Hint: run station apps update --help
    - command: 'apps update --all'
      exit: 2
      stderr: |
          Error: unknown flag: --all
          Hint: run station apps update --help
