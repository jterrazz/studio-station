description: 'a hook passes a flag this station does not know or cannot read: it still exits 0, silent'
env: in-workspace
runs:
    - command: 'agents record --tool claudecode'
      stdin: |
          {"kind":"prompted","session":"s-1","prompt":"Build the landing page"}
      exit: 0
    - command: 'agents record --app claudecode --json'
      stdin: |
          {"kind":"prompted","session":"s-2","folder":"/home/admin/app","prompt":"Build the landing page"}
      exit: 0
    - command: 'agents record --app'
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].vms["linux-1"].agents.journal["s-2"] | {state, task}'' world.json'
      exit: 0
      stdout: |
          {"state":"working","task":"Build the landing page"}
