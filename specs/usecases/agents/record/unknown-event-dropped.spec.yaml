description: 'an event no hook reads, of an unknown app or not JSON, is dropped: the hook exits 0, silent'
env: in-workspace
runs:
    - command: 'agents record --app claudecode'
      stdin: |
          {"kind":"compacted","session":"s-1"}
      exit: 0
    - command: 'agents record --app cursor'
      stdin: |
          {"kind":"prompted","session":"s-1","prompt":"Build the landing page"}
      exit: 0
    - command: 'agents record'
      stdin: |
          not json
      exit: 0
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].vms["linux-1"].agents'' world.json'
      exit: 0
      stdout: |
          null
