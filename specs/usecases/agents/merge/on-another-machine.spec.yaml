description: 'the PR of an agent merged from the Mac with --on is merged inside the workspace'
env: two-macs
runs:
    - command: 'world agent-prompt linux-1 s-1 "Review the auth refresh"'
      exit: 0
    - command: 'world agent-step linux-1 s-1 run "gh pr create --fill" "https://github.com/jterrazz/app/pull/42"'
      exit: 0
    - command: 'agents merge linux-1 --on linux-1'
      exit: 0
      stdout: |
          	On linux-1:
          ●	linux-1	merged PR #42 · finished
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].vms["linux-1"].agents | {prs, state: .journal["s-1"].state}'' world.json'
      exit: 0
      stdout: |
          {"prs":{"42":"merged"},"state":"finished"}
