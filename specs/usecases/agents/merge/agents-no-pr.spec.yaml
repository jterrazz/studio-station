description: 'an agent that opened no PR has none to merge: refused'
env: in-workspace
runs:
    - command: 'world agent-prompt linux-1 s-1 "Write the changelog"'
      exit: 0
    - command: 'world agent-stop linux-1 s-1 "The changelog is written"'
      exit: 0
    - command: 'agents merge linux-1'
      exit: 2
      stderr: |
          Error: linux-1 has opened no PR
          Hint: station agents
