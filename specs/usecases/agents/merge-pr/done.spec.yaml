description: 'review-bot waits with "PR #42 is ready"; a reply sets it working, and a merge finishes it'
env: review-bot
runs:
    - command: 'world agent-prompt review-bot review-bot "Review the auth refresh"'
      exit: 0
    - command: 'world agent-step review-bot review-bot run "gh pr create --fill" "https://github.com/jterrazz/app/pull/42"'
      exit: 0
    - command: 'world agent-stop review-bot review-bot "PR #42 is ready"'
      exit: 0
    - command: 'agents'
      exit: 0
      stdout: |
          # Agents	1 ◐
          ◐	review-bot	claudecode	waiting · PR #42 is ready	Review the auth refresh	PR #42 · https://github.com/jterrazz/app/pull/42 · station agents merge-pr review-bot
    - command: 'agents reply review-bot also squash the fixups'
      exit: 0
      stdout: |
          ●	review-bot	sent · it works on it
    - command: 'agents'
      exit: 0
      stdout: |
          # Agents	1 ●
          ●	review-bot	claudecode	working · opening a PR	Review the auth refresh	PR #42 · https://github.com/jterrazz/app/pull/42
    - command: 'agents merge-pr review-bot'
      exit: 0
      stdout: |
          ●	review-bot	merged PR #42 · finished
    - command: 'agents'
      exit: 0
      stdout: |
          # Agents	1 ○
          ○	review-bot	claudecode	finished · merged PR #42	Review the auth refresh	PR #42 · https://github.com/jterrazz/app/pull/42
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].vms["review-bot"].agents.prs'' world.json'
      exit: 0
      stdout: |
          {"42":"merged"}
