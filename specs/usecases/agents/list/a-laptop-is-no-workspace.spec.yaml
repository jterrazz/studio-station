description: 'agents --on a laptop (the mini on battery) is refused: --on names a workspace'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-mac-mini"].power += {HasBattery: true, Source: "battery", Percent: 80, Lid: "open"}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'agents --on jterrazz-mac-mini'
      exit: 2
      stderr: |
          Error: jterrazz-mac-mini is a Mac: agents are recorded inside the workspace they work in
          Hint: run station overview for what jterrazz-mac-mini has
