description: 'an agent run by hand takes its workspace''s name, which no agent elsewhere may hold'
env: mini-workspace
runs:
    - command: 'agents start "Write the changelog" --on linux-1 --name ci-1'
      exit: 2
      stderr: |
          Error: ci-1 is ci-1's: a workspace names its own agents ci-1 and ci-1·<n>
          Hint: name it another way: --name <name>
    - command: 'agents start "Write the changelog" --on linux-1 --name docs-bot'
      exit: 0
      stdout: |
          	On linux-1:
          ●	docs-bot	starts · claudecode · Write the changelog
    - command: 'world agent-prompt ci-1 s-1 "Review the auth refresh"'
      exit: 0
    - command: 'agents'
      exit: 0
      stdout: |
          # Agents	2 ●
          ●	docs-bot	claudecode	working	Write the changelog	linux-1	jterrazz-macbook-pro	24s ago
          ●	ci-1	claudecode	working	Review the auth refresh	ci-1	jterrazz-mac-mini	12s ago
    - command: 'agents stop ci-1 --yes'
      exit: 0
      stdout: |
          ●	ci-1	stopped · its workspace keeps running
    - command: '--version >/dev/null; /usr/bin/jq -c ''[.macs["jterrazz-macbook-pro"].vms["linux-1"].agents.journal, .macs["jterrazz-mac-mini"].vms["ci-1"].agents.journal] | map(map_values(.state))'' world.json'
      exit: 0
      stdout: |
          [{"station-docs-bot":"working"},{"s-1":"finished"}]
