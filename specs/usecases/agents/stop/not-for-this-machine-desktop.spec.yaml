description: 'on a desktop Mac, station agents stop is refused: agents work inside a workspace'
env: two-macs
runs:
    - command: 'agents stop linux-1 --yes --on jterrazz-mac-mini'
      exit: 2
      stderr: |
          Error: jterrazz-mac-mini is a Mac: agents are recorded inside the workspace they work in
          Hint: run station overview for what jterrazz-mac-mini has
