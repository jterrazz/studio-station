description: 'a name two workspaces'' agents hold is refused naming both: a stop never reaches the other'
env: mini-workspace
runs:
    - command: 'agents start "Write the changelog" --on linux-1 --name docs-bot'
      exit: 0
      stdout: |
          	On linux-1:
          ●	docs-bot	starts · claudecode · Write the changelog
    - command: 'agents start "Write the release notes" --on ci-1 --name docs-bot'
      exit: 2
      stderr: |
          Error: an agent is already named docs-bot
          Hint: name it another way: --name <name>
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-mac-mini"].vms["ci-1"].agents.journal["station-docs-bot"] = (.macs["jterrazz-macbook-pro"].vms["linux-1"].agents.journal["station-docs-bot"] | .vm = "ci-1" | .task = "Write the release notes")'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'agents stop docs-bot --yes'
      exit: 2
      stderr: |
          Error: more than one agent is named docs-bot: docs-bot on linux-1 and docs-bot on ci-1
          Hint: name its workspace: --on linux-1 or --on ci-1
    - command: 'agents stop docs-bot --yes --on ci-1'
      exit: 0
      stdout: |
          	On ci-1:
          ●	docs-bot	stopped · its workspace keeps running
    - command: '--version >/dev/null; /usr/bin/jq -c ''[.macs["jterrazz-macbook-pro"].vms["linux-1"].agents.journal, .macs["jterrazz-mac-mini"].vms["ci-1"].agents.journal] | map(map_values(.state))'' world.json'
      exit: 0
      stdout: |
          [{"station-docs-bot":"working"},{"station-docs-bot":"finished"}]
