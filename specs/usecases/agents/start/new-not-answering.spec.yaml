description: 'an ephemeral workspace that is silent is kept, its agent not started, and how to start it is said'
env: two-macs
runs:
    - command: 'agents start "Build the landing page" --new'
      exit: 1
      stderr: |
          Error: linux-2 is ready, but its agent did not start: linux-2 does not answer
          Hint: station agents start "<task>" --on linux-2
    - command: 'machines --this-mac | /usr/bin/grep linux-2'
      exit: 0
      stdout: |
          ●	linux-2	Workspace	jterrazz-macbook-pro	Running · ephemeral	4 CPU	4 GB
