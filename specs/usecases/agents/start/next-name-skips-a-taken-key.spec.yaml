description: 'the next name skips one whose key an agent holds: linux-1-2 taken, then linux-1·3'
env: two-macs
runs:
    - command: 'agents start "Build the landing page" --on linux-1'
      exit: 0
      stdout: |
          	On linux-1:
          ●	linux-1	starts · claudecode · Build the landing page
    - command: 'agents start "Write the changelog" --on linux-1 --name linux-1-2'
      exit: 0
      stdout: |
          	On linux-1:
          ●	linux-1-2	starts · claudecode · Write the changelog
    - command: 'agents start "Write the release notes" --on linux-1'
      exit: 0
      stdout: |
          	On linux-1:
          ●	linux-1·3	starts · claudecode · Write the release notes
