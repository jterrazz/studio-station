description: 'a name an agent holds on any workspace starts nothing on another: a name is unique everywhere'
env: mini-workspace
runs:
    - command: 'agents start "Write the changelog" --on linux-1 --name docs-bot'
      exit: 0
      stdout: |
          	On linux-1:
          ●	docs-bot	starts · claudecode · Write the changelog
    - command: 'agents start "Write the release notes" --on ci-1 --name docs-bot'
      exit: 2
      stderr: |
          Error: an agent is already named docs-bot
          Hint: name it another way: --name <name>
    - command: 'agents start "Write the release notes" --on ci-1'
      exit: 0
      stdout: |
          	On ci-1:
          ●	ci-1	starts · claudecode · Write the release notes
