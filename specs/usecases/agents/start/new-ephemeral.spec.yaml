description: '--new makes an ephemeral workspace first, and the agent takes its name; the VM keeps no task'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["linux-2"] = {self: {kind: "workspace", system: {OS: "linux"}}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'agents start "Build the landing page" --new'
      exit: 0
      stdout: |
          ●	linux-2	starts on linux-2, a new ephemeral workspace · claudecode · Build the landing page
    - command: 'agents'
      exit: 0
      stdout: |
          # Agents	1 ●
          ●	linux-2	claudecode	working	Build the landing page	linux-2	jterrazz-macbook-pro	12s ago
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].vms["linux-2"] | {kept: .kept.lifetime, task: .kept.task, opened: .agents.opened, typed: .agents.typed}'' world.json'
      exit: 0
      stdout: |
          {"kept":"ephemeral","task":null,"opened":["claudecode"],"typed":["Build the landing page"]}
