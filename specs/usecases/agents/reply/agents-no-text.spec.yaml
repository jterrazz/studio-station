description: 'a reply with nothing to say is refused, and nothing is typed'
env: in-workspace
runs:
    - command: 'world agent-prompt linux-1 s-1 "Review the auth refresh"'
      exit: 0
    - command: 'agents reply s-1'
      stdin: ''
      exit: 2
      stderr: |
          Error: nothing to send to s-1
          Hint: station agents reply s-1 <text>
