description: 'a reply sent from the Mac with --on, its text on stdin, is typed in the workspace once'
env: two-macs
runs:
    - command: 'world agent-prompt linux-1 s-1 "Review the auth refresh"'
      exit: 0
    - command: 'world agent-stop linux-1 s-1 "PR #42 is ready"'
      exit: 0
    - command: 'agents reply linux-1 --on linux-1'
      stdin: |
          yes, merge it
      exit: 0
      stdout: |
          	On linux-1:
          ●	linux-1	sent · it works on it
    - command: '--version >/dev/null; /usr/bin/jq -c ''.macs["jterrazz-macbook-pro"].vms["linux-1"].agents.typed'' world.json'
      exit: 0
      stdout: |
          ["yes, merge it"]
