description: 'an installer that fails is told in our words, its own output kept in the log, then one block, exit 1'
env: two-macs
runs:
    - command: 'world fault Installer.Install'
      exit: 0
    - command: 'apps install go'
      exit: 0
      stdout: |
          ●	go	1.25.3	mise	already installed
    - command: '--version >/dev/null; /usr/bin/cut -d" " -f2- .local/state/station/logs/apps.log'
      exit: 1
      stderr: |
          cut: .local/state/station/logs/apps.log: No such file or directory
