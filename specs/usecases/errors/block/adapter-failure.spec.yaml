description: 'an installer that fails is told in our words, its own output kept in the log, then one block, exit 1'
env: two-macs
runs:
    - command: 'world fault Installer.Install'
      exit: 0
    - command: 'tools install go'
      exit: 1
      stdout: |
          ✗	go	the install failed: its output is in ~/.local/state/station/logs/apps.log
      stderr: |
          Error: 1 of 1 tools failed
          Hint: station tools install go
    - command: '--version >/dev/null; /usr/bin/cut -d" " -f2- .local/state/station/logs/apps.log'
      exit: 0
      stdout: |
          install go: exited 1: Error: the run failed, as the world scripted it
