description: 'what needs a terminal, off one, says so: exit 2 (the unlock of a Mac that waits at pre-boot, a setting that asks a value)'
env: mini-offline
runs:
    - command: 'machines unlock jterrazz-mac-mini </dev/null'
      exit: 2
      stderr: |
          Error: machines unlock needs a terminal
          Hint: run it in a terminal
    - command: 'settings apply autologin </dev/null'
      exit: 2
      stderr: |
          Error: autologin asks a value: run it on a terminal
          Hint: station settings apply autologin
