description: 'ctrl-c at a question prints nothing after it and exits 130'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION" tools uninstall lazygit'
      stdin: |
          see Uninstall lazygit?
          send \x03
          scrollback
      exit: 130
      stdout: |
          ┃ Uninstall lazygit?
          ┃
