description: 'a question answered no keeps what it asked about: one block, exit 1, nothing removed'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION" tools uninstall lazygit'
      stdin: |
          see Uninstall lazygit?
          send n
          see Hint:
          screen
      exit: 1
      stdout: |
          ┃ Uninstall lazygit?
          ┃
          Error: lazygit kept: you said no
          Hint: --yes skips the question
