description: 'a read with a Mac that does not answer, or a stopped engine, still exits 0 with its findings'
env: two-macs
runs:
    - command: 'world power-cut jterrazz-mac-mini'
      exit: 0
    - command: 'machines | /usr/bin/grep jterrazz-mac-mini'
      exit: 0
      stdout: |
          ✗	jterrazz-mac-mini	Mac	jterrazz-mac-mini	Unreachable
    - command: 'world engine-crash jterrazz-macbook-pro'
      exit: 0
    - command: 'machines | /usr/bin/grep jterrazz-macbook-pro'
      exit: 0
      stdout: |
          ●	jterrazz-macbook-pro	Mac	jterrazz-macbook-pro	Engine running
          ○	api	Workspace	jterrazz-macbook-pro	Stopped · persistent	4 CPU	8 GB
          ●	linux-1	Workspace	jterrazz-macbook-pro	Running · ephemeral	4 CPU	8 GB
    - command: 'ports --all-machines'
      exit: 0
      stdout: |
          ●	Tailscale	signed in · jterrazz-macbook-pro.tail1234.ts.net · ports are shared
          # Private: shared with you on Tailscale	2 ●	1 ◐
          ●	linux-1	5173	private	https://jterrazz-macbook-pro.tail1234.ts.net:40001	shared	node	vite
          ●	linux-1	7000	private	jterrazz-macbook-pro.tail1234.ts.net:40002	shared	server
          ◐	jterrazz-mac-mini				does not answer		station machines
          	Reserved on This Mac: 2 of 1000 (40000-40999), 998 free
