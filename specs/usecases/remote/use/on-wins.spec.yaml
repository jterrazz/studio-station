description: '--on beats station use for that one command; the terminal keeps its choice'
env: two-macs
runs:
    - command: 'use linux-1'
      exit: 0
      stdout: |
          	On linux-1 in this terminal. Other terminals stay on This Mac.
    - command: 'overview --on jterrazz-mac-mini --json | /usr/bin/jq -r .machine.name'
      exit: 0
      stdout: |
          jterrazz-mac-mini
    - command: 'overview --json | /usr/bin/jq -r .machine.name'
      exit: 0
      stdout: |
          linux-1
