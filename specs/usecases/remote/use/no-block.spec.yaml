description: 'station use without the station block is refused, exit 2; the commands stay on This Mac'
env: no-block
runs:
    - command: 'use linux-1'
      exit: 2
      stderr: |
          Error: this terminal has no station block
          Hint: use --on linux-1, or run station setup
    - command: 'overview --json | /usr/bin/jq -r .machine.name'
      exit: 0
      stdout: |
          jterrazz-macbook-pro
