description: 'station use this-mac: back on This Mac, the later commands run here'
env: two-macs
runs:
    - command: 'use linux-1'
      exit: 0
      stdout: |
          	On linux-1 in this terminal. Other terminals stay on This Mac.
    - command: 'use this-mac'
      exit: 0
      stdout: |
          	Back on This Mac (was linux-1).
    - command: 'overview --json | /usr/bin/jq -r .machine.name'
      exit: 0
      stdout: |
          jterrazz-macbook-pro
    - command: 'shell prompt'
      exit: 0
