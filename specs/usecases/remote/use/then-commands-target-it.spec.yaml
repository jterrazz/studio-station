description: 'station use linux-1: every later command of this terminal runs on linux-1, until changed'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 80x10 /usr/bin/env -u NO_COLOR COLUMNS=80 "$STATION" use linux-1'
      stdin: |
          scrollback
      exit: 0
      stdout: |4
           station use                                        jterrazz-macbook-pro · host
           ──────────────────────────────────────────────────────────────────────────────

             On linux-1 in this terminal. Other terminals stay on This Mac.

           → station use - to go back
    - command: 'settings > used.txt; "$STATION" settings --on linux-1 | /usr/bin/cmp used.txt -'
      exit: 0
    - command: 'settings > used.txt; "$STATION" settings --on jterrazz-macbook-pro | /usr/bin/cmp -s used.txt - || echo not This Mac'
      exit: 0
      stdout: |
          not This Mac
    - command: 'overview --json | /usr/bin/jq -r .machine.name'
      exit: 0
      stdout: |
          linux-1
