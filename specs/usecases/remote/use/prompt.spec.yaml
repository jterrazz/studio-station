description: 'the prompt segment says on linux-1 while this terminal uses it, nothing on This Mac'
env: two-macs
runs:
    - command: 'shell prompt'
      exit: 0
    - command: 'use linux-1'
      exit: 0
      stdout: |
          	On linux-1 in this terminal. Other terminals stay on This Mac.
    - command: 'shell prompt'
      exit: 0
      stdout: |
          on linux-1
    - command: 'use -'
      exit: 0
      stdout: |
          	Back on This Mac (was linux-1).
    - command: 'shell prompt'
      exit: 0
