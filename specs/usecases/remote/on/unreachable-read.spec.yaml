description: 'a read of a Mac that does not answer is its finding, and exits 0'
env: mini-offline
runs:
    - command: 'apps --on mac-mini'
      exit: 0
      stdout: |
          ✗ mac-mini does not answer
    - command: 'disk --on mac-mini'
      exit: 0
      stdout: |
          ✗ mac-mini does not answer
