description: 'an older Mac that says `mac` for its kind is read as a computer, and answers its apps'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-mac-mini"].self = {kind: "mac", system: {OS: "macos"}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'apps --on mac-mini | /usr/bin/head -2'
      exit: 0
      stdout: |
          	On mac-mini:
          # Not installed	109 ○
