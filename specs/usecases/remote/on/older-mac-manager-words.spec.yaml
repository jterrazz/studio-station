description: 'an older Mac is asked --manager skill and cask in its words, skills and brew, and updates them'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-mac-mini"].station = "v3.0.0" | .macs["jterrazz-mac-mini"].apps = {"skill": {"installed": {"upgrading-expo": "1.0.0"}, "behind": {"upgrading-expo": "1.1.0"}}, "cask": {"installed": {"ghostty": "1.2.0"}, "behind": {"ghostty": "1.2.1"}}}'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'apps update --manager skill --manager cask --on jterrazz-mac-mini'
      exit: 0
      stdout: |
          	On mac-mini:
          ●	upgrading-expo	1.1.0	skill
