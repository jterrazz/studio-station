description: 'an older Mac is never asked a manager it has none of, which would update nothing: exit 1'
env: two-macs
runs:
    - command: '--version >/dev/null; /usr/bin/jq ''.macs["jterrazz-mac-mini"].station = "v3.0.0"'' world.json > w.json && /bin/mv w.json world.json'
      exit: 0
    - command: 'apps update --manager mas --on jterrazz-mac-mini'
      exit: 1
      stderr: |
          Error: mac-mini runs station v3.0.0, which has no apps.update --manager mas
          Hint: update station on mac-mini (scripts/install.sh there)
