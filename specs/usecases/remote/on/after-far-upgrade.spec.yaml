description: 'once mac-mini is updated the same call runs: its calls are read again at each connection'
env: mini-old
runs:
    - command: 'ports declare 5000 --via lan --on mac-mini'
      exit: 1
      stderr: |
          Error: mac-mini runs station v3.2.0, which has no ports.declare
          Hint: update station on mac-mini (scripts/install.sh there)
    - command: 'world upgrade jterrazz-mac-mini v3.3.0'
      exit: 0
    - command: 'ports declare 5000 --via lan --on mac-mini'
      exit: 0
      stdout: |
          	On mac-mini:
          ●	5000 on jterrazz-mac-mini	declared public (your LAN)
