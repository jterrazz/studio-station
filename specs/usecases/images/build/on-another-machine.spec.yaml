description: 'a build on another Mac makes the image there, This Mac''s untouched'
fixture: ../../__fixtures__/build/
env: two-macs
runs:
    - command: 'images build station-linux --binary $HOME/station-linux --on jterrazz-mac-mini'
      exit: 0
      stdout: |
          	On mac-mini:
          ●	station-linux	2026.11.04	built
    - command: 'images --json | /usr/bin/jq -r ''.images[] | "\(.mac) \(.version)"'''
      exit: 0
      stdout: |
          jterrazz-macbook-pro 2026.11.01
          jterrazz-macbook-pro 2026.10.20
          jterrazz-mac-mini 2026.11.04
          jterrazz-mac-mini 2026.11.01
