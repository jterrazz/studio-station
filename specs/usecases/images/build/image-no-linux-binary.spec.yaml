description: 'a dev build asks for --binary before the hypervisor is asked anything'
env:
    - two-macs
    - engine
runs:
    - command: 'images build station-linux'
      exit: 2
      stderr: |
          Error: this station is a dev build: there is no release binary to put in the image
          Hint: make build-linux, then station images build station-linux --binary .artifacts/go/station-linux-arm64
    - command: '--version >/dev/null; "$STATION" guest serve --stdio | /usr/bin/jq -c ''select(.error) | .error | {code, subject, message}'''
      stdin: |
          {"v":2,"id":"1","call":"images.build","in":{"Names":["station-linux"]}}
      exit: 0
      stdout: |
          {"code":"image.no-linux-binary","subject":null,"message":"this station is a dev build: there is no release binary to put in the image"}
