description: 'a registry that does not answer fails the update, and the image stays as it was'
env: two-macs
runs:
    - command: 'world fault ImageSource.Latest 1'
      exit: 0
    - command: 'images update linux'
      exit: 1
      stderr: |
          Error: the registry did not answer for station-linux: the registry does not answer, as the world scripted it
          Hint: station images update station-linux
    - command: 'images --json | /usr/bin/jq -r ''.images[] | select(.mac == "jterrazz-macbook-pro") | "\(.version) \(.newest)"'''
      exit: 0
      stdout: |
          2026.11.01 true
          2026.10.20 false
