description: 'on a terminal, deleting one version asks, then deletes it alone; the VMs keep theirs'
fixture: ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal "$STATION" images delete linux@2026.10.20'
      stdin: |
          see Delete linux@2026.10.20?
          send y
          see deleted
          screen
      exit: 0
      stdout: |
          ┃ Delete linux@2026.10.20?
          ┃
          ●       linux   2026.10.20      deleted
    - command: 'images --json | /usr/bin/jq -r ''.images[] | "\(.mac) \(.version) \(.vms | join(","))"'''
      exit: 0
      stdout: |
          jterrazz-macbook-pro 2026.11.01 api,linux-1
          jterrazz-mac-mini 2026.11.01 infra
