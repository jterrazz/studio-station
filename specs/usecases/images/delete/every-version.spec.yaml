description: 'a bare image name deletes every version of it on This Mac; its VMs keep their own disks'
env: two-macs
runs:
    - command: 'images delete station-linux --yes'
      exit: 0
      stdout: |
          ●	station-linux	2026.11.01	deleted
          ●	station-linux	2026.10.20	deleted
    - command: 'images --json | /usr/bin/jq -r ''.images[] | "\(.mac) \(.version)"'''
      exit: 0
      stdout: |
          jterrazz-mac-mini 2026.11.01
    - command: 'machines --this-mac --json | /usr/bin/jq -r ''[.. | objects | select(has("name") and has("lifetime")) | .name] | sort | join(" ")'''
      exit: 0
      stdout: |
          api linux-1
