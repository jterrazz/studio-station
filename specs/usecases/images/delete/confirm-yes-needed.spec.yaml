description: 'off a terminal, deleting a version without --yes is refused and the image kept'
env: two-macs
runs:
    - command: 'images delete station-linux@2026.10.20 </dev/null'
      exit: 2
      stderr: |
          Error: refusing to delete without --yes
          Hint: re-run with --yes
    - command: 'images --json | /usr/bin/jq -r ''[.images[] | select(.mac == "jterrazz-macbook-pro") | .version] | join(" ")'''
      exit: 0
      stdout: |
          2026.11.01 2026.10.20
