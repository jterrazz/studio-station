description: 'with --yes, deleting a version off a terminal deletes it without a question'
env: two-macs
runs:
    - command: 'images delete linux@2026.10.20 --yes </dev/null'
      exit: 0
      stdout: |
          ●	linux	2026.10.20	deleted
    - command: 'images --json | /usr/bin/jq -r ''[.images[] | select(.mac == "jterrazz-macbook-pro") | .version] | join(" ")'''
      exit: 0
      stdout: |
          2026.11.01
