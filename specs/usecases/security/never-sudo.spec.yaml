description: 'no gesture runs sudo: what needs root is refused with its command, and the world records no attempt'
env: two-macs
runs:
    - command: 'settings apply sshd'
      exit: 2
      stderr: |
          Error: sshd needs admin rights
          Hint: sudo station settings apply sshd
    - command: 'settings apply restart-after-power-cut'
      exit: 2
      stderr: |
          Error: restart-after-power-cut needs admin rights
          Hint: sudo station settings apply restart-after-power-cut
    - command: 'apps install tart'
      exit: 0
      stdout: |
          ●	tart		shell
          ●	tart-launcher			~/.local/bin/tart
    - command: 'init --name jterrazz-macbook-pro >/dev/null; /usr/bin/grep -c "\"as_root\"" world.json'
      exit: 1
      stdout: |
          0
