description: 'inside linux-1 the Overview is the workspace''s own: its kind and uptime, its sections, no On line'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - in-linux-1
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 80x30 /usr/bin/env -u NO_COLOR COLUMNS=80 "$STATION" overview'
      stdin: |
          scrollback
      exit: 0
