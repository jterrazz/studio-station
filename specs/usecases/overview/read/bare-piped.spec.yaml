description: 'bare station piped prints the overview as records: glyph-led rows, tab-separated, no colour'
env: two-macs
runs:
    - command: '> bare.txt; /usr/bin/head -1 bare.txt; /usr/bin/grep -c "^✗	" bare.txt; /usr/bin/grep -c "	Apps	" bare.txt; /usr/bin/grep -c "$(printf "\033")" bare.txt'
      exit: 1
      stdout: |
          # Needs you
          2
          1
          0
