description: 'station --all on a terminal prints the overview with Needs you unfolded and returns, never the TUI'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 100x80 /usr/bin/env -u NO_COLOR COLUMNS=100 "$STATION" overview | /usr/bin/grep -c "more: station overview --all"'
      stdin: |
          scrollback
      exit: 0
      stdout: |
          1
    - command: '--version >/dev/null; terminal --size 100x80 /usr/bin/env -u NO_COLOR COLUMNS=100 "$STATION" --all | /usr/bin/grep -c "more: station overview --all"'
      stdin: |
          scrollback
      exit: 1
      stdout: |
          0
