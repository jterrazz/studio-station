description: 'the Overview owns no fact: its counts are each section''s own read, counted the same'
env:
    - two-macs
    - engine
runs:
    - command: 'overview --json > o.json; "$STATION" apps --json | /usr/bin/jq -c ''[.apps | group_by(.state)[] | {(.[0].state): length}] | add'' > a.json; /usr/bin/jq -c ''.sections[] | select(.id == "apps") | .counts'' o.json | /usr/bin/cmp - a.json && /bin/cat a.json'
      exit: 0
      stdout: |
          {"not-installed":100,"ok":5,"update-available":3}
    - command: 'overview --json > o.json; "$STATION" accounts --json | /usr/bin/jq -c ''[.accounts[] | select(.state == "signed-in")] | length''; /usr/bin/jq -c ''.sections[] | select(.id == "accounts") | .counts["signed-in"]'' o.json'
      exit: 0
      stdout: |
          6
          6
    - command: 'overview --json > o.json; "$STATION" background --json | /usr/bin/jq -c ''[(.tasks | length), ([.findings[] | select(.severity == "broken")] | length), ([.findings[] | select(.severity == "needs-a-look")] | length)]''; /usr/bin/jq -c ''.sections[] | select(.id == "background") | .counts | [.ok + .failing + .orphan, .failing, .orphan]'' o.json'
      exit: 0
      stdout: |
          [14,1,3]
          [14,1,3]
    - command: 'overview --json > o.json; "$STATION" ports --json | /usr/bin/jq -c ''.ports | length''; /usr/bin/jq -c ''.sections[] | select(.id == "ports") | .counts.private'' o.json'
      exit: 0
      stdout: |
          2
          2
    - command: 'overview --json > o.json; "$STATION" disk --json | /usr/bin/jq -c ''.findings''; /usr/bin/jq -c ''[.findings[] | select(.section == "disk") | .text]'' o.json'
      exit: 0
      stdout: |
          ["~/.tart is misplaced"]
          ["~/.tart is misplaced"]
