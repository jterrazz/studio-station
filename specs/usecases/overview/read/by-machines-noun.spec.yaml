description: 'station machines <machine> is byte for byte station overview --on <machine>, a VM or a Mac'
env:
    - two-macs
    - engine
runs:
    - command: '--version >/dev/null; "$STATION" machines linux-1 > noun.txt; "$STATION" overview --on linux-1 > on.txt; /usr/bin/cmp noun.txt on.txt && /bin/cat noun.txt'
      exit: 0
      stdout: |
          ●	Running
          ●	Has an address	192.168.64.5
          ●	SSH answers
          ●	Size	4 CPU · 8 GB · 50 GB
    - command: '--version >/dev/null; "$STATION" machines infra --json > noun.json; "$STATION" overview --on infra --json > on.json; /usr/bin/cmp noun.json on.json && /usr/bin/jq -c ''{schema, machine}'' noun.json'
      exit: 0
      stdout: |
          {"schema":"station.overview.read/v1","machine":{"name":"infra","kind":"server","on":"jterrazz-mac-mini","reachable":true}}
    - command: 'machines jterrazz-mac-mini --json | /usr/bin/jq -c ''{schema, machine: .machine.name}'''
      exit: 0
      stdout: |
          {"schema":"station.overview.read/v1","machine":"jterrazz-mac-mini"}
    - command: 'overview --on jterrazz-mac-mini --json | /usr/bin/jq -c ''{schema, machine: .machine.name}'''
      exit: 0
      stdout: |
          {"schema":"station.overview.read/v1","machine":"jterrazz-mac-mini"}
