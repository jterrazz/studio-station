description: 'station machines <machine> is the Overview station overview --on <machine> prints'
env: two-macs
runs:
    - command: 'machines jterrazz-macbook-pro --json | /usr/bin/jq -c ''{schema, machine: .machine.name}'''
      exit: 0
      stdout: |
          {"schema":"station.overview.read/v1","machine":"jterrazz-macbook-pro"}
    - command: 'overview --on jterrazz-macbook-pro --json | /usr/bin/jq -c ''{schema, machine: .machine.name}'''
      exit: 0
      stdout: |
          {"schema":"station.overview.read/v1","machine":"jterrazz-macbook-pro"}
