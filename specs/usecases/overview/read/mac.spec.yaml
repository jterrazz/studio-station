description: 'station overview on This Mac: first line, Needs you, one line per section, VMs, next step'
fixture:
    - ../../../__fixtures__/terminal/
env:
    - two-macs
    - terminal
runs:
    - command: '--version >/dev/null; terminal --size 80x60 /usr/bin/env -u NO_COLOR COLUMNS=80 "$STATION" overview'
      stdin: |
          scrollback
      exit: 0
      stdout: |
