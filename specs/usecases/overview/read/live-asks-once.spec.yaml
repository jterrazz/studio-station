description: 'the Overview on a terminal fills as it reads, then prints once, and reads each section once'
fixture:
    - ../../../__fixtures__/terminal/
    - ./__fixtures__/recording/
env: terminal
runs:
    - command: '--version >/dev/null; terminal --size 120x250 /usr/bin/env -u NO_COLOR COLUMNS=120 "$STATION" overview --all | /usr/bin/grep -cE "needs? you · "'
      stdin: |
          within 5 see Background
          gone ◌
          screen
      exit: 0
      stdout: |
          1
    - command: '--version >/dev/null; /usr/bin/grep -E "^(brew list --cask --versions|gh auth status)$" .calls | /usr/bin/sort | /usr/bin/uniq -c | /usr/bin/sed "s/^ *//"'
      exit: 0
      stdout: |
          1 brew list --cask --versions
          1 gh auth status
