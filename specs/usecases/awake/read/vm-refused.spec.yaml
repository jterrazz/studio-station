description: 'a VM follows its Mac: awake on it is refused, exit 2'
env: two-macs
runs:
    - command: 'awake --on linux-1'
      exit: 2
      stderr: |
          Error: linux-1 follows its Mac
          Hint: station awake
    - command: 'awake 4h --on infra'
      exit: 2
      stderr: |
          Error: infra follows its Mac
          Hint: station awake
