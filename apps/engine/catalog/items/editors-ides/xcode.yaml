item: station.catalog/v1
kind: app
name: xcode
description: Apple development IDE
needs: [license]
provides: [xcodebuild]
bundle: Xcode
version-read:
    args: [xcodebuild, -version]
    pattern: ^Xcode (\S+)
methods:
    - os: macos
      mas:
          id: 497799835
          name: Xcode
disk:
    paths:
        - path: ~/Library/Developer/Xcode/DerivedData
          level: cache
        - path: ~/Library/Developer/Xcode/iOS DeviceSupport
          level: cache
        - path: ~/Library/Developer/CoreSimulator/Devices
          level: data
          note: every simulator device
        - path: ~/Library/Developer/Xcode/Archives
          level: data
    installed: [/Applications/Xcode.app, /Library/Developer/CoreSimulator]
    free:
        - delete:
              - ~/Library/Developer/Xcode/DerivedData/*
              - ~/Library/Developer/Xcode/iOS DeviceSupport/*
        - run: [xcrun, simctl, delete, unavailable]
          uses: xcrun
    erase:
        - run: [xcrun, simctl, shutdown, all]
          uses: xcrun
        - run: [xcrun, simctl, erase, all]
          uses: xcrun
    quit: Xcode
