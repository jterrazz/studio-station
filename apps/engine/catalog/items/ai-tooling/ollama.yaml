item: station.catalog/v1
kind: app
name: ollama
description: Run large language models locally, on the Mac's GPU
provides: [ollama]
bundle: Ollama
live:
    process: ollama
updates: self
methods:
    - os: macos
      machine: computer
      cask: ollama-app
disk:
    paths:
        - path: ~/.ollama/logs
          level: cache
        - path: ~/.ollama/models
          level: data
    free:
        - delete: [~/.ollama/logs/*]
    erase:
        - delete: [~/.ollama/models/*]
    quit: ollama
